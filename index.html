/* ============================================================
   LA FILA — LA CLIENTA QUE LLEGA SIN TURNO

   Así trabajan de verdad: manicuría, pedicuría, belleza de pies y
   depilación descartable NO se dan por turno. La clienta llega,
   la recepcionista le pide nombre y teléfono, y espera.

   Y algo que pasa todo el tiempo: muchas piden por una profesional
   en particular y prefieren esperarla. Eso cambia quién la puede
   levantar, así que está puesto como una marca bien visible.

   Cuando pasa a atenderse deja de ser "fila" y se convierte en una
   visita común y corriente. Por eso el cobro, la comisión y la caja
   funcionan exactamente igual que con un turno: no hay dos caminos
   para la plata, hay uno solo.
   ============================================================ */
const FILA_EST = {esp:'Esperando', at:'Atendiéndose', fin:'Terminada', fue:'Se fue'};

function filaDeHoy(sid){
  sid = sid || ST.sucursalId;
  const h = hoy();
  return (DB.fila||[]).filter(f=>f.fecha===h && f.sucursalId===sid);
}
const esperando   = sid => filaDeHoy(sid).filter(f=>f.estado==='esp');
const atendiendose= sid => filaDeHoy(sid).filter(f=>f.estado==='at');

/* hace cuánto que espera, y qué tan grave es */
function esperaDe(f){
  const min = Math.max(0, ahoraMin() - mh(f.llegada));
  const nivel = min>=35 ? 'alto' : min>=20 ? 'medio' : 'ok';
  const txt = min<1 ? 'recién llegó' : min<60 ? 'hace '+min+' min'
    : 'hace '+Math.floor(min/60)+'h '+(min%60?(min%60)+'m':'');
  return {min, nivel, txt};
}

/* ---------- anotar a la que llega ---------- */
let FI = {clientaId:null, servicioId:null, areaId:null, profPedida:null, q:''};

function llegoAlguien(){
  if(!puedeEditarAgenda()){ toast('No podés anotar en la fila'); return; }
  FI = {clientaId:null, servicioId:null, areaId:null, profPedida:null, q:''};
  pasoClienteFila();
}

function pasoClienteFila(){
  sheet('¿Quién llegó?', `
    <div class="f"><input id="fq" placeholder="Nombre o teléfono" autocomplete="off"
      oninput="FI.q=this.value;pintarClientasFila()"></div>
    <div id="fres"></div>`, {focus:'fq'});
  pintarClientasFila();
}
function pintarClientasFila(){
  const box = document.getElementById('fres'); if(!box) return;
  const q = (FI.q||'').trim().toLowerCase();
  const nq = q.replace(/\D/g,'');
  let hay = DB.clientas;
  if(q) hay = hay.filter(c=> c.nombre.toLowerCase().includes(q)
    || (nq.length>=3 && (c.tel||'').replace(/\D/g,'').includes(nq)));
  else hay = clientasRecientes();
  hay = hay.slice(0,8);
  const exacta = q && hay.some(c=>c.nombre.toLowerCase()===q);
  box.innerHTML = `
    ${(q && !exacta)?`<button class="btn" style="margin-bottom:11px"
      onclick="nuevaEnLaFila()">${ic('plus','sm')} Nueva: ${esc(FI.q.trim())}</button>`:''}
    <div class="listcard">${hay.length?hay.map(c=>`
      <button class="lr" onclick="FI.clientaId='${c.id}';pasoServicioFila()">
        <div class="av">${ini(c.nombre)}</div>
        <div class="g"><b>${esc(c.nombre)}</b><span>${esc(c.tel||'sin teléfono')}</span></div>
        ${ic('chev','sm')}</button>`).join('')
      :`<div class="empty">${q?'No hay ninguna con ese nombre.':'Todavía no hay clientas cargadas.'}</div>`}</div>
    ${(!q)?`<button class="btn sec" style="margin-top:11px" onclick="nuevaEnLaFila()">
      ${ic('plus','sm')} Es una clienta nueva</button>`:''}`;
}
/* las últimas que vinieron: casi siempre la que llega es una de estas */
function clientasRecientes(){
  const orden = {};
  DB.visitas.slice(-400).forEach(v=>{ orden[v.clientaId] = v.fecha; });
  return [...DB.clientas].sort((a,b)=>(orden[b.id]||'').localeCompare(orden[a.id]||''));
}

    <div class="f"><label>Teléfono</label><input id="ft" inputmode="tel" placeholder="221 555-1234"></div>

/* ---------- pasa a atenderse ---------- */
function pasaAtenderse(fid){
  if(!puedeEditarAgenda()){ toast('No podés tocar la fila'); return; }
  const f=byId(DB.fila,fid); if(!f) return;
  const cl=byId(DB.clientas,f.clientaId), sv=byId(DB.servicios,f.servicioId);
  const hacen = profesDelDia(f.areaId, hoy()).filter(p=>profesDe(f.areaId,f.servicioId).some(x=>x.id===p.id));
  const pedida = f.profPedida ? byId(DB.profesionales,f.profPedida) : null;
  const ocupada = pid => atendiendose().some(x=>x.profId===pid);
  const lista = pedida ? hacen.filter(p=>p.id===pedida.id) : hacen;
  const otras = pedida ? hacen.filter(p=>p.id!==pedida.id) : [];
  sheet('¿Con quién pasa?', `
    <div class="card cardp" style="margin-bottom:12px">
      <div style="font-weight:700;font-size:16px">${esc(cl.nombre)}</div>
      <div class="small muted">${esc(sv.nombre)} · esperando ${esperaDe(f).txt}</div>
    </div>
    ${pedida?`<div class="infobox">Pidió por <b>${esc(pedida.nombre)}</b>.</div>`:''}
    <div class="listcard">${lista.length?lista.map(p=>`
      <button class="lr" onclick="hacerPasar('${fid}','${p.id}')">
        <div class="av">${ini(p.nombre)}</div>
        <div class="g"><b>${esc(p.nombre)}</b>
          <span>${ocupada(p.id)?'Ahora está atendiendo':'Libre'}</span></div>
        ${ic('chev','sm')}</button>`).join('')
      :`<div class="empty">Hoy no hay nadie cargada para ese servicio.</div>`}</div>
    ${otras.length?`<div class="sep"></div>
      <div class="small muted" style="margin-bottom:7px">Si acepta que la atienda otra:</div>
      <div class="listcard">${otras.map(p=>`
        <button class="lr" onclick="hacerPasar('${fid}','${p.id}')">
          <div class="av">${ini(p.nombre)}</div>
          <div class="g"><b>${esc(p.nombre)}</b><span>${ocupada(p.id)?'Ahora está atendiendo':'Libre'}</span></div>
          ${ic('chev','sm')}</button>`).join('')}</div>`:''}`);
}

function hacerPasar(fid, pid){
  if(!puedeEditarAgenda()){ toast('No podés tocar la fila'); return; }
  const f=byId(DB.fila,fid); if(!f) return;
  const sv=byId(DB.servicios,f.servicioId);
  const as=DB.asign.find(a=>a.profId===pid && a.areaId===f.areaId);
  const pq=paqueteActivo(f.clientaId, f.servicioId);
  const linea = {id:uid('ln'), servicioId:f.servicioId, profId:pid, areaId:f.areaId,
    hora:horaAhora(), dur:sv.dur, estado:'serv', precio:sv.contado, descuento:0,
    comisionPct:(as&&as.comision!=null)?as.comision:sv.comision, exenta:false, motivo:'',
    paqueteId: pq?pq.id:null, voucherId:null, consumida:false, liqId:null, forzado:'',
    sinTurno:true};
  const v = {id:uid('vi'), clientaId:f.clientaId, sucursalId:f.sucursalId, fecha:hoy(),
    creada:new Date().toISOString(), lineas:[linea], pagos:[], sinTurno:true};
  DB.visitas.push(v);
  f.estado='at'; f.visitaId=v.id; f.profId=pid; f.desde=horaAhora();
  logAcc(`Pasó a atenderse: ${byId(DB.clientas,f.clientaId).nombre} con ${byId(DB.profesionales,pid).nombre}`);
  save(); closeSheet(); render();
  toast('Pasó a atenderse');
}

function terminoFila(fid){
  if(!puedeEditarAgenda()){ toast('No podés tocar la fila'); return; }
  const f=byId(DB.fila,fid); if(!f) return;
  const v=f.visitaId?byId(DB.visitas,f.visitaId):null;
  if(v) v.lineas.forEach(l=>{ if(l.estado==='serv') l.estado='fin'; });
  f.estado='fin'; f.hasta=horaAhora();
  save(); render();
  if(v && puedeCobrar()) setTimeout(()=>cobrar(v.id), 300);
}

function seFueDeLaFila(fid){
  if(!puedeEditarAgenda()){ toast('No podés tocar la fila'); return; }
  const f=byId(DB.fila,fid); if(!f) return;
  const cl=byId(DB.clientas,f.clientaId);

}
function hacerSeFue(fid){
  const f=byId(DB.fila,fid); if(!f) return;

/* ============================================================
   QUIÉN PUEDE PASAR AHORA

   El orden ya está: es el de llegada. Pero el orden solo no
   alcanza. Si la primera pidió por Ana y Ana está atendiendo, esa
   clienta NO puede pasar todavía, aunque sea la primera. Si eso no
   se ve, la recepcionista hace pasar mal a alguien o deja a una
   profesional parada al pedo.

   Así que en vez de un botón que hay que aprender, la lista se lee
   sola: la primera que puede pasar lleva el cartel SIGUE, y la que
   está esperando a alguien ocupado se ve en gris y dice por qué.
   ============================================================ */
/* está atendiendo a alguien ahora mismo */
let _OCU = null;
const ocupadasAhora = () => _OCU || (_OCU = new Set(atendiendose().map(x=>x.profId)));
const profOcupada = pid => ocupadasAhora().has(pid);

/* quiénes podrían atender a esta clienta hoy */
function profesPosibles(f){
  return profesDelDia(f.areaId, hoy())
    .filter(p=>profesDe(f.areaId, f.servicioId).some(x=>x.id===p.id));
}
/* ¿puede pasar ahora? Y si no, por qué */
function puedePasar(f){
  const posibles = profesPosibles(f);
  if(!posibles.length) return {ok:false, razon:'Hoy no hay nadie para ese servicio'};
  if(f.profPedida){
    const p = byId(DB.profesionales, f.profPedida);
    if(!posibles.some(x=>x.id===f.profPedida))
      return {ok:false, razon:(p?p.nombre.split(' ')[0]:'Esa profesional')+' hoy no trabaja acá'};
    if(profOcupada(f.profPedida))
      return {ok:false, razon:'Espera a '+(p?p.nombre.split(' ')[0]:'ella')+' · está atendiendo'};
    return {ok:true};
  }
  const libre = posibles.find(p=>!profOcupada(p.id));
  if(!libre) return {ok:false, razon:'Todas ocupadas ahora'};
  return {ok:true};
}
/* la primera de CADA área que puede pasar: esa es la que sigue */
function lasQueSiguen(){
  const marca = {};
  esperando().sort((a,b)=>mh(a.llegada)-mh(b.llegada)).forEach(f=>{
    if(marca[f.areaId]) return;
    if(puedePasar(f).ok) marca[f.areaId] = f.id;
  });
  return new Set(Object.values(marca));
}

function diaCumple(c){
  const d = parseISO(c.nacimiento);
  return d.getDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()];
}
function clientasCumpleSemana(){
  const n=new Date(), fin=new Date(); fin.setDate(fin.getDate()+7);
  return DB.clientas.filter(c=>{
    if(!c.nacimiento) return false;
    const d=parseISO(c.nacimiento); const y=n.getFullYear();
    const este=new Date(y,d.getMonth(),d.getDate());
    return este>=new Date(y,n.getMonth(),n.getDate()) && este<=fin;
  });
}
function clientasPerdidas(){
  const lim = addDays(hoy(), -DB.cfg.diasSinVenir);
  return DB.clientas.filter(c=>{
    const vs = DB.visitas.filter(v=>v.clientaId===c.id).map(v=>v.fecha).sort();
    if(!vs.length) return false;
    return vs[vs.length-1] < lim;
  });
}
function verPerdidas(){
  const ps = clientasPerdidas();
  sheet('Clientas para reactivar', `<div class="listcard">${ps.map(c=>{
    const vs = DB.visitas.filter(v=>v.clientaId===c.id).map(v=>v.fecha).sort();
    const ult = vs[vs.length-1];
    const dias = Math.round((parseISO(hoy())-parseISO(ult))/86400000);
    return `<div class="lr"><div class="av">${ini(c.nombre)}</div>
      <div class="g"><b>${esc(c.nombre)}</b><span>Última vez: ${fechaCorta(ult)} · hace ${dias} días</span></div>

}

function areasDeSucursal(){
  let as = DB.areas.filter(a=>a.sucursalId===ST.sucursalId && a.activa).sort((x,y)=>x.orden-y.orden);
  const u = usuario();
  if(perm('agenda')==='area'){ const mias=areasDeUsuario(u); as = as.filter(a=>mias.includes(a.id)); }
  if(perm('agenda')==='prop'){
    const mias = DB.asign.filter(x=>x.profId===u.profId).map(x=>x.areaId);
    as = as.filter(a=>mias.includes(a.id));
  }
  return as;
}
/* clientas que este usuario tiene permitido ver */
function clientasVisibles(){
  if(perm('clientas')!=='prop') return DB.clientas;
  const u = usuario();
  const ids = new Set();
  DB.visitas.forEach(v=>v.lineas.forEach(l=>{ if(l.profId===u.profId) ids.add(v.clientaId); }));
  return DB.clientas.filter(c=>ids.has(c.id));
}
function vAgenda(){
  /* Solo lo que se da con turno. Manicuría, pedicuría y depilación
     descartable son por orden de llegada: van en la Fila, no acá. */
  const areas = areasDeSucursal().filter(a=>a.porTurno!==false);
  if(!areas.length) return `<div class="empty">En esta sucursal no hay nada que se dé con turno.<br><span class="small muted">Manicuría, pedicuría y depilación se atienden por orden de llegada, desde la Fila.</span></div>`;
  const verDia = puedeVerDiaCompleto();
  /* si no tiene permiso de ver la sucursal entera, nunca queda parado en esa vista */
  if(ST.areaId==='__dia' && !verDia) ST.areaId = null;
  const esDia = ST.areaId==='__dia';
  if(!esDia && (!ST.areaId || !areas.find(a=>a.id===ST.areaId))) ST.areaId = areas[0].id;
  const area = esDia ? null : byId(DB.areas, ST.areaId);
  let profes = [];
  if(!esDia){
    profes = profesDelDia(area.id, ST.fecha);
    /* quien tenga turnos ese día también va, aunque no tenga horario cargado:
       si no, un turno forzado o movido desaparecía de la agenda */
    const conTurnos = [...new Set(lineasDe(ST.fecha, l=>l.areaId===area.id).map(l=>l.profId))];
    conTurnos.forEach(pid=>{ if(!profes.some(p=>p.id===pid)){
      const p=byId(DB.profesionales,pid); if(p) profes.push(p); } });
    profes.sort((x,y)=>x.nombre.localeCompare(y.nombre));
    if(perm('agenda')==='prop') profes = profes.filter(p=>p.id===usuario().profId);
    if(!ST.profTab || !profes.find(p=>p.id===ST.profTab)) ST.profTab = profes[0]?.id || null;
  }

  return `
    <div class="tabs">
      ${verDia?`<button class="tab ${esDia?'on':''}"
        onclick="ST.areaId='__dia';ST.profTab=null;render()">📋 Todo el día</button>`:''}
      ${areas.map(a=>`<button class="tab ${a.id===ST.areaId?'on':''}"
        onclick="ST.areaId='${a.id}';ST.profTab=null;render()">${a.icono} ${esc(a.nombre)}</button>`).join('')}
    </div>
    <div class="daybar" style="padding:6px 14px">
      <button onclick="ST.fecha=addDays(ST.fecha,-1);render()">${ic('left')}</button>

      ${ST.fecha!==hoy()?`<button class="btn sm sec" style="padding:4px 10px"
        onclick="ST.fecha=hoy();render()">Hoy</button>`:''}
      <button onclick="ST.fecha=addDays(ST.fecha,1);render()">${ic('right')}</button>
      <button onclick="buscarAgenda()" aria-label="Buscar un turno">${ic('search')}</button>
    </div>
    ${esDia
      ? agendaDia()
      : (profes.length===0
        ? `<div class="empty">Nadie trabaja en ${esc(area.nombre)} este día.</div>`
        : agendaDelDia(area, profes))}
    ${puedeEditarAgenda()?`<button class="fab" onclick="nuevoTurno()">${ic('plus','lg')}</button>`:''}
  `;
}

  return `

        const cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
        const pr=byId(DB.profesionales,l.profId), ar=byId(DB.areas,l.areaId);
        const franja = l.hora.slice(0,2)+':00';
        const sep = franja!==ultima ? `<div class="hsep">${franja}</div>` : '';
        ultima = franja;
        const saldo = saldoVisita(l.visita);
        return `${sep}<button class="tcard st-${l.estado}" onclick="abrirTurno('${l.visita.id}','${l.id}')">
          <div class="n">${l.hora} · ${esc(cl.nombre)}</div>
          <div class="s">${esc(sv.nombre)} · ${esc(pr.nombre.split(' ')[0])}</div>
          <div class="t">
            <span>${ar?ar.icono+' '+esc(ar.nombre):''}</span>
            <span style="display:inline-flex;align-items:center;gap:5px"><i class="dot d-${l.estado}"></i>${EST[l.estado].n}</span>
            ${(['lleg','serv','fin'].includes(l.estado) && saldo>0 && puedeCobrar())
              ?`<span style="color:var(--warn)">Debe ${money(saldo)}</span>`:''}
          </div>
        </button>`;
      }).join('')}
      <div style="height:20px"></div>
    </div>`;
}

/* ============================================================
   AGENDA DEL DÍA — como se ve en cualquier sistema de salón:
   la hora a la izquierda, una columna por profesional, todo junto.
   ============================================================ */
let GRID={desde:540,H:14,paso:15};
function agendaDelDia(area, profes){
  /* Antes esto era H=14: media hora entraba en 28 píxeles y el nombre salía en
     letra de 10. En un celular no se leía y no se podía tocar. Ahora media hora
     son 44 píxeles, que es alto de dedo, y la letra se lee. La grilla ocupa más
     y se scrollea: mejor scrollear que no entender nada. */
  const H=22, PASO=15;
  const hs = profes.map(p=>horarioDe(p.id, area.id, ST.fecha)).filter(Boolean);
  const dia = lineasDe(ST.fecha, l=>l.areaId===area.id && profes.some(p=>p.id===l.profId));
  const abre = mh(DB.cfg.abre||'09:00'), cierra = mh(DB.cfg.cierra||'19:30')+30;
  let desde = Math.min(...hs.map(h=>mh(h.desde)), ...dia.map(l=>mh(l.hora)), abre);
  let hasta = Math.max(...hs.map(h=>mh(h.hasta)), ...dia.map(l=>mh(l.hora)+l.dur), cierra);
  desde = Math.floor(desde/30)*30; hasta = Math.ceil(hasta/30)*30;
  GRID = {desde, H, paso:PASO};
  const alto = (hasta-desde)/PASO*H;
  const y = m => (m-desde)/PASO*H;
  const ahora = (ST.fecha===hoy()) ? ahoraMin() : null;

  /* turnos de cada profesional, con las superposiciones puestas lado a lado */
  const porProf = {};
  profes.forEach(p=>{
    const ls = dia.filter(l=>l.profId===p.id).sort((a,b)=>mh(a.hora)-mh(b.hora));
    const fin = [];
    ls.forEach(l=>{
      const i=mh(l.hora), f=i+l.dur;
      let c=0; while(fin[c]!==undefined && fin[c]>i) c++;
      fin[c]=f; l._c=c;
    });
    const n = Math.max(1, fin.length);
    ls.forEach(l=>l._n=n);
    porProf[p.id]=ls;
  });

  const columna = p => {
    const h = horarioDe(p.id, area.id, ST.fecha);
    const ls = porProf[p.id]||[];
    let fondo='';
    if(!h){ fondo = `<div class="off" style="top:0;height:${alto}px"></div>`; }
    else{
      const d=mh(h.desde), t=mh(h.hasta);
      if(d>desde) fondo += `<div class="off" style="top:0;height:${y(d)}px"></div>`;
      if(t<hasta) fondo += `<div class="off" style="top:${y(t)}px;height:${alto-y(t)}px"></div>`;
      if(h.pausaD) fondo += `<div class="pau" style="top:${y(mh(h.pausaD))}px;height:${(mh(h.pausaH)-mh(h.pausaD))/PASO*H}px"></div>`;
    }
    bloqueosDe(p.id, ST.fecha).forEach(b=>{
      fondo += `<div class="blqz" style="top:${y(mh(b.desde))}px;height:${(mh(b.hasta)-mh(b.desde))/PASO*H}px"
        title="${esc(b.motivo||'Bloqueado')}"></div>`;
    });
    /* dónde hay lugar */
    let libres='';
    if(puedeEditarAgenda() && h){
      huecosLibres(p.id, area.id, ST.fecha).forEach(([a,b])=>{
        const alt=(b-a)/PASO*H;
        /* los turnos se dan cada media hora: un hueco de 15 minutos no se ofrece.
           Igual la columna entera se puede tocar si hay que meter algo a presión. */
        if(b-a < 30) return;
        libres += `<div class="libre" style="top:${y(a)+1}px;height:${alt-2}px">
          ${alt>=40?`<span>${hm(a)} · ${durTxt(b-a)} libre</span>`:'+'}</div>`;
      });
    }
    const eventos = ls.map(l=>{
      const cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
      const top=y(mh(l.hora)), alt=Math.max(16, l.dur/PASO*H);
      const w=100/l._n, left=l._c*w;
      const col='var(--b-'+l.estado+')';
      let proceso='';
      if(sv && sv.proceso>0 && sv.trabajo2>0){
        proceso = `<i class="pr" style="top:${sv.trabajo1/PASO*H}px;height:${sv.proceso/PASO*H}px"></i>`;
      }
      const nom = cl?cl.nombre.split(' ')[0]+' '+((cl.nombre.split(' ')[1]||'')[0]||''):'';
      return `<div class="ev ${alt<30?'mini':''}" style="top:${top}px;height:${alt-2}px;left:${left}%;width:${w}%;
        background:${col};${l.estado==='fin'?'opacity:.78;':''}"
        onclick="event.stopPropagation();abrirTurno('${l.visita.id}','${l.id}')">
        ${proceso}
        <b>${esc(nom)}</b>
        ${alt>=40?`<em>${esc(sv?sv.nombre:'')}</em>`:''}
        ${alt>=72?`<em>${EST[l.estado].n}</em>`:''}
      </div>`;
    }).join('');
    return `<div class="col" onclick="clicAgenda(event,'${p.id}')" style="height:${alto}px">
      ${fondo}${libres}${eventos}</div>`;
  };

  /* de a media hora, que es como se dan los turnos acá */
  const horas=[];
  for(let t=desde;t<=hasta;t+=30)
    horas.push(`<div class="hh ${t%60?'media':''}" style="top:${y(t)}px">${hm(t)}</div>`);

  return `
    <div class="leyenda">
      <span><i style="background:var(--b-res)"></i>Reservado</span>
      <span><i style="background:var(--b-conf)"></i>Confirmado</span>
      <span><i style="background:var(--b-lleg)"></i>Llegó</span>
      <span><i style="background:var(--b-serv)"></i>Atendiendo</span>
      <span><i style="background:var(--b-fin)"></i>Terminado</span>
      <span><i style="background:#F0F9F4;border:1px solid #9FCBB4"></i>Libre</span>
    </div>
    <div class="diawrap">
      <div class="diahead">
        <div class="hc"></div>
        ${profes.map(p=>{
          const h=horarioDe(p.id,area.id,ST.fecha);
          return `<div class="pcol">${esc(p.nombre.split(' ')[0])}
            <span>${h?h.desde+'-'+h.hasta:'no trabaja'}</span></div>`;}).join('')}
      </div>
      <div class="diabody" style="height:${alto}px">
        <div class="horas" style="height:${alto}px">${horas.join('')}</div>
        ${profes.map(columna).join('')}
        ${(ahora!=null && ahora>=desde && ahora<=hasta)
          ? `<div class="ahora" style="top:${y(ahora)}px;left:44px"><i></i><b>${horaAhora()}</b></div>`:''}
      </div>
    </div>
    <div class="small muted" style="padding:10px 14px 0">
      Tocá cualquier hueco para cargar un turno ahí. Las rayas dentro de un turno son el tiempo de
      proceso: ahí la profesional queda libre.
    </div>`;
}
/* tocar un lugar vacío de la columna = nuevo turno a esa hora */
function clicAgenda(ev, profId){
  if(!puedeEditarAgenda()) return;
  const col = ev.currentTarget;
  const y = ev.clientY - col.getBoundingClientRect().top;
  /* los turnos se dan a las en punto y a la media: el toque cae ahí */
  let min = GRID.desde + Math.round(y/GRID.H)*GRID.paso;
  min = Math.max(GRID.desde, Math.floor(min/30)*30);
  nuevoTurno(profId, hm(min));
}

/* --- vista celular: una profesional por vez (ya no se usa) --- */
function agendaMovil(area, profes){
  const p = byId(DB.profesionales, ST.profTab) || profes[0];
  const h = horarioDe(p.id, area.id, ST.fecha);
  const ls = lineasDe(ST.fecha, l=>l.profId===p.id && l.areaId===area.id)
    .sort((a,b)=>mh(a.hora)-mh(b.hora));
  const blqs = bloqueosDe(p.id, ST.fecha);

  let cuerpo = '';
  if(!h){ cuerpo = `<div class="empty">No trabaja este día.</div>`; }
  else{
    const items = [];
    ls.forEach(l=>items.push({t:mh(l.hora), tipo:'turno', l}));
    blqs.forEach(b=>items.push({t:mh(b.desde), tipo:'blq', b}));
    if(h.pausaD) items.push({t:mh(h.pausaD), tipo:'pausa', h});
    /* los ratos libres se muestran como espacios tocables, en su lugar del día */
    const libres = puedeEditarAgenda() ? huecosLibres(p.id, area.id, ST.fecha) : [];
    libres.forEach(([a,b])=>items.push({t:a, tipo:'libre', a, b}));
    items.sort((a,b)=>a.t-b.t);

    cuerpo = `<div class="tl">
      <div class="small muted" style="margin-bottom:10px">
        ${ic('clock','sm')} Trabaja ${h.desde} a ${h.hasta}${h.pausaD?` · pausa ${h.pausaD}-${h.pausaH}`:''}
      </div>
      ${items.length===0?`<div class="empty">Sin turnos. Tocá el + para agregar uno.</div>`:''}
      ${items.map(it=>{
        if(it.tipo==='libre') return `<button class="hueco" onclick="nuevoTurno('${p.id}','${hm(it.a)}')">
          ${ic('plus','sm')}<span>${hm(it.a)} a ${hm(it.b)} libre</span><span class="hx">${durTxt(it.b-it.a)}</span></button>`;
        if(it.tipo==='pausa') return `<div class="blk">${ic('clock','sm')} Pausa ${it.h.pausaD} a ${it.h.pausaH}</div>`;
        if(it.tipo==='blq') return `<div class="blk">${ic('lock','sm')} Bloqueado ${it.b.desde} a ${it.b.hasta}${it.b.motivo?' · '+esc(it.b.motivo):''}
          ${puedeEditarAgenda()?`<button class="btn sm sec" style="margin-left:auto" onclick="quitarBloqueo('${it.b.id}')">Quitar</button>`:''}</div>`;
        const l=it.l, cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
        const e=EST[l.estado];
        const proc = sv.proceso>0;
        return `<button class="tcard st-${l.estado} ${proc?'proc':''}" onclick="abrirTurno('${l.visita.id}','${l.id}')">
          <div class="n">${esc(cl.nombre)}</div>
          <div class="s">${esc(sv.nombre)}</div>
          <div class="t">
            <span>${l.hora} – ${hm(mh(l.hora)+l.dur)}</span>
            <span style="display:inline-flex;align-items:center;gap:5px"><i class="dot d-${l.estado}"></i>${e.n}</span>
            ${proc?`<span>${sv.trabajo1}′ trabajo · ${sv.proceso}′ proceso · ${sv.trabajo2}′ trabajo</span>`:''}
            ${l.paqueteId?(()=>{const pq=byId(DB.paquetes,l.paqueteId);
              return pq?`<span style="color:var(--acc)">Sesión ${l.consumida?pq.usadas:pq.usadas+1} de ${pq.total}</span>`:'';})():''}
            ${l.voucherId?`<span style="color:#0B7C40">Voucher</span>`:''}
            ${(puedeVerPrecios() && ['lleg','serv','fin'].includes(l.estado) && saldoVisita(l.visita)>0)?`<span style="color:var(--warn)">Debe ${money(saldoVisita(l.visita))}</span>`:''}
          </div>
        </button>`;
      }).join('')}
      ${puedeEditarAgenda()?`${libres.length?'':`<button class="free" onclick="nuevoTurno('${p.id}')">${ic('plus','sm')} Agregar turno a ${esc(p.nombre.split(' ')[0])}</button>`}
      <button class="free" onclick="bloquearHorario('${p.id}')">${ic('lock','sm')} Bloquear un horario</button>`:''}
      <div style="height:20px"></div>
    </div>`;
  }

  return `
    <div class="subtabs">
      ${profes.map(x=>{
        const tra = !!horarioDe(x.id, area.id, ST.fecha);
        return `<button class="ptab ${x.id===p.id?'on':''} ${tra?'':'off'}"
          onclick="ST.profTab='${x.id}';render()"><i></i>${esc(x.nombre.split(' ')[0])}</button>`;
      }).join('')}
    </div>
    ${cuerpo}`;
}

/* --- vista ancha: grilla horas x profesionales --- */
function agendaGrilla(area, profes){
  const hs = profes.map(p=>horarioDe(p.id, area.id, ST.fecha)).filter(Boolean);
  if(!hs.length) return `<div class="empty">Nadie trabaja este día.</div>`;
  const paso = 15;
  const dia = lineasDe(ST.fecha, l=>l.areaId===area.id && profes.some(p=>p.id===l.profId));
  /* la grilla arranca y termina abarcando horarios de trabajo Y turnos cargados fuera de horario */
  const desde = Math.floor(Math.min(...hs.map(h=>mh(h.desde)), ...dia.map(l=>mh(l.hora)))/paso)*paso;
  const hasta = Math.max(...hs.map(h=>mh(h.hasta)), ...dia.map(l=>mh(l.hora)+l.dur));
  const filas = [];
  for(let t=desde;t<hasta;t+=paso) filas.push(t);

  /* cada franja puede tener MÁS DE UN turno (superposición) */
  const ocup = {};
  profes.forEach(p=>{
    ocup[p.id]={};
    dia.filter(l=>l.profId===p.id).forEach(l=>{
      const s=mh(l.hora), e=s+l.dur;
      for(let t=s;t<e;t+=paso){
        (ocup[p.id][t] = ocup[p.id][t] || []).push({l, primero:t===s, ultimo:t+paso>=e});
      }
    });
  });

  return `<div class="gridwrap"><div class="grid" style="grid-template-columns:46px repeat(${profes.length},minmax(104px,156px))">
    <div class="gh"></div>
    ${profes.map(p=>`<div class="gh">${esc(p.nombre.split(' ')[0])}</div>`).join('')}
    ${filas.map(t=>`
      <div class="gt">${t%60===0?hm(t):''}</div>
      ${profes.map(p=>{
        const h = horarioDe(p.id, area.id, ST.fecha);
        const dentro = h && t>=mh(h.desde) && t<mh(h.hasta);
        const enPausa = h && h.pausaD && t>=mh(h.pausaD) && t<mh(h.pausaH);
        const os = ocup[p.id][t];
        if(os && os.length){
          return `<div class="gc gcx"><div class="gsplit">${os.map(o=>{
            const l=o.l, cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
            const rad = (o.primero?'7px 7px':'0 0')+' '+(o.ultimo?'7px 7px':'0 0');
            return `<div class="gi" onclick="abrirTurno('${l.visita.id}','${l.id}')"
              style="border-left-color:var(--${EST[l.estado].c});border-radius:${rad};${o.primero?'':'padding-top:0'}">
              ${o.primero?`<b>${esc(cl.nombre)}</b><span>${esc(sv.nombre)}</span><span>${l.hora}</span>`:''}
            </div>`;}).join('')}</div></div>`;
        }
        if(!dentro || enPausa) return `<div class="gc" style="background:var(--bg)"></div>`;
        return `<div class="gc" ${puedeEditarAgenda()?`onclick="nuevoTurno('${p.id}','${hm(t)}')"`:''}></div>`;
      }).join('')}
    `).join('')}
  </div></div>`;
}

/* ---------- abrir un turno ---------- */
function abrirTurno(visitaId, lineaId){
  const v = byId(DB.visitas, visitaId), l = byId(v.lineas, lineaId);
  const cl = byId(DB.clientas, v.clientaId), sv = byId(DB.servicios, l.servicioId);
  const pr = byId(DB.profesionales, l.profId);
  const saldo = saldoVisita(v);
  const otras = v.lineas.filter(x=>x.id!==l.id && x.estado!=='can');

  const acciones = {
    res :[['conf','Confirmar','conf'],['lleg','Marcar que llegó','lleg']],
    conf:[['lleg','Marcar que llegó','lleg'],['no','No asistió','no']],
    lleg:[['serv','Empezar servicio','serv']],
    serv:[['fin','Finalizar','fin']],
    fin:[], can:[], no:[]
  }[l.estado] || [];

  const verPlata = puedeVerPrecios();
  const verInt = puedeVerNotasInternas();

  sheet(cl.nombre, `
    <div class="card cardp" style="margin-bottom:13px">
      ${puedeVerTelefono()?`<div class="kv"><span class="muted">Teléfono</span><b>${esc(cl.tel)||'—'}</b></div>`:''}
      <div class="kv"><span class="muted">Servicio</span><b>${esc(sv.nombre)}</b></div>
      <div class="kv"><span class="muted">Profesional</span><b>${esc(pr.nombre)}</b></div>
      <div class="kv"><span class="muted">Horario</span><b>${l.hora} – ${hm(mh(l.hora)+l.dur)}</b></div>
      <div class="kv"><span class="muted">Estado</span><b style="display:inline-flex;align-items:center;gap:6px"><i class="dot d-${l.estado}"></i>${EST[l.estado].n}</b></div>
      ${sv.proceso>0?`<div class="kv"><span class="muted">Tiene proceso</span><b>${sv.trabajo1}′ + ${sv.proceso}′ libre + ${sv.trabajo2}′</b></div>`:''}
      ${l.paqueteId?(()=>{const pq=byId(DB.paquetes,l.paqueteId);
        return pq?`<div class="kv"><span class="muted">Paquete</span><b style="color:var(--acc)">Sesión ${l.consumida?pq.usadas:pq.usadas+1} de ${pq.total}</b></div>`:'';})():''}
      ${l.voucherId?`<div class="kv"><span class="muted">Voucher</span><b style="color:#0B7C40">${esc((byId(DB.vouchers,l.voucherId)||{}).codigo||'')}</b></div>`:''}
      ${verPlata?`<div class="kv"><span class="muted">Precio contado</span><b>${money(l.precio)}</b></div>`:''}
      ${l.descuento&&verPlata?`<div class="kv"><span class="muted">Descuento</span><b style="color:var(--stop)">− ${money(l.descuento)}${l.motivoDesc?' · '+esc(l.motivoDesc):''}</b></div>`:''}
      ${suComision(l)
        ?`<div class="kv"><span class="muted">${puedeVerComisiones()?'Comisión de '+esc(pr.nombre.split(' ')[0]):'Tu comisión'}</span><b>${l.exenta?'Exenta':money(comisionLinea(l))+' ('+l.comisionPct+'%)'}</b></div>`:''}
      ${puedeCobrar()?(saldo>0?`<div class="kv"><span class="muted">Saldo de esta visita</span><b style="color:var(--warn)">${money(saldo)}</b></div>`:
                 `<div class="kv"><span class="muted">Pago</span><b style="color:var(--ok)">Al día</b></div>`):''}
    </div>
    ${l.forzado?`<div class="warnbox">${ic('alert','sm')} Turno forzado: ${esc(l.forzado)}</div>`:''}
    ${otras.length?`<div class="infobox">Esta visita tiene ${otras.length} servicio${otras.length>1?'s':''} más:
      ${otras.map(o=>esc(byId(DB.servicios,o.servicioId).nombre)+' '+o.hora).join(' · ')}</div>`:''}
    ${cl.notas?`<div class="warnbox">${ic('alert','sm')} ${esc(cl.notas)}</div>`:''}
    ${verInt&&cl.notasInt?`<div class="infobox">${ic('lock','sm')} Nota interna: ${esc(cl.notasInt)}</div>`:''}

    ${(()=>{ const ac = acciones.filter(a=>puedeMarcarEstado(l, a[0]));
       return ac.length?`<div class="btns">
      ${ac.map(a=>`<button class="btn ${a[2]}"
        onclick="cambiarEstado('${v.id}','${l.id}','${a[0]}',1)">${a[1]}</button>`).join('')}
    </div>`:''; })()}

    <div class="btns">
      ${saldo>0 && puedeCobrar()?`<button class="btn pay" onclick="cobrar('${v.id}')">${ic('cash','sm')} Cobrar ${money(saldo)}</button>`:''}
      ${puedeEditarAgenda()?`<button class="btn sec" onclick="moverTurno('${v.id}','${l.id}')">Cambiar hora</button>
      <button class="btn sec" onclick="cambiarProfesional('${v.id}','${l.id}')">Cambiar profesional</button>
      <button class="btn sec" onclick="cambiarServicio('${v.id}','${l.id}')">Cambiar servicio</button>`:''}
      ${puedeVerTelefono()?`<a class="btn wa" href="${waLink(cl.tel, msgConfirmacion(v,l))}" target="_blank">${ic('wa','sm')} WhatsApp</a>`:''}
      ${puedeVerClientas()?`<button class="btn sec" onclick="go('ficha',{clientaId:'${cl.id}',fichaFrom:'agenda'})">${ic('user','sm')} Ficha de ${esc(cl.nombre.split(' ')[0])}</button>`:''}
      ${puedeEditarAgenda()?`<button class="btn sec" onclick="agregarServicio('${v.id}')">Agregar servicio</button>`:''}
      ${puedeDescuentos()?`<button class="btn sec" onclick="ponerDescuento('${v.id}')">Descuento</button>`:''}
      ${puedeAjustarComision()?`<button class="btn sec" onclick="exencionComision('${v.id}','${l.id}')">Comisión</button>`:''}
      ${l.estado!=='can' && puedeEditarAgenda()?`<button class="btn dan" onclick="cancelarTurno('${v.id}','${l.id}')">Cancelar turno</button>`:''}
    </div>`);
}
function msgConfirmacion(v,l){
  const cl=byId(DB.clientas,v.clientaId), sv=byId(DB.servicios,l.servicioId);
  const pr=byId(DB.profesionales,l.profId), su=byId(DB.sucursales,v.sucursalId);
  return `Hola ${cl.nombre.split(' ')[0]}! Te recordamos tu turno en ${DB.cfg.negocio} ${su.nombre}: ${sv.nombre} con ${pr.nombre.split(' ')[0]}, el ${fechaLarga(v.fecha)} a las ${l.hora}. ¿Nos confirmás?`;
}
function cambiarEstado(vid,lid,est,desdeFicha){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  if(!puedeMarcarEstado(l, est)){ toast('No podés modificar turnos'); return; }
  ST.ultimoTocado = lid;
  l.estado=est;
  /* al finalizar se descuenta la sesión del paquete */
  if(est==='fin' && l.paqueteId && !l.consumida){
    const pq = byId(DB.paquetes, l.paqueteId);
    if(pq){ pq.usadas++; l.consumida=true;
      if(pq.total-pq.usadas<=1) setTimeout(()=>toast(pq.total-pq.usadas===0
        ? 'Se le terminaron las sesiones del paquete'
        : 'Le queda 1 sesión del paquete'), 900);
    }
  }
  logAcc(`${byId(DB.clientas,v.clientaId).nombre}: ${EST[est].n}`);
  save(); closeSheet(); render();
  toast(EST[est].n);
  if(est==='fin' && saldoVisita(v)>0 && puedeCobrar()){ setTimeout(()=>cobrar(vid), 350); return; }
  /* la ficha NO se cierra entre paso y paso: la acción que sigue queda a mano.
     Desde la lista del día no se reabre: ahí el renglón ya se actualiza solo. */
  if(desdeFicha && ['res','conf','lleg','serv'].includes(est)) setTimeout(()=>abrirTurno(vid,lid), 240);
}
function cancelarTurno(vid,lid){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const cl=byId(DB.clientas,v.clientaId), sv=byId(DB.servicios,l.servicioId);
  const av=[`${esc(cl.nombre)} · ${esc(sv.nombre)} · ${fechaCorta(v.fecha)} a las ${l.hora}.`];
  if(pagadoVisita(v)>0) av.push(`Esta visita ya tiene ${money(cobradoVisita(v))} cobrados. Revisá si hay que devolver algo.`);
  confirmarConMotivo('Cancelar el turno', av, 'Cancelar el turno', m=>hacerCancelar(vid,lid,m));
}
function hacerCancelar(vid,lid,motivo){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  l.estado='can'; l.motivoCan=motivo||'';
  logAcc(`Cancelado: ${byId(DB.clientas,v.clientaId).nombre}${motivo?' — '+motivo:''}`);
  save(); closeSheet(); render();
  /* si quedó plata a favor de la clienta, hay que devolverla Y que la caja se entere */
  if(puedeCobrar() && saldoVisita(v) < 0){
    setTimeout(()=>ofrecerDevolucion(vid), 400);
    return;
  }
  const esp = DB.espera.filter(e=>e.fecha===v.fecha);
  if(esp.length){
    setTimeout(()=>sheet('Se liberó un horario', `
      <div class="okbox">Quedó libre ${l.hora} el ${fechaCorta(v.fecha)}. Hay gente esperando ese día.</div>
      <div class="listcard">${esp.map(e=>{
        const c=byId(DB.clientas,e.clientaId), s=byId(DB.servicios,e.servicioId);
        return `<div class="lr"><div class="av">${ini(c.nombre)}</div>
          <div class="g"><b>${esc(c.nombre)}</b><span>${esc(s.nombre)}${e.nota?' · '+esc(e.nota):''}</span></div>
          <a class="btn sm wa" href="${waLink(c.tel,'Hola '+c.nombre.split(' ')[0]+'! Se liberó un turno el '+fechaCorta(v.fecha)+' a las '+l.hora+'. ¿Te sirve?')}" target="_blank">${ic('wa','sm')}</a>
        </div>`;}).join('')}</div>`), 300);
  } else toast('Turno cancelado');
}
function moverTurno(vid,lid){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const hs = huecos(l.profId, l.areaId, v.fecha, l.servicioId);
  sheet('Mover a otro horario', `
    <div class="small muted" style="margin-bottom:11px">Horarios libres de ${esc(byId(DB.profesionales,l.profId).nombre)} el ${fechaCorta(v.fecha)}</div>
    ${hs.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px">
      ${hs.map(h=>`<button class="pill" onclick="hacerMover('${vid}','${lid}','${h}')">${h}</button>`).join('')}
    </div>`:`<div class="empty">No quedan horarios libres.</div>`}
    <div class="sep"></div>
    <div class="f"><label>O poné la hora a mano (el sistema avisa si se superpone)</label>
      <input type="time" id="horaman" value="${l.hora}"></div>
    <button class="btn sec" onclick="hacerMover('${vid}','${lid}',document.getElementById('horaman').value,true)">Mover igual</button>`);
}
function hacerMover(vid,lid,hora,forzar){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  if(!/^\d\d:\d\d$/.test(hora||'')){ toast('Poné una hora válida'); return; }
  if(forzarPara(l.profId, l.areaId, v.fecha, hora, l.servicioId, l.dur, l.id)){
    const av = avisosDeTurno(l.profId, l.areaId, v.fecha, mh(hora), l.dur, l.id);
    return confirmarConMotivo('Mover a las '+hora,
      av.length?av:['Ese horario no está libre.'],
      'Moverlo igual a las '+hora, m=>aplicarMover(vid,lid,hora,m));
  }
  aplicarMover(vid,lid,hora,'');
}
function aplicarMover(vid,lid,hora,motivo){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const antes=l.hora; l.hora=hora; if(motivo) l.forzado=motivo;
  logAcc(`${byId(DB.clientas,v.clientaId).nombre}: turno movido de ${antes} a ${hora}${motivo?' — FORZADO: '+motivo:''}`);
  save(); closeSheet(); render(); toast('Movido a las '+hora);
}
/* cambiar el servicio de un turno ya cargado, sin tener que borrarlo y rehacerlo */
function cambiarServicio(vid,lid){

    con el porcentaje del servicio nuevo.</div>

      const hace=profesDe(l.areaId,x.id).some(p=>p.id===l.profId);

          <span>${x.dur} min${hace?'':' · no lo tiene habilitado'}</span></div>
        ${puedeVerPrecios()?`<div class="r"><b>${money(x.contado)}</b></div>`:''}
        ${x.id===l.servicioId?'<span class="bd ac">Ahora</span>':''}</button>`;}).join('')}</div>`);
}
function hacerCambioServicio(vid,lid,svId){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const nuevo=byId(DB.servicios,svId), antes=byId(DB.servicios,l.servicioId);
  const aplicar=(motivo)=>{
    const as=DB.asign.find(a=>a.profId===l.profId && a.areaId===l.areaId);
    l.servicioId=svId; l.dur=nuevo.dur; l.precio=nuevo.contado;
    l.comisionPct=(as&&as.comision!=null)?as.comision:nuevo.comision;
    l.paqueteId = (paqueteActivo(v.clientaId,svId)||{}).id || null;
    if(motivo) l.forzado=motivo;
    logAcc(`${byId(DB.clientas,v.clientaId).nombre}: ${antes?antes.nombre:'?'} → ${nuevo.nombre}${motivo?' — '+motivo:''}`);
    save(); closeSheet(); render(); toast('Servicio cambiado');
  };
  /* si el servicio nuevo dura más y pisa otra cosa, avisar */
  if(forzarPara(l.profId, l.areaId, v.fecha, l.hora, svId, nuevo.dur, l.id)){
    const av=avisosDeTurno(l.profId, l.areaId, v.fecha, mh(l.hora), nuevo.dur, l.id);
    return confirmarConMotivo('El servicio nuevo no entra',
      av.concat([`${nuevo.nombre} dura ${nuevo.dur} min y el turno arranca ${l.hora}.`]),
      'Cambiarlo igual', aplicar);
  }
  aplicar('');
}
function cambiarProfesional(vid,lid){

}
function hacerCambioProf(vid,lid,pid){

function aplicarCambioProf(vid,lid,pid,motivo){

function hacerBloqueo(pid){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const d=document.getElementById('bd').value, h=document.getElementById('bh').value;
  const m=(document.getElementById('bm').value||'').trim();
  if(!d||!h||mh(h)<=mh(d)){ toast('Revisá el horario: el "hasta" tiene que ser posterior'); return; }
  if(!m){ toast('Escribí el motivo del bloqueo'); return; }
  /* avisar si hay turnos cargados en ese rato */
  const chocan = lineasDe(ST.fecha, l=>l.profId===pid).filter(l=>mh(l.hora)<mh(h) && mh(l.hora)+l.dur>mh(d));
  const guardar = ()=>{
    DB.bloqueos.push({id:uid('bl'), profId:pid, fecha:ST.fecha, desde:d, hasta:h, motivo:m});
    logAcc(`Bloqueo ${d}-${h} para ${byId(DB.profesionales,pid).nombre}: ${m}`);
    save(); closeSheet(); render(); toast('Horario bloqueado');
  };
  if(chocan.length) return confirmarConMotivo('Ya hay turnos en ese rato',
    chocan.map(l=>`${byId(DB.clientas,l.visita.clientaId).nombre} a las ${l.hora} (${byId(DB.servicios,l.servicioId).nombre}).`)
      .concat(['Los turnos NO se cancelan solos: hay que reubicarlos.']),
    'Bloquear igual', ()=>guardar());
  guardar();
}

}

/* ============================================================
   NUEVO TURNO
   ============================================================ */
const NT = {clientaId:null, areaId:null, servicioId:null, profId:null, hora:null,
            visitaId:null, motivo:'', aviso:null, espera:false};
/* el área en la que estamos parados (la pestaña "Todo el día" no es un área) */
const areaActual = () => (ST.areaId && ST.areaId!=='__dia') ? ST.areaId : (areasDeSucursal()[0]||{}).id;
/* EL ORDEN: primero el LUGAR (servicio -> profesional y hora) y recien al final la clienta.
   Es como se piensa en el mostrador: "tengo las 3 y media con Caro, ¿quien la agarra?".
   Si la clienta YA se sabe (otra visita, agregar servicio) se saltea el ultimo paso. */
function nuevoTurno(profId, hora){
  NT.clientaId=null; NT.servicioId=null; NT.profId=profId||null; NT.hora=hora||null;
  NT.visitaId=null; NT.motivo=''; NT.aviso=null; NT.espera=false;
  NT.areaId = areaActual();
  if(profId){
    const as = DB.asign.find(a=>a.profId===profId && a.areaId===NT.areaId);
    if(as) NT.areaId = as.areaId;
  }
  pasoServicio();
}
function pasoCliente(){
  const sv = NT.servicioId ? byId(DB.servicios, NT.servicioId) : null;
  const p  = NT.profId ? byId(DB.profesionales, NT.profId) : null;
  sheet(NT.espera?'¿Quién queda en espera?':'¿Para quién es?', `
    ${sv?`<div class="card cardp" style="margin-bottom:11px">
      <div style="font-weight:700;font-size:15px">${esc(sv.nombre)}</div>
      <div class="small muted">${p?esc(p.nombre)+' · ':''}${fechaCorta(ST.fecha)}${NT.hora?' a las '+NT.hora:''}</div>
    </div>`:''}
    <div class="f"><input id="bq" placeholder="Buscar por nombre o teléfono"
      oninput="pintarClientas(this.value)" autocomplete="off"></div>
    <div id="reslist" class="listcard">${listaClientasHTML('')}</div>
    <div class="sep"></div>
    <button class="btn sec" onclick="nuevaClientaRapida()">${ic('plus','sm')} Es una clienta nueva</button>`,
    {focus:'bq'});
}
/* elegir la clienta es el ultimo paso: de aca sale el turno (o la lista de espera) */
function elegidaClienta(id){
  NT.clientaId = id;
  if(NT.espera){ NT.espera=false; anotarEnEspera(); return; }
  preGuardarTurno();
}
function listaClientasHTML(q){
  const t = q.toLowerCase().trim();
  const res = DB.clientas.filter(c=>!t || c.nombre.toLowerCase().includes(t) || c.tel.includes(t)).slice(0,20);
  if(!res.length) return `<div class="empty">No aparece nadie con ese nombre.</div>`;
  return res.map(c=>`<button class="lr" onclick="elegidaClienta('${c.id}')">
    <div class="av">${ini(c.nombre)}</div>
    <div class="g"><b>${esc(c.nombre)}</b><span>${esc(c.tel)}${c.notas?' · ⚠ '+esc(c.notas.slice(0,30)):''}</span></div>
    ${ic('chev','sm')}</button>`).join('');
}
function pintarClientas(q){ document.getElementById('reslist').innerHTML = listaClientasHTML(q); }
function nuevaClientaRapida(){
  sheet('Clienta nueva', `
    <div class="infobox">Con el nombre y el teléfono alcanza. Todo lo demás es opcional y se completa después.</div>
    <div class="f"><label>Nombre y apellido</label><input id="nn" autocomplete="off"></div>

}
function pasoServicio(){
  const areas = areasDeSucursal();
  const svs = DB.servicios.filter(s=>s.areaId===NT.areaId && s.activo);
  const cl = NT.clientaId ? byId(DB.clientas, NT.clientaId) : null;
  const p0 = NT.profId ? byId(DB.profesionales, NT.profId) : null;
  sheet('¿Qué servicio?', `
    ${cl?`<div class="card cardp" style="margin-bottom:11px;display:flex;align-items:center;gap:11px">
      <div class="av">${ini(cl.nombre)}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">${esc(cl.nombre)}</div>
      <div class="small muted">${fechaCorta(ST.fecha)}</div></div></div>`:''}
    ${(p0&&NT.hora)?`<div class="infobox">Turno de las ${NT.hora} con ${esc(p0.nombre.split(' ')[0])}. Elegí el servicio.</div>`:''}
    <div class="subtabs" style="padding:0 0 12px">
      ${areas.map(a=>`<button class="ptab ${a.id===NT.areaId?'on':''}"
        onclick="NT.areaId='${a.id}';NT.profId=null;pasoServicio()">${a.icono} ${esc(a.nombre)}</button>`).join('')}
    </div>
    <div class="listcard">${svs.map(s=>`
      <button class="lr" onclick="NT.servicioId='${s.id}';pasoProfesional()">
        <div class="g"><b>${esc(s.nombre)}</b>
          <span>${s.dur} min${s.proceso>0?` · ${s.trabajo1}′+${s.proceso}′ proceso+${s.trabajo2}′`:''}${s.simult>1?' · hasta '+s.simult+' a la vez':''}</span></div>
        <div class="r"><b>${money(s.contado)}</b><br><span class="tiny">lista ${money(precioLista(s.contado))}</span></div>
      </button>`).join('')}</div>`);
}
function pasoProfesional(){
  const cl=NT.clientaId?byId(DB.clientas,NT.clientaId):null, sv=byId(DB.servicios,NT.servicioId);
  /* si se tocó un hueco o una celda de la agenda, la profesional y la hora YA están elegidas:
     solo faltaba la clienta y el servicio. Si entra, el turno se carga solo.
     Si no entra, el sistema dice exactamente qué pasa y deja forzarlo con un motivo. */
  if(NT.profId && NT.hora){
    const p0 = byId(DB.profesionales, NT.profId);
    const hace = profesDe(NT.areaId, NT.servicioId).some(x=>x.id===NT.profId);
    if(hace){
      if(!hayQueForzar(NT.profId, NT.areaId, ST.fecha, NT.hora, NT.servicioId))
        return elegirTurno(NT.profId, NT.hora);
      const av = avisosDeTurno(NT.profId, NT.areaId, ST.fecha, mh(NT.hora), sv.dur);
      return confirmarConMotivo(
        esc(sv.nombre)+' a las '+NT.hora,
        av.length?av:['A las '+NT.hora+' no entra '+sv.nombre+' con '+(p0?p0.nombre.split(' ')[0]:'ella')+'.'],
        'Cargarlo igual a las '+NT.hora,
        m=>{ NT.motivo=m; trasElegirHorario(); },
        {texto:'Ver horarios libres', accion:"NT.profId=null;NT.hora=null;pasoProfesional()"});
    }
    NT.aviso = (p0?p0.nombre.split(' ')[0]:'Esa profesional')+' no tiene habilitado '+sv.nombre+'. Elegí a otra.';
    NT.profId=null; NT.hora=null;
  }
  const aviso = NT.aviso; NT.aviso=null;
  const profes = profesDe(NT.areaId, NT.servicioId);
  const todos = profes.map(p=>({p, hs:huecos(p.id, NT.areaId, ST.fecha, NT.servicioId)}));
  const conHueco = todos.filter(x=>x.hs.length);

/* ============================================================
   LAS SUCURSALES DE UN VISTAZO — para la dueña.
   Antes había un desplegable que solo decía el nombre: para saber
   cómo venía el día en las tres había que cambiar de sucursal,
   leer, y volver. Tres veces.
   ============================================================ */
function resumenSucursal(sid){
  const H = hoy();
  const vs = DB.visitas.filter(v=>v.fecha===H && v.sucursalId===sid);
  let turnos=0, local=0, cobrado=0, deben=0;
  vs.forEach(v=>{
    v.lineas.forEach(l=>{ if(l.estado==='can') return; turnos++;
      if(['lleg','serv'].includes(l.estado)) local++; });
    cobrado += cobradoVisita(v);
    if(saldoVisita(v)>0) deben++;
  });
  return {turnos, local, cobrado, deben};
}
function sucursalesDeUnVistazo(){
  const sucs = DB.sucursales.filter(x=>x.activa);
  if(!puedeCambiarSucursal() || sucs.length<2){
    const su = byId(DB.sucursales, ST.sucursalId);
    return su?`<div class="small muted" style="margin:2px 0 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
      <b style="color:var(--ink)">${esc(su.nombre)}</b> · ${esc(su.dir)}</div>`:'';
  }
  const ver = puedeVerPrecios();
  /* Con cuatro locales, un renglón por local empujaba el trabajo del día
     casi media pantalla para abajo. De a dos por fila entran los cuatro
     en el mismo alto que entraban dos, y se sigue viendo todo de un saque. */
  return `<div class="vzgrid">
    ${sucs.map(su=>{ const r=resumenSucursal(su.id); const on = su.id===ST.sucursalId;
      return `<button class="vz ${on?'on':''}"
        onclick="ST.sucursalId='${su.id}';ST.areaId=null;ST.diaTodo=false;save();render()">
        <b>${esc(su.nombre)}</b>
        <span>${r.turnos} turno${r.turnos===1?'':'s'} · ${r.local} acá${r.deben?' · '+r.deben+' debe'+(r.deben===1?'':'n'):''}</span>
        ${ver?`<i>${money(r.cobrado)}</i>`:''}
      </button>`;}).join('')}
  </div>`;
}
/* las mismas sucursales como chips, para no tener que volver al inicio */
function chipsSucursal(){
  const sucs = DB.sucursales.filter(x=>x.activa);
  if(!puedeCambiarSucursal() || sucs.length<2) return '';
  return `<div class="subtabs" style="padding:10px 14px 0">

/* ============================================================
   EL DÍA — lo que hay que atender AHORA, con el botón al lado.
   Es la pantalla de inicio. Antes un servicio de punta a punta
   eran 10 toques buscando el turno en la grilla cada vez.
   Cada una ve lo de su rango: recepción su sucursal, la
   supervisora sus áreas, la profesional lo suyo (solo mirar).
   ============================================================ */
function filaDelDia({v,l,acc,urg}){
  const cl=byId(DB.clientas,v.clientaId), sv=byId(DB.servicios,l.servicioId)||{};
  const pr=byId(DB.profesionales,l.profId);
  const puede = acc.k==='cobrar' ? puedeCobrar() : puedeMarcarEstado(l, acc.k);
  return `<div class="ahr ${urg?'n':''}">
    <div class="hh2">${l.hora}</div>
    <button class="g2" onclick="abrirTurno('${v.id}','${l.id}')">
      <b>${esc(cl?cl.nombre:'—')}</b>
      <span>${esc(sv.nombre||'')}${pr?' · '+esc(pr.nombre.split(' ')[0]):''}</span>
    </button>
    ${puede
      ? `<button class="btn xs ${acc.c}" onclick="${acc.k==='cobrar'?`cobrar('${v.id}')`:`cambiarEstado('${v.id}','${l.id}','${acc.k}',0)`}">${acc.t}</button>`
      : `<span class="bd"><i class="dot d-${l.estado}"></i> ${EST[l.estado].n}</span>`}
  </div>`;
}
function elDia(){
  if(!puedeVerAgenda()) return '';
  const H = hoy(), now = ahoraMin();
  /* TRES grupos, que son las tres cosas que pasan en el mostrador:
     la que está esperando para pagar, la que está adentro atendiéndose,
     y la que está por entrar por la puerta. En una sola lista, la que
     acaba de llegar queda tapada abajo de las de la mañana. */
  const cobrar = [], dentro = [], llegando = [];
  DB.visitas.filter(v=>v.fecha===H).forEach(v=>{
    const saldo = saldoVisita(v);
    v.lineas.forEach(l=>{
      if(l.estado==='can') return;
      if(!turnoVisibleEnAgenda(l,v)) return;
      if(l.estado==='serv'){ dentro.push({v,l,acc:{k:'fin',t:'Terminar',c:'fin'},urg:true}); }
      else if(l.estado==='lleg'){ dentro.push({v,l,acc:{k:'serv',t:'Empezar',c:'serv'},urg:true}); }
      else if(l.estado==='fin' && saldo>0 && puedeCobrar()){
        cobrar.push({v,l,acc:{k:'cobrar',t:'Cobrar '+money(saldo),c:'pay'},urg:true}); }
      else if(l.estado==='res' || l.estado==='conf'){
        const dif = mh(l.hora) - now;
        /* "llegando" es de verdad: media hora tarde o una hora antes.
           La de hace dos horas no está llegando, no vino. */
        if(dif > 60 || dif < -30) return;
        llegando.push({v,l,acc:{k:'lleg',t:'Llegó',c:'lleg'},urg:dif<=0});
      }
    });
  });
  /* la clienta que acabás de marcar queda PRIMERA en su grupo aunque su hora sea tardía:
     con el día lleno, al marcarla que llegó se iba al fondo de la lista y desaparecía. */
  const porHora=(a,b)=>{
    if(ST.ultimoTocado){
      if(a.l.id===ST.ultimoTocado) return -1;
      if(b.l.id===ST.ultimoTocado) return 1;
    }
    return mh(a.l.hora)-mh(b.l.hora);
  };
  cobrar.sort(porHora); dentro.sort(porHora); llegando.sort(porHora);
  const total = cobrar.length+dentro.length+llegando.length;
  if(!total) return `<div class="card cardp" style="margin-bottom:13px">
    <div class="small muted">No hay nada para atender en este momento. Lo de más tarde está en la agenda.</div></div>`;
  const TOPE = ST.diaTodo ? 999 : 5;
  const resto = Math.max(0,cobrar.length-TOPE)+Math.max(0,dentro.length-TOPE)+Math.max(0,llegando.length-TOPE);
  const grupo = (titulo, arr) => arr.length
    ? `<div class="ahsep">${titulo}${arr.length>5?' · '+arr.length:''}</div>${arr.slice(0,TOPE).map(filaDelDia).join('')}`
    : '';
  return `<div class="ahorabox">
    ${grupo('Esperando para pagar', cobrar)}
    ${grupo('En el local', dentro)}
    ${grupo('Llegando', llegando)}
    ${resto?`<button class="ahr" style="justify-content:center;color:var(--acc);font-weight:700;font-size:13px"
      onclick="ST.diaTodo=true;render()">Ver los ${resto} que faltan</button>`:''}
    ${(ST.diaTodo && total>15)?`<button class="ahr" style="justify-content:center;color:var(--muted);font-weight:700;font-size:13px"
      onclick="ST.diaTodo=false;render()">Mostrar menos</button>`:''}
  </div>`;
}

/* ============================================================
   ¿QUIÉN ESTÁ LIBRE AHORA? — llega una sin turno.
   Antes había que recorrer las pestañas de área una por una
   buscando un rectángulo verde en la grilla.
   ============================================================ */
function quienEstaLibre(){
  if(!puedeEditarAgenda()){ toast('No podés cargar turnos'); return; }
  const now = ahoraMin(), F = hoy(), out = [];
  areasDeSucursal().forEach(ar=>{
    profesDelDia(ar.id, F).forEach(p=>{
      huecosLibres(p.id, ar.id, F).forEach(([a,bb])=>{
        if(bb <= now+10) return;
        const desde = Math.max(a, now);
        if(desde > now+45) return;          /* libre ya, o en la próxima media hora */
        if(bb - desde < 15) return;
        out.push({p, ar, desde, hasta:bb});
      });
    });
  });
  out.sort((x,y)=> x.desde-y.desde || (y.hasta-y.desde)-(x.hasta-x.desde));
  sheet('¿Quién está libre ahora?', out.length
    ? `<div class="small muted" style="margin-bottom:10px">Son las ${horaAhora()}. Tocá a una y se carga el turno directo.</div>
       <div class="listcard">${out.map(o=>`
       <button class="lr" onclick="closeSheet();ST.areaId='${o.ar.id}';nuevoTurno('${o.p.id}','${hm(Math.ceil(o.desde/15)*15)}')">
         <div class="av">${ini(o.p.nombre)}</div>
         <div class="g"><b>${esc(o.p.nombre)}</b>
           <span>${o.ar.icono} ${esc(o.ar.nombre)} · ${o.desde<=now?'libre ya':'libre desde '+hm(o.desde)} hasta ${hm(o.hasta)}</span></div>
         <div class="r"><b style="color:var(--freetx);font-size:13px">${durTxt(o.hasta-o.desde)}</b></div>
       </button>`).join('')}</div>`
    : `<div class="empty">En este momento están todas ocupadas.</div>
       <button class="btn sec" onclick="closeSheet();cuandoHayLugar()">Ver cuándo hay lugar</button>`);
}

/* ============================================================
   ¿CUÁNDO HAY LUGAR? — la pregunta más común del teléfono.
   El sistema siempre supo la respuesta; ahora la dice.
   ============================================================ */
function primerHueco(areaId, servicioId, diasMax){
  const now = ahoraMin();
  for(let d=0; d<diasMax; d++){
    const F = addDays(hoy(), d);
    let mejor = null;
    profesDe(areaId, servicioId).forEach(p=>{
      huecos(p.id, areaId, F, servicioId).forEach(h=>{
        if(d===0 && mh(h) < now+15) return;
        if(!mejor || mh(h) < mh(mejor.hora)) mejor = {fecha:F, hora:h, prof:p};
      });
    });
    if(mejor) return mejor;
  }
  return null;
}
function cuandoHayLugar(areaId){
  if(!puedeEditarAgenda()){ toast('No podés cargar turnos'); return; }
  const areas = areasDeSucursal();
  if(!areas.length){ toast('Esta sucursal no tiene áreas'); return; }
  const aid = areaId || ((ST.areaId && ST.areaId!=='__dia' && areas.some(a=>a.id===ST.areaId)) ? ST.areaId : areas[0].id);
  const svs = DB.servicios.filter(x=>x.areaId===aid && x.activo);
  const filas = svs.map(x=>({s:x, h:primerHueco(aid, x.id, 21)}));
  sheet('¿Cuándo hay lugar?', `
    <div class="subtabs" style="padding:0 0 12px">
      ${areas.map(a=>`<button class="ptab ${a.id===aid?'on':''}"
        onclick="cuandoHayLugar('${a.id}')">${a.icono} ${esc(a.nombre)}</button>`).join('')}
    </div>
    <div class="listcard">${filas.map(({s,h})=> h
      ? `<button class="lr" onclick="tomarHueco('${aid}','${s.id}','${h.fecha}','${h.hora}','${h.prof.id}')">
           <div class="g"><b>${esc(s.nombre)}</b>
             <span>${esc(h.prof.nombre.split(' ')[0])} · ${s.dur} min${puedeVerPrecios()?' · '+money(s.contado):''}</span></div>
           <div class="r"><b style="font-size:13px;color:var(--ink)">${h.fecha===hoy()?'HOY':fechaCorta(h.fecha)}</b>
             <div style="font-size:13px">${h.hora}</div></div>
         </button>`
      : `<div class="lr"><div class="g"><b>${esc(s.nombre)}</b>
           <span>Sin lugar en las próximas 3 semanas</span></div></div>`).join('')}</div>`);
}
/* tocar un primer lugar arranca el turno ahí mismo: solo falta la clienta */
function tomarHueco(aid, sid, fecha, hora, pid){
  ST.fecha = fecha; ST.areaId = aid;
  NT.clientaId=null; NT.visitaId=null; NT.motivo=''; NT.aviso=null; NT.espera=false;
  NT.areaId = aid; NT.servicioId = sid; NT.profId = pid; NT.hora = hora;
  pasoCliente();
}

/* ============================================================
   BUSCADOR DE LA AGENDA
   Encontrar a una clienta sin saber que dia tiene el turno ni
   recorrer la grilla. Busca en TODOS los dias, respetando lo que
   cada rol puede ver: la profesional solo encuentra lo suyo y la
   supervisora solo sus areas.
   ============================================================ */
function turnoVisibleEnAgenda(l, v){
  const p = perm('agenda');
  if(p==='no') return false;
  if(p==='prop'){ const u=usuario(); return !!u && l.profId===u.profId; }
  if(v.sucursalId!==ST.sucursalId) return false;
  if(p==='area') return areasDeUsuario().includes(l.areaId);
  return true;
}
function buscarAgenda(){
  if(!puedeVerAgenda()){ toast('No tenés acceso a la agenda'); return; }
  sheet('Buscar un turno', `
    <div class="f"><input id="aq" placeholder="Nombre de la clienta${puedeVerTelefono()?', teléfono':''} o servicio"
      oninput="pintarBusqAgenda(this.value)" autocomplete="off"></div>
    <div id="ares">${busqAgendaHTML('')}</div>`, {focus:'aq'});
}
function busqAgendaHTML(q){
  const t = (q||'').toLowerCase().trim();
  if(t.length<2) return `<div class="small muted" style="padding:2px 2px 8px">Escribí al menos dos letras. Busca en todos los días, no solo en el que estás mirando.</div>`;
  const H = hoy(), out = [];
  DB.visitas.forEach(v=>{
    const cl = byId(DB.clientas, v.clientaId); if(!cl) return;
    v.lineas.forEach(l=>{
      if(!turnoVisibleEnAgenda(l,v)) return;
      const sv = byId(DB.servicios, l.servicioId) || {};
      const pr = byId(DB.profesionales, l.profId) || {};
      const heno = (cl.nombre+' '+(puedeVerTelefono()?(cl.tel||''):'')+' '+(sv.nombre||'')+' '+(pr.nombre||'')).toLowerCase();
      if(!heno.includes(t)) return;
      out.push({v,l,cl,sv,pr});
    });
  });
  if(!out.length) return `<div class="empty">No hay ningún turno que coincida.</div>`;
  /* primero lo que viene, despues lo que ya paso */
  out.sort((a,b)=>{
    const pa = a.v.fecha < H, pb = b.v.fecha < H;
    if(pa!==pb) return pa?1:-1;
    if(a.v.fecha!==b.v.fecha) return pa ? (a.v.fecha<b.v.fecha?1:-1) : (a.v.fecha<b.v.fecha?-1:1);
    return mh(a.l.hora)-mh(b.l.hora);
  });
  const ver = out.slice(0,30);
  return `<div class="listcard">${ver.map(({v,l,cl,sv,pr})=>{
    const e = EST[l.estado] || {n:'', c:'e-fin'};
    return `<button class="lr" onclick="irAlTurno('${v.id}','${l.id}')">
      <div class="av">${ini(cl.nombre)}</div>
      <div class="g"><b>${esc(cl.nombre)}</b>
        <span>${esc(sv.nombre||'')}${pr.nombre?' · '+esc(pr.nombre.split(' ')[0]):''}</span>
        <span class="tiny"><span class="dot d-${l.estado}"></span> ${e.n}</span></div>
      <div class="r"><b style="font-size:12.5px;color:var(--ink)">${v.fecha===H?'HOY':fechaCorta(v.fecha)}</b>
        <div style="font-size:12.5px">${l.hora}</div></div>
    </button>`;}).join('')}</div>
    ${out.length>30?`<div class="small muted" style="padding:10px 2px 0">Hay ${out.length-30} más. Escribí un poco más para afinar.</div>`:''}`;
}
function pintarBusqAgenda(q){
  const e = document.getElementById('ares'); if(e) e.innerHTML = busqAgendaHTML(q);
}
/* lleva la agenda al dia, al area y a la profesional del turno, y lo abre */
function irAlTurno(vid, lid){
  const v = byId(DB.visitas, vid); if(!v) return;
  const l = byId(v.lineas, lid); if(!l) return;
  ST.view='agenda'; ST.fecha=v.fecha; ST.areaId=l.areaId; ST.profTab=l.profId;
  /* si el turno es en otro local, la agenda se muda sola: si no, se abre
     una pantalla vacía y parece que el turno no existe */
  if(v.sucursalId && v.sucursalId!==ST.sucursalId && puedeVerSucursal(v.sucursalId))
    ST.sucursalId = v.sucursalId;
  closeSheet(); render();
  setTimeout(()=>abrirTurno(vid,lid), 60);
}

/* ============================================================
   RECEPCIÓN RÁPIDA

function recepcionRapida(){
  sheet('Recepción rápida', `
    <div class="f"><input id="rq" placeholder="Escribí el nombre de la clienta"
      oninput="pintarRecepcion(this.value)" autocomplete="off"></div>
    <div id="rres">${recepcionHTML('')}</div>`, {focus:'rq'});
}
function recepcionHTML(q){
  const t=q.toLowerCase().trim();
  const hoyVs = DB.visitas.filter(v=>v.fecha===hoy() && v.sucursalId===ST.sucursalId);
  let res, cabecera='';
  if(t){
    res = hoyVs.filter(v=>byId(DB.clientas,v.clientaId).nombre.toLowerCase().includes(t));
  }else{
    /* sin escribir nada, muestra las que están llegando ahora */
    const ahora = ahoraMin();
    res = hoyVs.filter(v=>v.lineas.some(l=>l.estado!=='can' &&
      mh(l.hora) > ahora-45 && mh(l.hora) < ahora+90));
    cabecera = `<div class="small muted" style="margin-bottom:9px">Las que están llegando ahora. Escribí un nombre para buscar otra.</div>`;
    if(!res.length){
      /* fuera del horario de atención muestra las que todavía no llegaron */
      res = hoyVs.filter(v=>v.lineas.some(l=>['res','conf'].includes(l.estado)));
      cabecera = res.length?`<div class="small muted" style="margin-bottom:9px">Turnos de hoy que todavía no llegaron.</div>`:'';
    }
    res.sort((a,b)=>mh(a.lineas[0].hora)-mh(b.lineas[0].hora));
  }
  if(!res.length) return `<div class="empty">${t?'Ninguna clienta con ese nombre tiene turno hoy.'
    :'No hay nadie llegando en este rato. Escribí un nombre para buscar.'}</div>`;
  return cabecera + res.map(v=>{
    const c=byId(DB.clientas,v.clientaId);
    const ls=v.lineas.filter(l=>l.estado!=='can');
    const otrasV = DB.visitas.filter(x=>x.id!==v.id && x.clientaId===v.clientaId
      && x.fecha===v.fecha && x.sucursalId===v.sucursalId && x.lineas.some(l=>l.estado!=='can')).length;
    const saldo=saldoVisita(v);
    const todosLlegaron = ls.every(l=>['lleg','serv','fin'].includes(l.estado));
    return `<div class="card cardp" style="margin-bottom:9px">
      <div style="display:flex;gap:11px;align-items:flex-start">
        <div class="av">${ini(c.nombre)}</div>
        <div style="flex:1;min-width:0">
          <b style="font-size:16px">${esc(c.nombre)}</b>
          ${otrasV?`<div class="tiny" style="color:var(--acc);font-weight:700">Tiene ${otrasV} visita${otrasV>1?'s':''} más ese día, se cobran aparte</div>`:''}
          ${ls.map(l=>`<div class="small muted">${l.hora} · ${esc(byId(DB.servicios,l.servicioId).nombre)} · ${esc(byId(DB.profesionales,l.profId).nombre.split(' ')[0])}
            <i class="dot d-${l.estado}" style="display:inline-block;margin-left:4px"></i></div>`).join('')}
          ${puedeVerPrecios()?(saldo>0?`<div class="small" style="color:var(--warn);margin-top:3px">Debe ${money(saldo)}</div>`
                   :`<div class="small" style="color:var(--ok);margin-top:3px">Pago al día</div>`):''}
        </div>
      </div>
      ${c.notas?`<div class="warnbox" style="margin:11px 0 0">${esc(c.notas)}</div>`:''}
      ${puedeVerNotasInternas()&&c.notasInt?`<div class="infobox" style="margin:9px 0 0">${ic('lock','sm')} ${esc(c.notasInt)}</div>`:''}
      <div class="btns">
        ${!todosLlegaron?`<button class="btn lleg" onclick="marcarLlegada('${v.id}')">Llegó</button>`:''}
        ${saldo>0?`<button class="btn pay" onclick="cobrar('${v.id}')">${ic('cash','sm')} Cobrar ${money(saldo)}</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function pintarRecepcion(q){ document.getElementById('rres').innerHTML = recepcionHTML(q); }
function marcarLlegada(vid){
  const v=byId(DB.visitas,vid);
  v.lineas.forEach(l=>{ if(['res','conf'].includes(l.estado)) l.estado='lleg'; });
  logAcc(`Llegó: ${byId(DB.clientas,v.clientaId).nombre}`);
  save(); render(); toast('Marcada como llegada');
  const q=document.getElementById('rq'); if(q) pintarRecepcion(q.value);
}

/* ============================================================
   COBRO
   ============================================================ */
const CO = {vid:null, medio:'efectivo', pagos:[]};
function cobrar(vid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  CO.vid=vid; CO.medio='efectivo';
  pintarCobro();
}
function avisoCajaSinAbrir(){
  const a = arqueoDe(hoy(), ST.sucursalId);
  if(a.apertura) return '';
  return `<div class="warnbox">${ic('alert','sm')} <b>La caja de hoy todavía no está abierta.</b>
    El cobro se registra igual, pero el arqueo va a arrancar sin el fondo del cajón.
    <button class="btn sm" style="margin-top:9px" onclick="closeSheet();go('caja');abrirCaja()">Abrirla ahora</button></div>`;
}
function pintarCobro(){
  const v=byId(DB.visitas,CO.vid), cl=byId(DB.clientas,v.clientaId);
  const todas=v.lineas.filter(l=>l.estado!=='can');
  const M=MEDIOS.find(m=>m.k===CO.medio);
  const desc = todas.filter(l=>!cubierta(l)).reduce((s,l)=>s+(l.descuento||0),0);
  const total = totalVisita(v);          /* en precio de CONTADO, ya con descuentos */
  const pagado = pagadoVisita(v);        /* contado que ya quedó cubierto */
  const entro  = cobradoVisita(v);       /* plata que entró, con recargos incluidos */
  const saldo = total - pagado;          /* lo que falta, en contado */
  const aCobrar = aCobrarCon(Math.max(0,saldo), CO.medio);

  sheet('Cobrar a '+cl.nombre, `
    ${avisoCajaSinAbrir()}
    <div class="card cardp" style="margin-bottom:13px">
      ${todas.map(l=>{const c=cubierta(l);
        return `<div class="kv">
        <span>${esc(byId(DB.servicios,l.servicioId).nombre)}<br>
          <span class="tiny muted">${esc(byId(DB.profesionales,l.profId).nombre)}</span></span>
        ${c?`<b style="color:var(--ok);font-size:12.5px">${c==='Paquete'?(()=>{const pq=byId(DB.paquetes,l.paqueteId);
              return pq?`Paquete · sesión ${l.consumida?pq.usadas:pq.usadas+1} de ${pq.total}`:'Paquete';})():'Voucher'}<br>
            <span class="tiny muted">ya estaba pago</span></b>`
          :`<b>${money(l.precio)}</b>`}</div>`;}).join('')}
      ${desc?`<div class="kv"><span style="color:var(--stop)">Descuento</span><b style="color:var(--stop)">− ${money(desc)}</b></div>`:''}
      <div class="tot"><span>Total de contado</span><span>${money(total)}</span></div>
      ${pagado?`<div class="kv" style="margin-top:8px"><span class="muted">Ya cubierto</span><b>${money(pagado)}</b>
        </div><div class="kv"><span class="muted">Entró a la caja</span><b>${money(entro)}</b></div>
        <div class="kv"><span class="muted">Falta (de contado)</span><b style="color:var(--warn)">${money(saldo)}</b></div>`:''}
    </div>

    <label>¿Con qué paga esta parte?</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin-bottom:6px">
      ${MEDIOS.map(m=>`<button class="pill ${m.k===CO.medio?'on':''}"
        onclick="CO.medio='${m.k}';pintarCobro()">${m.n}</button>`).join('')}
    </div>
    <div class="${M.rec?'warnbox':'okbox'}" style="margin-top:10px">
      ${M.rec
        ? `Por los ${money(saldo)} que faltan, con ${M.n.toLowerCase()} hay que cobrar <b>${money(aCobrar)}</b>
           (recargo del ${DB.cfg.recargo}%). El recargo se aplica solo a esta parte, no a lo que ya se pagó.`
        : `Efectivo: precio de contado, sin recargo. Faltan <b>${money(saldo)}</b>.`}
    </div>

    ${total<=0?`<div class="okbox">No hay nada que cobrar: está todo cubierto por paquete o voucher.</div>`:''}
    <div class="f"><label>Importe a cobrar ahora</label>
      <input type="number" id="imp" value="${Math.max(0,Math.round(aCobrar))}" inputmode="numeric"></div>

    <div class="btns">
      <button class="btn pay" onclick="registrarPago('total')">${ic('cash','sm')} Cobrar</button>
      <button class="btn sec" onclick="registrarPago('sena')">Es una seña</button>
    </div>
    <div class="btns">
      ${puedeDescuentos()?`<button class="btn sec" onclick="ponerDescuento('${v.id}')">Hacer un descuento</button>`:''}
      <button class="btn sec" onclick="canjearVoucher('${v.id}')">${ic('gift','sm')} Canjear voucher</button>
    </div>
    ${v.pagos.length?`<div class="h3">Ya cobrado</div>
      <div class="listcard">${v.pagos.map(p=>{
        const m=MEDIOS.find(x=>x.k===p.medio);
        const cu=(p.contado!=null?p.contado:p.importe);
        return `<div class="lr">
        <div class="g"><b>${money(p.importe)}</b>
          <span>${m.n} · ${p.tipo==='sena'?'Seña':'Pago'} · ${esc(p.usuario)}</span>
          ${m.rec?`<span class="tiny">cubre ${money(cu)} de contado</span>`:''}
          ${p.motivo?`<span class="tiny" style="color:var(--warn)">${esc(p.motivo)}</span>`:''}</div>
        <button class="btn sm sec" onclick="borrarPago('${v.id}','${p.id}')">${ic('trash','sm')}</button>
      </div>`;}).join('')}</div>`:''}`);
}
function registrarPago(tipo){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,CO.vid);
  const M=MEDIOS.find(m=>m.k===CO.medio);
  const imp = +document.getElementById('imp').value;
  if(!imp || imp<=0){ toast('Poné un importe'); return; }
  const saldo = saldoVisita(v);
  const sug = aCobrarCon(Math.max(0,saldo), CO.medio);
  /* cuánto del precio de contado cubre esta plata */
  const contado = M.rec
    ? (imp===sug ? saldo : Math.round(imp/(1+(DB.cfg.recargo||0)/100)))
    : imp;
  if(contado - saldo > 0.5){
    return confirmarConMotivo('Está cobrando de más',
      [`Falta ${money(Math.max(0,saldo))} de contado y este pago cubre ${money(contado)}.`,
       `Quedarían ${money(contado-saldo)} a favor de la clienta.`],
      'Cobrar igual', m=>hacerPago(tipo, imp, contado, m));
  }
  hacerPago(tipo, imp, contado, '');
}
function hacerPago(tipo, imp, contado, motivo){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,CO.vid);
  const cl=byId(DB.clientas,v.clientaId);
  const p={id:uid('pa'), importe:imp, contado, medio:CO.medio, tipo,
    fecha:hoy(), hora:horaAhora(), usuario:usuario().nombre, motivo:motivo||'', anulado:null};
  v.pagos.push(p);
  /* al libro de caja, con la fecha de HOY: la plata entró hoy aunque el turno sea de otro día */
  const m = mov(tipo==='sena'?'sena':'cobro', {importe:imp, medio:CO.medio, visitaId:v.id,
    pagoId:p.id, clientaId:v.clientaId, motivo:motivo||'',
    concepto:(cl?cl.nombre:'')+(v.fecha!==hoy()?' · turno del '+fechaCorta(v.fecha):'')});
  p.movId = m.id;
  logAcc(`Cobro ${money(imp)} (${CO.medio}) a ${cl?cl.nombre:''}${motivo?' — '+motivo:''}`);
  save();
  if(saldoVisita(v)<=0){ closeSheet(); render(); toast('Cobrado. Cuenta saldada.'); }
  else { pintarCobro(); toast('Pago registrado'); }
}
/* Los cobros NO se borran: se ANULAN. El renglón queda en el libro con el motivo
   y quién lo anuló, y la dueña lo ve marcado en la caja del día. */
function borrarPago(vid,pid){ anularPago(vid,pid); }
function anularPago(vid,pid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,vid), p=byId(v.pagos,pid);
  if(!p || p.anulado){ toast('Ese cobro ya está anulado'); return; }
  const cl=byId(DB.clientas,v.clientaId);
  confirmarConMotivo('Anular el cobro de '+money(p.importe),
    [`${MEDIOS.find(m=>m.k===p.medio).n} · ${esc(cl?cl.nombre:'')} · lo cobró ${esc(p.usuario||'—')}${p.hora?' a las '+p.hora:''}.`,
     'El renglón no se borra: queda anulado en el libro de caja, con tu nombre y el motivo.'],
    'Anular el cobro', m=>hacerAnularPago(vid, pid, m));
}
function hacerAnularPago(vid,pid,motivo){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,vid), p=byId(v.pagos,pid);
  if(!p || p.anulado) return;
  p.anulado = {motivo:motivo||'', usuario:usuario().nombre, fecha:hoy(), hora:horaAhora()};
  if(p.movId) anularMov(p.movId, motivo);
  else { const mv=DB.mov.find(x=>x.pagoId===p.id); if(mv) anularMov(mv.id, motivo); }
  logAcc(`ANULADO el cobro de ${money(p.importe)} a ${(byId(DB.clientas,v.clientaId)||{}).nombre||''} — ${motivo}`);
  save(); closeSheet();
  if(CO.vid===vid) pintarCobro(); else render();
  toast('Cobro anulado');
}

/* ============================================================
   DEVOLUCIONES
   Si se cancela algo ya cobrado, la plata sale del cajón: tiene
   que salir también del libro, con quién la devolvió y por qué.
   ============================================================ */
let DEVMEDIO='efectivo';
function medioDev(k){ DEVMEDIO=k; const v=DEV_VID; if(v) ofrecerDevolucion(v); }
let DEV_VID=null;
function ofrecerDevolucion(vid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,vid); if(!v) return;
  const cl=byId(DB.clientas,v.clientaId);
  const aFavor = Math.max(0, -saldoVisita(v));
  const cobrado = cobradoVisita(v);
  DEV_VID = vid;
  sheet('¿Se le devuelve la plata?', `
    <div class="warnbox">${ic('alert','sm')} ${esc(cl?cl.nombre:'')} tiene
      <b>${money(aFavor)}</b> a favor: ya había pagado ${money(cobrado)} y el turno se canceló.</div>
    <div class="f"><label>¿Cuánto se le devuelve?</label>
      <input type="number" id="dev" value="${Math.round(aFavor)}" inputmode="numeric"></div>
    ${elegirMedioHTML(DEVMEDIO,'medioDev')}
    <button class="btn dan" onclick="hacerDevolucion('${vid}')">${ic('back','sm')} Registrar la devolución</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">No se devuelve nada por ahora</button>
    <div class="small muted" style="margin-top:9px">Si no se devuelve ahora, la plata le queda a favor
      y aparece cuando vuelva.</div>`);
}
function hacerDevolucion(vid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,vid);
  const imp = +document.getElementById('dev').value||0;
  if(imp<=0){ toast('Poné cuánto se devuelve'); return; }
  const cl=byId(DB.clientas,v.clientaId);
  const p={id:uid('pa'), importe:-imp, contado:-imp, medio:DEVMEDIO, tipo:'devolucion',
    fecha:hoy(), hora:horaAhora(), usuario:usuario().nombre, motivo:'devolución', anulado:null};
  v.pagos.push(p);
  p.movId = mov('devolucion', {importe:imp, medio:DEVMEDIO, visitaId:v.id, pagoId:p.id,
    clientaId:v.clientaId, concepto:(cl?cl.nombre:'')+' · turno cancelado'}).id;
  logAcc(`Devolución de ${money(imp)} a ${cl?cl.nombre:''} (${DEVMEDIO})`);
  save(); closeSheet(); render();
  toast('Devolución registrada');
}

function ponerDescuento(vid){
  if(!puedeDescuentos()){ toast('No tenés permiso para hacer descuentos'); return; }
  const v=byId(DB.visitas,vid);
  const ls=v.lineas.filter(l=>l.estado!=='can');
  sheet('Descuento', `
    <div class="infobox">Queda registrado quién lo hizo. La comisión de la profesional no se toca:
    se sigue calculando sobre el precio de contado completo.</div>
    ${ls.map(l=>`<div class="f">
      <label>${esc(byId(DB.servicios,l.servicioId).nombre)} — contado ${money(l.precio)}</label>
      <input type="number" id="d_${l.id}" value="${l.descuento||0}" inputmode="numeric" placeholder="0"></div>`).join('')}
    <button class="btn" onclick="guardarDescuento('${vid}')">Aplicar descuento</button>`);
}
function guardarDescuento(vid){
  const v=byId(DB.visitas,vid);
  const cambios=[]; const excede=[];
  v.lineas.filter(l=>l.estado!=='can').forEach(l=>{
    const e=document.getElementById('d_'+l.id); if(!e) return;
    const d=+e.value||0;
    cambios.push({id:l.id, d});
    if(d>l.precio) excede.push(`${byId(DB.servicios,l.servicioId).nombre}: descuento de ${money(d)} sobre un precio de ${money(l.precio)}.`);
    else if(d<0) excede.push(`${byId(DB.servicios,l.servicioId).nombre}: el descuento no puede ser negativo.`);
  });
  const aplicar = (motivo)=>{
    cambios.forEach(({id,d})=>{ const l=byId(v.lineas,id); l.descuento=d; l.motivoDesc=motivo||''; });
    logAcc(`Descuento a ${byId(DB.clientas,v.clientaId).nombre} por ${usuario().nombre}${motivo?' — '+motivo:''}`);
    save();
    if(puedeCobrar() && CO.vid===vid) pintarCobro(); else { closeSheet(); render(); }
    toast('Descuento aplicado');
  };
  if(excede.length) return confirmarConMotivo('Revisá el descuento', excede, 'Aplicarlo igual', aplicar);
  aplicar('');
}
