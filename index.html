/* profesionales que trabajan en alguna área de la sucursal elegida */

/* ============================================================
   LOS HORARIOS

   Antes el horario colgaba del ÁREA: una persona en tres áreas
   tenía tres horarios sueltos y nadie los comparaba. Así quedó
   cargada gente en dos sucursales a la misma hora del mismo día.

   Ahora manda la persona: una pantalla con su semana, y cada día
   con su horario y su local. Como una profesional trabaja en un
   solo lugar por día, al cargar un día se lo saca de cualquier
   otro: no se puede pisar.

   Abajo sigue guardándose igual que siempre, así que la agenda
   no se entera de nada.
   ============================================================ */
const DIAS_ORD = [1,2,3,4,5,6,0];

/* Los Hornos → LH · Centro 54 → C54 · City Bell → CB */
function sucCorta(nombre){
  const n = String(nombre||'').trim();
  const num = n.match(/\d+/);
  const letras = n.replace(/\d+/g,'').split(/\s+/).filter(Boolean)
    .map(w=>w[0]).join('').toUpperCase().slice(0,2);
  return letras + (num?num[0]:'');
}

/* la semana de una persona, juntando todas sus áreas */
function semanaDe(pid){
  const asgs = DB.asign.filter(a=>a.profId===pid);
  const out = {};
  DIAS_ORD.forEach(d=>{
    out[d] = DB.horarios.filter(h=>h.dia===d && asgs.some(a=>a.id===h.asignId))
      .map(h=>{ const as=byId(DB.asign,h.asignId), ar=as?byId(DB.areas,as.areaId):null;
        return {h, as, area:ar, suc:ar?byId(DB.sucursales,ar.sucursalId):null}; })
      .filter(x=>x.area);
  });
  return out;
}
/* ¿quedó en dos lugares el mismo día? */
function diasChocados(pid){
  const sem = semanaDe(pid), out=[];
  DIAS_ORD.forEach(d=>{
    const ss = [...new Set(sem[d].map(x=>x.suc?x.suc.id:''))];
    if(sem[d].length>1 && ss.length>1) out.push(d);
  });
  return out;
}

/* ---- guardar un día: se lo saca de todos lados y se pone en uno ---- */
function ponerDiaSemana(pid, dia, desde, hasta, areaId){
  if(!puedeTocarHorarioDe(pid)){ toast('Solo podés cambiarle el horario a la gente de tu área'); return false; }
  const asgs = DB.asign.filter(a=>a.profId===pid);
  DB.horarios = DB.horarios.filter(h=>!(h.dia===dia && asgs.some(a=>a.id===h.asignId)));
  if(desde && hasta && areaId){
    let as = asgs.find(a=>a.areaId===areaId);
    if(!as){
      as = {id:uid('as'), profId:pid, areaId,
        servicios: DB.servicios.filter(x=>x.areaId===areaId && x.activo).map(x=>x.id), comision:null};
      DB.asign.push(as);
    }
    DB.horarios.push({id:uid('ho'), asignId:as.id, dia, desde, hasta, pausaD:null, pausaH:null});
  }
  save();
  return true;
}

/* ---- LA SEMANA DE UNA PERSONA ---- */
function suSemana(pid){
  const p = byId(DB.profesionales, pid);
  const sem = semanaDe(pid);
  const choc = diasChocados(pid);
  const puede = puedeTocarHorarioDe(pid);
  const cargados = DIAS_ORD.filter(d=>sem[d].length).length;
  sheet('La semana de '+p.nombre.split(' ')[0], `
    <div class="small muted" style="margin-bottom:11px">Trabaja ${cargados} ${cargados===1?'día':'días'} por semana.
      Una profesional trabaja en un solo lugar por día.</div>
    ${choc.length?`<div class="warnbox">${ic('alert','sm')} <b>Está en dos locales el mismo día</b>
      (${choc.map(d=>DIAS[d]).join(', ')}). Tocá ese día y elegí uno solo.</div>`:''}
    <div class="card cardp" style="padding:4px 8px">
      ${DIAS_ORD.map(d=>{
        const hs = sem[d];
        return `<button class="semdia" ${puede?`onclick="SEMD={};editarDiaSemana('${pid}',${d})"`:'disabled'}>
          <div class="sd1">${DIAS[d].slice(0,3)}</div>
          <div class="sd2">${hs.length?hs.map(x=>`
            <div><b>${x.h.desde} a ${x.h.hasta}</b>
              <span>${x.suc?esc(x.suc.nombre):''} · ${x.area.icono} ${esc(x.area.nombre)}</span></div>`).join('')
            :`<div class="nolab">no trabaja</div>`}</div>
          ${puede?ic('chev','sm'):''}</button>`;}).join('')}
    </div>
    ${puede?`<div class="btns" style="margin-top:11px">
      <button class="btn sec" onclick="copiarSemana('${pid}')">${ic('list','sm')} Copiar un día al resto</button>
    </div>`:''}`);
}

function editarDiaSemana(pid, dia){
  const p = byId(DB.profesionales, pid);
  const sem = semanaDe(pid)[dia];
  const actual = sem[0] || null;
  const frec = horariosFrecuentes();
  /* todas las áreas de todos los locales: puede empezar en un local nuevo */
  const areas = DB.areas.filter(a=>a.activa)
    .sort((x,y)=>(byId(DB.sucursales,x.sucursalId)||{}).nombre?.localeCompare((byId(DB.sucursales,y.sucursalId)||{}).nombre||'')||0);
  if(!SEMD.areaId) SEMD.areaId = actual ? actual.area.id : (areas[0]||{}).id;
  if(!SEMD.desde){ SEMD.desde = actual?actual.h.desde:''; SEMD.hasta = actual?actual.h.hasta:''; }
  const sel = byId(DB.areas, SEMD.areaId);
  const selSuc = sel?byId(DB.sucursales, sel.sucursalId):null;
  sheet(DIAS[dia]+' de '+p.nombre.split(' ')[0], `
    <div class="${actual?'okbox':'infobox'}" style="margin-bottom:12px">
      ${actual?`Hoy tiene cargado <b>${actual.h.desde} a ${actual.h.hasta}</b> en ${esc(actual.suc?actual.suc.nombre:'')}`
        :`Los ${DIAS[dia].toLowerCase()} <b>no trabaja</b>.`}
    </div>

    <div class="h3" style="margin-top:0">¿Qué horario?</div>
    <div class="pillgrid">
      ${frec.map(([a,b])=>`<button class="pill ${(SEMD.desde===a&&SEMD.hasta===b)?'on':''}"
        onclick="SEMD.desde='${a}';SEMD.hasta='${b}';editarDiaSemana('${pid}',${dia})">${a} a ${b}</button>`).join('')}
      <button class="pill" style="color:var(--acc);font-weight:700"
        onclick="horarioSemanaAMano('${pid}',${dia})">Otro horario…</button>
    </div>
    ${(SEMD.desde&&!frec.some(([a,b])=>a===SEMD.desde&&b===SEMD.hasta))?`
      <div class="okbox" style="margin-top:9px">Elegido: <b>${SEMD.desde} a ${SEMD.hasta}</b></div>`:''}

    <div class="h3">¿Dónde?</div>
    <div class="pillgrid">
      ${areas.map(a=>{const su=byId(DB.sucursales,a.sucursalId);
        return `<button class="pill ${a.id===SEMD.areaId?'on':''}"
          onclick="SEMD.areaId='${a.id}';editarDiaSemana('${pid}',${dia})">
          ${esc(su?sucCorta(su.nombre):'')} · ${a.icono} ${esc(a.nombre)}</button>`;}).join('')}
    </div>

    <button class="btn" style="margin-top:14px" onclick="guardarDiaSemana('${pid}',${dia})">
      Guardar${(SEMD.desde&&selSuc)?' · '+SEMD.desde+' a '+SEMD.hasta+' en '+esc(selSuc.nombre):''}</button>
    ${actual?`<button class="btn dan" style="margin-top:8px" onclick="sacarDiaSemana('${pid}',${dia})">
      ${ic('x','sm')} Los ${DIAS[dia].toLowerCase()} no trabaja</button>`:''}
    <button class="btn sec" style="margin-top:8px" onclick="SEMD={};suSemana('${pid}')">Volver</button>`);
}
let SEMD = {};
function horarioSemanaAMano(pid, dia){
  sheet('Otro horario', `
    <div class="small muted" style="margin-bottom:11px">Los turnos suelen ser de 6 horas,
      pero podés poner el que necesites.</div>
    <div class="row f">
      <div><label>Desde</label><input type="time" id="smd" value="${SEMD.desde||'09:00'}"></div>
      <div><label>Hasta</label><input type="time" id="smh" value="${SEMD.hasta||'15:00'}"></div>
    </div>
    <button class="btn" onclick="(function(){
      const a=document.getElementById('smd').value, b=document.getElementById('smh').value;
      if(!a||!b||mh(b)<=mh(a)){ toast('Revisá el horario'); return; }
      SEMD.desde=a; SEMD.hasta=b; editarDiaSemana('${pid}',${dia});})()">Usar este horario</button>`);
}
function guardarDiaSemana(pid, dia){
  if(!SEMD.desde||!SEMD.hasta){ toast('Elegí el horario'); return; }
  if(!SEMD.areaId){ toast('Elegí dónde trabaja'); return; }
  const antes = semanaDe(pid)[dia];
  const areaNueva = byId(DB.areas, SEMD.areaId);
  const sucNueva = byId(DB.sucursales, areaNueva.sucursalId);
  const mudanza = antes.filter(x=>x.area.id!==SEMD.areaId);
  if(!ponerDiaSemana(pid, dia, SEMD.desde, SEMD.hasta, SEMD.areaId)) return;
  logAcc(`${byId(DB.profesionales,pid).nombre}: los ${DIAS[dia].toLowerCase()} ${SEMD.desde} a ${SEMD.hasta} en ${sucNueva.nombre}`);
  const q = SEMD; SEMD = {};
  render();
  if(mudanza.length) toast('Guardado. Le saqué ese día de '+mudanza.map(x=>x.suc?x.suc.nombre:'').join(', '));
  else toast('Guardado');
  suSemana(pid);
}
function sacarDiaSemana(pid, dia){
  if(!ponerDiaSemana(pid, dia, null, null, null)) return;
  logAcc(`${byId(DB.profesionales,pid).nombre}: los ${DIAS[dia].toLowerCase()} no trabaja`);
  SEMD = {}; render(); toast('Guardado'); suSemana(pid);
}

/* ---- copiar un día al resto ---- */
function copiarSemana(pid){
  const sem = semanaDe(pid);
  const conHorario = DIAS_ORD.filter(d=>sem[d].length);
  if(!conHorario.length){ toast('Primero cargale un día'); return; }
  sheet('Copiar un día al resto', `
    <div class="infobox">Elegí el día que ya está bien cargado. Se copia a los días
      de lunes a viernes que no tengan nada.</div>
    <div class="listcard">${conHorario.map(d=>{
      const x=sem[d][0];
      return `<button class="lr" onclick="hacerCopiarSemana('${pid}',${d})">
        <div class="av">${DIAS[d].slice(0,3)}</div>
        <div class="g"><b>${x.h.desde} a ${x.h.hasta}</b>
          <span>${esc(x.suc?x.suc.nombre:'')} · ${x.area.icono} ${esc(x.area.nombre)}</span></div>
        ${ic('chev','sm')}</button>`;}).join('')}</div>`);
}
function hacerCopiarSemana(pid, dia){
  const x = semanaDe(pid)[dia][0]; if(!x) return;
  let n=0;
  [1,2,3,4,5].forEach(d=>{
    if(d===dia) return;
    if(semanaDe(pid)[d].length) return;      /* no pisa lo que ya está cargado */
    if(ponerDiaSemana(pid, d, x.h.desde, x.h.hasta, x.area.id)) n++;
  });
  logAcc(`${byId(DB.profesionales,pid).nombre}: se copió el ${DIAS[dia].toLowerCase()} a ${n} días`);
  render(); toast(n?('Copiado a '+n+' días'):'Los demás días ya tenían horario');
  suSemana(pid);
}

/* ============================================================
   EL CUADRO DE TODA LA SEMANA, TODOS LOS LOCALES
   Lo que la supervisora hoy hace con una hoja y una birome.
   ============================================================ */
function profesParaHorarios(){
  let ps = DB.profesionales.filter(p=>p.activa);
  const u = usuario();
  if(perm('equipo')==='prop') ps = ps.filter(p=>p.id===u.profId);
  return ps.sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
/* los avisos: lo que la supervisora tendría que sacar a mano */
function avisosHorarios(sucFiltro){
  const av = [];
  const ps = profesParaHorarios();
  ps.forEach(p=>{
    const sem = semanaDe(p.id);
    if(!DIAS_ORD.some(d=>sem[d].length))
      av.push({n:'rojo', t:esc(p.nombre)+' no tiene ningún horario cargado'});
    diasChocados(p.id).forEach(d=>
      av.push({n:'naranja', t:esc(p.nombre.split(' ')[0])+' está en dos locales el '+DIAS[d].toLowerCase()}));
  });
  /* áreas sin nadie, pero solo los días en que el local sí abre */
  const areas = DB.areas.filter(a=>a.activa && (!sucFiltro || a.sucursalId===sucFiltro));
  DIAS_ORD.forEach(d=>{
    const porSuc = {};
    areas.forEach(a=>{
      const hay = DB.horarios.some(h=>h.dia===d && (byId(DB.asign,h.asignId)||{}).areaId===a.id);
      porSuc[a.sucursalId] = porSuc[a.sucursalId] || [];
      porSuc[a.sucursalId].push({a, hay});
    });
    Object.entries(porSuc).forEach(([sid, lista])=>{
      if(!lista.some(x=>x.hay)) return;                 /* ese día el local no abre */
      lista.filter(x=>!x.hay).forEach(x=>{
        const su=byId(DB.sucursales,sid);
        av.push({n:'rojo', t:DIAS[d]+' · '+esc(su?su.nombre:'')+' · '+esc(x.a.nombre)+': no queda nadie'});
      });
    });
  });
  return av;
}

function profesDeSucursal(){
  const areasS = areasDeSucursal();
  const ids = [...new Set(DB.asign.filter(a=>areasS.some(x=>x.id===a.areaId)).map(a=>a.profId))];
  let ps = ids.map(i=>byId(DB.profesionales,i)).filter(Boolean);
  const u = usuario();
  if(perm('equipo')==='prop') ps = ps.filter(p=>p.id===u.profId);
  if(perm('equipo')==='area' && areasDeUsuario(u).length){
    const mias = areasDeUsuario(u);
    const mios = DB.asign.filter(a=>mias.includes(a.areaId)).map(a=>a.profId);
    ps = ps.filter(p=>mios.includes(p.id));
  }
  return ps.sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
function areasDeProf(profId){
  return DB.asign.filter(a=>a.profId===profId)
    .map(a=>({as:a, area:byId(DB.areas,a.areaId)}))
    .filter(x=>x.area)
    .map(x=>({...x, suc:byId(DB.sucursales, x.area.sucursalId)}));
}

/* ---------- excepciones por día ---------- */
/* ============================================================
   HORARIOS EN UNA SOLA PANTALLA
   Se toca la casilla de la semana y se resuelve ahí: el horario de ese día,
   o el horario de siempre para ese día de la semana. Sin saltar a otro lado.
   ============================================================ */
/* los horarios que más se usan en el instituto, para ofrecerlos de un toque */
function horariosFrecuentes(){
  const c={};
  DB.horarios.forEach(h=>{ const k=h.desde+'-'+h.hasta; c[k]=(c[k]||0)+1; });
  const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0].split('-'));
  /* de arranque, bloques de 6 horas que cubren el día de 9 a 19:30.
     A medida que cargan los de verdad, estos se caen solos de la lista. */
  ['09:00-15:00','13:30-19:30','10:00-16:00'].forEach(d=>{
    const [a,b]=d.split('-');
    if(!arr.some(x=>x[0]===a&&x[1]===b) && arr.length<5) arr.push([a,b]);
  });
  return arr;
}
/* la supervisora maneja los horarios de SU gente; administración, de todos */
function puedeTocarHorarioDe(pid){
  const nivel = perm('equipo');
  if(nivel==='todo') return true;
  if(nivel==='suc'){
    /* recepción: cualquiera que trabaje en un área de SU sucursal */
    const ids = DB.areas.filter(a=>a.sucursalId===ST.sucursalId).map(a=>a.id);
    return DB.asign.some(a=>a.profId===pid && ids.includes(a.areaId));
  }
  if(nivel!=='area') return false;
  const mias = areasDeUsuario();
  if(!mias.length) return false;
  return DB.asign.some(a=>a.profId===pid && mias.includes(a.areaId));
}
function editarDia(pid, fecha){

  const aHoy = areasS.find(x=>horarioBase(pid, x.id, fecha)) || areasDeProf(pid).map(x=>x.area)[0];
  const base = aHoy?horarioBase(pid, aHoy.id, fecha):null;
  const otras = areasDeProf(pid).filter(x=>!aHoy || x.area.id!==aHoy.id);
  const real = aHoy?horarioDe(pid, aHoy.id, fecha):null;
  const d = parseISO(fecha);
  const frec = horariosFrecuentes();

  sheet(p.nombre.split(' ')[0]+' · '+fechaLarga(fecha), `
    <div class="${real?'okbox':'warnbox'}" style="margin-bottom:11px">
      ${real?`Ese día trabaja <b>${real.desde} a ${real.hasta}</b>${aHoy?' en '+esc(aHoy.nombre):''}${real.excepcion?' (cambiado a mano)':''}`
            :`Ese día <b>no trabaja</b>${ex?': '+esc(etiquetaExc(ex)):''}`}

      <button class="pill" onclick="horarioAMano('${pid}','${fecha}')" style="color:var(--acc);font-weight:700">Otro horario…</button>
      ${base?`<button class="pill" onclick="quitarExcepcionDia('${pid}','${fecha}')">Lo de siempre</button>`:''}

      ${otras.length?`<button class="btn sm sec" style="grid-column:1/3" onclick="trasladoDia('${pid}','${fecha}')">🔄 Ese día va a otra área</button>`:''}
      ${(puedeEditarAgenda() && turnosDelDiaDe(pid,fecha).length)?`<button class="btn sm sec" style="grid-column:1/3"
        onclick="closeSheet();reubicarTurnos('${pid}','${fecha}')">👥 Pasarle sus ${turnosDelDiaDe(pid,fecha).length} turnos a otra</button>`:''}
    </div>

    <div class="h3">Todos los ${DIAS[d.getDay()].toLowerCase()}</div>
    <div class="small muted" style="margin:-4px 0 9px">Esto cambia su horario de siempre, no un día suelto.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">

function marcarDia(pid, fecha, tipo){
  if(!puedeTocarHorarioDe(pid)){ toast('Solo podés cambiarle el horario a la gente de tu área'); return; }
  const chocan = lineasDe(fecha, l=>l.profId===pid && !['can','fin','no'].includes(l.estado));

    const vieja = excepcionDe(pid, fecha);
    if(vieja) DB.excepciones = DB.excepciones.filter(e=>e.id!==vieja.id);
    let hastaF = fecha;
    if(tipo==='vacaciones'){ const q=prompt('¿Hasta qué día? (AAAA-MM-DD)', addDays(fecha,7)); if(q) hastaF=q; }
    DB.excepciones.push({id:uid('ex'), profId:pid, tipo, desdeF:fecha, hastaF,
      desde:null, hasta:null, areaId:null, motivo:motivo||''});
    logAcc(`${byId(DB.profesionales,pid).nombre}: ${tipo} desde ${fechaCorta(fecha)}`);
    save(); closeSheet(); render(); toast('Guardado');
  };
  if(chocan.length) return confirmarConMotivo('Tiene turnos ese día',
    chocan.map(l=>`${byId(DB.clientas,l.visita.clientaId).nombre} a las ${l.hora}.`)
      .concat(['Al guardar, el sistema te ofrece pasárselos a otra.']),
    'Guardarlo igual', m=>{ guardar(m); setTimeout(()=>reubicarTurnos(pid, fecha), 350); });
  guardar('');
}

/* ============================================================
   FALTÓ UNA PROFESIONAL — pasarle el día entero a otra.
   Antes había que abrir turno por turno y usar "Cambiar
   profesional" en cada uno: con 25 turnos, 100 toques.
   ============================================================ */
function turnosDelDiaDe(pid, fecha){
  return lineasDe(fecha, l=>l.profId===pid && !['can','fin','no'].includes(l.estado))
    .sort((a,b)=>mh(a.hora)-mh(b.hora));
}
/* ¿esta profesional puede tomar esta línea, y entra sin pisar nada? */
function puedeTomar(destId, l, fecha){
  if(!profesDe(l.areaId, l.servicioId).some(z=>z.id===destId)) return 'no-hace';
  return forzarPara(destId, l.areaId, fecha, l.hora, l.servicioId, l.dur, l.id) ? 'forzando' : 'entra';
}
function reubicarTurnos(pid, fecha){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const p = byId(DB.profesionales, pid);
  const ls = turnosDelDiaDe(pid, fecha).filter(l=>turnoVisibleEnAgenda(l, l.visita));
  if(!ls.length){ toast('No le quedan turnos ese día'); return; }
  /* candidatas: las del área de esos turnos, menos ella */
  const cands = [];
  [...new Set(ls.map(l=>l.areaId))].forEach(aid=>profesDe(aid).forEach(x=>{
    if(x.id!==pid && !cands.find(c=>c.id===x.id)) cands.push(x); }));
  const cuenta = c => { const r={entra:0, forzando:0, no:0};
    ls.forEach(l=>{ const q=puedeTomar(c.id,l,fecha);
      if(q==='entra') r.entra++; else if(q==='forzando') r.forzando++; else r.no++; });
    return r; };
  const filas = cands.map(c=>({c, r:cuenta(c)}))
    .sort((a,b)=> (b.r.entra-a.r.entra) || (a.r.no-b.r.no));
  sheet('Faltó '+p.nombre.split(' ')[0], `
    ${(()=>{ const todos = turnosDelDiaDe(pid, fecha).length;
      return `<div class="warnbox">${ic('alert','sm')} Tiene <b>${ls.length} turno${ls.length===1?'':'s'}</b>
      el ${fechaCorta(fecha)}, de ${ls[0].hora} a ${ls[ls.length-1].hora}. Hay que reubicarlos.
      ${todos>ls.length?`<br><span class="tiny">Ese día tiene ${todos} en total; los otros ${todos-ls.length} son de áreas que no manejás.</span>`:''}</div>`;})()}
    <div class="h3" style="margin-top:0">Pasárselos todos a</div>
    ${filas.length?`<div class="listcard">${filas.map(({c,r})=>`
      <button class="lr" onclick="confirmarReubicar('${pid}','${fecha}','${c.id}')">
        <div class="av">${ini(c.nombre)}</div>
        <div class="g"><b>${esc(c.nombre)}</b>
          <span>${r.entra} entra${r.entra===1?'':'n'} bien${r.forzando?` · ${r.forzando} forzándolo${r.forzando===1?'':'s'}`:''}${r.no?` · ${r.no} no lo${r.no===1?'':'s'} hace`:''}</span></div>
        ${ic('chev','sm')}</button>`).join('')}</div>`
      :`<div class="empty">No hay otra profesional en esa área.</div>`}
    <div class="h3">O uno por uno</div>
    <div class="listcard">${ls.map(l=>{
      const cl=byId(DB.clientas,l.visita.clientaId)||{}, sv=byId(DB.servicios,l.servicioId)||{};

function confirmarReubicar(pid, fecha, destId){
  const p = byId(DB.profesionales, pid), d = byId(DB.profesionales, destId);
  const ls = turnosDelDiaDe(pid, fecha).filter(l=>turnoVisibleEnAgenda(l, l.visita));
  const forz = ls.filter(l=>puedeTomar(destId,l,fecha)==='forzando');
  const noHace = ls.filter(l=>puedeTomar(destId,l,fecha)==='no-hace');
  const mueve = ls.length - noHace.length;
  const avisos = [];
  if(forz.length) avisos.push(`${forz.length} se le superponen o quedan fuera de su horario. Se cargan igual, marcados como forzados.`);
  if(noHace.length) avisos.push(`${noHace.length} no los tiene habilitados y quedan con ${esc(p.nombre.split(' ')[0])}: ${noHace.map(l=>l.hora).join(', ')}.`);
  if(!mueve){ toast(d.nombre.split(' ')[0]+' no hace ninguno de esos servicios'); return; }
  if(avisos.length)
    return confirmarConMotivo(`Pasar ${mueve} a ${d.nombre.split(' ')[0]}`, avisos,
      `Pasárselos igual`, m=>hacerReubicar(pid, fecha, destId, m));
  hacerReubicar(pid, fecha, destId, '');
}
function hacerReubicar(pid, fecha, destId, motivo){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const p = byId(DB.profesionales, pid), d = byId(DB.profesionales, destId);
  const ls = turnosDelDiaDe(pid, fecha).filter(l=>turnoVisibleEnAgenda(l, l.visita));
  let movidos=0, forzados=0, quedaron=0;
  ls.forEach(ref=>{
    const v = byId(DB.visitas, ref.visita.id); if(!v) return;
    const l = byId(v.lineas, ref.id); if(!l) return;
    const q = puedeTomar(destId, l, fecha);
    if(q==='no-hace'){ quedaron++; return; }
    if(q==='forzando'){
      l.forzado = (l.forzado?l.forzado+' · ':'') + 'Reemplazo de '+p.nombre.split(' ')[0]+(motivo?': '+motivo:'');
      forzados++;
    }
    l.profId = destId;
    /* la comisión la cobra quien EFECTIVAMENTE hace el servicio */
    const as = DB.asign.find(a=>a.profId===destId && a.areaId===l.areaId);
    const sv = byId(DB.servicios, l.servicioId);
    l.comisionPct = (as && as.comision!=null) ? as.comision : (sv?sv.comision:l.comisionPct);
    movidos++;
  });
  logAcc(`${movidos} turnos de ${p.nombre} pasaron a ${d.nombre} el ${fechaCorta(fecha)}${motivo?' — '+motivo:''}`);
  save(); closeSheet(); render();
  toast(movidos+' turno'+(movidos===1?'':'s')+' a '+d.nombre.split(' ')[0]);
  if(quedaron) setTimeout(()=>sheet('Quedaron '+quedaron+' sin reubicar', `
    <div class="warnbox">${ic('alert','sm')} ${esc(d.nombre.split(' ')[0])} no tiene habilitados esos servicios.
      Siguen figurando con ${esc(p.nombre.split(' ')[0])}.</div>
    <button class="btn" onclick="closeSheet();reubicarTurnos('${pid}','${fecha}')">Buscarles otra</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Después lo veo</button>`), 700);
}

function hacerTraslado(pid, fecha, areaId){
  if(!puedeTocarHorarioDe(pid)){ toast('Solo podés cambiarle el horario a la gente de tu área'); return; }
  /* si ese día ya tiene turnos en su área, el traslado los deja colgados: ahí sí pide motivo */
  const chocan = lineasDe(fecha, l=>l.profId===pid && l.areaId!==areaId && !['can','fin','no'].includes(l.estado));
  const guardar = (motivo)=>{
    const vieja = excepcionDe(pid, fecha);
    if(vieja) DB.excepciones = DB.excepciones.filter(e=>e.id!==vieja.id);
    const base = horarioBase(pid, areaId, fecha) || horarioBase(pid, (areasDeProf(pid)[0]||{area:{}}).area.id, fecha) || {desde:'09:00', hasta:'17:00'};
    DB.excepciones.push({id:uid('ex'), profId:pid, tipo:'traslado', desdeF:fecha, hastaF:fecha,
      desde:base.desde, hasta:base.hasta, areaId, motivo:motivo||'Traslado del día'});
    logAcc(`${byId(DB.profesionales,pid).nombre}: el ${fechaCorta(fecha)} va a ${byId(DB.areas,areaId).nombre}${motivo?' — '+motivo:''}`);
    save(); closeSheet(); render(); toast('Guardado');
  };
  if(chocan.length) return confirmarConMotivo('Tiene turnos ese día en su área',
    chocan.map(l=>`${byId(DB.clientas,l.visita.clientaId).nombre} a las ${l.hora} (${byId(DB.servicios,l.servicioId).nombre}).`)
      .concat(['Si se va a otra área esos turnos quedan sin profesional.']),
    'Trasladarla igual', m=>guardar(m));
  guardar('');
}

function ponerHorarioSiempre(pid, fecha, desde, hasta){
  if(!puedeTocarHorarioDe(pid)){ toast('Solo podés cambiarle el horario a la gente de tu área'); return; }
  const dia = parseISO(fecha).getDay();
  const areasS = areasDeSucursal();
  const a = areasS.find(x=>DB.asign.find(y=>y.profId===pid && y.areaId===x.id))
         || (areasDeProf(pid)[0]||{}).area;
  if(!a){ toast('Primero hay que asignarla a un área'); return; }
  const as = DB.asign.find(y=>y.profId===pid && y.areaId===a.id);
  const otros = DB.horarios.filter(h=>h.asignId===as.id && h.dia!==dia);
  const modelo = DB.horarios.find(h=>h.asignId===as.id) || {pausaD:null, pausaH:null};
  DB.horarios = DB.horarios.filter(h=>!(h.asignId===as.id && h.dia===dia));
  if(desde && hasta){
    DB.horarios.push({id:uid('ho'), asignId:as.id, dia, desde, hasta,
      pausaD:modelo.pausaD, pausaH:modelo.pausaH});
  }
  logAcc(`${byId(DB.profesionales,pid).nombre}: los ${DIAS[dia].toLowerCase()} ${desde?desde+' a '+hasta:'no trabaja'}`);
  save(); closeSheet(); render();
  toast(desde?`Todos los ${DIAS[dia].toLowerCase()} ${desde} a ${hasta}`:`Ya no trabaja los ${DIAS[dia].toLowerCase()}`);
}

function vComisiones(){
  if(!ST.comDesde){ const d=new Date(); ST.comDesde=iso(new Date(d.getFullYear(),d.getMonth(),1)); ST.comHasta=hoy(); }
  const presets = [
    ['Esta semana', lunesDe(hoy()), hoy()],
    ['Este mes', (()=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth(),1))})(), hoy()],
    ['Mes pasado', (()=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth()-1,1))})(),
                   (()=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth(),0))})()]
  ];
  let gente = DB.profesionales;
  if(perm('equipo')==='area'){
    const mias = areasDeUsuario();
    const mios = DB.asign.filter(a=>mias.includes(a.areaId)).map(a=>a.profId);
    gente = gente.filter(p=>mios.includes(p.id));
  }
  if(perm('equipo')==='suc'){
    /* recepción: la gente que trabaja en su sucursal, que es a la que le paga */
    const ids = DB.areas.filter(a=>a.sucursalId===ST.sucursalId).map(a=>a.id);
    const suyos = DB.asign.filter(a=>ids.includes(a.areaId)).map(a=>a.profId);
    gente = gente.filter(p=>suyos.includes(p.id));
  }
  const filas = gente.map(p=>{
    const ls = lineasComisionables(p.id, ST.comDesde, ST.comHasta);
    const pend = ls.filter(x=>!x.l.liqId);
    return {p, ls, pend,
      com: pend.reduce((s,x)=>s+comisionLinea(x.l),0),
      fact: pend.reduce((s,x)=>s+x.l.precio,0)};
  }).filter(f=>f.ls.length>0 || f.com>0).sort((a,b)=>b.com-a.com);

  /* las liquidaciones también se filtran por la misma gente: la supervisora no tiene
     por qué ver lo que se le pagó a otra área, ni recepción lo de otra sucursal */
  const visibles = new Set(gente.map(p=>p.id));

/* servicios finalizados de una profesional en un rango */
function lineasComisionables(profId, desde, hasta){
  const out=[];
  DB.visitas.filter(v=>v.fecha>=desde && v.fecha<=hasta).forEach(v=>{
    v.lineas.filter(l=>l.profId===profId && l.estado==='fin').forEach(l=>out.push({l,v}));
  });
  return out.sort((a,b)=>a.v.fecha.localeCompare(b.v.fecha));
}
function verComisiones(pid){
  const p = byId(DB.profesionales,pid);
  const ls = lineasComisionables(pid, ST.comDesde, ST.comHasta).filter(x=>!x.l.liqId);
  const com = ls.reduce((s,x)=>s+comisionLinea(x.l),0);
  const exentas = ls.filter(x=>x.l.exenta);
  sheet('Comisiones de '+p.nombre.split(' ')[0], `
    <div class="card cardp" style="margin-bottom:13px">
      <div class="kv"><span class="muted">Período</span><b>${fechaCorta(ST.comDesde)} al ${fechaCorta(ST.comHasta)}</b></div>
      <div class="kv"><span class="muted">Servicios</span><b>${ls.length}</b></div>
      <div class="kv"><span class="muted">Facturó</span><b>${money(ls.reduce((s,x)=>s+x.l.precio,0))}</b></div>
      ${exentas.length?`<div class="kv"><span class="muted">Exentas</span><b>${exentas.length}</b></div>`:''}
      ${p.fijoMonto>0?`<div class="kv"><span class="muted">Sueldo fijo</span><b>${money(p.fijoMonto)} por ${p.fijoFrec}</b></div>`:''}
      <div class="tot"><span>Comisión</span><span>${money(com)}</span></div>
    </div>
    <div class="listcard" style="max-height:280px;overflow-y:auto">
      ${ls.length?ls.map(x=>{
        const cl=byId(DB.clientas,x.v.clientaId), sv=byId(DB.servicios,x.l.servicioId);
        return `<div class="lr"><div class="g">
          <b>${esc(sv.nombre)}</b>
          <span>${fechaCorta(x.v.fecha)} · ${esc(cl.nombre)}</span></div>
          <div class="r">${x.l.exenta
            ? `<span class="bd">Exenta</span><br><span class="tiny">${esc(x.l.motivo||'')}</span>`
            : `<b>${money(comisionLinea(x.l))}</b><br><span class="tiny">${x.l.comisionPct}% de ${money(x.l.precio)}</span>`}
          </div></div>`;}).join(''):`<div class="empty">Sin servicios finalizados en el período.</div>`}
    </div>
    ${ls.length&&puedeLiquidar()?`<button class="btn pay" style="margin-top:13px" onclick="liquidar('${pid}')">
      Liquidar ${money(com + (p.fijoMonto||0))}</button>`:''}`);
}
function liquidar(pid){
  const p = byId(DB.profesionales,pid);
  const ls = lineasComisionables(pid, ST.comDesde, ST.comHasta).filter(x=>!x.l.liqId);
  const com = ls.reduce((s,x)=>s+comisionLinea(x.l),0);
  sheet('Liquidar a '+p.nombre.split(' ')[0], `
    <div class="card cardp" style="margin-bottom:13px">
      <div class="kv"><span class="muted">Comisiones</span><b>${money(com)}</b></div>
      <div class="kv"><span class="muted">Sueldo fijo</span><b>${money(p.fijoMonto||0)}</b></div>
      <div class="tot"><span>Total a pagar</span><span>${money(com+(p.fijoMonto||0))}</span></div>
    </div>
    <div class="warnbox">Al liquidar, estos ${ls.length} servicios quedan cerrados y no se vuelven
    a contar. Un cambio de porcentaje de acá en adelante no los toca.</div>
    <div class="f"><label>Sueldo fijo a incluir</label>
      <input type="number" id="lqf" value="${p.fijoMonto||0}" inputmode="numeric"></div>
    <button class="btn pay" onclick="hacerLiquidacion('${pid}')">Cerrar la liquidación</button>`);
}
function hacerLiquidacion(pid){
  if(!puedeLiquidar()){ toast('Las liquidaciones las maneja administración'); return; }
  const p = byId(DB.profesionales,pid);
  const ls = lineasComisionables(pid, ST.comDesde, ST.comHasta).filter(x=>!x.l.liqId);
  const com = ls.reduce((s,x)=>s+comisionLinea(x.l),0);
  const fijo = +document.getElementById('lqf').value||0;
  const liq = {id:uid('lq'), profId:pid, desde:ST.comDesde, hasta:ST.comHasta,
    lineas:ls.map(x=>x.l.id), comision:com, fijo, total:com+fijo,
    fecha:hoy(), pagada:false, pagadaF:null, usuario:usuario().nombre};
  DB.liquidaciones.push(liq);
  ls.forEach(x=>x.l.liqId=liq.id);
  logAcc(`Liquidación de ${p.nombre}: ${money(liq.total)}`);
  save(); closeSheet(); render(); toast('Liquidada. Queda pendiente de pago.');
}
function deshacerLiquidacion(lid){
  if(!puedeLiquidar()){ toast('Las liquidaciones las maneja administración'); return; }
  const l=byId(DB.liquidaciones,lid);
  const p=byId(DB.profesionales,l.profId);
  sheet('Deshacer la liquidación', `
    <div class="warnbox">${ic('alert','sm')} Los ${l.lineas.length} servicios de
      <b>${esc(p?p.nombre:'')}</b> vuelven a quedar sin liquidar, como estaban antes.</div>
    <div class="infobox">Usalo si liquidaste el período equivocado o con el porcentaje viejo.</div>
    <button class="btn dan" onclick="hacerDeshacerLiquidacion('${lid}')">Sí, deshacerla</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
}
function hacerDeshacerLiquidacion(lid){
  if(!puedeLiquidar()){ toast('Las liquidaciones las maneja administración'); return; }
  const l=byId(DB.liquidaciones,lid);
  DB.visitas.forEach(v=>v.lineas.forEach(x=>{ if(x.liqId===lid) x.liqId=null; }));
  DB.liquidaciones = DB.liquidaciones.filter(x=>x.id!==lid);
  logAcc(`Liquidación deshecha: ${(byId(DB.profesionales,l.profId)||{}).nombre||''}`);
  save(); closeSheet(); render(); toast('Liquidación deshecha');
}
function marcarPagada(lid){
  if(!puedeLiquidar()){ toast('Las liquidaciones las maneja administración'); return; }
  const l = byId(DB.liquidaciones,lid);
  const p = byId(DB.profesionales,l.profId);
  l.pagada=true; l.pagadaF=hoy();
  /* la plata sale de la caja: si no quedó cargada al liquidar, se carga ahora */
  if(!l.gastoId && puedeCobrar()){
    const g = {id:uid('ga'), sucursalId:ST.sucursalId, fecha:hoy(),
      concepto:'Pago a '+(p?p.nombre:''), importe:l.total, tipo:'comision'};
    DB.gastos.push(g); l.gastoId=g.id;
  }
  logAcc(`Pagada la liquidación de ${p?p.nombre:''}: ${money(l.total)}`);
  save(); render();
  toast(l.gastoId?'Pagada y cargada en la caja':'Marcada como pagada');
}

function paqueteActivo(clientaId, servicioId){
  return DB.paquetes.find(p=>p.clientaId===clientaId && p.servicioId===servicioId && p.usadas<p.total) || null;
}
function venderPaquete(clientaId){
  const svs = DB.servicios.filter(s=>s.activo && byId(DB.areas,s.areaId).sucursalId===ST.sucursalId);
  sheet('Vender un paquete de sesiones', `
    ${clientaId?'':`<div class="f"><label>Clienta</label>
      <select id="pqc">${DB.clientas.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></div>`}
    <div class="f"><label>Servicio</label>
      <select id="pqs" onchange="calcPaquete()">${svs.map(s=>`<option value="${s.id}" data-p="${s.contado}">${esc(s.nombre)} — ${money(s.contado)}</option>`).join('')}</select></div>
    <div class="row f">
      <div><label>Cantidad de sesiones</label><input type="number" id="pqn" value="6" min="1" inputmode="numeric" oninput="calcPaquete()"></div>
      <div><label>Descuento %</label><input type="number" id="pqd" value="20" inputmode="numeric" oninput="calcPaquete()"></div>
    </div>
    <div id="pqprev" class="okbox"></div>
    <div class="f"><label>Precio final del paquete</label><input type="number" id="pqt" inputmode="numeric"></div>
    <label>Medio de pago</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin-bottom:13px">
      ${MEDIOS.map((m,i)=>`<button class="pill ${i===0?'on':''}" data-m="${m.k}"
        onclick="[...document.querySelectorAll('[data-m]')].forEach(x=>x.classList.remove('on'));this.classList.add('on')">${m.n}</button>`).join('')}
    </div>
    <div class="infobox">La plata entra hoy a la caja. La comisión de la profesional se genera
    en cada sesión que se hace, no toda junta hoy.</div>
    <button class="btn pay" onclick="guardarPaquete('${clientaId||''}')">Vender paquete</button>`);
  setTimeout(calcPaquete,40);
}
function calcPaquete(){
  const s=document.getElementById('pqs'), n=+document.getElementById('pqn').value||1,
        d=+document.getElementById('pqd').value||0;
  const pr=+s.options[s.selectedIndex].dataset.p;
  const lista=pr*n, fin=Math.round(lista*(1-d/100)/500)*500;
  document.getElementById('pqprev').innerHTML =
    `${n} sesiones a ${money(pr)} = ${money(lista)} · con ${d}% de descuento: <b>${money(fin)}</b>`;
  document.getElementById('pqt').value = fin;
}
function guardarPaquete(clientaId){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const cid = clientaId || document.getElementById('pqc').value;
  const sid = document.getElementById('pqs').value;
  const n = +document.getElementById('pqn').value||1;
  const imp = +document.getElementById('pqt').value||0;
  const medio = (document.querySelector('[data-m].on')||{dataset:{m:'efectivo'}}).dataset.m;
  const pq={id:uid('pq'), clientaId:cid, servicioId:sid, total:n, usadas:0,
    importe:imp, medio, fecha:hoy(), sucursalId:ST.sucursalId, usuario:usuario().nombre};
  DB.paquetes.push(pq);
  pq.movId = mov('paquete', {importe:imp, medio, clientaId:cid,
    concepto:'Paquete · '+byId(DB.clientas,cid).nombre+' · '+n+' sesiones'}).id;
  logAcc(`Paquete vendido a ${byId(DB.clientas,cid).nombre}: ${n} sesiones por ${money(imp)}`);
  save(); closeSheet(); render(); toast('Paquete vendido');
}

function hacerCanje(vid, voId){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }

/* ============================================================
   LO QUE HAY QUE PAGARLE HOY A CADA PROFESIONAL
   La cajera tiene que poder ver y pagar sin entrar a Comisiones.
   ============================================================ */
function pagosDelDia(fecha, sucursalId){
  const out = {};
  DB.visitas.filter(v=>v.fecha===fecha && v.sucursalId===sucursalId).forEach(v=>{
    v.lineas.filter(l=>l.estado==='fin' && !l.liqId).forEach(l=>{
      const p = byId(DB.profesionales, l.profId); if(!p) return;
      out[p.id] = out[p.id] || {p, lineas:[], facturo:0, comision:0};
      out[p.id].lineas.push({l,v});
      out[p.id].facturo += l.precio;
      out[p.id].comision += comisionLinea(l);
    });
  });
  return Object.values(out).sort((a,b)=>b.comision-a.comision);
}

function pagarElDia(pid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const f = pagosDelDia(hoy(), ST.sucursalId).find(x=>x.p.id===pid);
  if(!f) return;
  const fijo = fijoDelDia(f.p);
  const total = f.comision + fijo;
  const liq = {id:uid('lq'), profId:pid, desde:hoy(), hasta:hoy(),
    lineas:f.lineas.map(x=>x.l.id), comision:f.comision, fijo, total,
    fecha:hoy(), pagada:true, pagadaF:hoy(), usuario:usuario().nombre};
  DB.liquidaciones.push(liq);
  f.lineas.forEach(x=>{ x.l.liqId = liq.id; });
  const g = {id:uid('ga'), sucursalId:ST.sucursalId, fecha:hoy(), hora:horaAhora(),
    concepto:'Pago a '+f.p.nombre, importe:total, tipo:'comision',
    medio:PMEDIO, usuario:usuario().nombre};
  DB.gastos.push(g); liq.gastoId = g.id;
  liq.medio = PMEDIO;
  g.movId = mov('pagoprof', {importe:total, medio:PMEDIO, gastoId:g.id, liqId:liq.id,
    profId:pid, concepto:f.p.nombre+' · '+f.lineas.length+' servicio'+(f.lineas.length===1?'':'s')}).id;
  logAcc(`Pagado el día a ${f.p.nombre}: ${money(total)} (${PMEDIO})`);
  save(); closeSheet(); render();
  toast('Pagado. Quedó cargado en la caja.');
}

function previoCierre(){

  document.getElementById('difc').innerHTML = mc.value===''
    ? ''
    : (dif===0 ? `<div class="okbox">Cierra justo. ${money(contado)}.</div>`
       : `<div class="warnbox">${ic('alert','sm')} ${dif>0?'SOBRAN':'FALTAN'} <b>${money(Math.abs(dif))}</b>.

  document.getElementById('retc').innerHTML = mc.value===''
    ? ''
    : `Se retiran <b>${money(Math.max(0,contado-fondo))}</b> y quedan ${money(fondo)} en el cajón.`;

function hacerCerrarCaja(){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const a = arqueoDe(hoy(), ST.sucursalId);
  if(!a.apertura || a.cierre) return;
  const mc=document.getElementById('mc');
  if(!mc || mc.value===''){ toast('Contá la plata y poné cuánto hay'); return; }
  const contado = +mc.value||0;
  const fondo = +(document.getElementById('mf').value)||0;
  const dif = contado - a.esperado;
  if(dif!==0) return confirmarConMotivo(
    (dif>0?'Sobran ':'Faltan ')+money(Math.abs(dif)),
    [`Tendría que haber ${money(a.esperado)} y contaste ${money(contado)}.`,
     'La diferencia queda anotada en el cierre con tu nombre.'],
    'Cerrar igual', m=>hacerCerrarCajaFin(contado, fondo, m));
  hacerCerrarCajaFin(contado, fondo, '');
}
function hacerCerrarCajaFin(contado, fondo, motivo){
  const a = arqueoDe(hoy(), ST.sucursalId);
  const c = DB.caja.find(x=>x.sucursalId===ST.sucursalId && x.fecha===hoy());
  const retiro = Math.max(0, contado - fondo);
  if(retiro>0) mov('retiro', {importe:retiro, medio:'efectivo',
    concepto:'Se retira del cajón al cerrar', motivo});
  mov('cierre', {importe:contado, medio:'efectivo', concepto:'Cierre del día', motivo,
    contado, esperado:a.esperado, diferencia:contado-a.esperado, fondoQueda:fondo});
  if(c){ c.montoContado=contado; c.abierta=false; c.usuarioCierre=usuario().nombre; c.horaCierre=horaAhora(); }
  DB.cfg.fondoCaja = fondo;
  logAcc(`Caja cerrada: contó ${money(contado)}, esperado ${money(a.esperado)}`+
    (contado-a.esperado?`, diferencia ${money(contado-a.esperado)} — ${motivo}`:', sin diferencia')+
    `. Se retiran ${money(retiro)} y quedan ${money(fondo)}.`);
  save(); closeSheet(); render(); toast('Caja cerrada');
}

function guardarGasto(gid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const g=byId(DB.gastos,gid);
  const nc=document.getElementById('gc2').value.trim();
  const ni=+document.getElementById('gi2').value||0;
  if(g.concepto===nc && g.importe===ni){ closeSheet(); return; }
  const viejo = `${g.concepto} ${money(g.importe)}`;
  if(g.movId) anularMov(g.movId, 'corregido');
  else { const mv=DB.mov.find(x=>x.gastoId===g.id); if(mv) anularMov(mv.id,'corregido'); }
  g.concepto=nc; g.importe=ni;
  const m = mov('gasto', {importe:ni, medio:g.medio||'efectivo', gastoId:g.id, concepto:nc,
    motivo:'corrige: '+viejo});
  g.movId = m.id;
  logAcc(`Gasto corregido: ${viejo} → ${nc} ${money(ni)}`);
  save(); closeSheet(); render(); toast('Gasto corregido');
}

/* los períodos que se piden de verdad: el día, el de ayer, la semana, el mes.
   Antes el reporte era SIEMPRE "últimos 30 días" y no había forma de pedir otra cosa. */
const PERIODOS = [
  ['hoy',    'Hoy'],
  ['ayer',   'Ayer'],
  ['semana', 'Últimos 7 días'],
  ['mes',    'Este mes'],
  ['30',     'Últimos 30 días']
];
function rangoPeriodo(k){
  const H = hoy();
  if(k==='hoy')    return {desde:H, hasta:H, n:'Hoy'};
  if(k==='ayer')   return {desde:addDays(H,-1), hasta:addDays(H,-1), n:'Ayer'};
  if(k==='semana') return {desde:addDays(H,-6), hasta:H, n:'Últimos 7 días'};
  if(k==='mes'){ const d=parseISO(H); return {desde:iso(new Date(d.getFullYear(),d.getMonth(),1)), hasta:H, n:'Este mes'}; }
  return {desde:addDays(H,-30), hasta:H, n:'Últimos 30 días'};
}
function vReportes(){
  const nivel = perm('reportes');
  /* recepción ve el movimiento del día y nada más: eso no cambia */
  const fijo = nivel==='dia';
  const per = fijo ? 'hoy' : (ST.repPer || '30');
  const R = rangoPeriodo(per);
  /* recepción y supervisora ven SU sucursal, no el negocio entero */
  const soloSuc = (nivel!=='todo') ? ST.sucursalId : null;
  let vs = DB.visitas.filter(v=>v.fecha>=R.desde && v.fecha<=R.hasta
    && (!soloSuc || v.sucursalId===soloSuc));
  if(nivel==='area'){
    const mias = areasDeUsuario();
    vs = vs.map(v=>({...v, lineas:v.lineas.filter(l=>mias.includes(l.areaId))})).filter(v=>v.lineas.length);
  }

  /* ---- LA PLATA QUE ENTRÓ ----
     Sale del LIBRO DE CAJA, el mismo lugar del que sale la pantalla de Caja.
     Por eso los dos números dan siempre IGUAL: si acá dice que entraron
     $500.000, en la caja de esos días entraron $500.000.

     El recargo de la tarjeta CUENTA como plata que entró. Es plata del
     negocio: después la dueña decide cuándo y cuánto le paga a la tarjeta,
     y ese pago se carga como un gasto. Lo que NO cambia es la comisión de
     la profesional, que se sigue calculando sobre el precio de contado. */
  const movsR = (DB.mov||[]).filter(m=> m.fecha>=R.desde && m.fecha<=R.hasta
    && !m.anulado && m.tipo!=='anulacion' && (!soloSuc || m.sucursalId===soloSuc));
  const entraron = ms => ms.reduce((t,m)=>{
    const sg = (MOV_TIPOS[m.tipo]||{}).signo;
    if(m.tipo==='devolucion') return t - m.importe;
    return t + (sg===1 ? m.importe : 0);
  },0);
  /* la supervisora ve solo lo de sus áreas: eso no está en el libro,
     hay que sacarlo de los turnos */
  const fact = nivel==='area'
    ? vs.reduce((s,v)=>s+cobradoVisita(v),0)
    : entraron(movsR);
  const fin = vs.reduce((s,v)=>s+v.lineas.filter(l=>l.estado==='fin').length,0);
  const can = vs.reduce((s,v)=>s+v.lineas.filter(l=>l.estado==='can').length,0);
  const no  = vs.reduce((s,v)=>s+v.lineas.filter(l=>l.estado==='no').length,0);

  const porSuc = DB.sucursales.filter(su=>!soloSuc || su.id===soloSuc).map(su=>({su,
    t: nivel==='area'
      ? vs.filter(v=>v.sucursalId===su.id).reduce((s,v)=>s+cobradoVisita(v),0)
      : entraron(movsR.filter(m=>m.sucursalId===su.id))}))
    .sort((a,b)=>b.t-a.t);
  const cnt={};
  vs.forEach(v=>v.lineas.filter(l=>l.estado==='fin').forEach(l=>{
    const n=byId(DB.servicios,l.servicioId).nombre; cnt[n]=(cnt[n]||0)+1; }));
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max = Math.max(1,...porSuc.map(x=>x.t));

  return `<div class="pad">
    ${fijo?'':`<div class="subtabs" style="padding:0 0 11px">
      ${PERIODOS.map(([k,n])=>`<button class="ptab ${k===per?'on':''}"
        onclick="ST.repPer='${k}';render()">${n}</button>`).join('')}
    </div>`}
    <div class="small muted" style="margin-bottom:11px">${fijo?'Movimiento de hoy':esc(R.n)+' · del '+fechaCorta(R.desde)+' al '+fechaCorta(R.hasta)}${
      nivel==='area'?' · solo '+esc(nombreAreasDe()||'tu área'):''}</div>
    <div class="kpis" style="grid-template-columns:1fr 1fr">
      <div class="kpi"><b style="font-size:19px">${money(fact)}</b><span>Entró</span></div>
      <div class="kpi"><b>${fin}</b><span>Servicios hechos</span></div>
      <div class="kpi"><b style="color:var(--e-can)">${can}</b><span>Cancelados</span></div>
      <div class="kpi no"><b>${no}</b><span>No asistieron</span></div>
    </div>
    <div class="small muted" style="margin:-4px 0 12px">Es la misma plata que muestra la
      Caja de esos días. Incluye el recargo de las tarjetas: esa plata es del negocio
      hasta que se le pague a la tarjeta.</div>
    <div class="h3">${soloSuc?'Tu sucursal':'Por sucursal'}</div>
    <div class="card cardp">
      ${porSuc.map(x=>`<div style="margin-bottom:11px">
        <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">
          <span>${esc(x.su.nombre)}</span><b>${money(x.t)}</b></div>

function hacerLimpieza(){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const c=k=>(document.getElementById(k)||{}).checked;
  const hecho=[];
  if(c('li_tur')){ DB.visitas=[]; hecho.push('turnos'); }
  if(c('li_caja')){ DB.caja=[]; DB.gastos=[]; DB.fichadas=[]; DB.mov=[]; DB.cfg.fondoCaja=0;
    hecho.push('caja y fichajes'); }
  if(c('li_tur')) DB.fila=[];
  if(c('li_vou')){ DB.vouchers=[]; DB.paquetes=[]; hecho.push('vouchers y paquetes'); }
  if(c('li_esp')){ DB.espera=[]; DB.liquidaciones=[]; DB.log=[]; hecho.push('espera y liquidaciones'); }
  if(c('li_cli')){ DB.clientas=[]; hecho.push('clientas'); }
  if(c('li_blq')){ DB.bloqueos=[]; DB.excepciones=[]; hecho.push('bloqueos y ausencias'); }
  if(!hecho.length){ toast('No tildaste nada'); return; }
  /* si se borraron las clientas, no pueden quedar visitas colgadas */
  if(c('li_cli')) DB.visitas=[];
  /* el LIBRO DE CAJA se rehace con lo que quedó: si no, muestra plata que ya no existe */
  DB.mov = armarLibroDesdeLoViejo();
  logAcc('Datos de prueba borrados: '+hecho.join(', '));
  save(); closeSheet(); ST.view='home'; render();
  toast('Listo, ya pueden cargar en serio');
}

function guardarArea(id){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const n=document.getElementById('an').value.trim();
  if(!n){ toast('Falta el nombre'); return; }
  const g=k=>(document.getElementById(k)||{}).value;
  if(id){
    const a=byId(DB.areas,id);
    a.nombre=n; a.icono=g('ai')||'✨';
    a.supervisoraId=g('as')||null;
    a.sucursalId=g('asu')||a.sucursalId;
    a.orden=+g('aor')||0;
    const atu=document.getElementById('atu'); if(atu) a.porTurno=atu.checked;
    const aa=document.getElementById('aa'); if(aa) a.activa=aa.checked;
    logAcc(`Área editada: ${n}`);
  }else{
    DB.areas.push({id:uid('ar'), sucursalId:g('asu')||ST.sucursalId, nombre:n,
      icono:g('ai')||'✨', supervisoraId:g('as')||null,
      orden:+g('aor')||DB.areas.length, activa:true,
      porTurno: (document.getElementById('atu')||{checked:true}).checked});
    logAcc(`Área nueva: ${n}`);

function borrarArea(id){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const a=byId(DB.areas,id);
  const svs=DB.servicios.filter(x=>x.areaId===id);
  const asg=DB.asign.filter(x=>x.areaId===id);
  const lleva=[];
  if(svs.length) lleva.push(`${svs.length} servicio${svs.length===1?'':'s'} (${svs.slice(0,4).map(x=>x.nombre).join(', ')}${svs.length>4?'…':''})`);
  if(asg.length) lleva.push(`${asg.length} profesional${asg.length===1?'':'es'} asignada${asg.length===1?'':'s'} con sus horarios`);
  pedirBorrar({tipo:'area', id, nombre:a.nombre, seLleva:lleva.join(' y '),
    alBorrar:`hacerBorrarArea('${id}')`,
    alDejarSinUso:`dejarSinUsoArea('${id}')`, estaSinUso:!a.activa});
}
function hacerBorrarArea(id){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const a=byId(DB.areas,id);
  const asg=DB.asign.filter(x=>x.areaId===id).map(x=>x.id);
  DB.horarios = DB.horarios.filter(h=>!asg.includes(h.asignId));
  DB.asign = DB.asign.filter(x=>x.areaId!==id);
  DB.servicios = DB.servicios.filter(x=>x.areaId!==id);
  DB.excepciones = DB.excepciones.filter(e=>e.areaId!==id);
  DB.areas = DB.areas.filter(x=>x.id!==id);
  if(ST.areaId===id) ST.areaId=null;
  logAcc(`Área borrada: ${a.nombre}`);
  save(); closeSheet(); render(); toast('Área borrada');
}
function dejarSinUsoArea(id){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const a=byId(DB.areas,id); a.activa=!a.activa;

function recalcDur(){
  const v=k=>+((document.getElementById(k)||{}).value||0);
  const d = v('s1')+v('s2')+v('s3');
  const e=document.getElementById('durtot'); if(e) e.textContent=d;
  const c=v('sc'), p=document.getElementById('prev');
  if(p) p.innerHTML = c>0
    ? `Contado <b>${money(c)}</b> · con recargo del ${DB.cfg.recargo}% redondeado para arriba: <b>${money(precioLista(c))}</b>`
    : 'Poné el precio de contado y te muestro cómo queda el de lista.';
}
function guardarServicio(id){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const n=document.getElementById('sn').value.trim();
  if(!n){ toast('Falta el nombre'); return; }
  const v=k=>+document.getElementById(k).value||0;
  const dur = v('s1')+v('s2')+v('s3');
  if(dur<=0){ toast('El servicio tiene que durar al menos unos minutos'); return; }
  if(v('sk')>100 || v('sk')<0){
    return confirmarConMotivo('Revisá la comisión',
      [`Pusiste ${v('sk')}% de comisión. Más de 100% significa pagarle a la profesional más de lo que cobra el negocio.`],
      'Guardarlo igual', m=>guardarServicioYa(id, m));
  }
  guardarServicioYa(id, '');
}
function guardarServicioYa(id, motivo){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const n=document.getElementById('sn').value.trim();
  const v=k=>+document.getElementById(k).value||0;
  const datos = {nombre:n, contado:v('sc'), comision:v('sk'),
    trabajo1:v('s1'), proceso:v('s2'), trabajo2:v('s3'),
    dur:v('s1')+v('s2')+v('s3'), simult:Math.max(1,v('ss'))};
  const man = document.getElementById('sm').checked;
  const areaEl = document.getElementById('sar');
  if(areaEl) datos.areaId = areaEl.value;
  if(motivo) datos.motivoRaro = motivo;
  if(id){
    const s=byId(DB.servicios,id); Object.assign(s, datos); s.precioManual=man;
    const sa=document.getElementById('sa'); if(sa) s.activo=sa.checked;
  }else{
    const s = {id:uid('sv'), areaId:ST.areaId, ...datos, precioManual:man, activo:true};
    DB.servicios.push(s);
    /* todas las profesionales del área quedan habilitadas */
    DB.asign.filter(a=>a.areaId===ST.areaId).forEach(a=>a.servicios.push(s.id));
  }
  logAcc(`Servicio ${id?'editado':'creado'}: ${n}`);
  save(); closeSheet(); render();
  toast(id?'Servicio actualizado':'Servicio creado y habilitado para todas');
}
function borrarServicio(id){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const sv=byId(DB.servicios,id);
  const quien=DB.asign.filter(a=>a.servicios.includes(id)).length;
  pedirBorrar({tipo:'servicio', id, nombre:sv.nombre,
    seLleva: quien?`sale de la lista de ${quien} profesional${quien===1?'':'es'}`:'',
    alBorrar:`hacerBorrarServicio('${id}')`,
    alDejarSinUso:`dejarSinUsoServicio('${id}')`, estaSinUso:!sv.activo});
}
function hacerBorrarServicio(id){

function verAumento(){
  const sel=document.getElementById('am').value, p=+document.getElementById('ap').value||0;

    ? byId(DB.areas,s.areaId).sucursalId===ST.sucursalId : s.areaId===sel));

  const fijos = todos.filter(s=>s.precioManual);
  const m=DB.cfg.redondeo;

  sheet('Revisá antes de confirmar', `
    <div class="warnbox">${nuevos.length} servicios van a subir ${p}%. Mirá la lista antes de aplicar.</div>

    <div class="listcard" style="max-height:320px;overflow-y:auto">
      ${nuevos.map(x=>`<div class="lr"><div class="g"><b>${esc(x.s.nombre)}</b>

        <div class="r"><span style="text-decoration:line-through;color:var(--faint)">${money(x.s.contado)}</span><br>

    </div>`);

function aplicarAumento(sel,p){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const m=DB.cfg.redondeo;
  DB.servicios.filter(s=> s.activo && !s.precioManual && (sel==='todo'
    ? byId(DB.areas,s.areaId).sucursalId===ST.sucursalId : s.areaId===sel))
    .forEach(s=>{ s.contado = Math.ceil(s.contado*(1+p/100)/m)*m; });
  logAcc(`Aumento del ${p}% aplicado`);
  save(); closeSheet(); render(); toast('Precios actualizados');
}

function guardarSucursal(id){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const n=document.getElementById('sun').value.trim();

function descPerm(mk,v){
  const d = {
    todo:'Ve y modifica todo el negocio', suc:'Solo lo de su sucursal',
    area:'Solo lo de su área', prop:'Solo lo suyo', ver:'Puede mirar pero no modificar',
    dia:'Solo el movimiento del día', no:'No tiene acceso', si:'Tiene acceso'
  };
  if(mk==='equipo' && v==='suc') return 'Ve y maneja horarios de toda su sucursal';
  if(mk==='equipo' && v==='area') return 'Ve y maneja horarios de su(s) área(s)';
  if(mk==='caja' && v==='todo') return 'Cobra, carga gastos y cierra caja';
  if(mk==='config' && v==='si') return 'Puede cambiar áreas, servicios, precios y permisos';
  return d[v]||'';
}

    <div class="listcard">${DB.usuarios.map(u=>{
      const exc = Object.keys(u.permisos||{}).filter(k=>u.permisos[k]);
      const su = u.sucursalId?byId(DB.sucursales,u.sucursalId):null;
      const ar = nombreAreasDe(u);
      return `<button class="lr" onclick="editarUsuario('${u.id}')" ${u.activo?'':'style="opacity:.5"'}>
        <div class="av">${ini(u.nombre)}</div>
        <div class="g"><b>${esc(u.nombre)}${u.activo?'':' <span class="bd">Inactivo</span>'}</b>
          <span>${ROLES[u.rol]}${ar?' · '+esc(ar):''}${su?' · '+esc(su.nombre):''}</span>
          ${exc.length?`<span class="tiny" style="color:var(--warn)">${exc.length} permiso${exc.length>1?'s':''} distinto${exc.length>1?'s':''} al de su rol</span>`:''}</div>
        ${ic('chev','sm')}</button>`;}).join('')}</div>
  </div>`;
}
function cambiarPedirClave(v){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); render(); return; }
  if(v){
    const yo = usuario();
    const sinMail = DB.usuarios.filter(u=>u.activo!==false && !u.email);
    if(!yo.email){
      sheet('Falta tu mail', `
        <div class="warnbox">${ic('alert','sm')} Antes de prender esto tenés que cargar
          <b>tu propio mail</b>, si no te quedás afuera del sistema.</div>
        <button class="btn" onclick="closeSheet();editarUsuario('${yo.id}')">Cargar mi mail</button>`);
      render(); return;
    }
    sheet('Prender el login', `
      <div class="infobox">A partir de ahora, para entrar hay que poner mail y contraseña.
        Cada una tiene que tener su cuenta creada.</div>
      ${sinMail.length?`<div class="warnbox">${ic('alert','sm')} <b>${sinMail.length}
        ${sinMail.length===1?'persona se queda':'personas se quedan'} afuera</b> hasta que le cargues el mail:
        ${sinMail.map(u=>esc(u.nombre)).join(', ')}.</div>`:''}
      <button class="btn" onclick="hacerPedirClave(true)">${ic('lock','sm')} Prender igual</button>
      <button class="btn sec" style="margin-top:8px" onclick="closeSheet();render()">Cancelar</button>`);
    return;
  }
  hacerPedirClave(false);
}
function hacerPedirClave(v){
  DB.cfg.pedirClave = !!v;
  if(v) fbIniciar();
  logAcc('Login con contraseña ' + (v?'prendido':'apagado'));
  save(); closeSheet(); render();
  toast(v?'Login prendido':'Login apagado');
}
function editarUsuario(usId){
  const u = usId?byId(DB.usuarios,usId):null;
  sheet(u?'Editar '+u.nombre:'Usuario nuevo', `
    <div class="f"><label>Nombre y apellido</label><input id="un" value="${u?esc(u.nombre):''}"></div>
    <div class="f"><label>Mail con el que entra</label>
      <input id="ue" type="email" inputmode="email" value="${u?esc(u.email||''):''}"
        placeholder="sunombre@gmail.com">
      <div class="tiny muted" style="margin-top:4px">Es el mail con el que va a entrar al sistema
        y al que le llegan los avisos de contraseña. Tiene que ser uno al que ella entre de verdad.</div></div>
    <div class="f"><label>Rol</label>
      <select id="ur" onchange="camposUsuario()">
        ${Object.keys(ROLES).map(r=>`<option value="${r}" ${u&&u.rol===r?'selected':''}>${ROLES[r]}</option>`).join('')}
      </select></div>
    <div id="ucampos"></div>
    ${u?`<div class="chk"><input type="checkbox" id="ua" ${u.activo?'checked':''}>
      <div class="g"><b>Activo</b><span class="small muted">Si se va, desactivalo. No pierde nada del historial.</span></div></div>`:''}
    <button class="btn" style="margin-top:13px" onclick="guardarUsuario('${usId||''}')">Guardar</button>
    ${u?`<button class="btn sec" style="margin-top:8px" onclick="permisosDe('${usId}')">
      ${ic('lock','sm')} Permisos propios de ${esc(u.nombre.split(' ')[0])}</button>
    <button class="btn dan" style="margin-top:8px" onclick="borrarUsuario('${usId}')">${ic('trash','sm')} Borrar este usuario</button>`:''}`,
    {focus:'un'});
  setTimeout(()=>camposUsuario(usId),40);
}
function camposUsuario(usId){
  const u = usId?byId(DB.usuarios,usId):null;
  const sel = document.getElementById('ur');
  const box = document.getElementById('ucampos');
  /* si la hoja ya se cerró (se guardó rápido), no hay nada que pintar */
  if(!sel || !box) return;
  const r = sel.value;
  let html = '';
  if(r!=='duena' && r!=='admin'){
    html += `<div class="f"><label>Sucursal</label>
      <select id="us"><option value="">Todas</option>
        ${DB.sucursales.map(s=>`<option value="${s.id}" ${u&&u.sucursalId===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}
      </select></div>`;
  }
  if(r==='supervisora'){
    const mias = u?areasDeUsuario(u):[];
    html += `<div class="f"><label>Áreas que supervisa</label>
      <div class="small muted" style="margin:-3px 0 7px">Puede estar a cargo de más de un área.</div>
      <div class="card cardp" style="max-height:220px;overflow-y:auto">
        ${DB.areas.filter(a=>a.activa).map(a=>{const su=byId(DB.sucursales,a.sucursalId);
          return `<div class="chk"><input type="checkbox" class="uar" value="${a.id}" ${mias.includes(a.id)?'checked':''}>
            <div class="g"><b>${a.icono} ${esc(a.nombre)}</b><span class="small muted">${esc(su?su.nombre:'')}</span></div></div>`;}).join('')}
      </div></div>`;
  }
  if(r==='supervisora'||r==='profesional'){
    html += `<div class="f"><label>¿Con qué profesional se corresponde?</label>
      <select id="up"><option value="">Ninguna</option>
        ${DB.profesionales.filter(p=>p.activa).map(p=>`<option value="${p.id}" ${u&&u.profId===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}
      </select></div>`;
  }
  box.innerHTML = html;
}
function guardarUsuario(usId){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const n = document.getElementById('un').value.trim();
  if(!n){ toast('Falta el nombre'); return; }
  const g = k => (document.getElementById(k)||{}).value || null;
  const areas = [...document.querySelectorAll('.uar:checked')].map(x=>x.value);
  const mail = ((document.getElementById('ue')||{}).value||'').trim().toLowerCase();
  if(mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast('Ese mail está mal escrito'); return; }
  if(mail && DB.usuarios.some(x=>x.id!==usId && (x.email||'').toLowerCase()===mail)){
    toast('Ese mail ya lo usa otra persona'); return; }
  const d = {nombre:n, email:mail, rol:document.getElementById('ur').value,
    sucursalId:g('us'), areas, areaId:areas[0]||null, profId:g('up')};
  if(d.rol==='supervisora' && !areas.length){ toast('Elegí al menos un área que supervise'); return; }
  if(usId){
    const u=byId(DB.usuarios,usId); Object.assign(u,d);
    const ua=document.getElementById('ua'); if(ua) u.activo=ua.checked;
  }else{
    DB.usuarios.push({id:uid('us'), ...d, permisos:{}, activo:true});
  }
  logAcc(`Usuario ${usId?'editado':'creado'}: ${n}`);
  save(); closeSheet(); render(); toast('Guardado');
}
function borrarUsuario(usId){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const u=byId(DB.usuarios,usId);
  if(usId===ST.usuarioId){ toast('No podés borrar el usuario con el que estás adentro'); return; }
  if(DB.usuarios.filter(x=>x.activo!==false && ['duena','admin'].includes(x.rol)).length<=1
     && ['duena','admin'].includes(u.rol) && u.activo!==false){
    toast('Tiene que quedar al menos una dueña o administración'); return;
  }
  sheet('Borrar usuario', `
    <div class="warnbox">${ic('alert','sm')} <b>${esc(u.nombre)}</b> deja de tener acceso al sistema.
      Los turnos que cargó y los cobros que hizo quedan como están.</div>
    <div class="infobox">Si solo se fue de vacaciones o dejó el puesto un tiempo, mejor
      destildá "Activo" en vez de borrarlo.</div>
    <button class="btn dan" onclick="hacerBorrarUsuario('${usId}')">Sí, borrar el acceso</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
}
function hacerBorrarUsuario(usId){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const u=byId(DB.usuarios,usId);
  DB.usuarios = DB.usuarios.filter(x=>x.id!==usId);
  logAcc(`Usuario borrado: ${u.nombre}`);
  save(); closeSheet(); render(); toast('Usuario borrado');
}
function permisosDe(usId){
  const u = byId(DB.usuarios,usId);
  const P = DB.cfg.permisos[u.rol];
  sheet('Permisos de '+u.nombre.split(' ')[0], `
    <div class="infobox">Por defecto usa los permisos de ${ROLES[u.rol]}.
    Acá le podés dar o sacar algo puntual solo a ${esc(u.nombre.split(' ')[0])},
    sin cambiarle el rol ni tocar a las demás.</div>
    ${MODULOS.map(m=>{
      const propio = u.permisos[m.k];
      return `<div class="f"><label>${m.n}</label>
        <select id="pu_${m.k}">
          <option value="">Usa el de su rol (${etiquetaPerm(m.k,P[m.k])})</option>
          ${m.vals.map(v=>`<option value="${v[0]}" ${propio===v[0]?'selected':''}>${v[1]}</option>`).join('')}
        </select></div>`;}).join('')}
    <button class="btn" onclick="guardarPermisosDe('${usId}')">Guardar</button>`);
}
function guardarPermisosDe(usId){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const u = byId(DB.usuarios,usId);
  u.permisos = {};
  MODULOS.forEach(m=>{
    const v = document.getElementById('pu_'+m.k).value;
    if(v) u.permisos[m.k]=v;
  });
  logAcc(`Permisos propios de ${u.nombre} actualizados`);
  save(); closeSheet(); render(); toast('Guardado');
}

/* ============================================================
   RESPONSIVE: qué agenda se muestra
   ============================================================ */
const mq = window.matchMedia('(min-width:900px)');
function aplicarMQ(){
  const st = document.getElementById('mqstyle') || (()=>{
    const e=document.createElement('style'); e.id='mqstyle'; document.head.appendChild(e); return e; })();
  st.textContent = mq.matches
    ? '.solomovil{display:none}.soloancho{display:block}'
    : '.solomovil{display:block}.soloancho{display:none}';
}
mq.addEventListener('change', aplicarMQ);

/* ============================================================
   ARRANQUE
   ============================================================ */
load();
migrar();
save();
aplicarMQ();
ponerManifest();
if(loginPrendido()) fbIniciar();
render();
</script>
