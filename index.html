<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ISIS — Gestión</title>
<!-- para que el celular la pueda poner en la pantalla como si fuera una app -->
<meta name="theme-color" content="#16161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ISIS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#F2F2F4; --card:#FFFFFF; --ink:#16161A; --muted:#5E5E68; --faint:#6B6B75;
  --line:#E3E3E7; --line2:#C2C2CA;
  --acc:#D9202C; --acc2:#B4171F; --accsoft:#FDECEE;
  --bar:#16161A;
  --ok:#26694C; --warn:#8E5B10; --stop:#9B2C2C;
  /* verde = lugar libre, en TODA la app. El rojo no se usa para esto. */
  --freebg:#F0F9F4; --freeln:#8FC2AA; --freetx:#1F6A49;
  --e-res:#A87A00; --e-conf:#2F6FB5; --e-lleg:#24784A; --e-serv:#8250A8;
  --e-fin:#6E6E7A; --e-can:#9B2C2C; --e-no:#77718A;
  --sh:0 1px 3px rgba(22,22,26,.08);
  --sh2:0 6px 24px rgba(22,22,26,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:10px;
  background:var(--card);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.f{margin-bottom:13px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* layout */
#app{max-width:1400px;margin:0 auto;padding:0 0 84px}
.top{
  position:sticky;top:0;z-index:40;background:var(--bar);color:#fff;
  padding:9px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh);
}
.top .logo{height:26px;width:auto;border-radius:4px;flex:none;background:#fff;padding:2px 4px}
.top h1{font-size:16px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:11px;opacity:.82;font-weight:400;display:block;letter-spacing:0}
.top button{color:#fff;padding:7px;border-radius:9px;display:flex;align-items:center}
.top button:active{background:rgba(255,255,255,.18)}
.ico{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:17px;height:17px}
.ico.lg{width:28px;height:28px}

.pad{padding:14px}
.h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.h3{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:22px 0 9px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.center{text-align:center}
.empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:14px}

/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh)}
.card+.card{margin-top:9px}
.cardp{padding:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;
  padding:13px 18px;border-radius:11px;font-weight:600;font-size:15px;
  background:var(--acc);color:#fff;width:100%;
}
.btn:active{background:var(--acc2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.sec:active{background:var(--bg)}
/* cada acción tiene su color. Los que cambian el estado de un turno usan
   exactamente el color de ese estado, para que se aprendan solos. */
.btn.wa  {background:#0B7C40}                       /* WhatsApp */
.btn.wa:active{background:#096632}
.btn.pay {background:#8F5E00}                       /* plata: cobrar, caja */
.btn.pay:active{background:#744B00}
.btn.conf{background:var(--e-conf)}                 /* -> Confirmado */
.btn.lleg{background:var(--e-lleg)}                 /* -> Llegó */
.btn.serv{background:var(--e-serv)}                 /* -> En servicio */
.btn.fin {background:#4A4A55}                       /* -> Finalizado */
.btn.no  {background:var(--card);color:var(--e-no);border:1.5px solid var(--line2)}
.btn.dan {background:var(--card);color:var(--stop);border:1.5px solid var(--stop)}
.btn.dan:active{background:#FBEAEA}
.btn.ok{background:var(--ok)}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:9px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{width:auto;flex:1;min-width:120px}

/* ===== EL DÍA: el inicio es el trabajo, no un menú ===== */
.vzgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 13px}
.vz{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;text-align:left;min-height:62px;font:inherit;cursor:pointer}
.vz.on{border-color:var(--pri);background:var(--freebg)}
.vz b{font-size:13.5px;color:var(--ink);line-height:1.2}
.vz span{font-size:11.5px;color:var(--muted);line-height:1.25}
.vz i{font-style:normal;font-size:14px;font-weight:700;color:var(--ink);margin-top:1px}
.ahorabox{background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--sh);overflow:hidden;margin-bottom:13px}
.ahsep{padding:9px 13px 7px;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.ahr{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.ahr:last-child{border-bottom:0}
.ahr.n{background:var(--freebg)}
.ahr .hh2{width:42px;flex:none;font-size:12.5px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums;text-align:center}
.ahr .g2{flex:1;min-width:0;text-align:left;padding:2px 0}
.ahr .g2 b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahr .g2 span{display:block;font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.xs{padding:8px 11px;font-size:12.5px;border-radius:9px;width:auto;gap:5px;flex:none}
.q2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.qb{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px;
  text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.qb b{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.qb span{font-size:11.5px;color:var(--muted);line-height:1.25}
.qb:active{background:var(--bg)}

/* home tiles — compactas: el menu es un indice, no la pantalla principal */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:11px 4px 9px;display:flex;flex-direction:column;gap:5px;align-items:center;
  box-shadow:var(--sh);text-align:center;
}
.tile:active{background:var(--bg)}
.tile .ico{color:var(--acc);width:23px;height:23px}
.tile span{display:none}
@media (min-width:600px){ .tiles{grid-template-columns:repeat(6,1fr)} }
.tile.t-cli .ico{color:#2F6FB5} .tile.t-eq .ico{color:#8250A8}
.tile.t-caja .ico{color:#B07400} .tile.t-esp .ico{color:#0E8A8A}
.tile.t-vou .ico{color:#0B7C40} .tile.t-rep .ico{color:#3F51A8}
.tile.t-cfg .ico{color:#65656E} .tile.t-pre .ico{color:#0F6E8C}
.tile.t-com .ico{color:#8F5B10}
.tile b{font-size:11.5px;font-weight:700;letter-spacing:-.01em;line-height:1.15}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 8px;text-align:center}
.kpi b{display:block;font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.kpi.res b{color:var(--e-res)} .kpi.conf b{color:var(--e-conf)}
.kpi.lleg b{color:var(--e-lleg)} .kpi.no b{color:var(--e-no)}

/* chips / tabs */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 14px;scrollbar-width:none;
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:44px;z-index:30}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--muted);flex:none;
}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.subtabs{display:flex;gap:7px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.ptab{
  padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line2);
  font-size:13px;font-weight:600;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;
}
.ptab.on{background:var(--bar);border-color:var(--bar);color:#fff}
.ptab i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
.ptab.off i{background:var(--faint)}

/* daybar */
.daybar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);
  border-bottom:1px solid var(--line)}
.daybar button{padding:7px;border-radius:8px;color:var(--muted)}
.daybar button:active{background:var(--bg)}
.daybar b{flex:1;text-align:center;font-size:14.5px;font-weight:700}

/* timeline (mobile agenda) */
.tl{padding:8px 14px 0}
.slot{display:flex;gap:11px;align-items:stretch;min-height:34px}
.slot .hr{width:44px;flex:none;font-size:11.5px;color:var(--faint);padding-top:3px;
  font-variant-numeric:tabular-nums}
.slot .bar{flex:1;border-top:1px dashed var(--line);position:relative}
.tcard{
  border-radius:11px;padding:10px 12px;margin:0 0 7px;border:1px solid var(--line);text-align:left;width:100%;
  background:var(--card);box-shadow:var(--sh);border-left-width:4px;
}
.tcard:active{background:var(--bg)}
.tcard .n{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.tcard .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.tcard .t{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;
  font-variant-numeric:tabular-nums}
.tcard.proc{background:repeating-linear-gradient(135deg,var(--card),var(--card) 7px,var(--bg) 7px,var(--bg) 14px)}
.st-res{border-left-color:var(--e-res)} .st-conf{border-left-color:var(--e-conf)}
.st-lleg{border-left-color:var(--e-lleg)} .st-serv{border-left-color:var(--e-serv)}
.st-fin{border-left-color:var(--e-fin);opacity:.72} .st-can{border-left-color:var(--e-can);opacity:.5}
.st-no{border-left-color:var(--e-no);opacity:.55}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.d-res{background:var(--e-res)} .d-conf{background:var(--e-conf)} .d-lleg{background:var(--e-lleg)}
.d-serv{background:var(--e-serv)} .d-fin{background:var(--e-fin)} .d-can{background:var(--e-can)}
.d-no{background:var(--e-no)}
.free{
  border:1px dashed var(--line2);border-radius:10px;padding:9px;text-align:center;
  color:var(--faint);font-size:12.5px;margin:0 0 7px;background:transparent;width:100%;
}
.free:active{background:var(--freebg);color:var(--freetx);border-color:var(--freeln)}
.hueco{
  border:1px dashed var(--freeln);border-radius:10px;padding:10px 12px;margin:0 0 7px;width:100%;
  background:var(--freebg);color:var(--freetx);font-size:12.5px;text-align:left;font-weight:600;
  display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;
}
.hueco:active{background:var(--freetx);color:#fff;border-color:var(--freetx)}
.hueco .hx{margin-left:auto;font-weight:700;opacity:.8}
.hsep{font-size:11.5px;font-weight:700;color:var(--faint);margin:13px 0 7px;
  display:flex;align-items:center;gap:9px;font-variant-numeric:tabular-nums}
.hsep:after{content:'';flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:5px 11px;font-size:12px;color:var(--muted);font-weight:600}
.chip b{color:var(--ink)}
.blk{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;
  margin:0 0 7px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}

/* ===== AGENDA DEL DÍA: todas las profesionales a la vez ===== */
:root{
  --b-res:#9C6300; --b-conf:#2A66AB; --b-lleg:#1B6B42; --b-serv:#7B45A3;
  --b-fin:#66666F; --b-no:#736D82;
}
.diawrap{overflow-x:auto;background:var(--card);border-top:1px solid var(--line);
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.diahead{display:flex;background:var(--card);border-bottom:1.5px solid var(--line2);
  position:sticky;top:0;z-index:6;width:max-content;min-width:100%}
.diahead .hc{width:52px;flex:none;position:sticky;left:0;background:var(--card);z-index:7}
.pcol{flex:1 0 124px;padding:9px 6px;font-size:13.5px;font-weight:700;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line)}
.pcol span{display:block;font-size:11px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.diabody{display:flex;position:relative;width:max-content;min-width:100%}
.horas{width:52px;flex:none;position:sticky;left:0;z-index:4;background:var(--card);
  border-right:1px solid var(--line2)}
.hh{position:absolute;right:7px;font-size:12px;color:var(--ink);font-weight:700;
  transform:translateY(-8px);font-variant-numeric:tabular-nums}
.hh.media{font-size:11px;font-weight:500;color:var(--faint)}
.col{flex:1 0 124px;position:relative;border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent,transparent 43px,var(--line) 43px,var(--line) 44px)}
.off{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#E9E9EE,#E9E9EE 4px,#E1E1E8 4px,#E1E1E8 8px)}
.pau{position:absolute;left:0;right:0;background:#EFEBF7}
.blqz{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#FBE4E4,#FBE4E4 4px,#F4D4D4 4px,#F4D4D4 8px)}
.libre{position:absolute;left:2px;right:2px;border:1.5px dashed var(--freeln);border-radius:8px;
  background:var(--freebg);display:flex;align-items:center;justify-content:center;
  color:var(--freetx);font-size:17px;font-weight:700;cursor:pointer}
.libre span{font-size:11.5px;font-weight:700;opacity:.9;text-align:center;line-height:1.25;padding:0 3px}
.ev{position:absolute;border-radius:8px;padding:5px 7px;overflow:hidden;color:#fff;
  font-size:11.5px;line-height:1.3;box-shadow:0 1px 3px rgba(22,22,26,.25);
  border:1px solid rgba(255,255,255,.3);text-align:left}
.ev b{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev em{display:block;font-style:normal;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i.pr{position:absolute;left:0;right:0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.55),rgba(255,255,255,.55) 3px,transparent 3px,transparent 7px)}
.ev.mini{padding:2px 6px;font-size:10.5px}
.ev.mini b{font-size:11.5px}
.ahora{position:absolute;left:0;right:0;height:2px;background:var(--acc);z-index:5;pointer-events:none}
.ahora i{position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.ahora b{position:absolute;left:12px;top:-9px;background:var(--acc);color:#fff;font-size:9.5px;
  padding:1px 5px;border-radius:9px;font-weight:700}
.leyenda{display:flex;gap:11px;padding:6px 14px 4px;font-size:10.5px;color:var(--muted);
  overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.leyenda::-webkit-scrollbar{display:none}
.leyenda span{flex:none}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* desktop grid agenda */
.gridwrap{overflow-x:auto;padding:0 14px 14px}
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:11px;overflow:hidden;width:max-content;max-width:100%}
.gh{background:var(--card);padding:8px 6px;font-size:12.5px;font-weight:700;
  position:sticky;top:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{background:var(--card);padding:6px 7px;font-size:11px;color:var(--faint);
  text-align:right;font-variant-numeric:tabular-nums}
.gc{background:var(--card);padding:0 2px;min-height:27px;position:relative}
.gcx{padding:0 2px}
.gsplit{display:flex;gap:2px;height:100%}
.gsplit>.gi{flex:1;min-width:0}
.gc:active{background:var(--freebg)}
.gi{border-radius:7px;padding:4px 6px;font-size:11px;line-height:1.22;height:100%;
  border-left:3px solid;background:var(--bg);overflow:hidden}
.gi b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* list rows */
.lr{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);
  background:var(--card);width:100%;text-align:left}
.lr:active{background:var(--bg)}
.lr:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:#ECECF1;color:#4A4A55;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.lr .g{flex:1;min-width:0}
.lr b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .r{font-size:12.5px;color:var(--faint);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.listcard{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--sh)}

/* badges */
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.bd.ok{background:#E9F5EF;color:var(--ok);border-color:#BCDECD}
.bd.wa{background:#FCF1DE;color:var(--warn);border-color:#EBD3A8}
.bd.st{background:#FBEAEA;color:var(--stop);border-color:#F0CFCF}
.bd.ac{background:var(--accsoft);color:var(--acc2);border-color:#F2C9CD}

/* sheet / modal */
.veil{position:fixed;inset:0;background:rgba(22,22,26,.55);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;box-shadow:var(--sh2);animation:up .2s ease;
}
@keyframes up{from{transform:translateY(30px)}to{transform:translateY(0)}}
.sheet .sh{position:sticky;top:0;background:var(--bg);padding:16px 16px 11px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2}
.sheet .sh b{flex:1;font-size:17px;font-weight:700;letter-spacing:-.02em}
.sheet .sb{padding:16px}
.grab{width:36px;height:4px;background:var(--line2);border-radius:2px;margin:8px auto 0}
@media (min-width:600px){
  .veil{align-items:center}
  .sheet{border-radius:18px;max-height:88vh}
  .grab{display:none}
}

/* bottom nav */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);display:flex;padding:6px 4px 8px;
}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--faint);font-size:10.5px;font-weight:600;border-radius:9px}
.nav button.on{color:var(--acc)}
.nav button.on .ico{stroke-width:2.2}

/* fab */
.fab{position:fixed;right:13px;bottom:76px;z-index:45;width:46px;height:46px;border-radius:15px;
  background:var(--bar);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(22,22,26,.35);opacity:.92}
.fab:active{background:var(--acc2)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:200;
  background:var(--bar);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;
  box-shadow:var(--sh2);max-width:92%;text-align:center}

/* misc */
.sep{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding:11px 0 0;letter-spacing:-.02em}
.pill{padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card);
  font-size:13.5px;font-weight:600;text-align:center;flex:1}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--acc)}
.chk .g{flex:1;min-width:0}
.warnbox{background:#FDF2E0;border:1px solid #F2DFBB;color:#7A5210;border-radius:11px;
  padding:12px 14px;font-size:13.5px;margin-bottom:13px}
.okbox{background:#E9F5EF;border:1px solid #C9E6D8;color:#1D5C41;border-radius:11px;
  padding:12px 14px;font-size:13.5px;margin-bottom:13px}
.infobox{background:var(--accsoft);border:1px solid #EBD3DE;color:#5E2140;border-radius:11px;
  padding:12px 14px;font-size:13.5px;margin-bottom:13px}
.demo{background:#2B2B33;color:#D9D9E0;padding:4px 14px;font-size:10.5px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.alarma{position:sticky;top:44px;z-index:39;width:100%;display:flex;align-items:center;
  justify-content:center;gap:8px;background:#8E1520;color:#fff;padding:11px 14px;
  font-size:13px;font-weight:700;border-bottom:2px solid #6B0F18}

/* ---------- horarios ---------- */
.semdia{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
  border-bottom:1px solid var(--line);padding:11px 2px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.semdia:last-child{border-bottom:0}
.semdia:disabled{cursor:default}
.sd1{flex:0 0 42px;font-size:13px;font-weight:700;color:var(--muted)}
.sd2{flex:1;min-width:0}
.sd2 b{display:block;font-size:14.5px}
.sd2 span{display:block;font-size:12px;color:var(--muted)}
.sd2 .nolab{font-size:13.5px;color:var(--faint)}
.pillgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.avh{font-size:12.5px;line-height:1.45;padding:4px 0 4px 15px;position:relative}
.avh:before{content:'';position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%}
.avh.rojo:before{background:var(--stop)}
.avh.naranja:before{background:var(--warn)}
.horwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);
  border:1px solid var(--line);border-radius:13px}
.hortab{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.hortab th,.hortab td{padding:0;font-size:11.5px}
.hortab thead th{background:var(--card);font-size:11.5px;font-weight:700;color:var(--muted);
  padding:9px 0;text-align:center;border-bottom:1.5px solid var(--line2);min-width:62px}
.hortab th.hnom{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;
  padding:8px 10px;min-width:104px;max-width:104px;border-right:1px solid var(--line2)}
.hortab tbody th.hnom{font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line)}
.hortab .lnk{background:none;border:0;padding:0;font:inherit;color:var(--acc);text-align:left;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px;display:block}
.hortab td{text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);
  padding:6px 3px;vertical-align:middle;cursor:pointer;min-width:62px}
.hortab td.hay{background:var(--freebg)}
.hortab td.hay b{display:block;font-size:11.5px;font-weight:700;color:var(--freetx);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hortab td.hay span{display:block;font-size:10px;color:var(--muted)}
.hortab td.no i{color:var(--line2);font-style:normal;font-size:14px}
.hortab td.choque{background:#FBE4E4;outline:1.5px solid var(--stop);outline-offset:-2px}

/* ---------- la fila ---------- */
.filacount{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 11px;text-align:center}
.fc b{display:block;font-size:26px;line-height:1.1}
.fc span{font-size:12px;color:var(--muted)}
.fc.at{background:var(--freebg);border-color:var(--freeln)}
.fc.at b{color:var(--freetx)}
.filabar{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);
  border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:11px;
  font:inherit;color:inherit;text-align:left;cursor:pointer}
.filabar.hay{border-color:var(--acc);background:var(--accsoft)}
.filabar .fb1,.filabar .fb2{font-size:13.5px;color:var(--muted)}
.filabar b{font-size:19px;color:var(--ink);margin-right:4px}
.filabar .fb3{margin-left:auto;display:flex}
.fr{display:flex;align-items:center;gap:11px;padding:11px 8px;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr .fic{font-size:22px;width:30px;text-align:center;flex:0 0 30px}
.fr .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fr .g b{font-size:14.5px}
.fr .g span{font-size:12.5px;color:var(--muted)}
.fr .pide{color:var(--acc)!important;font-weight:600;display:flex;align-items:center;gap:4px}
.fr .fder{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.fr.sigue{background:var(--freebg);border-radius:9px}
.fr.trabada{opacity:.62}
.chipsigue{display:inline-block;margin-left:7px;background:var(--freetx);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:6px;
  vertical-align:middle}
.fr .trab{color:var(--warn)!important;font-weight:600}
.esp-ok{font-size:12px;color:var(--muted)}
.esp-medio{font-size:12px;color:var(--warn);font-weight:600}
.esp-alto{font-size:12px;color:var(--stop);font-weight:700}
button.kpi{font:inherit;text-align:center;cursor:pointer}

/* ---------- pantalla de entrada ---------- */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:22px;overflow-y:auto;z-index:50}
.loginbox{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:26px 20px 22px;text-align:center;
  box-shadow:0 8px 28px rgba(0,0,0,.07)}
.loginbox .f{text-align:left}
.loginbox .btn{width:100%}
</style>
</head>

/* ---------- helpers ---------- */
/* ============================================================
   EL CÓDIGO INTERNO DE CADA COSA

   Cada turno, cada cobro y cada movimiento lleva un código que lo
   identifica. Antes ese código era un número que arrancaba en 1000
   y subía de a uno EN CADA APARATO. O sea: el celular del mostrador
   y el de Romi le ponían el MISMO código a dos turnos distintos.

   Mientras cada celular estaba solo no molestaba. Con todos los
   aparatos compartiendo los datos, eso hace que un turno pise a
   otro, o que un cobro caiga en la visita equivocada. Es la clase
   de error que no se ve hasta que ya rompió algo.

   Ahora el código lleva el momento exacto en que se creó más un
   pedazo al azar: dos aparatos no pueden generar el mismo ni
   aunque toquen el botón en el mismo segundo.
   ============================================================ */
let _id = 1000;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const hm  = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const mh  = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const money = n => '$'+Math.round(n).toLocaleString('es-AR');
/* TODO el sistema trabaja con la fecha y la hora de Argentina.
   Antes se usaba UTC: después de las 21:00 la caja, los fichajes y los turnos
   se guardaban con la fecha del día siguiente. */
const TZ = 'America/Argentina/Buenos_Aires';
/* AAAA-MM-DD a partir de los componentes LOCALES de la fecha, nunca UTC */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let _HOY=null, _HOY_T=0, _HORA=null, _HORA_T=0;
const hoy = () => {
  const t = Date.now();
  if(_HOY && t - _HOY_T < 20000) return _HOY;
  _HOY_T = t;
  try{ return _HOY = new Date().toLocaleDateString('en-CA',{timeZone:TZ}); }
  catch(e){ return _HOY = iso(new Date()); } };
const horaAhora = () => {
  const t = Date.now();
  if(_HORA && t - _HORA_T < 20000) return _HORA;
  _HORA_T = t;
  try{ return _HORA = new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
  }catch(e){ const n=new Date(); return _HORA = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); } };
const ahoraMin = () => mh(horaAhora());
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fechaLarga = s => { const d=parseISO(s);
  return DIAS[d.getDay()]+' '+d.getDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]; };
const fechaCorta = s => { const d=parseISO(s); return DIAS[d.getDay()].slice(0,3)+' '+d.getDate()+'/'+(d.getMonth()+1); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const ini = n => n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr,id) => arr.find(x=>x.id===id);

/* precio de lista = contado + recargo, redondeado SIEMPRE para arriba al múltiplo */
function precioLista(contado){
  const r = DB.cfg.recargo/100, m = DB.cfg.redondeo;
  return Math.ceil(contado*(1+r)/m)*m;
}
function precioSegunMedio(contado, medio){
  const M = MEDIOS.find(x=>x.k===medio);
  return (M && M.rec) ? precioLista(contado) : contado;
}

  /* Horarios de ejemplo. IMPORTANTE: una profesional trabaja en UN SOLO
     lugar por día, así que los días se reparten entre sus áreas en vez de
     repetirse. Antes el ejemplo dejaba a casi todas en dos sucursales a la
     misma hora, que es justo el error que el sistema ahora no deja hacer.
     Se deja UN choque a propósito (Belén) para que se vea el aviso. */
  /* HORARIOS DE EJEMPLO
     Regla de oro: una profesional trabaja en UN SOLO lugar por día.
     Con eso, lo que hay que repartir son personas-día entre áreas-día.
     Se recorre día por día y se le da a cada área la profesional suya que
     menos días tenga cargados y esté libre ese día: así queda parejo y
     todas las áreas quedan cubiertas. */
  /* Las tandas son de 6 horas, que es como se fracciona el turno acá.
     La primera persona del área entra a la mañana y la segunda al mediodía:
     así el área queda cubierta de 9 a 19.30 y la agenda tiene DOS columnas
     con huecos de verdad, que es lo que hace falta para dar un turno. */
  const TANDAS = [['09:00','15:00'], ['13:30','19:30'], ['10:00','16:00']];
  const tomado = {}, carga = {};
  const seLibra = (pid,d) => !tomado[pid+'|'+d];
  /* cuánta gente necesita cada área por día */
  const cupoDe = (ar, d) => d===6 ? 1
    : ar.porTurno ? 2 : (ar.nombre==='Depilación' ? 2 : 1);
  /* Se reparte POR RONDAS: primero una persona a cada área, recién después
     la segunda. Si se hiciera área por área, el último local se quedaba sin
     nadie porque la gente ya estaba tomada. */
  [1,2,3,4,5,6].forEach((d, di)=>{
    for(let n=0; n<2; n++){
      D.areas.forEach((ar, ai)=>{
        if(d===6 && ai%5===0) return;                  /* algunas áreas no abren sábado */
        if(n >= cupoDe(ar, d)) return;
        const suyas = D.asign.filter(a=>a.areaId===ar.id && seLibra(a.profId, d));
        if(!suyas.length) return;
        suyas.sort((x,y)=>(carga[x.profId]||0)-(carga[y.profId]||0));
        const as = suyas[0];
        tomado[as.profId+'|'+d] = true;
        carga[as.profId] = (carga[as.profId]||0)+1;
        /* la primera entra a la mañana, la segunda al mediodía: el área
           queda cubierta de punta a punta */
        const t = n===0 ? TANDAS[(ai+di)%2===0 ? 0 : 2] : TANDAS[1];
        D.horarios.push({id:uid('ho'), asignId:as.id, dia:d, desde:t[0], hasta:t[1],
          pausaD:null, pausaH:null});
      });
    }
  });
  /* UN choque a propósito, para que el aviso tenga algo que mostrar el
     primer día. Es el error que más se comete: la misma persona anotada
     en dos locales el mismo día. */
  (()=>{
    const sucDe = as => (byId(D.areas, as.areaId)||{}).sucursalId;
    for(const p of D.profesionales){
      const suyas = D.asign.filter(a=>a.profId===p.id);
      if(suyas.length<2) continue;
      for(const d of [1,2,3,4,5]){
        const hoy = D.horarios.filter(h=>h.dia===d && suyas.some(a=>a.id===h.asignId));
        if(hoy.length!==1) continue;
        const usada = byId(D.asign, hoy[0].asignId);
        const otra = suyas.find(a=>a.id!==usada.id && sucDe(a)!==sucDe(usada));
        if(!otra) continue;
        D.horarios.push({id:uid('ho'), asignId:otra.id, dia:d, desde:'13:30', hasta:'19:30',
          pausaD:null, pausaH:null});
        return;
      }
    }
  })();

  /* clientas */
  const cl = [

     areaId:'ar2', areas:['ar2','ar3'], permisos:{agenda:'suc'}, activo:true},

  /* ============================================================
     LA AGENDA DE EJEMPLO: UN NEGOCIO ANDANDO

     No son cuatro turnos sueltos. Son tres semanas para atrás ya
     cobradas, el día de hoy en plena marcha, y tres semanas para
     adelante reservadas, en las tres sucursales.
     Los números son "al azar" pero SIEMPRE LOS MISMOS: así todas
     ven lo mismo y se puede hablar de "el turno de las 10" sin líos.
     ============================================================ */
  const H = hoy(), M = addDays(H,1);
  const svAr = n => D.servicios.filter(s=>s.areaId===n);

  let _s = 20260915;
  const rnd = () => { _s = (_s*1103515245 + 12345) & 0x7fffffff; return _s/0x7fffffff; };
  const elegir = a => a[Math.floor(rnd()*a.length)];
  const chance = p => rnd() < p;

  /* ---- más clientas: un negocio de verdad tiene cartera ---- */
  const NOM = ['Brenda','Candela','Daniela','Emilia','Fernanda','Gisela','Ivana','Jazmín',
    'Karen','Lucía','Malena','Noelia','Paula','Romina','Sabrina','Tamara','Valentina',
    'Ximena','Yamila','Zoe','Aldana','Belén','Cecilia','Débora','Elisa','Gabriela',
    'Ingrid','Jimena','Lorena','Mariel','Natalia','Ornella','Priscila','Rosario','Silvana',
    'Verónica','Aitana','Bianca','Carolina','Denise','Evelyn','Giuliana'];
  const APE = ['Acosta','Bianchi','Cabrera','Duarte','Escobar','Figueroa','Gutiérrez',
    'Herrera','Juárez','Ledesma','Maidana','Núñez','Ojeda','Peralta','Quiroga','Ramírez',
    'Suárez','Torres','Vera','Zárate','Aguirre','Barrios','Coronel','Díaz','Espinosa',
    'Fernández','Gómez','Ibarra','Leiva','Molina','Ortiz','Pereyra','Rivas','Salas',
    'Toledo','Villalba','Ávalos','Bustos','Cáceres','Delgado','Encina','Franco'];
  for(let i=0;i<84;i++){
    const n = NOM[i%NOM.length]+' '+APE[(i*7+3+5*Math.floor(i/NOM.length))%APE.length];
    if(D.clientas.some(c=>c.nombre===n)) continue;
    D.clientas.push({id:'cl'+(19+i), nombre:n,
      tel:'221 5'+(60+(i%40))+'-'+(1000+i*91), nacimiento:'',
      notas:'', notasInt:'', alta: addDays(H, -(20 + i*4))});
  }
  const CLI = D.clientas.map(c=>c.id);

  /* ---- ausencias cargadas: hay que verlas en la agenda ---- */
  D.excepciones = [
    {id:uid('ex'), profId:'pr3', tipo:'no', desdeF:addDays(H,2), hastaF:addDays(H,2),
     desde:null, hasta:null, areaId:null, motivo:'Trámite'},
    {id:uid('ex'), profId:'pr9', tipo:'vacaciones', desdeF:addDays(H,4), hastaF:addDays(H,11),
     desde:null, hasta:null, areaId:null, motivo:''},
    {id:uid('ex'), profId:'pr1', tipo:'horario', desdeF:addDays(H,1), hastaF:addDays(H,1),
     desde:'11:00', hasta:'19:00', areaId:null, motivo:'Entra más tarde'},
    {id:uid('ex'), profId:'pr6', tipo:'no', desdeF:addDays(H,-3), hastaF:addDays(H,-3),
     desde:null, hasta:null, areaId:null, motivo:'Se enfermó'}
  ];
  /* los días en que alguien NO está: ahí no se generan turnos */
  const noTrabaja = (profId, f) => D.excepciones.some(e=>
    e.profId===profId && (e.tipo==='no'||e.tipo==='vacaciones') && f>=e.desdeF && f<=e.hastaF);

  /* ---- el generador ---- */
  const visitas = [];
  const libre = {};                    /* profesional|fecha -> franjas ya tomadas */
  /* El día de ejemplo tiene que verse EN MARCHA a la hora que lo abran.
     Si alguien entra a las 9 de la noche y todo el día ya pasó, la pantalla
     queda muerta y no se entiende nada. Por eso, para repartir los estados,
     se hace de cuenta que es el mediodía: algunas terminadas, dos o tres
     adentro atendiéndose, y un montón por venir. */
  const ahoraReal = (()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); })();
  const ahora = Math.min(Math.max(ahoraReal, 11*60), 15*60);
  const USUARIOS_CAJA = ['Vanesa Ledesma','Vanesa Ledesma','Nadia Ferrari','Nadia Ferrari'];
  const MEDIO_POND = ['efectivo','efectivo','efectivo','efectivo','efectivo',
    'transfer','transfer','debito','credito','mp'];
  const conRec = m => (MEDIOS.find(x=>x.k===m)||{}).rec;
  const lista = c => Math.ceil(c*(1+D.cfg.recargo/100)/D.cfg.redondeo)*D.cfg.redondeo;

  for(let dd=-14; dd<=10; dd++){
    const f = addDays(H, dd);
    const dow = parseISO(f).getDay();
    D.asign.forEach(as=>{
      if(noTrabaja(as.profId, f)) return;
      const ho = D.horarios.find(h=>h.asignId===as.id && h.dia===dow);
      if(!ho) return;                                   /* ese día no trabaja */
      const area = byId(D.areas, as.areaId);
      const svs = D.servicios.filter(x=>x.areaId===as.areaId && x.activo);
      if(!svs.length) return;
      const finTurno = mh(ho.hasta);
      /* ya no se carga el almuerzo: el turno entero está disponible */
      const pd = ho.pausaD ? mh(ho.pausaD) : -1, ph = ho.pausaH ? mh(ho.pausaH) : -1;
      /* qué tan lleno está: lo de atrás y lo de hoy, a tope; lo de más
         adelante se va vaciando, como pasa de verdad */
      /* el día tiene que verse lleno PERO con lugar: si no queda ningún
         hueco, la recepcionista no puede mostrar dónde dar un turno */
      const hueco = dd < 0 ? 0.30 : dd === 0 ? 0.28
                  : dd <= 4 ? 0.34 : dd <= 7 ? 0.48 : 0.65;
      let t = mh(ho.desde);
      while(t < finTurno - 20){
        if(t >= pd && t < ph){ t = ph; continue; }
        if(chance(hueco)){ t += 15; continue; }
        const sv = elegir(svs);
        if(t + sv.dur > finTurno) break;
        if(t < pd && t + sv.dur > pd){ t = ph; continue; }   /* no pisar el almuerzo */
        const k = as.profId+'|'+f;
        (libre[k] = libre[k] || []).push([t, t+sv.dur]);

        let estado;
        if(dd < 0)       estado = chance(.05) ? 'can' : chance(.045) ? 'no' : 'fin';
        else if(dd > 0)  estado = (dd<=2 && chance(.65)) ? 'conf' : 'res';
        else {
          if(t + sv.dur <= ahora - 10)        estado = chance(.04) ? 'no' : 'fin';
          else if(t <= ahora + 5)             estado = chance(.72) ? 'serv' : 'lleg';
          else if(t - ahora <= 40)            estado = chance(.45) ? 'lleg' : 'conf';
          else                                estado = chance(.55) ? 'conf' : 'res';
          if(estado!=='fin' && estado!=='serv' && chance(.035)) estado = 'can';
        }

        const desc = (estado==='fin' && chance(.08)) ? Math.round(sv.contado*0.1/500)*500 : 0;
        const v = { id:uid('vi'), clientaId: elegir(CLI), sucursalId: area.sucursalId,
          fecha: f, creada: new Date(parseISO(f).getTime() - 86400000*(1+Math.floor(rnd()*9))).toISOString(),
          lineas:[{ id:uid('ln'), servicioId:sv.id, profId:as.profId, areaId:as.areaId,
            hora: hm(t), dur: sv.dur, estado, precio: sv.contado, descuento: desc,
            comisionPct: sv.comision, exenta:false, motivo: estado==='can'?'La clienta avisó':'' }],
          pagos:[], sinTurno: !area.porTurno };

        /* lo que se terminó, se cobró */
        if(estado === 'fin'){
          const medio = elegir(MEDIO_POND);
          const base = sv.contado - desc;
          const imp = conRec(medio) ? lista(base) : base;
          v.pagos.push({id:uid('pa'), importe:imp, contado:base, medio, tipo:'total',
            fecha:f, hora:hm(Math.min(finTurno, t+sv.dur+5)),
            usuario: USUARIOS_CAJA[D.sucursales.findIndex(x=>x.id===area.sucursalId)] || 'Vanesa Ledesma',
            anulado:null});
        }
        /* algunas de adelante dejan seña */
        if(dd > 0 && chance(.07)){
          const sena = Math.round(sv.contado*0.3/500)*500;
          v.pagos.push({id:uid('pa'), importe:sena, contado:sena, medio:'transfer', tipo:'sena',
            fecha: addDays(f, -2), hora:'11:00', usuario:'Vanesa Ledesma', anulado:null});
        }
        visitas.push(v);
        t += sv.dur + (chance(.35) ? 15 : 0);
      }
    });
  }
  D.visitas = visitas;

  /* ---- LA FILA DE HOY ----
     Lo que se atiende por orden de llegada no está en la agenda: está acá.
     La recepcionista anota a la clienta cuando llega, con el número de
     tiquera que le da la profesional, y marca en qué está.
     Para que el ejemplo se vea como un día real, la fila arranca con lo
     que ya se atendió hoy, lo que se está atendiendo ahora mismo, y unas
     cuantas esperando. */
  D.fila = [];
  let tiq = 4100;
  const CAJERA = sid => USUARIOS_CAJA[D.sucursales.findIndex(x=>x.id===sid)] || 'Vanesa Ledesma';
  D.visitas.filter(v=>v.fecha===H && v.sinTurno).forEach(v=>{
    const l = v.lineas[0];
    const est = l.estado==='fin' ? 'fin' : l.estado==='serv' ? 'at'
              : l.estado==='no' ? 'fue' : null;
    if(!est) return;
    D.fila.push({id:uid('fl'), sucursalId:v.sucursalId, fecha:H, clientaId:v.clientaId,
      servicioId:l.servicioId, areaId:l.areaId, profPedida:null,
      llegada: hm(Math.max(0, mh(l.hora) - 5 - Math.floor(rnd()*20))),
      estado:est, visitaId:v.id, profId:l.profId,
      desde:l.hora, hasta: est==='fin' ? hm(mh(l.hora)+l.dur) : null,
      tiquera:String(tiq++), usuario:CAJERA(v.sucursalId), ts:Date.now()});
  });
  /* quiénes están hoy en cada área: pedir por alguien que hoy no vino no
     tiene sentido, y en la pantalla queda como un error */
  const hoyEn = ar => {
    const dow = parseISO(H).getDay();
    return D.asign.filter(a=>a.areaId===ar.id)
      .filter(a=>D.horarios.some(h=>h.asignId===a.id && h.dia===dow))
      .filter(a=>!noTrabaja(a.profId, H));
  };
  /* en cada local tiene que haber alguien atendiéndose: si no, la pantalla
     de la recepcionista arranca vacía y no se entiende para qué sirve */
  D.sucursales.forEach(su=>{
    if(D.fila.some(f=>f.sucursalId===su.id && f.estado==='at')) return;
    const ar = D.areas.find(a=>a.sucursalId===su.id && !a.porTurno && hoyEn(a).length);
    if(!ar) return;
    const svs = D.servicios.filter(x=>x.areaId===ar.id && x.activo);
    const as = hoyEn(ar)[0];
    D.fila.push({id:uid('fl'), sucursalId:su.id, fecha:H, clientaId:elegir(CLI),
      servicioId:elegir(svs).id, areaId:ar.id, profPedida:null,
      llegada: hm(Math.max(540, ahora-25)), estado:'at', visitaId:null, profId:as.profId,
      desde: hm(Math.max(540, ahora-15)), hasta:null, tiquera:String(tiq++),
      usuario:CAJERA(su.id), ts:Date.now()});
  });
  /* las que están esperando en este momento */
  D.areas.filter(a=>!a.porTurno).forEach(ar=>{
    const svs = D.servicios.filter(x=>x.areaId===ar.id && x.activo);
    const suyas = hoyEn(ar);
    if(!svs.length) return;
    const cuantas = 1 + Math.floor(rnd()*3);
    for(let k=0;k<cuantas;k++){
      /* muchas clientas piden por una profesional y la esperan. Se pide
         solo por alguien que HOY esté trabajando en esa área. */
      const pedida = (chance(.35) && suyas.length) ? elegir(suyas).profId : null;
      D.fila.push({id:uid('fl'), sucursalId:ar.sucursalId, fecha:H, clientaId:elegir(CLI),
        servicioId:elegir(svs).id, areaId:ar.id, profPedida: pedida,
        llegada: hm(Math.max(540, ahora - 3 - Math.floor(rnd()*40))),
        estado:'esp', visitaId:null, profId:null, desde:null, hasta:null,
        tiquera: chance(.8) ? String(tiq++) : '',
        usuario:CAJERA(ar.sucursalId), ts:Date.now()});
    }
  });
  D.fila.sort((a,b)=> a.llegada<b.llegada?-1:1);

  /* ---- lista de espera ---- */
  const A1 = svAr('ar1'), A2 = svAr('ar2');
  D.espera = [
    {id:uid('es'), clientaId:'cl11', servicioId:A2[1].id, fecha:H, nota:'Cualquier horario'},
    {id:uid('es'), clientaId:'cl14', servicioId:A1[0].id, fecha:M, nota:'Después de las 15'},
    {id:uid('es'), clientaId:'cl6',  servicioId:A1[2].id, fecha:H, nota:'Si se libera algo hoy'},
    {id:uid('es'), clientaId:'cl22', servicioId:A2[0].id, fecha:addDays(H,2), nota:'A la mañana'}
  ];

  /* ---- la caja de cada día en cada sucursal ---- */
  D.caja = []; D.gastos = [];
  const GASTOS = [['Insumos de manicuría',18500],['Descartables',9500],['Limpieza',7000],
    ['Café y agua',6500],['Insumos de pestañas',24000],['Toallas',12000],
    ['Delivery de insumos',5000],['Mantenimiento equipo',32000]];
  D.sucursales.map(x=>x.id).forEach((sid, si)=>{
    const quien = USUARIOS_CAJA[si];
    for(let dd=-14; dd<=0; dd++){
      const f = addDays(H, dd);
      const hubo = D.visitas.some(v=>v.sucursalId===sid && v.fecha===f && v.pagos.length);
      if(!hubo && dd!==0) continue;
      const enEfectivo = D.visitas.filter(v=>v.sucursalId===sid && v.fecha===f)
        .reduce((a,v)=>a + v.pagos.filter(p=>p.medio==='efectivo')
          .reduce((b,p)=>b+p.importe,0), 0);
      D.caja.push({id:uid('ca'), sucursalId:sid, fecha:f, montoInicial:20000,
        abierta: dd===0, montoContado: dd===0 ? null : 20000 + enEfectivo,
        usuario: quien});
      if(chance(.45) || dd===0){
        const g = elegir(GASTOS);
        D.gastos.push({id:uid('ga'), sucursalId:sid, fecha:f, concepto:g[0],
          importe:g[1], medio:'efectivo', usuario:quien});
      }
    }
  });

  /* ---- fichajes de hoy: quién entró y a qué hora ---- */
  D.fichadas = [];
  D.asign.forEach(as=>{
    const ho = D.horarios.find(h=>h.asignId===as.id && h.dia===parseISO(H).getDay());
    if(!ho) return;
    if(D.fichadas.some(x=>x.profId===as.profId && x.fecha===H)) return;
    const ent = mh(ho.desde) + (chance(.3) ? Math.floor(rnd()*12) : -Math.floor(rnd()*6));
    if(ent > ahoraReal) return;
    D.fichadas.push({id:uid('fi'), profId:as.profId, fecha:H, entrada:hm(Math.max(0,ent)),
      salida: (mh(ho.hasta) < ahoraReal) ? ho.hasta : null});
  });

  /* paquetes */
  const svDef = D.servicios.filter(s=>byId(D.areas,s.areaId).nombre==='Depilación definitiva');
  D.paquetes = [
    {id:uid('pq'), clientaId:'cl4', servicioId:svDef[0].id, total:6, usadas:2,
     importe:Math.round(svDef[0].contado*6*0.8), medio:'efectivo', sucursalId:'su2',
     fecha:addDays(H,-70), usuario:'Vanesa Ledesma'},
    {id:uid('pq'), clientaId:'cl9', servicioId:svDef[1].id, total:6, usadas:5,
     importe:Math.round(svDef[1].contado*6*0.8), medio:'transfer', sucursalId:'su2',
     fecha:addDays(H,-120), usuario:'Vanesa Ledesma'}
  ];

  /* vouchers */
  D.vouchers = [
    {id:uid('vo'), codigo:'ISIS-4471', servicios:[A2[0].id], deQuien:'Martín G.',
     paraQuien:'Camila Sosa', clientaId:null, fecha:addDays(H,-12), importe:A2[0].contado,
     medio:'efectivo', sucursalId:'su1', canjeado:false, canjeadoF:null, usuario:'Vanesa Ledesma'},
    {id:uid('vo'), codigo:'ISIS-4472', servicios:[A1[2].id, A2[3].id], deQuien:'Lucía P.',
     paraQuien:'Renata Vidal', clientaId:null, fecha:H, importe:A1[2].contado+A2[3].contado,
     medio:'credito', sucursalId:'su1', canjeado:false, canjeadoF:null, usuario:'Vanesa Ledesma'}
  ];

  /* el libro de caja de los datos de ejemplo */
  const _db = DB; DB = D; D.mov = armarLibroDesdeLoViejo(); DB = _db;
  D.cfg.fondoCaja = 20000;
  D.cfg.v = 4;
  return D;
}

let DB, MEM=null;
function load(){
  try{
    const raw = localStorage.getItem('isis_db');
    if(raw){ DB = JSON.parse(raw); return; }
  }catch(e){}
  DB = MEM || seed();
  save();
}
function migrar(){
  if(!DB.cfg.permisos) DB.cfg.permisos = JSON.parse(JSON.stringify(PERM_DEF));
  /* --- cambios de versión sobre bases ya guardadas: EN ORDEN, de la más vieja a la más nueva --- */
  if(!DB.cfg.v || DB.cfg.v < 2){
    /* la supervisora pasa a administrar las clientas de su área */
    if(DB.cfg.permisos.supervisora && DB.cfg.permisos.supervisora.clientas==='ver')
      DB.cfg.permisos.supervisora.clientas='todo';
    /* las notas que ya estaban cargadas son notas DE TRABAJO (tono, potencia, alergias) */
    DB.clientas.forEach(c=>{ if(c.notasInt===undefined) c.notasInt=''; });
    /* los pagos viejos: cuánto del precio de contado cubrió cada uno */
    DB.visitas.forEach(v=>v.pagos.forEach(p=>{
      if(p.contado===undefined) p.contado = MEDIOS.find(m=>m.k===p.medio)?.rec
        ? Math.round(p.importe/(1+(DB.cfg.recargo||0)/100)) : p.importe;
    }));
    DB.cfg.v = 2;
  }
  if(DB.cfg.v < 3){
    /* el ejemplo de excepción por persona pasa a ser de agenda: una supervisora
       no entra a la caja ni con excepción cargada por error */
    const u4 = byId(DB.usuarios,'us4');
    if(u4 && u4.rol==='supervisora' && u4.permisos && u4.permisos.caja){
      delete u4.permisos.caja; u4.permisos.agenda='suc';
    }
    DB.cfg.v = 3;
  }
  if(DB.cfg.v < 4){
    /* una supervisora puede tener varias áreas: el campo pasa a ser una lista */
    DB.usuarios.forEach(u=>{ if(!Array.isArray(u.areas)) u.areas = u.areaId?[u.areaId]:[]; });
    /* recepción pasa a poder manejar horarios de su sucursal */
    if(DB.cfg.permisos.recepcion && DB.cfg.permisos.recepcion.equipo==='ver')
      DB.cfg.permisos.recepcion.equipo='suc';
    DB.usuarios.forEach(u=>{ if(u.rol==='recepcion' && u.permisos && u.permisos.equipo==='ver')
      delete u.permisos.equipo; });
    DB.cfg.v = 4;
  }
  DB.clientas.forEach(c=>{ if(c.notasInt===undefined) c.notasInt=''; });
  DB.liquidaciones = DB.liquidaciones || [];
  /* v4: el libro de caja. Se arma una sola vez con todo lo que ya estaba cargado,
     así ninguna caja vieja queda sin respaldo. */
  if(!DB.mov){ DB.mov = armarLibroDesdeLoViejo(); }
  if(DB.cfg.fondoCaja===undefined) DB.cfg.fondoCaja = 0;
  if(!DB.cfg.v || DB.cfg.v < 4) DB.cfg.v = 4;
  DB.excepciones = DB.excepciones || [];
  DB.usuarios.forEach(u=>{ if(!u.permisos) u.permisos={}; if(u.activo===undefined) u.activo=true;
    if(u.email===undefined) u.email=''; });
  /* el login arranca APAGADO: se prende cuando todas tengan su mail cargado */
  if(DB.cfg.pedirClave===undefined) DB.cfg.pedirClave = false;
  if(DB.cfg.linkApp===undefined) DB.cfg.linkApp = LINK_POR_DEFECTO;
  if(DB.cfg.presentado===undefined) DB.cfg.presentado = false;
  DB.fila = DB.fila || [];
  /* la agenda va de media hora, de 9 a 19:30, igual en los cuatro locales */
  if(!DB.cfg.paso)   DB.cfg.paso = 30;
  if(!DB.cfg.abre)   DB.cfg.abre = '09:00';
  if(!DB.cfg.cierra) DB.cfg.cierra = '19:30';
  /* v5: el almuerzo sale del sistema. Lo hacen cuando tienen libre y lo
     manejan con la cajera; tenerlo cargado bloqueaba media hora al pedo. */
  if(DB.cfg.v < 5){ DB.horarios.forEach(h=>{ h.pausaD=null; h.pausaH=null; }); DB.cfg.v = 5; }
  /* las áreas que ya estaban cargadas no sabían si se agendan o no */
  if(DB.cfg.v < 6){
    (DB.areas||[]).forEach(a=>{ if(a.porTurno===undefined) a.porTurno = AREAS_CON_TURNO.includes(a.nombre); });
    DB.cfg.v = 6;
  }
  /* volver a entrar como la última vez que se usó este aparato */
  if(DB.cfg.ultimoUsuario && byId(DB.usuarios, DB.cfg.ultimoUsuario)){
    ST.usuarioId = DB.cfg.ultimoUsuario;
    const u = byId(DB.usuarios, ST.usuarioId);
    if(u.sucursalId) ST.sucursalId = u.sucursalId;
    const mias = areasDeUsuario(u); if(mias.length) ST.areaId = mias[0];
  }
  DB.profesionales.forEach(p=>{ if(!p.fichaje) p.fichaje='foto'; });
  /* las fotos de fichaje viejas se borran solas para no llenar la memoria */
  const lim = addDays(hoy(), -60);
  DB.fichadas.forEach(f=>{ if(f.fecha<lim){ delete f.fotoEntrada; delete f.fotoSalida; } });
}

      if(!d.visitas || !d.servicios) throw new Error('no parece una copia de Isis');

function archivar(lim){
  const n = DB.visitas.filter(v=>v.fecha<lim).length;

  DB.visitas = DB.visitas.filter(v=>v.fecha>=lim);
  DB.fichadas = DB.fichadas.filter(f=>f.fecha>=lim);
  save(); closeSheet(); render();
  toast(n+' turnos archivados');
}

/* tramos en que la profesional está OCUPADA por una línea
   (trabaja -> proceso libre -> vuelve a trabajar) */
function tramosOcupados(linea){
  const sv = byId(DB.servicios, linea.servicioId);
  const ini = mh(linea.hora);
  if(!sv) return [[ini, ini+linea.dur]];
  if(sv.proceso>0 && sv.trabajo2>0){
    return [[ini, ini+sv.trabajo1],[ini+sv.trabajo1+sv.proceso, ini+sv.dur]];
  }
  if(sv.proceso>0) return [[ini, ini+sv.trabajo1]];
  return [[ini, ini+sv.dur]];
}
function lineasDe(fecha, filtro){
  const out=[];
  DB.visitas.filter(v=>v.fecha===fecha).forEach(v=>{
    v.lineas.forEach(l=>{
      if(l.estado==='can') return;
      if(filtro && !filtro(l,v)) return;
      out.push({...l, visita:v});
    });
  });
  return out;
}
/* horario HABITUAL (base) de una profesional en un área un día */
function horarioBase(profId, areaId, fecha){
  const as = DB.asign.find(a=>a.profId===profId && a.areaId===areaId);
  if(!as) return null;
  const dia = parseISO(fecha).getDay();
  return DB.horarios.find(x=>x.asignId===as.id && x.dia===dia) || null;
}
/* excepción vigente para esa persona esa fecha */
function excepcionDe(profId, fecha){
  return DB.excepciones.find(e=>e.profId===profId && fecha>=e.desdeF && fecha<=e.hastaF) || null;
}
/* DISPONIBILIDAD REAL = horario habitual + excepciones.
   Es lo que usa toda la agenda. */
function horarioDe(profId, areaId, fecha){
  const ex = excepcionDe(profId, fecha);
  if(ex){
    if(['no','vacaciones','licencia'].includes(ex.tipo)) return null;
    if(ex.tipo==='traslado'){
      /* ese día trabaja en otra área: solo aparece ahí */
      if(ex.areaId!==areaId) return null;
      if(!DB.asign.find(a=>a.profId===profId && a.areaId===areaId)) return null;
      return {desde:ex.desde||'09:00', hasta:ex.hasta||'17:00', pausaD:null, pausaH:null, excepcion:ex};
    }
    if(ex.tipo==='horario'){
      const base = horarioBase(profId, areaId, fecha);
      if(!base) return null;
      return {...base, desde:ex.desde||base.desde, hasta:ex.hasta||base.hasta, excepcion:ex};
    }
  }
  /* si ese día la trasladaron a otra área, no aparece en la suya */
  return horarioBase(profId, areaId, fecha);
}
function bloqueosDe(profId, fecha){
  return DB.bloqueos.filter(b=>b.profId===profId && b.fecha===fecha);
}
/* cuántas atenciones activas tiene la profesional en [a,b) */
function solapadas(profId, fecha, a, b, exceptoLineaId){
  let n=0;
  /* si la clienta no asistió, la profesional quedó libre: ese rato se puede volver a usar */
  lineasDe(fecha, l=>l.profId===profId && l.id!==exceptoLineaId && l.estado!=='no').forEach(l=>{
    tramosOcupados(l).forEach(([x,y])=>{ if(a < y && b > x) n++; });
  });
  return n;
}
/* huecos donde entra un servicio */
function huecos(profId, areaId, fecha, servicioId){
  const h = horarioDe(profId, areaId, fecha);
  if(!h) return [];
  const sv = byId(DB.servicios, servicioId);
  const desde = mh(h.desde), hasta = mh(h.hasta);
  const pausa = h.pausaD ? [mh(h.pausaD), mh(h.pausaH)] : null;
  const blqs = bloqueosDe(profId, fecha).map(b=>[mh(b.desde), mh(b.hasta)]);
  const out=[];
  for(let t=desde; t+sv.dur<=hasta; t+=15){
    const fin = t+sv.dur;
    if(pausa && t < pausa[1] && fin > pausa[0]) continue;
    if(blqs.some(([x,y])=> t<y && fin>x)) continue;
    /* tramos activos del nuevo servicio */
    const nuevos = sv.proceso>0 && sv.trabajo2>0
      ? [[t,t+sv.trabajo1],[t+sv.trabajo1+sv.proceso, fin]]
      : sv.proceso>0 ? [[t,t+sv.trabajo1]] : [[t,fin]];
    let libre = true;
    for(const [a,b] of nuevos){
      if(solapadas(profId, fecha, a, b) >= sv.simult){ libre=false; break; }
    }
    if(libre) out.push(hm(t));
  }
  return out;
}
/* TRAMOS LIBRES de una profesional en el dia (sin pensar en un servicio puntual):
   lo que queda del horario despues de sacar turnos, bloqueos y pausa.
   Es lo que la agenda del celular muestra como espacios tocables. */
function huecosLibres(profId, areaId, fecha){
  const h = horarioDe(profId, areaId, fecha);
  if(!h) return [];
  const desde = mh(h.desde), hasta = mh(h.hasta);
  const ocup = [];
  /* todos sus turnos del día, de cualquier área: si está ocupada en otra, no está libre acá.
     Los turnos donde la clienta no asistió liberan el horario. */
  lineasDe(fecha, l=>l.profId===profId && l.estado!=='no').forEach(l=> ocup.push([mh(l.hora), mh(l.hora)+l.dur]));
  bloqueosDe(profId, fecha).forEach(b=> ocup.push([mh(b.desde), mh(b.hasta)]));
  if(h.pausaD) ocup.push([mh(h.pausaD), mh(h.pausaH)]);
  ocup.sort((a,b)=>a[0]-b[0]);
  const out=[]; let t=desde;
  ocup.forEach(([a,b])=>{ if(a>t && a>desde) out.push([t, Math.min(a,hasta)]); if(b>t) t=b; });
  if(t<hasta) out.push([t,hasta]);
  return out.filter(([a,b])=> b-a>=15);
}
function durTxt(m){
  const h=Math.floor(m/60), r=m%60;
  return h? (h+' h'+(r?' '+r+'′':'')) : (r+'′');
}
/* profesionales que pueden hacer un servicio en un área */
function profesDe(areaId, servicioId){
  return DB.asign.filter(a=>a.areaId===areaId && (!servicioId || a.servicios.includes(servicioId)))
    .map(a=>byId(DB.profesionales, a.profId)).filter(p=>p && p.activa);
}
let _PDD = {};
function profesDelDia(areaId, fecha){
  const k = areaId+'|'+fecha;
  if(_PDD[k]) return _PDD[k];
  return _PDD[k] = profesDe(areaId).filter(p=>horarioDe(p.id, areaId, fecha));
}
function olvidarProfesDelDia(){ _PDD = {}; }


/* ============================================================
   EL LIBRO DE CAJA
   Cada peso que entra o sale es UN RENGLÓN con fecha, hora, quién
   lo hizo, con qué se pagó y por qué. La caja no se calcula
   mirando los turnos: suma sus propios renglones.
   Nada se borra: se ANULA, y la anulación es otro renglón.
   ============================================================ */
const MOV_TIPOS = {
  apertura:  {n:'Apertura de caja',   signo: 0, ic:'cash'},
  cobro:     {n:'Cobro',              signo:+1, ic:'cash'},
  sena:      {n:'Seña',               signo:+1, ic:'cash'},
  voucher:   {n:'Voucher vendido',    signo:+1, ic:'gift'},
  paquete:   {n:'Paquete vendido',    signo:+1, ic:'gift'},
  gasto:     {n:'Gasto',              signo:-1, ic:'trash'},
  pagoprof:  {n:'Pago a profesional', signo:-1, ic:'sobre'},
  devolucion:{n:'Devolución',         signo:-1, ic:'back'},
  retiro:    {n:'Retiro de caja',     signo:-1, ic:'back'},
  cierre:    {n:'Cierre de caja',     signo: 0, ic:'lock'},
  anulacion: {n:'Anulación',          signo: 0, ic:'x'},
  ajuste:    {n:'Corrección',         signo: 0, ic:'edit'}
};
const signoMov = m => (MOV_TIPOS[m.tipo]||{signo:0}).signo;
const nombreMov = m => (MOV_TIPOS[m.tipo]||{n:m.tipo}).n;

/* graba un renglón. SIEMPRE por acá: es el único lugar que escribe en el libro. */
function mov(tipo, datos){
  const u = usuario() || {};
  const m = Object.assign({
    id: uid('mv'), sucursalId: ST.sucursalId, fecha: hoy(), hora: horaAhora(),
    ts: new Date().toISOString(), usuarioId: u.id||null, usuario: u.nombre||'—',
    tipo, medio: null, importe: 0, concepto: '',
    visitaId: null, pagoId: null, gastoId: null, liqId: null,
    profId: null, clientaId: null,
    anulado: null, anulaA: null, motivo: ''
  }, datos||{});
  DB.mov.push(m);
  return m;
}
/* anular = dejar el renglón viejo marcado y escribir uno nuevo que lo explica */
function anularMov(movId, motivo){
  const m = byId(DB.mov, movId);
  if(!m || m.anulado) return null;
  const a = mov('anulacion', {importe:m.importe, medio:m.medio, anulaA:m.id, motivo:motivo||'',
    concepto:'Anula: '+nombreMov(m)+(m.concepto?' · '+m.concepto:''),
    visitaId:m.visitaId, pagoId:m.pagoId, gastoId:m.gastoId, liqId:m.liqId,
    profId:m.profId, clientaId:m.clientaId});
  m.anulado = a.id;
  return a;
}
const movsDe = (fecha, sid) => DB.mov
  .filter(m=>m.fecha===fecha && m.sucursalId===sid)
  .sort((a,b)=> (a.ts||'').localeCompare(b.ts||'') || (a.hora||'').localeCompare(b.hora||''));
/* los que mueven plata de verdad: ni anulados, ni las propias anulaciones */
const movsVivos = ms => ms.filter(m=>!m.anulado && m.tipo!=='anulacion');

function arqueoDe(fecha, sid){
  const todos = movsDe(fecha, sid);
  const vivos = movsVivos(todos);
  const apertura = vivos.find(m=>m.tipo==='apertura') || null;
  const cierre   = vivos.find(m=>m.tipo==='cierre')   || null;
  const fondo = apertura ? apertura.importe : 0;
  const porMedio = {}; MEDIOS.forEach(x=>porMedio[x.k]={entra:0, sale:0});
  let entra=0, sale=0, efeIn=0, efeOut=0;
  vivos.forEach(m=>{
    const sg = signoMov(m); if(!sg) return;
    const pm = porMedio[m.medio];
    if(sg>0){ entra+=m.importe; if(pm) pm.entra+=m.importe; if(m.medio==='efectivo') efeIn+=m.importe; }
    else    { sale +=m.importe; if(pm) pm.sale +=m.importe; if(m.medio==='efectivo') efeOut+=m.importe; }
  });
  const esperado = fondo + efeIn - efeOut;
  return {fecha, sid, todos, vivos, apertura, cierre, fondo, entra, sale,
          efeIn, efeOut, esperado, porMedio,
          abierta: !!apertura && !cierre,
          contado: cierre ? (cierre.contado!=null?cierre.contado:null) : null,
          diferencia: cierre && cierre.contado!=null ? cierre.contado - (cierre.esperado!=null?cierre.esperado:esperado) : null,
          anulaciones: todos.filter(m=>m.tipo==='anulacion').length};
}
/* el fondo que quedó en el cajón la última vez que se cerró */
function fondoQueQuedo(sid){
  const cierres = DB.mov.filter(m=>m.sucursalId===sid && m.tipo==='cierre' && !m.anulado)
    .sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
  return cierres.length ? (cierres[0].fondoQueda||0) : 0;
}
/* los días que tienen movimientos, del más nuevo al más viejo */
function diasConCaja(sid){
  return [...new Set(DB.mov.filter(m=>m.sucursalId===sid).map(m=>m.fecha))].sort().reverse();
}

/* ============================================================
   MIGRACIÓN: armar el libro con lo que ya estaba cargado
   ============================================================ */
function armarLibroDesdeLoViejo(){
  const L = [];
  const push = (o)=>L.push(Object.assign({
    id: uid('mv'), medio:'efectivo', importe:0, concepto:'', usuario:'—', usuarioId:null,
    hora:'00:00', ts:'', visitaId:null, pagoId:null, gastoId:null, liqId:null,
    profId:null, clientaId:null, anulado:null, anulaA:null, motivo:''}, o));
  (DB.caja||[]).forEach(c=>{
    push({tipo:'apertura', sucursalId:c.sucursalId, fecha:c.fecha, importe:c.montoInicial||0,
      usuario:c.usuario||'—', concepto:'Apertura', hora:'08:00', ts:c.fecha+'T08:00:00'});
    if(c.montoContado!=null) push({tipo:'cierre', sucursalId:c.sucursalId, fecha:c.fecha,
      importe:c.montoContado, contado:c.montoContado, esperado:null, fondoQueda:0,
      usuario:c.usuario||'—', concepto:'Cierre', hora:'21:00', ts:c.fecha+'T21:00:00'});
  });
  (DB.visitas||[]).forEach(v=>(v.pagos||[]).forEach(p=>{
    if(p.anulado) return;
    push({tipo: p.tipo==='sena'?'sena':'cobro', sucursalId:v.sucursalId, fecha:p.fecha||v.fecha,
      importe:p.importe, medio:p.medio||'efectivo', usuario:p.usuario||'—',
      visitaId:v.id, pagoId:p.id, clientaId:v.clientaId, motivo:p.motivo||'',
      concepto:(byId(DB.clientas,v.clientaId)||{}).nombre||'', ts:(p.fecha||v.fecha)+'T12:00:00'});
  }));
  (DB.vouchers||[]).filter(x=>x.importe>0).forEach(x=>push({tipo:'voucher',
    sucursalId:x.sucursalId, fecha:x.fecha, importe:x.importe, medio:x.medio||'efectivo',
    usuario:x.usuario||'—', concepto:'Voucher '+x.codigo, ts:x.fecha+'T12:00:00'}));
  (DB.paquetes||[]).filter(x=>x.importe>0).forEach(x=>push({tipo:'paquete',
    sucursalId:x.sucursalId, fecha:x.fecha, importe:x.importe, medio:x.medio||'efectivo',
    usuario:x.usuario||'—', clientaId:x.clientaId,
    concepto:'Paquete · '+((byId(DB.clientas,x.clientaId)||{}).nombre||''), ts:x.fecha+'T12:00:00'}));
  (DB.gastos||[]).forEach(g=>push({tipo: g.tipo==='comision'?'pagoprof':'gasto',
    sucursalId:g.sucursalId, fecha:g.fecha, importe:g.importe, medio:g.medio||'efectivo',
    usuario:g.usuario||'—', gastoId:g.id, concepto:g.concepto, ts:g.fecha+'T13:00:00'}));
  return L.sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
}

/* ============================================================
   CÁLCULOS DE PLATA
   ============================================================ */
/* una línea cubierta por un paquete o un voucher ya está paga: no se vuelve a cobrar,
   pero la comisión de la profesional se genera igual */
function cubierta(l){ return l.paqueteId?'Paquete':(l.voucherId?'Voucher':null); }
function totalVisita(v){
  return v.lineas.filter(l=>l.estado!=='can' && !cubierta(l))
    .reduce((s,l)=> s + (l.precio - (l.descuento||0)), 0);
}
/* CUÁNTO DEL PRECIO DE CONTADO cubrió cada pago.
   Un pago con tarjeta de $11.500 con 15% de recargo cubre $10.000 de contado.
   Así el recargo se cobra SOLO sobre la parte que se paga con tarjeta,
   nunca sobre lo que ya se pagó en efectivo. */
/* un pago ANULADO no existe para la cuenta de la clienta: el renglón queda en el
   libro de caja para que se vea qué pasó, pero no suma ni resta plata. */
const pagosVivos = v => v.pagos.filter(p=>!p.anulado);
function pagadoVisita(v){ return pagosVivos(v).reduce((s,p)=>s+(p.contado!=null?p.contado:p.importe),0); }
/* plata que realmente entró a la caja */
function cobradoVisita(v){ return pagosVivos(v).reduce((s,p)=>s+p.importe,0); }
function saldoVisita(v){ return totalVisita(v) - pagadoVisita(v); }
/* cuánto hay que cobrar para saldar, según con qué se paga */
function aCobrarCon(saldoContado, medio){
  const M = MEDIOS.find(m=>m.k===medio);
  return (M && M.rec) ? precioLista(saldoContado) : saldoContado;
}
function comisionLinea(l){
  if(l.exenta) return 0;
  return Math.round(l.precio * (l.comisionPct/100));   /* SIEMPRE sobre contado */
}

/* ============================================================
   BORRAR COSAS
   Todo se puede editar y sacar desde adentro de la app.
   Regla: si NO tiene historial atado, se borra de verdad.
   Si tiene, se deja SIN USO: desaparece de las pantallas pero el historial queda.
   ============================================================ */
function ataduras(tipo, id){
  const L=[]; const n=(c,uno,varios)=>{ if(c) L.push(c+' '+(c===1?uno:varios)); };
  if(tipo==='sucursal'){
    n(DB.areas.filter(a=>a.sucursalId===id).length,'área','áreas');
    n(DB.visitas.filter(v=>v.sucursalId===id).length,'turno','turnos');
    n(DB.caja.filter(c=>c.sucursalId===id).length,'día de caja','días de caja');
    n(DB.gastos.filter(g=>g.sucursalId===id).length,'gasto','gastos');
    n(DB.usuarios.filter(u=>u.sucursalId===id).length,'usuario asignado','usuarios asignados');
    n(DB.vouchers.filter(v=>v.sucursalId===id).length,'voucher','vouchers');
    n(DB.paquetes.filter(p=>p.sucursalId===id).length,'paquete','paquetes');
  }
  if(tipo==='area'){
    n(DB.visitas.reduce((t,v)=>t+v.lineas.filter(l=>l.areaId===id).length,0),'turno','turnos');
    n(DB.usuarios.filter(u=>areasDeUsuario(u).includes(id)).length,'usuario que la supervisa','usuarios que la supervisan');
  }
  if(tipo==='servicio'){
    n(DB.visitas.reduce((t,v)=>t+v.lineas.filter(l=>l.servicioId===id).length,0),'turno','turnos');
    n(DB.paquetes.filter(p=>p.servicioId===id).length,'paquete','paquetes');
    n(DB.vouchers.filter(v=>v.servicios.includes(id)).length,'voucher','vouchers');
    n(DB.espera.filter(e=>e.servicioId===id).length,'anotación en la lista de espera','anotaciones en la lista de espera');
  }
  if(tipo==='profesional'){
    n(DB.visitas.reduce((t,v)=>t+v.lineas.filter(l=>l.profId===id).length,0),'turno','turnos');
    n(DB.fichadas.filter(f=>f.profId===id).length,'fichada','fichadas');
    n(DB.liquidaciones.filter(x=>x.profId===id).length,'liquidación','liquidaciones');
    n(DB.usuarios.filter(u=>u.profId===id).length,'usuario','usuarios');
  }
  if(tipo==='clienta'){
    n(DB.visitas.filter(v=>v.clientaId===id).length,'visita','visitas');
    n(DB.paquetes.filter(p=>p.clientaId===id).length,'paquete','paquetes');
    n(DB.vouchers.filter(v=>v.clientaId===id).length,'voucher','vouchers');
    n(DB.espera.filter(e=>e.clientaId===id).length,'anotación en la lista de espera','anotaciones en la lista de espera');
  }
  return L;
}
/* pantalla única de borrado: explica qué pasa y ofrece la salida correcta */
function pedirBorrar(o){
  /* o = {tipo, id, nombre, seLleva, alBorrar, alDejarSinUso, estaSinUso} */
  const at = ataduras(o.tipo, o.id);
  if(at.length){
    sheet('No se puede borrar', `
      <div class="warnbox">${ic('alert','sm')} <b>${esc(o.nombre)}</b> tiene historial cargado:
        ${at.join(' · ')}. Si se borrara, esos datos quedarían rotos.</div>
      ${o.alDejarSinUso?`<div class="infobox">Lo que sí podés hacer es <b>dejarlo sin uso</b>:
        desaparece de la agenda y de las pantallas de todos los días, pero el historial,
        los cobros y las comisiones quedan intactos. Se puede volver a activar cuando quieras.</div>
      <button class="btn dan" onclick="${o.alDejarSinUso}">${o.estaSinUso?'Volver a activarlo':'Dejarlo sin uso'}</button>`:''}
      <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
    return;
  }
  sheet('Borrar '+o.nombre, `
    <div class="warnbox">${ic('alert','sm')} Se borra para siempre. No tiene historial atado,
      así que no se pierde nada de lo ya hecho.</div>
    ${o.seLleva?`<div class="infobox">Se lleva también: ${esc(o.seLleva)}</div>`:''}
    <button class="btn dan" onclick="${o.alBorrar}">Sí, borrar</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
}

/* ============================================================
   AVISOS Y MOTIVOS
   Nada se traba: todo se puede forzar. Pero el sistema dice exactamente
   qué pasa y pide un motivo corto que queda escrito en el movimiento.
   ============================================================ */
/* qué problemas tiene poner (o mover) un turno ahí */
function avisosDeTurno(profId, areaId, fecha, desdeMin, dur, exceptoLineaId){
  const av=[];
  const p = byId(DB.profesionales, profId);
  const n = p?p.nombre.split(' ')[0]:'Ella';
  const ex = excepcionDe(profId, fecha);
  const h = horarioDe(profId, areaId, fecha);
  const fin = desdeMin+dur;
  if(ex && ['vacaciones','licencia'].includes(ex.tipo))
    av.push(`${n} está de ${ex.tipo==='vacaciones'?'vacaciones':'licencia'} ese día.`);
  else if(ex && ex.tipo==='no') av.push(`${n} no trabaja ese día${ex.motivo?' ('+ex.motivo+')':''}.`);
  else if(ex && ex.tipo==='traslado' && ex.areaId!==areaId) av.push(`${n} ese día va a otra área.`);
  if(!h){ if(!av.length) av.push(`${n} no tiene horario cargado ese día.`); }
  else{
    if(desdeMin < mh(h.desde) || fin > mh(h.hasta))
      av.push(`Queda fuera de su horario: trabaja de ${h.desde} a ${h.hasta}.`);
    if(h.pausaD && desdeMin < mh(h.pausaH) && fin > mh(h.pausaD))
      av.push(`Cae en su pausa de ${h.pausaD} a ${h.pausaH}.`);
  }
  bloqueosDe(profId, fecha).forEach(b=>{
    if(desdeMin<mh(b.hasta) && fin>mh(b.desde))
      av.push(`Tiene ese rato bloqueado, ${b.desde} a ${b.hasta}${b.motivo?': '+b.motivo:''}.`); });
  lineasDe(fecha, l=>l.profId===profId && l.id!==exceptoLineaId && l.estado!=='no').forEach(l=>{
    const cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
    const nom = cl?cl.nombre.split(' ')[0]:'otra clienta';
    let choca=false;
    tramosOcupados(l).forEach(([a,b])=>{ if(desdeMin<b && fin>a) choca=true; });
    if(choca) av.push(`Está atendiendo a ${nom} (${sv?sv.nombre:''} ${l.hora}, ${EST[l.estado].n.toLowerCase()}).`);
    else if(sv && sv.proceso>0){
      const i=mh(l.hora), pa=i+sv.trabajo1, pb=pa+sv.proceso;
      if(desdeMin<pb && fin>pa) av.push(`En ese rato ${nom} está en proceso: queda libre pero vuelve a las ${hm(pb)}.`);
    }
  });
  return [...new Set(av)];
}
/* ¿hace falta forzarlo? Si el horario está entre los libres de verdad, no. */
function hayQueForzar(profId, areaId, fecha, hora, servicioId){
  return !huecos(profId, areaId, fecha, servicioId).includes(hora);
}
/* lo mismo para un turno que YA existe y se está moviendo o reasignando
   (no se cuenta a sí mismo como ocupación) */
function forzarPara(profId, areaId, fecha, hora, servicioId, dur, exceptoLineaId){
  const sv = byId(DB.servicios, servicioId); if(!sv) return true;
  const h = horarioDe(profId, areaId, fecha);
  const t = mh(hora), fin = t + (dur||sv.dur);
  if(!h) return true;
  if(t < mh(h.desde) || fin > mh(h.hasta)) return true;
  if(h.pausaD && t < mh(h.pausaH) && fin > mh(h.pausaD)) return true;
  if(bloqueosDe(profId, fecha).some(b=> t<mh(b.hasta) && fin>mh(b.desde))) return true;
  const nuevos = sv.proceso>0 && sv.trabajo2>0
    ? [[t,t+sv.trabajo1],[t+sv.trabajo1+sv.proceso, fin]]
    : sv.proceso>0 ? [[t,t+sv.trabajo1]] : [[t,fin]];
  return nuevos.some(([a,b])=> solapadas(profId, fecha, a, b, exceptoLineaId) >= sv.simult);
}

   - Mientras "Pedir contraseña para entrar" esté apagado, la app
     sigue funcionando como hasta ahora (se elige de una lista).
     Se prende cuando todas tengan su mail cargado.
   ============================================================ */
const FIREBASE_CFG = {

/* El SDK de Google se baja SOLO si el login está prendido. Mientras esté
   apagado la app no pide nada a internet y abre igual de rápido que antes. */
function bajarScript(src){
  return new Promise((ok,mal)=>{
    const e=document.createElement('script');
    e.src=src; e.async=false;
    e.onload=()=>ok(); e.onerror=()=>mal(new Error('no bajó '+src));
    document.head.appendChild(e);
  });
}
let FB_PROM = null;
function fbIniciar(){
  if(FB.listo) return Promise.resolve(true);
  if(FB_PROM) return FB_PROM;            /* ya se está bajando: esperá esa misma */
  FB_PROM = fbIniciarDeVerdad();
  return FB_PROM;
}
async function fbIniciarDeVerdad(){
  FB.cargando = true; FB.aviso=''; render();
  try{
    if(typeof firebase === 'undefined'){
      for(const u of FB_SDK) await bajarScript(u);
    }
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CFG);
    FB.auth = firebase.auth();
    FB.listo = true;
    FB.auth.onAuthStateChanged(u=>{
      FB.user = u; FB.arranco = true;
      if(u) engancharUsuario(u);
      render();
    });
  }catch(e){
    FB.aviso = 'No se pudo conectar con el servidor. Fijate que haya internet.';
  }
  FB.cargando = false; render();
  if(!FB.listo) FB_PROM = null;          /* si falló, se puede volver a probar */
  return FB.listo;
}

/* La cuenta de Google entró: ¿de quién es acá adentro? */
function engancharUsuario(u){
  const mail = (u.email||'').trim().toLowerCase();
  const mio = DB.usuarios.find(x => (x.email||'').trim().toLowerCase()===mail && x.activo!==false);
  if(!mio){
    FB.aviso = 'La cuenta ' + mail + ' no está dada de alta en este sistema. '
      + 'Pedile a la dueña que cargue ese mail en tu usuario.';
    if(FB.auth) FB.auth.signOut();
    return;
  }
  FB.aviso = '';
  if(ST.usuarioId !== mio.id){
    ST.usuarioId = mio.id;
    if(mio.sucursalId) ST.sucursalId = mio.sucursalId;
    const mias = areasDeUsuario(mio); ST.areaId = mias.length?mias[0]:null;
    ST.view = 'home'; save();
  }
}

/* los errores de Google, dichos como los diría una persona */
function errorEnCriollo(e){
  const c = (e && e.code) || '';
  if(c.includes('invalid-email'))        return 'Ese mail está mal escrito.';
  if(c.includes('user-disabled'))        return 'Esa cuenta está deshabilitada.';
  if(c.includes('too-many-requests'))    return 'Probaste muchas veces seguidas. Esperá unos minutos.';
  if(c.includes('network'))              return 'No hay internet. Conectate y probá de nuevo.';
  if(c.includes('missing-password'))     return 'Falta la contraseña.';
  if(c.includes('weak-password'))        return 'La contraseña es muy corta: tiene que tener 6 o más.';
  if(c.includes('user-not-found') || c.includes('wrong-password') || c.includes('invalid-credential'))
    return 'El mail o la contraseña no coinciden.';
  return 'No se pudo entrar. ' + ((e&&e.message)||'');
}

/* ============================================================
   COMPARTIR EL SISTEMA Y PONERLO EN LA PANTALLA DEL TELÉFONO

   Dos cosas que pidió Julián:
   1. Un botón para que la dueña o la supervisora le manden a
      alguien el link para entrar.
   2. Un botón para que cada una deje ISIS fija en la pantalla
      de su celular o de su compu, como cualquier otra app.
   ============================================================ */
const LINK_POR_DEFECTO = 'https://juliandarino-lab.github.io/isis/';

/* el link de verdad: si la app está abierta desde internet, es el de ahora */
function linkDelSistema(){
  if(location.protocol==='http:' || location.protocol==='https:')
    return location.origin + location.pathname;
  return (DB.cfg && DB.cfg.linkApp) || LINK_POR_DEFECTO;
}

/* la ficha que lee el celular para dejar instalarla */
function ponerManifest(){
  if(!/^https?:$/.test(location.protocol)) return;
  if(document.querySelector('link[rel="manifest"]')) return;
  const carpeta = location.origin + location.pathname.replace(/[^/]*$/,'');
  const m = {
    name: (DB.cfg.negocio||'ISIS') + ' — Gestión', short_name: DB.cfg.negocio || 'ISIS',
    start_url: location.origin + location.pathname, scope: carpeta,
    display: 'standalone', orientation: 'portrait',
    background_color: '#F2F2F4', theme_color: '#16161A', lang: 'es',
    icons: [ {src: ICON192, sizes:'192x192', type:'image/png', purpose:'any'},
             {src: ICON512, sizes:'512x512', type:'image/png', purpose:'any'},
             {src: ICON512, sizes:'512x512', type:'image/png', purpose:'maskable'} ]
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(m));
  document.head.appendChild(l);
  const a = document.createElement('link');
  a.rel = 'apple-touch-icon'; a.href = ICON192;
  document.head.appendChild(a);
}

/* el navegador avisa cuándo puede instalarla: hay que guardarse el aviso */
const PWA = { prompt:null };

  if(/Android/.test(ua)) return 'android';

async function copiarLink(){

      t.select(); bien = document.execCommand('copy'); document.body.removeChild(t);
    }catch(e2){}
  }
  toast(bien ? 'Link copiado' : 'No se pudo copiar: anotalo a mano');
}
