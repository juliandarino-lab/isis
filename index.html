function quitarEspera(id){ DB.espera=DB.espera.filter(e=>e.id!==id); save(); render(); toast('Quitada'); }

function vReportes(){
  const nivel = perm('reportes');
  const desde = nivel==='dia' ? hoy() : addDays(hoy(),-30);
  let vs = DB.visitas.filter(v=>v.fecha>=desde);
  if(nivel==='area'){
    const mias = areasDeUsuario();
    vs = vs.map(v=>({...v, lineas:v.lineas.filter(l=>mias.includes(l.areaId))})).filter(v=>v.lineas.length);
  }
  const fact = vs.reduce((s,v)=>s+pagadoVisita(v),0);
  const fin = vs.reduce((s,v)=>s+v.lineas.filter(l=>l.estado==='fin').length,0);
  const can = vs.reduce((s,v)=>s+v.lineas.filter(l=>l.estado==='can').length,0);
  const no  = vs.reduce((s,v)=>s+v.lineas.filter(l=>l.estado==='no').length,0);

  const porSuc = DB.sucursales.map(su=>({su,
    t: vs.filter(v=>v.sucursalId===su.id).reduce((s,v)=>s+pagadoVisita(v),0)}))
    .sort((a,b)=>b.t-a.t);
  const cnt={};
  vs.forEach(v=>v.lineas.filter(l=>l.estado==='fin').forEach(l=>{
    const n=byId(DB.servicios,l.servicioId).nombre; cnt[n]=(cnt[n]||0)+1; }));
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max = Math.max(1,...porSuc.map(x=>x.t));

  return `<div class="pad">
    <div class="small muted" style="margin-bottom:11px">${nivel==='dia'?'Movimiento de hoy':'Últimos 30 días'}${
      nivel==='area'?' · solo '+esc(nombreAreasDe()||'tu área'):''}</div>
    <div class="kpis" style="grid-template-columns:1fr 1fr">
      <div class="kpi"><b style="font-size:19px">${money(fact)}</b><span>Facturado</span></div>
      <div class="kpi"><b>${fin}</b><span>Servicios hechos</span></div>
      <div class="kpi"><b style="color:var(--e-can)">${can}</b><span>Cancelados</span></div>
      <div class="kpi no"><b>${no}</b><span>No asistieron</span></div>
    </div>
    <div class="h3">Por sucursal</div>
    <div class="card cardp">
      ${porSuc.map(x=>`<div style="margin-bottom:11px">
        <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">
          <span>${esc(x.su.nombre)}</span><b>${money(x.t)}</b></div>
        <div style="height:7px;background:var(--bg);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${Math.round(x.t/max*100)}%;background:var(--acc);border-radius:4px"></div></div>
      </div>`).join('')}
    </div>
    <div class="h3">Por área</div>
    <div class="card cardp">
      ${(()=>{const t={};
        vs.forEach(v=>v.lineas.filter(l=>l.estado==='fin').forEach(l=>{
          const a=byId(DB.areas,l.areaId); if(!a) return;
          const k=a.icono+' '+a.nombre+' · '+byId(DB.sucursales,a.sucursalId).nombre;
          t[k]=(t[k]||0)+l.precio;}));
        const arr=Object.entries(t).sort((a,b)=>b[1]-a[1]);
        const mx=Math.max(1,...arr.map(x=>x[1]));
        return arr.length?arr.map(x=>`<div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">
            <span>${esc(x[0])}</span><b>${money(x[1])}</b></div>
          <div style="height:7px;background:var(--bg);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${Math.round(x[1]/mx*100)}%;background:var(--acc);border-radius:4px"></div></div>
        </div>`).join(''):'<div class="empty">Sin datos.</div>';})()}
    </div>

    <div class="h3">Por profesional</div>
    <div class="listcard">
      ${(()=>{const t={};
        vs.forEach(v=>v.lineas.filter(l=>l.estado==='fin').forEach(l=>{
          t[l.profId]=t[l.profId]||{n:0,f:0,c:0};
          t[l.profId].n++; t[l.profId].f+=l.precio; t[l.profId].c+=comisionLinea(l);}));
        const arr=Object.entries(t).sort((a,b)=>b[1].f-a[1].f);
        return arr.length?arr.map(([pid,x])=>{const p=byId(DB.profesionales,pid);
          return `<div class="lr"><div class="av">${ini(p?p.nombre:'?')}</div>
            <div class="g"><b>${esc(p?p.nombre:'?')}</b><span>${x.n} servicios</span></div>
            <div class="r"><b>${money(x.f)}</b><br><span class="tiny">comisión ${money(x.c)}</span></div></div>`;
        }).join(''):'<div class="empty">Sin datos.</div>';})()}
    </div>

    <div class="h3">Servicios más hechos</div>
    <div class="listcard">${top.length?top.map(([n,c],i)=>`<div class="lr">
      <div class="av">${i+1}</div><div class="g"><b>${esc(n)}</b></div>
      <div class="r">${c}</div></div>`).join(''):`<div class="empty">Sin datos.</div>`}</div>
    <div class="h3">Últimos movimientos</div>
    <div class="listcard">${DB.log.slice(0,15).map(l=>`<div class="lr">
      <div class="g"><b style="font-weight:500;font-size:13.5px">${esc(l.texto)}</b>
        <span class="tiny">${esc(l.usuario)} · ${new Date(l.ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</span></div>
    </div>`).join('')||'<div class="empty">Sin movimientos.</div>'}</div>
  </div>`;
}

function hacerLimpieza(){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const c=k=>(document.getElementById(k)||{}).checked;
  const hecho=[];
  if(c('li_tur')){ DB.visitas=[]; hecho.push('turnos'); }
  if(c('li_caja')){ DB.caja=[]; DB.gastos=[]; DB.fichadas=[]; hecho.push('caja y fichajes'); }
  if(c('li_vou')){ DB.vouchers=[]; DB.paquetes=[]; hecho.push('vouchers y paquetes'); }
  if(c('li_esp')){ DB.espera=[]; DB.liquidaciones=[]; DB.log=[]; hecho.push('espera y liquidaciones'); }
  if(c('li_cli')){ DB.clientas=[]; hecho.push('clientas'); }
  if(c('li_blq')){ DB.bloqueos=[]; DB.excepciones=[]; hecho.push('bloqueos y ausencias'); }
  if(!hecho.length){ toast('No tildaste nada'); return; }
  /* si se borraron las clientas, no pueden quedar visitas colgadas */
  if(c('li_cli')) DB.visitas=[];

  toast('Listo, ya pueden cargar en serio');
}

function guardarServicio(id){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const n=document.getElementById('sn').value.trim();
  if(!n){ toast('Falta el nombre'); return; }
  const v=k=>+document.getElementById(k).value||0;
  const dur = v('s1')+v('s2')+v('s3');
  if(dur<=0){ toast('El servicio tiene que durar al menos unos minutos'); return; }
  if(v('sk')>100 || v('sk')<0){
    return confirmarConMotivo('Revisá la comisión',
      [`Pusiste ${v('sk')}% de comisión. Más de 100% significa pagarle a la profesional más de lo que cobra el negocio.`],
      'Guardarlo igual', m=>guardarServicioYa(id, m));
  }
  guardarServicioYa(id, '');
}
function guardarServicioYa(id, motivo){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const n=document.getElementById('sn').value.trim();
  const v=k=>+document.getElementById(k).value||0;
  const datos = {nombre:n, contado:v('sc'), comision:v('sk'),
    trabajo1:v('s1'), proceso:v('s2'), trabajo2:v('s3'),
    dur:v('s1')+v('s2')+v('s3'), simult:Math.max(1,v('ss'))};
  const man = document.getElementById('sm').checked;
  const areaEl = document.getElementById('sar');
  if(areaEl) datos.areaId = areaEl.value;
  if(motivo) datos.motivoRaro = motivo;
  if(id){
    const s=byId(DB.servicios,id); Object.assign(s, datos); s.precioManual=man;
    const sa=document.getElementById('sa'); if(sa) s.activo=sa.checked;
  }else{
    const s = {id:uid('sv'), areaId:ST.areaId, ...datos, precioManual:man, activo:true};
    DB.servicios.push(s);
    /* todas las profesionales del área quedan habilitadas */
    DB.asign.filter(a=>a.areaId===ST.areaId).forEach(a=>a.servicios.push(s.id));
  }
  logAcc(`Servicio ${id?'editado':'creado'}: ${n}`);
  save(); closeSheet(); render();
  toast(id?'Servicio actualizado':'Servicio creado y habilitado para todas');
}

  const d = {
    todo:'Ve y modifica todo el negocio', suc:'Solo lo de su sucursal',
    area:'Solo lo de su área', prop:'Solo lo suyo', ver:'Puede mirar pero no modificar',
    dia:'Solo el movimiento del día', no:'No tiene acceso', si:'Tiene acceso'
  };
  if(mk==='equipo' && v==='suc') return 'Ve y maneja horarios de toda su sucursal';
  if(mk==='equipo' && v==='area') return 'Ve y maneja horarios de su(s) área(s)';
  if(mk==='caja' && v==='todo') return 'Cobra, carga gastos y cierra caja';
  if(mk==='config' && v==='si') return 'Puede cambiar áreas, servicios, precios y permisos';
  return d[v]||'';
}
function setPermiso(rol, mk, v){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  DB.cfg.permisos[rol][mk]=v;
  logAcc(`Permiso ${ROLES[rol]} · ${mk} → ${v}`);
  save(); closeSheet(); render(); setTimeout(verPermisos,120);
}
function restaurarPermisos(){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  if(!confirm('¿Volver todos los permisos a como venían de fábrica?')) return;
  DB.cfg.permisos = JSON.parse(JSON.stringify(PERM_DEF));
  save(); closeSheet(); render(); toast('Permisos restaurados');
}

/* ---------- usuarios ---------- */
function vUsuarios(){
  return `<div class="pad">
    <button class="btn" style="margin-bottom:13px" onclick="editarUsuario()">${ic('plus','sm')} Agregar usuario</button>
    <div class="infobox">Cada persona entra con su usuario desde su propio celular.
    La recepcionista usa el del mostrador, y desde el botón de arriba a la derecha se cambia de usuario.</div>
    <div class="listcard">${DB.usuarios.map(u=>{
      const exc = Object.keys(u.permisos||{}).filter(k=>u.permisos[k]);
      const su = u.sucursalId?byId(DB.sucursales,u.sucursalId):null;
      const ar = nombreAreasDe(u);
      return `<button class="lr" onclick="editarUsuario('${u.id}')" ${u.activo?'':'style="opacity:.5"'}>
        <div class="av">${ini(u.nombre)}</div>
        <div class="g"><b>${esc(u.nombre)}${u.activo?'':' <span class="bd">Inactivo</span>'}</b>
          <span>${ROLES[u.rol]}${ar?' · '+esc(ar):''}${su?' · '+esc(su.nombre):''}</span>
          ${exc.length?`<span class="tiny" style="color:var(--warn)">${exc.length} permiso${exc.length>1?'s':''} distinto${exc.length>1?'s':''} al de su rol</span>`:''}</div>
        ${ic('chev','sm')}</button>`;}).join('')}</div>
  </div>`;
}
function editarUsuario(usId){
  const u = usId?byId(DB.usuarios,usId):null;
  sheet(u?'Editar '+u.nombre:'Usuario nuevo', `
    <div class="f"><label>Nombre y apellido</label><input id="un" value="${u?esc(u.nombre):''}"></div>
    <div class="f"><label>Rol</label>
      <select id="ur" onchange="camposUsuario()">
        ${Object.keys(ROLES).map(r=>`<option value="${r}" ${u&&u.rol===r?'selected':''}>${ROLES[r]}</option>`).join('')}
      </select></div>
    <div id="ucampos"></div>
    ${u?`<div class="chk"><input type="checkbox" id="ua" ${u.activo?'checked':''}>
      <div class="g"><b>Activo</b><span class="small muted">Si se va, desactivalo. No pierde nada del historial.</span></div></div>`:''}
    <button class="btn" style="margin-top:13px" onclick="guardarUsuario('${usId||''}')">Guardar</button>
    ${u?`<button class="btn sec" style="margin-top:8px" onclick="permisosDe('${usId}')">
      ${ic('lock','sm')} Permisos propios de ${esc(u.nombre.split(' ')[0])}</button>
    <button class="btn dan" style="margin-top:8px" onclick="borrarUsuario('${usId}')">${ic('trash','sm')} Borrar este usuario</button>`:''}`,
    {focus:'un'});
  setTimeout(()=>camposUsuario(usId),40);
}
function camposUsuario(usId){
  const u = usId?byId(DB.usuarios,usId):null;
  const r = document.getElementById('ur').value;
  const box = document.getElementById('ucampos');
  let html = '';
  if(r!=='duena' && r!=='admin'){
    html += `<div class="f"><label>Sucursal</label>
      <select id="us"><option value="">Todas</option>
        ${DB.sucursales.map(s=>`<option value="${s.id}" ${u&&u.sucursalId===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}
      </select></div>`;
  }
  if(r==='supervisora'){
    const mias = u?areasDeUsuario(u):[];
    html += `<div class="f"><label>Áreas que supervisa</label>
      <div class="small muted" style="margin:-3px 0 7px">Puede estar a cargo de más de un área.</div>
      <div class="card cardp" style="max-height:220px;overflow-y:auto">
        ${DB.areas.filter(a=>a.activa).map(a=>{const su=byId(DB.sucursales,a.sucursalId);
          return `<div class="chk"><input type="checkbox" class="uar" value="${a.id}" ${mias.includes(a.id)?'checked':''}>
            <div class="g"><b>${a.icono} ${esc(a.nombre)}</b><span class="small muted">${esc(su?su.nombre:'')}</span></div></div>`;}).join('')}
      </div></div>`;
  }
  if(r==='supervisora'||r==='profesional'){
    html += `<div class="f"><label>¿Con qué profesional se corresponde?</label>
      <select id="up"><option value="">Ninguna</option>
        ${DB.profesionales.filter(p=>p.activa).map(p=>`<option value="${p.id}" ${u&&u.profId===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}
      </select></div>`;
  }
  box.innerHTML = html;
}
function guardarUsuario(usId){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const n = document.getElementById('un').value.trim();
  if(!n){ toast('Falta el nombre'); return; }
  const g = k => (document.getElementById(k)||{}).value || null;
  const areas = [...document.querySelectorAll('.uar:checked')].map(x=>x.value);
  const d = {nombre:n, rol:document.getElementById('ur').value,
    sucursalId:g('us'), areas, areaId:areas[0]||null, profId:g('up')};
  if(d.rol==='supervisora' && !areas.length){ toast('Elegí al menos un área que supervise'); return; }
  if(usId){
    const u=byId(DB.usuarios,usId); Object.assign(u,d);
    const ua=document.getElementById('ua'); if(ua) u.activo=ua.checked;
  }else{
    DB.usuarios.push({id:uid('us'), ...d, permisos:{}, activo:true});
  }
  logAcc(`Usuario ${usId?'editado':'creado'}: ${n}`);
  save(); closeSheet(); render(); toast('Guardado');
}
function borrarUsuario(usId){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const u=byId(DB.usuarios,usId);
  if(usId===ST.usuarioId){ toast('No podés borrar el usuario con el que estás adentro'); return; }
  if(DB.usuarios.filter(x=>x.activo!==false && ['duena','admin'].includes(x.rol)).length<=1
     && ['duena','admin'].includes(u.rol) && u.activo!==false){
    toast('Tiene que quedar al menos una dueña o administración'); return;
  }
  sheet('Borrar usuario', `
    <div class="warnbox">${ic('alert','sm')} <b>${esc(u.nombre)}</b> deja de tener acceso al sistema.
      Los turnos que cargó y los cobros que hizo quedan como están.</div>
    <div class="infobox">Si solo se fue de vacaciones o dejó el puesto un tiempo, mejor
      destildá "Activo" en vez de borrarlo.</div>
    <button class="btn dan" onclick="hacerBorrarUsuario('${usId}')">Sí, borrar el acceso</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
}
function hacerBorrarUsuario(usId){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const u=byId(DB.usuarios,usId);
  DB.usuarios = DB.usuarios.filter(x=>x.id!==usId);
  logAcc(`Usuario borrado: ${u.nombre}`);
  save(); closeSheet(); render(); toast('Usuario borrado');
}
function permisosDe(usId){
  const u = byId(DB.usuarios,usId);
  const P = DB.cfg.permisos[u.rol];
  sheet('Permisos de '+u.nombre.split(' ')[0], `
    <div class="infobox">Por defecto usa los permisos de ${ROLES[u.rol]}.
    Acá le podés dar o sacar algo puntual solo a ${esc(u.nombre.split(' ')[0])},
    sin cambiarle el rol ni tocar a las demás.</div>
    ${MODULOS.map(m=>{
      const propio = u.permisos[m.k];
      return `<div class="f"><label>${m.n}</label>
        <select id="pu_${m.k}">
          <option value="">Usa el de su rol (${etiquetaPerm(m.k,P[m.k])})</option>
          ${m.vals.map(v=>`<option value="${v[0]}" ${propio===v[0]?'selected':''}>${v[1]}</option>`).join('')}
        </select></div>`;}).join('')}
    <button class="btn" onclick="guardarPermisosDe('${usId}')">Guardar</button>`);
}
function guardarPermisosDe(usId){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  const u = byId(DB.usuarios,usId);
  u.permisos = {};
  MODULOS.forEach(m=>{
    const v = document.getElementById('pu_'+m.k).value;
    if(v) u.permisos[m.k]=v;
  });
  logAcc(`Permisos propios de ${u.nombre} actualizados`);
  save(); closeSheet(); render(); toast('Guardado');
}

/* ============================================================
   RESPONSIVE: qué agenda se muestra
   ============================================================ */
const mq = window.matchMedia('(min-width:900px)');
function aplicarMQ(){
  const st = document.getElementById('mqstyle') || (()=>{
    const e=document.createElement('style'); e.id='mqstyle'; document.head.appendChild(e); return e; })();
  st.textContent = mq.matches
    ? '.solomovil{display:none}.soloancho{display:block}'
    : '.solomovil{display:block}.soloancho{display:none}';
}
mq.addEventListener('change', aplicarMQ);

/* ============================================================
   ARRANQUE
   ============================================================ */
load();
migrar();
save();
aplicarMQ();
render();
</script>
