    nacimiento:document.getElementById('nb').value, notas:'', alta:hoy()};
  DB.clientas.push(c); save();
  elegidaClienta(c.id);
}
function pasoServicio(){
  const areas = areasDeSucursal();
  const svs = DB.servicios.filter(s=>s.areaId===NT.areaId && s.activo);
  const cl = NT.clientaId ? byId(DB.clientas, NT.clientaId) : null;
  const p0 = NT.profId ? byId(DB.profesionales, NT.profId) : null;
  sheet('¿Qué servicio?', `
    ${cl?`<div class="card cardp" style="margin-bottom:11px;display:flex;align-items:center;gap:11px">
      <div class="av">${ini(cl.nombre)}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">${esc(cl.nombre)}</div>
      <div class="small muted">${fechaCorta(ST.fecha)}</div></div></div>`:''}
    ${(p0&&NT.hora)?`<div class="infobox">Turno de las ${NT.hora} con ${esc(p0.nombre.split(' ')[0])}. Elegí el servicio.</div>`:''}
    <div class="subtabs" style="padding:0 0 12px">
      ${areas.map(a=>`<button class="ptab ${a.id===NT.areaId?'on':''}"
        onclick="NT.areaId='${a.id}';NT.profId=null;pasoServicio()">${a.icono} ${esc(a.nombre)}</button>`).join('')}
    </div>
    <div class="listcard">${svs.map(s=>`
      <button class="lr" onclick="NT.servicioId='${s.id}';pasoProfesional()">
        <div class="g"><b>${esc(s.nombre)}</b>
          <span>${s.dur} min${s.proceso>0?` · ${s.trabajo1}′+${s.proceso}′ proceso+${s.trabajo2}′`:''}${s.simult>1?' · hasta '+s.simult+' a la vez':''}</span></div>
        <div class="r"><b>${money(s.contado)}</b><br><span class="tiny">lista ${money(precioLista(s.contado))}</span></div>
      </button>`).join('')}</div>`);
}
function pasoProfesional(){
  const cl=NT.clientaId?byId(DB.clientas,NT.clientaId):null, sv=byId(DB.servicios,NT.servicioId);
  /* si se tocó un hueco o una celda de la agenda, la profesional y la hora YA están elegidas:
     solo faltaba la clienta y el servicio. Si entra, el turno se carga solo.
     Si no entra, el sistema dice exactamente qué pasa y deja forzarlo con un motivo. */
  if(NT.profId && NT.hora){
    const p0 = byId(DB.profesionales, NT.profId);
    const hace = profesDe(NT.areaId, NT.servicioId).some(x=>x.id===NT.profId);
    if(hace){
      if(!hayQueForzar(NT.profId, NT.areaId, ST.fecha, NT.hora, NT.servicioId))
        return elegirTurno(NT.profId, NT.hora);
      const av = avisosDeTurno(NT.profId, NT.areaId, ST.fecha, mh(NT.hora), sv.dur);
      return confirmarConMotivo(
        esc(sv.nombre)+' a las '+NT.hora,
        av.length?av:['A las '+NT.hora+' no entra '+sv.nombre+' con '+(p0?p0.nombre.split(' ')[0]:'ella')+'.'],
        'Cargarlo igual a las '+NT.hora,
        m=>{ NT.motivo=m; trasElegirHorario(); },
        {texto:'Ver horarios libres', accion:"NT.profId=null;NT.hora=null;pasoProfesional()"});
    }
    NT.aviso = (p0?p0.nombre.split(' ')[0]:'Esa profesional')+' no tiene habilitado '+sv.nombre+'. Elegí a otra.';
    NT.profId=null; NT.hora=null;
  }
  const aviso = NT.aviso; NT.aviso=null;
  const profes = profesDe(NT.areaId, NT.servicioId);
  const todos = profes.map(p=>({p, hs:huecos(p.id, NT.areaId, ST.fecha, NT.servicioId)}));
  const conHueco = todos.filter(x=>x.hs.length);
  const sin = todos.length - conHueco.length;

  sheet('¿Cuándo y con quién?', `
    <div class="card cardp" style="margin-bottom:11px;display:flex;align-items:center;gap:11px">
      ${cl?`<div class="av">${ini(cl.nombre)}</div>`:''}
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:15.5px">${cl?esc(cl.nombre):esc(sv.nombre)}</div>
        <div class="small muted">${cl?esc(sv.nombre)+' · ':''}${sv.dur} min · ${money(sv.contado)} contado</div>
      </div>
      <button class="btn sm sec" onclick="pasoServicio()">Cambiar</button>
    </div>
    ${aviso?`<div class="warnbox">${ic('alert','sm')} ${esc(aviso)}</div>`:''}
    ${(cl&&cl.notas)?`<div class="warnbox">${ic('alert','sm')} ${esc(cl.notas)}</div>`:''}

    <div class="daybar" style="border:1px solid var(--line);border-radius:11px;margin-bottom:14px">
      <button onclick="ST.fecha=addDays(ST.fecha,-1);pasoProfesional()">${ic('left')}</button>
      <b>${ST.fecha===hoy()?'Hoy · ':''}${fechaCorta(ST.fecha)}</b>
      ${ST.fecha!==hoy()?`<button class="btn sm sec" style="padding:5px 10px"
        onclick="ST.fecha=hoy();pasoProfesional()">Hoy</button>`:''}
      <button onclick="ST.fecha=addDays(ST.fecha,1);pasoProfesional()">${ic('right')}</button>
    </div>

    ${conHueco.length?conHueco.map(({p,hs})=>`
      <div style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
          <div class="av" style="width:30px;height:30px;font-size:11.5px">${ini(p.nombre)}</div>
          <b style="font-size:14.5px">${esc(p.nombre)}</b>
          <span class="tiny muted" style="margin-left:auto">${hs.length} libres</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px">
          ${hs.slice(0,8).map(hh=>`<button class="pill" onclick="elegirTurno('${p.id}','${hh}')">${hh}</button>`).join('')}
          ${hs.length>8?`<button class="pill" style="color:var(--acc);font-weight:700"
            onclick="pasoHorario('${p.id}')">+${hs.length-8}</button>`:''}
        </div>
      </div>`).join('')
    :(()=>{ const pr = primerHueco(NT.areaId, NT.servicioId, 21);
        return `<div class="empty" style="padding:20px 10px">Nadie tiene lugar el ${fechaCorta(ST.fecha)} para ${esc(sv.nombre)}.</div>
        ${pr?`<button class="btn" onclick="ST.fecha='${pr.fecha}';pasoProfesional()">El primer lugar es ${pr.fecha===hoy()?'hoy':fechaCorta(pr.fecha)} a las ${pr.hora}, con ${esc(pr.prof.nombre.split(' ')[0])}</button>`
            :`<div class="small muted center">Tampoco hay lugar en las próximas 3 semanas.</div>`}
        <button class="btn sec" style="margin-top:8px" onclick="anotarEnEspera()">Anotar en lista de espera</button>`;})()}

    ${sin?`<div class="small muted" style="margin-top:4px">${sin} profesional${sin>1?'es':''} sin lugar este día.</div>`:''}
  `);
}
/* tocar un horario carga el turno directo: sin pantalla de confirmación */
function elegirTurno(pid, hora){
  NT.profId=pid; NT.hora=hora;
  trasElegirHorario();
}
function trasElegirHorario(){
  if(!NT.clientaId){ pasoCliente(); return; }
  preGuardarTurno();
}
/* Dos visitas el mismo día son DOS VISITAS: ojos a las 10 y manicuría a las 18 se
   cobran por separado, con su propia seña y su propio saldo. El sistema pregunta. */
function preGuardarTurno(){
  if(NT.visitaId){ guardarTurno(); return; }
  const previas = DB.visitas.filter(v=>v.clientaId===NT.clientaId && v.fecha===ST.fecha
    && v.sucursalId===ST.sucursalId && v.lineas.some(l=>l.estado!=='can'));
  if(!previas.length){ guardarTurno(); return; }
  const cl = byId(DB.clientas, NT.clientaId);
  sheet('Ya tiene turno ese día', `
    <div class="infobox">${esc(cl.nombre.split(' ')[0])} ya tiene ${previas.length===1?'una visita':previas.length+' visitas'}
      el ${fechaCorta(ST.fecha)}. Cada visita se cobra aparte, con su propia seña y su propio saldo.</div>
    <div class="listcard">${previas.map(v=>{
      const ls=v.lineas.filter(l=>l.estado!=='can').sort((a,b)=>mh(a.hora)-mh(b.hora));
      return `<button class="lr" onclick="NT.visitaId='${v.id}';guardarTurno()">
        <div class="av">${ls[0].hora.slice(0,2)}</div>
        <div class="g"><b>Agregar a la visita de las ${ls[0].hora}</b>
          <span>${ls.map(l=>esc(byId(DB.servicios,l.servicioId).nombre)).join(' · ')}</span>
          ${puedeVerPrecios()?`<span class="tiny">${saldoVisita(v)>0?'Debe '+money(saldoVisita(v)):'Pago al día'}</span>`:''}</div>
        ${ic('chev','sm')}</button>`;}).join('')}</div>
    <div class="sep"></div>
    <button class="btn" onclick="NT.visitaId=null;guardarTurno()">${ic('plus','sm')} Crear una visita nueva</button>`);
}
function pasoHorarioCualquiera(){
  const profes = profesDe(NT.areaId, NT.servicioId);
  const todos=[];
  profes.forEach(p=>huecos(p.id,NT.areaId,ST.fecha,NT.servicioId).forEach(h=>todos.push({h,p})));
  todos.sort((a,b)=>mh(a.h)-mh(b.h));
  sheet('Primeros turnos libres', `
    ${todos.length?`<div class="listcard">${todos.slice(0,24).map(x=>`
      <button class="lr" onclick="elegirTurno('${x.p.id}','${x.h}')">
        <div class="g"><b>${x.h}</b><span>${esc(x.p.nombre)}</span></div>${ic('chev','sm')}</button>`).join('')}</div>`
      :`<div class="empty">No hay horarios libres este día.</div>
        <button class="btn sec" onclick="anotarEnEspera()">Anotar en lista de espera</button>`}`);
}
function pasoHorario(pid){
  if(pid) NT.profId=pid;
  const hs = huecos(NT.profId, NT.areaId, ST.fecha, NT.servicioId);
  const p = byId(DB.profesionales, NT.profId);
  sheet('Horarios de '+p.nombre.split(' ')[0], `
    <div class="small muted" style="margin-bottom:11px">${esc(p.nombre)} · ${fechaCorta(ST.fecha)}</div>
    ${hs.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px">
      ${hs.map(x=>`<button class="pill" onclick="elegirTurno('${NT.profId}','${x}')">${x}</button>`).join('')}

/* ============================================================
   EL DÍA — lo que hay que atender AHORA, con el botón al lado.
   Es la pantalla de inicio. Antes un servicio de punta a punta
   eran 10 toques buscando el turno en la grilla cada vez.
   Cada una ve lo de su rango: recepción su sucursal, la
   supervisora sus áreas, la profesional lo suyo (solo mirar).
   ============================================================ */
function filaDelDia({v,l,acc,urg}){
  const cl=byId(DB.clientas,v.clientaId), sv=byId(DB.servicios,l.servicioId)||{};
  const pr=byId(DB.profesionales,l.profId);
  const puede = acc.k==='cobrar' ? puedeCobrar() : puedeMarcarEstado(l, acc.k);
  return `<div class="ahr ${urg?'n':''}">
    <div class="hh2">${l.hora}</div>
    <button class="g2" onclick="abrirTurno('${v.id}','${l.id}')">
      <b>${esc(cl?cl.nombre:'—')}</b>
      <span>${esc(sv.nombre||'')}${pr?' · '+esc(pr.nombre.split(' ')[0]):''}</span>
    </button>
    ${puede
      ? `<button class="btn xs ${acc.c}" onclick="${acc.k==='cobrar'?`cobrar('${v.id}')`:`cambiarEstado('${v.id}','${l.id}','${acc.k}',0)`}">${acc.t}</button>`
      : `<span class="bd"><i class="dot d-${l.estado}"></i> ${EST[l.estado].n}</span>`}
  </div>`;
}
function elDia(){
  if(!puedeVerAgenda()) return '';
  const H = hoy(), now = ahoraMin();
  /* TRES grupos, que son las tres cosas que pasan en el mostrador:
     la que está esperando para pagar, la que está adentro atendiéndose,
     y la que está por entrar por la puerta. En una sola lista, la que
     acaba de llegar queda tapada abajo de las de la mañana. */
  const cobrar = [], dentro = [], llegando = [];
  DB.visitas.filter(v=>v.fecha===H).forEach(v=>{
    const saldo = saldoVisita(v);
    v.lineas.forEach(l=>{
      if(l.estado==='can') return;
      if(!turnoVisibleEnAgenda(l,v)) return;
      if(l.estado==='serv'){ dentro.push({v,l,acc:{k:'fin',t:'Terminar',c:'fin'},urg:true}); }
      else if(l.estado==='lleg'){ dentro.push({v,l,acc:{k:'serv',t:'Empezar',c:'serv'},urg:true}); }
      else if(l.estado==='fin' && saldo>0 && puedeCobrar()){
        cobrar.push({v,l,acc:{k:'cobrar',t:'Cobrar '+money(saldo),c:'pay'},urg:true}); }
      else if(l.estado==='res' || l.estado==='conf'){
        const dif = mh(l.hora) - now;
        /* "llegando" es de verdad: media hora tarde o una hora antes.
           La de hace dos horas no está llegando, no vino. */
        if(dif > 60 || dif < -30) return;
        llegando.push({v,l,acc:{k:'lleg',t:'Llegó',c:'lleg'},urg:dif<=0});
      }
    });
  });
  const porHora=(a,b)=>mh(a.l.hora)-mh(b.l.hora);
  cobrar.sort(porHora); dentro.sort(porHora); llegando.sort(porHora);
  const total = cobrar.length+dentro.length+llegando.length;
  if(!total) return `<div class="card cardp" style="margin-bottom:13px">
    <div class="small muted">No hay nada para atender en este momento. Lo de más tarde está en la agenda.</div></div>`;
  const TOPE = 6;
  const resto = Math.max(0,cobrar.length-TOPE)+Math.max(0,dentro.length-TOPE)+Math.max(0,llegando.length-TOPE);
  const grupo = (titulo, arr) => arr.length
    ? `<div class="ahsep">${titulo}${arr.length>TOPE?' · '+arr.length:''}</div>${arr.slice(0,TOPE).map(filaDelDia).join('')}`
    : '';
  return `<div class="ahorabox">
    ${grupo('Esperando para pagar', cobrar)}
    ${grupo('En el local', dentro)}
    ${grupo('Llegando', llegando)}
    ${resto?`<button class="ahr" style="justify-content:center;color:var(--acc);font-weight:700;font-size:13px"
      onclick="go('agenda')">Ver los ${resto} que faltan, en la agenda</button>`:''}
  </div>`;
}

/* ============================================================
   ¿QUIÉN ESTÁ LIBRE AHORA? — llega una sin turno.
   Antes había que recorrer las pestañas de área una por una
   buscando un rectángulo verde en la grilla.
   ============================================================ */
function quienEstaLibre(){
  if(!puedeEditarAgenda()){ toast('No podés cargar turnos'); return; }
  const now = ahoraMin(), F = hoy(), out = [];
  areasDeSucursal().forEach(ar=>{
    profesDelDia(ar.id, F).forEach(p=>{
      huecosLibres(p.id, ar.id, F).forEach(([a,bb])=>{
        if(bb <= now+10) return;
        const desde = Math.max(a, now);
        if(desde > now+45) return;          /* libre ya, o en la próxima media hora */
        if(bb - desde < 15) return;
        out.push({p, ar, desde, hasta:bb});
      });
    });
  });
  out.sort((x,y)=> x.desde-y.desde || (y.hasta-y.desde)-(x.hasta-x.desde));
  sheet('¿Quién está libre ahora?', out.length
    ? `<div class="small muted" style="margin-bottom:10px">Son las ${horaAhora()}. Tocá a una y se carga el turno directo.</div>
       <div class="listcard">${out.map(o=>`
       <button class="lr" onclick="closeSheet();ST.areaId='${o.ar.id}';nuevoTurno('${o.p.id}','${hm(Math.ceil(o.desde/15)*15)}')">
         <div class="av">${ini(o.p.nombre)}</div>
         <div class="g"><b>${esc(o.p.nombre)}</b>
           <span>${o.ar.icono} ${esc(o.ar.nombre)} · ${o.desde<=now?'libre ya':'libre desde '+hm(o.desde)} hasta ${hm(o.hasta)}</span></div>
         <div class="r"><b style="color:var(--freetx);font-size:13px">${durTxt(o.hasta-o.desde)}</b></div>
       </button>`).join('')}</div>`
    : `<div class="empty">En este momento están todas ocupadas.</div>
       <button class="btn sec" onclick="closeSheet();cuandoHayLugar()">Ver cuándo hay lugar</button>`);
}

/* ============================================================
   ¿CUÁNDO HAY LUGAR? — la pregunta más común del teléfono.
   El sistema siempre supo la respuesta; ahora la dice.
   ============================================================ */
function primerHueco(areaId, servicioId, diasMax){
  const now = ahoraMin();
  for(let d=0; d<diasMax; d++){
    const F = addDays(hoy(), d);
    let mejor = null;
    profesDe(areaId, servicioId).forEach(p=>{
      huecos(p.id, areaId, F, servicioId).forEach(h=>{
        if(d===0 && mh(h) < now+15) return;
        if(!mejor || mh(h) < mh(mejor.hora)) mejor = {fecha:F, hora:h, prof:p};
      });
    });
    if(mejor) return mejor;
  }
  return null;
}
function cuandoHayLugar(areaId){
  if(!puedeEditarAgenda()){ toast('No podés cargar turnos'); return; }
  const areas = areasDeSucursal();
  if(!areas.length){ toast('Esta sucursal no tiene áreas'); return; }
  const aid = areaId || ((ST.areaId && ST.areaId!=='__dia' && areas.some(a=>a.id===ST.areaId)) ? ST.areaId : areas[0].id);
  const svs = DB.servicios.filter(x=>x.areaId===aid && x.activo);
  const filas = svs.map(x=>({s:x, h:primerHueco(aid, x.id, 21)}));
  sheet('¿Cuándo hay lugar?', `
    <div class="subtabs" style="padding:0 0 12px">
      ${areas.map(a=>`<button class="ptab ${a.id===aid?'on':''}"
        onclick="cuandoHayLugar('${a.id}')">${a.icono} ${esc(a.nombre)}</button>`).join('')}
    </div>
    <div class="listcard">${filas.map(({s,h})=> h
      ? `<button class="lr" onclick="tomarHueco('${aid}','${s.id}','${h.fecha}','${h.hora}','${h.prof.id}')">
           <div class="g"><b>${esc(s.nombre)}</b>
             <span>${esc(h.prof.nombre.split(' ')[0])} · ${s.dur} min${puedeVerPrecios()?' · '+money(s.contado):''}</span></div>
           <div class="r"><b style="font-size:13px;color:var(--ink)">${h.fecha===hoy()?'HOY':fechaCorta(h.fecha)}</b>
             <div style="font-size:13px">${h.hora}</div></div>
         </button>`
      : `<div class="lr"><div class="g"><b>${esc(s.nombre)}</b>
           <span>Sin lugar en las próximas 3 semanas</span></div></div>`).join('')}</div>`);
}
/* tocar un primer lugar arranca el turno ahí mismo: solo falta la clienta */
function tomarHueco(aid, sid, fecha, hora, pid){

/* ============================================================
   BUSCADOR DE LA AGENDA
   Encontrar a una clienta sin saber que dia tiene el turno ni
   recorrer la grilla. Busca en TODOS los dias, respetando lo que
   cada rol puede ver: la profesional solo encuentra lo suyo y la
   supervisora solo sus areas.
   ============================================================ */
function turnoVisibleEnAgenda(l, v){
  if(v.sucursalId!==ST.sucursalId) return false;
  const p = perm('agenda');
  if(p==='no') return false;
  if(p==='prop'){ const u=usuario(); return !!u && l.profId===u.profId; }
  if(p==='area') return areasDeUsuario().includes(l.areaId);
  return true;
}
function buscarAgenda(){
  if(!puedeVerAgenda()){ toast('No tenés acceso a la agenda'); return; }
  sheet('Buscar un turno', `
    <div class="f"><input id="aq" placeholder="Nombre de la clienta${puedeVerTelefono()?', teléfono':''} o servicio"
      oninput="pintarBusqAgenda(this.value)" autocomplete="off"></div>
    <div id="ares">${busqAgendaHTML('')}</div>`, {focus:'aq'});
}
function busqAgendaHTML(q){
  const t = (q||'').toLowerCase().trim();
  if(t.length<2) return `<div class="small muted" style="padding:2px 2px 8px">Escribí al menos dos letras. Busca en todos los días, no solo en el que estás mirando.</div>`;
  const H = hoy(), out = [];
  DB.visitas.forEach(v=>{
    const cl = byId(DB.clientas, v.clientaId); if(!cl) return;
    v.lineas.forEach(l=>{
      if(!turnoVisibleEnAgenda(l,v)) return;
      const sv = byId(DB.servicios, l.servicioId) || {};
      const pr = byId(DB.profesionales, l.profId) || {};
      const heno = (cl.nombre+' '+(puedeVerTelefono()?(cl.tel||''):'')+' '+(sv.nombre||'')+' '+(pr.nombre||'')).toLowerCase();
      if(!heno.includes(t)) return;
      out.push({v,l,cl,sv,pr});
    });
  });
  if(!out.length) return `<div class="empty">No hay ningún turno que coincida.</div>`;
  /* primero lo que viene, despues lo que ya paso */
  out.sort((a,b)=>{
    const pa = a.v.fecha < H, pb = b.v.fecha < H;
    if(pa!==pb) return pa?1:-1;
    if(a.v.fecha!==b.v.fecha) return pa ? (a.v.fecha<b.v.fecha?1:-1) : (a.v.fecha<b.v.fecha?-1:1);
    return mh(a.l.hora)-mh(b.l.hora);
  });
  const ver = out.slice(0,30);
  return `<div class="listcard">${ver.map(({v,l,cl,sv,pr})=>{
    const e = EST[l.estado] || {n:'', c:'e-fin'};
    return `<button class="lr" onclick="irAlTurno('${v.id}','${l.id}')">
      <div class="av">${ini(cl.nombre)}</div>
      <div class="g"><b>${esc(cl.nombre)}</b>
        <span>${esc(sv.nombre||'')}${pr.nombre?' · '+esc(pr.nombre.split(' ')[0]):''}</span>
        <span class="tiny"><span class="dot d-${l.estado}"></span> ${e.n}</span></div>
      <div class="r"><b style="font-size:12.5px;color:var(--ink)">${v.fecha===H?'HOY':fechaCorta(v.fecha)}</b>
        <div style="font-size:12.5px">${l.hora}</div></div>
    </button>`;}).join('')}</div>
    ${out.length>30?`<div class="small muted" style="padding:10px 2px 0">Hay ${out.length-30} más. Escribí un poco más para afinar.</div>`:''}`;
}
function pintarBusqAgenda(q){
  const e = document.getElementById('ares'); if(e) e.innerHTML = busqAgendaHTML(q);
}

/* ============================================================
   RECEPCIÓN RÁPIDA
   ============================================================ */
function recepcionRapida(){
  sheet('Recepción rápida', `
    <div class="f"><input id="rq" placeholder="Escribí el nombre de la clienta"
      oninput="pintarRecepcion(this.value)" autocomplete="off"></div>
    <div id="rres">${recepcionHTML('')}</div>`, {focus:'rq'});
}
function recepcionHTML(q){
  const t=q.toLowerCase().trim();
  const hoyVs = DB.visitas.filter(v=>v.fecha===hoy() && v.sucursalId===ST.sucursalId);
  let res, cabecera='';
  if(t){
    res = hoyVs.filter(v=>byId(DB.clientas,v.clientaId).nombre.toLowerCase().includes(t));
  }else{
    /* sin escribir nada, muestra las que están llegando ahora */
    const ahora = ahoraMin();
    res = hoyVs.filter(v=>v.lineas.some(l=>l.estado!=='can' &&
      mh(l.hora) > ahora-45 && mh(l.hora) < ahora+90));
    cabecera = `<div class="small muted" style="margin-bottom:9px">Las que están llegando ahora. Escribí un nombre para buscar otra.</div>`;
    if(!res.length){
      /* fuera del horario de atención muestra las que todavía no llegaron */
      res = hoyVs.filter(v=>v.lineas.some(l=>['res','conf'].includes(l.estado)));
      cabecera = res.length?`<div class="small muted" style="margin-bottom:9px">Turnos de hoy que todavía no llegaron.</div>`:'';
    }
    res.sort((a,b)=>mh(a.lineas[0].hora)-mh(b.lineas[0].hora));
  }
  if(!res.length) return `<div class="empty">${t?'Ninguna clienta con ese nombre tiene turno hoy.'
    :'No hay nadie llegando en este rato. Escribí un nombre para buscar.'}</div>`;
  return cabecera + res.map(v=>{
    const c=byId(DB.clientas,v.clientaId);
    const ls=v.lineas.filter(l=>l.estado!=='can');
    const otrasV = DB.visitas.filter(x=>x.id!==v.id && x.clientaId===v.clientaId
      && x.fecha===v.fecha && x.sucursalId===v.sucursalId && x.lineas.some(l=>l.estado!=='can')).length;
    const saldo=saldoVisita(v);
    const todosLlegaron = ls.every(l=>['lleg','serv','fin'].includes(l.estado));
    return `<div class="card cardp" style="margin-bottom:9px">
      <div style="display:flex;gap:11px;align-items:flex-start">
        <div class="av">${ini(c.nombre)}</div>
        <div style="flex:1;min-width:0">
          <b style="font-size:16px">${esc(c.nombre)}</b>
          ${otrasV?`<div class="tiny" style="color:var(--acc);font-weight:700">Tiene ${otrasV} visita${otrasV>1?'s':''} más ese día, se cobran aparte</div>`:''}
          ${ls.map(l=>`<div class="small muted">${l.hora} · ${esc(byId(DB.servicios,l.servicioId).nombre)} · ${esc(byId(DB.profesionales,l.profId).nombre.split(' ')[0])}
            <i class="dot d-${l.estado}" style="display:inline-block;margin-left:4px"></i></div>`).join('')}
          ${puedeVerPrecios()?(saldo>0?`<div class="small" style="color:var(--warn);margin-top:3px">Debe ${money(saldo)}</div>`
                   :`<div class="small" style="color:var(--ok);margin-top:3px">Pago al día</div>`):''}
        </div>
      </div>
      ${c.notas?`<div class="warnbox" style="margin:11px 0 0">${esc(c.notas)}</div>`:''}
      ${puedeVerNotasInternas()&&c.notasInt?`<div class="infobox" style="margin:9px 0 0">${ic('lock','sm')} ${esc(c.notasInt)}</div>`:''}
      <div class="btns">
        ${!todosLlegaron?`<button class="btn lleg" onclick="marcarLlegada('${v.id}')">Llegó</button>`:''}
        ${saldo>0?`<button class="btn pay" onclick="cobrar('${v.id}')">${ic('cash','sm')} Cobrar ${money(saldo)}</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function pintarRecepcion(q){ document.getElementById('rres').innerHTML = recepcionHTML(q); }
function marcarLlegada(vid){
  const v=byId(DB.visitas,vid);
  v.lineas.forEach(l=>{ if(['res','conf'].includes(l.estado)) l.estado='lleg'; });
  logAcc(`Llegó: ${byId(DB.clientas,v.clientaId).nombre}`);

const CO = {vid:null, medio:'efectivo', pagos:[]};
function cobrar(vid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  CO.vid=vid; CO.medio='efectivo';
  pintarCobro();
}
function pintarCobro(){
  const v=byId(DB.visitas,CO.vid), cl=byId(DB.clientas,v.clientaId);
  const todas=v.lineas.filter(l=>l.estado!=='can');
  const M=MEDIOS.find(m=>m.k===CO.medio);
  const desc = todas.filter(l=>!cubierta(l)).reduce((s,l)=>s+(l.descuento||0),0);
  const total = totalVisita(v);          /* en precio de CONTADO, ya con descuentos */
  const pagado = pagadoVisita(v);        /* contado que ya quedó cubierto */
  const entro  = cobradoVisita(v);       /* plata que entró, con recargos incluidos */
  const saldo = total - pagado;          /* lo que falta, en contado */
  const aCobrar = aCobrarCon(Math.max(0,saldo), CO.medio);

  sheet('Cobrar a '+cl.nombre, `
    <div class="card cardp" style="margin-bottom:13px">
      ${todas.map(l=>{const c=cubierta(l);
        return `<div class="kv">
        <span>${esc(byId(DB.servicios,l.servicioId).nombre)}<br>
          <span class="tiny muted">${esc(byId(DB.profesionales,l.profId).nombre)}</span></span>
        ${c?`<b style="color:var(--ok);font-size:12.5px">${c==='Paquete'?(()=>{const pq=byId(DB.paquetes,l.paqueteId);
              return pq?`Paquete · sesión ${l.consumida?pq.usadas:pq.usadas+1} de ${pq.total}`:'Paquete';})():'Voucher'}<br>
            <span class="tiny muted">ya estaba pago</span></b>`
          :`<b>${money(l.precio)}</b>`}</div>`;}).join('')}
      ${desc?`<div class="kv"><span style="color:var(--stop)">Descuento</span><b style="color:var(--stop)">− ${money(desc)}</b></div>`:''}
      <div class="tot"><span>Total de contado</span><span>${money(total)}</span></div>
      ${pagado?`<div class="kv" style="margin-top:8px"><span class="muted">Ya cubierto</span><b>${money(pagado)}</b>
        </div><div class="kv"><span class="muted">Entró a la caja</span><b>${money(entro)}</b></div>
        <div class="kv"><span class="muted">Falta (de contado)</span><b style="color:var(--warn)">${money(saldo)}</b></div>`:''}
    </div>

    <label>¿Con qué paga esta parte?</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin-bottom:6px">
      ${MEDIOS.map(m=>`<button class="pill ${m.k===CO.medio?'on':''}"
        onclick="CO.medio='${m.k}';pintarCobro()">${m.n}</button>`).join('')}
    </div>
    <div class="${M.rec?'warnbox':'okbox'}" style="margin-top:10px">
      ${M.rec
        ? `Por los ${money(saldo)} que faltan, con ${M.n.toLowerCase()} hay que cobrar <b>${money(aCobrar)}</b>
           (recargo del ${DB.cfg.recargo}%). El recargo se aplica solo a esta parte, no a lo que ya se pagó.`
        : `Efectivo: precio de contado, sin recargo. Faltan <b>${money(saldo)}</b>.`}
    </div>

    ${total<=0?`<div class="okbox">No hay nada que cobrar: está todo cubierto por paquete o voucher.</div>`:''}
    <div class="f"><label>Importe a cobrar ahora</label>
      <input type="number" id="imp" value="${Math.max(0,Math.round(aCobrar))}" inputmode="numeric"></div>

    <div class="btns">
      <button class="btn pay" onclick="registrarPago('total')">${ic('cash','sm')} Cobrar</button>
      <button class="btn sec" onclick="registrarPago('sena')">Es una seña</button>
    </div>
    <div class="btns">
      ${puedeDescuentos()?`<button class="btn sec" onclick="ponerDescuento('${v.id}')">Hacer un descuento</button>`:''}
      <button class="btn sec" onclick="canjearVoucher('${v.id}')">${ic('gift','sm')} Canjear voucher</button>
    </div>
    ${v.pagos.length?`<div class="h3">Ya cobrado</div>
      <div class="listcard">${v.pagos.map(p=>{
        const m=MEDIOS.find(x=>x.k===p.medio);
        const cu=(p.contado!=null?p.contado:p.importe);
        return `<div class="lr">
        <div class="g"><b>${money(p.importe)}</b>
          <span>${m.n} · ${p.tipo==='sena'?'Seña':'Pago'} · ${esc(p.usuario)}</span>
          ${m.rec?`<span class="tiny">cubre ${money(cu)} de contado</span>`:''}
          ${p.motivo?`<span class="tiny" style="color:var(--warn)">${esc(p.motivo)}</span>`:''}</div>
        <button class="btn sm sec" onclick="borrarPago('${v.id}','${p.id}')">${ic('trash','sm')}</button>
      </div>`;}).join('')}</div>`:''}`);
}
function registrarPago(tipo){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,CO.vid);
  const M=MEDIOS.find(m=>m.k===CO.medio);
  const imp = +document.getElementById('imp').value;
  if(!imp || imp<=0){ toast('Poné un importe'); return; }
  const saldo = saldoVisita(v);
  const sug = aCobrarCon(Math.max(0,saldo), CO.medio);
  /* cuánto del precio de contado cubre esta plata */
  const contado = M.rec
    ? (imp===sug ? saldo : Math.round(imp/(1+(DB.cfg.recargo||0)/100)))
    : imp;
  if(contado - saldo > 0.5){
    return confirmarConMotivo('Está cobrando de más',
      [`Falta ${money(Math.max(0,saldo))} de contado y este pago cubre ${money(contado)}.`,
       `Quedarían ${money(contado-saldo)} a favor de la clienta.`],
      'Cobrar igual', m=>hacerPago(tipo, imp, contado, m));
  }
  hacerPago(tipo, imp, contado, '');
}
function hacerPago(tipo, imp, contado, motivo){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,CO.vid);
  v.pagos.push({id:uid('pa'), importe:imp, contado, medio:CO.medio, tipo,
    fecha:hoy(), usuario:usuario().nombre, motivo:motivo||''});
  logAcc(`Cobro ${money(imp)} (${CO.medio}) a ${byId(DB.clientas,v.clientaId).nombre}${motivo?' — '+motivo:''}`);
  save();
  if(saldoVisita(v)<=0){ closeSheet(); render(); toast('Cobrado. Cuenta saldada.'); }
  else { pintarCobro(); toast('Pago registrado'); }
}
function borrarPago(vid,pid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const v=byId(DB.visitas,vid);
  v.pagos = v.pagos.filter(p=>p.id!==pid);
  save(); pintarCobro(); toast('Pago borrado');
}
function ponerDescuento(vid){
  if(!puedeDescuentos()){ toast('No tenés permiso para hacer descuentos'); return; }
  const v=byId(DB.visitas,vid);
  const ls=v.lineas.filter(l=>l.estado!=='can');
  sheet('Descuento', `
    <div class="infobox">Queda registrado quién lo hizo. La comisión de la profesional no se toca:
    se sigue calculando sobre el precio de contado completo.</div>
    ${ls.map(l=>`<div class="f">
      <label>${esc(byId(DB.servicios,l.servicioId).nombre)} — contado ${money(l.precio)}</label>
      <input type="number" id="d_${l.id}" value="${l.descuento||0}" inputmode="numeric" placeholder="0"></div>`).join('')}
    <button class="btn" onclick="guardarDescuento('${vid}')">Aplicar descuento</button>`);
}
function guardarDescuento(vid){
  const v=byId(DB.visitas,vid);
  const cambios=[]; const excede=[];
  v.lineas.filter(l=>l.estado!=='can').forEach(l=>{
    const e=document.getElementById('d_'+l.id); if(!e) return;
    const d=+e.value||0;
    cambios.push({id:l.id, d});
    if(d>l.precio) excede.push(`${byId(DB.servicios,l.servicioId).nombre}: descuento de ${money(d)} sobre un precio de ${money(l.precio)}.`);
    else if(d<0) excede.push(`${byId(DB.servicios,l.servicioId).nombre}: el descuento no puede ser negativo.`);
  });
  const aplicar = (motivo)=>{
    cambios.forEach(({id,d})=>{ const l=byId(v.lineas,id); l.descuento=d; l.motivoDesc=motivo||''; });
    logAcc(`Descuento a ${byId(DB.clientas,v.clientaId).nombre} por ${usuario().nombre}${motivo?' — '+motivo:''}`);
    save();
    if(puedeCobrar() && CO.vid===vid) pintarCobro(); else { closeSheet(); render(); }
    toast('Descuento aplicado');
  };
  if(excede.length) return confirmarConMotivo('Revisá el descuento', excede, 'Aplicarlo igual', aplicar);
  aplicar('');
}

/* profesionales que trabajan en alguna área de la sucursal elegida */
function profesDeSucursal(){
  const areasS = areasDeSucursal();
  const ids = [...new Set(DB.asign.filter(a=>areasS.some(x=>x.id===a.areaId)).map(a=>a.profId))];
  let ps = ids.map(i=>byId(DB.profesionales,i)).filter(Boolean);
  const u = usuario();
  if(perm('equipo')==='prop') ps = ps.filter(p=>p.id===u.profId);
  if(perm('equipo')==='area' && areasDeUsuario(u).length){
    const mias = areasDeUsuario(u);
    const mios = DB.asign.filter(a=>mias.includes(a.areaId)).map(a=>a.profId);
    ps = ps.filter(p=>mios.includes(p.id));
  }
  return ps.sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
function areasDeProf(profId){

  const trabajan = profes.filter(p=>areasS.some(a=>horarioDe(p.id,a.id,hoy())));
  const libres = profes.filter(p=>!trabajan.includes(p));

  return `<div class="pad">

          ${tarde?`<span style="color:var(--warn)">Llegó ${mh(f.entrada)-mh(h.desde)} min tarde</span>`:''}</div>
        ${!puedeFichar() || (perm('equipo')==='prop' && p.id!==usuario().profId)
          ? (f&&f.salida?`<span class="bd ok">${difHoras(f)}</span>`:(f&&f.entrada?`<span class="bd">Entró ${f.entrada}</span>`:''))

            : !f.salida
              ? `<button class="btn sm fin" onclick="pedirFichada('${p.id}','salida')">Salida</button>`
              : `<span class="bd ok">${difHoras(f)}</span>`}
      </div>`;}).join(''):`<div class="empty">Hoy no trabaja nadie en esta sucursal.</div>`}</div>
    ${puedeVerComisiones()?`<button class="btn sec" style="margin-top:11px" onclick="go('comisiones')">
      ${ic('cash','sm')} Comisiones y liquidaciones</button>`:''}
    ${perm('equipo')==='prop'?misComisiones():''}
    ${libres.length?`<div class="h3">Hoy no trabajan · ${libres.length}</div>
      <div class="listcard">${libres.map(p=>{
        const ex = excepcionDe(p.id, hoy());
        return `<div class="lr" style="opacity:.65"><div class="av">${ini(p.nombre)}</div>
          <div class="g"><b>${esc(p.nombre)}</b><span>${ex?esc(etiquetaExc(ex)):'No tiene horario este día'}</span></div>
        </div>`;}).join('')}</div>`:''}
  </div>`;
}

/* ---------- solapa SEMANA: grilla editable ---------- */
function lunesDe(f){ const d=parseISO(f); const dow=(d.getDay()+6)%7; return addDays(f,-dow); }
function eqSemana(){
  const profes = profesDeSucursal();
  const areasS = areasDeSucursal();
  const dias = [0,1,2,3,4,5,6].map(i=>addDays(ST.semana,i));
  const editable = puedeHorarios();

  return `
    <div class="daybar">
      <button onclick="ST.semana=addDays(ST.semana,-7);render()">${ic('left')}</button>
      <b>${fechaCorta(ST.semana)} al ${fechaCorta(addDays(ST.semana,6))}</b>
      <button onclick="ST.semana=addDays(ST.semana,7);render()">${ic('right')}</button>
    </div>
    <div class="pad">
      ${editable?`<div class="infobox">Tocá cualquier casilla y le cambiás el horario ahí mismo:
      ese día suelto, o el horario de siempre para ese día de la semana.
      ${perm('equipo')==='suc'?'Podés hacerlo con toda la gente de tu sucursal, para cuando la supervisora no está.':''}</div>`:''}
      <div class="gridwrap" style="padding:0">
        <div class="grid" style="grid-template-columns:96px repeat(7,minmax(60px,82px))">
          <div class="gh"></div>
          ${dias.map(f=>{const d=parseISO(f);
            return `<div class="gh" style="${f===hoy()?'color:var(--acc)':''}">${DIAS[d.getDay()].slice(0,3)}<br>
              <span style="font-weight:400;font-size:10.5px;color:var(--faint)">${d.getDate()}/${d.getMonth()+1}</span></div>`;}).join('')}
          ${profes.map(p=>`
            <div class="gt" style="text-align:left;padding:8px;font-size:12px;color:var(--ink);font-weight:600;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.nombre.split(' ')[0])}</div>
            ${dias.map(f=>{
              const a = areasS.find(x=>horarioDe(p.id,x.id,f));
              const h = a?horarioDe(p.id,a.id,f):null;
              const ex = excepcionDe(p.id,f);
              const fondo = ex?(['vacaciones','licencia'].includes(ex.tipo)?'#EAF3FB'
                : ex.tipo==='no'?'var(--bg)':'#FDF5E6'):'';
              return `<div class="gc" style="padding:6px 4px;text-align:center;font-size:10.5px;
                ${h?'':'background:var(--bg);color:var(--faint)'}${fondo?`background:${fondo}`:''}"
                ${editable?`onclick="editarDia('${p.id}','${f}')"`:''}>
                ${h?`${h.desde}<br>${h.hasta}${h.excepcion?'<br><span style="color:var(--warn);font-size:9px">cambiado</span>':''}`
                   :(ex?`<span style="font-size:15px">${iconoExc(ex.tipo)}</span>`:'—')}
              </div>`;}).join('')}
          `).join('')}
        </div>
      </div>
      ${editable?`<div class="btns">
        <button class="btn sec" onclick="cargarVacaciones()">${ic('plus','sm')} Cargar vacaciones o licencia</button>
      </div>`:''}
      <div class="h3">Referencias</div>
      <div class="card cardp small muted">
        🏖️ Vacaciones o licencia · ❌ No trabaja ese día · 🔄 Ese día va a otra área ·
        <b style="color:var(--warn)">cambiado</b> horario distinto al habitual
      </div>
    </div>`;
}
/* la profesional ve solamente lo suyo */
function misComisiones(){
  const u = usuario();
  if(!u.profId) return '';
  const d = (()=>{const x=new Date();return iso(new Date(x.getFullYear(),x.getMonth(),1))})();
  const ls = lineasComisionables(u.profId, d, hoy());
  const pend = ls.filter(x=>!x.l.liqId);
  const p = byId(DB.profesionales,u.profId);
  return `<div class="h3">Mis comisiones de este mes</div>
    <div class="card cardp">
      <div class="kv"><span class="muted">Servicios hechos</span><b>${ls.length}</b></div>
      <div class="kv"><span class="muted">Sin liquidar</span><b>${money(pend.reduce((s,x)=>s+comisionLinea(x.l),0))}</b></div>
      <div class="kv"><span class="muted">Se te liquida</span><b>Por ${esc(p?p.liqFrec:'mes')}</b></div>
      ${DB.liquidaciones.filter(x=>x.profId===u.profId&&!x.pagada).map(x=>`
        <div class="kv"><span class="muted">Liquidado ${fechaCorta(x.hasta)}</span>
          <b style="color:var(--warn)">${money(x.total)} sin cobrar</b></div>`).join('')}
    </div>`;
}
function iconoExc(t){ return {vacaciones:'🏖️', licencia:'🏖️', no:'❌', traslado:'🔄', horario:'🕐'}[t]||'•'; }
function etiquetaExc(e){
  const a = e.areaId?byId(DB.areas,e.areaId):null;
  return {vacaciones:'Vacaciones', licencia:'Licencia', no:'No trabaja',
    traslado:'Va a '+(a?a.nombre+' · '+byId(DB.sucursales,a.sucursalId).nombre:'otra área'),
    horario:'Horario cambiado'}[e.tipo] || '';
}

  const puede = ['todo','area'].includes(perm('equipo'));
  const soloSuArea = perm('equipo')==='area';
  return `<div class="pad">
    ${perm('equipo')==='todo'?`<button class="btn" style="margin-bottom:13px" onclick="editarProfesional()">${ic('plus','sm')} Agregar profesional</button>`:''}

    <div class="listcard">${profes.map(p=>{
      const ars = areasDeProf(p.id);
      return `<button class="lr" onclick="verProfesional('${p.id}')">
        <div class="av">${ini(p.nombre)}</div>

    ${DB.profesionales.filter(p=>!profes.includes(p)).length && perm('equipo')==='todo'?`
      <div class="h3">Trabajan en otras sucursales</div>
      <div class="listcard">${DB.profesionales.filter(p=>!profes.includes(p)).map(p=>`
        <button class="lr" style="opacity:.7" onclick="verProfesional('${p.id}')">
          <div class="av">${ini(p.nombre)}</div>
          <div class="g"><b>${esc(p.nombre)}</b>
            <span>${areasDeProf(p.id).map(x=>x.suc.nombre).join(', ')||'Sin asignar'}</span></div>
          ${ic('chev','sm')}</button>`).join('')}</div>`:''}
  </div>`;
}

  if(!['todo','area'].includes(perm('equipo'))){ toast('No tenés acceso a la ficha del personal'); return; }
  const p = byId(DB.profesionales,pid);
  let ars = areasDeProf(pid);
  const exs = DB.excepciones.filter(e=>e.profId===pid && e.hastaF>=hoy())
    .sort((a,b)=>a.desdeF.localeCompare(b.desdeF));
  const puede = ['todo','area'].includes(perm('equipo'));
  const total = perm('equipo')==='todo';
  if(perm('equipo')==='area'){ const mias=areasDeUsuario(); ars = ars.filter(x=>mias.includes(x.area.id)); }
  sheet(p.nombre, `
    <div class="card cardp" style="margin-bottom:13px">
      <div class="kv"><span class="muted">Teléfono</span><b>${esc(p.tel)||'—'}</b></div>
      <div class="kv"><span class="muted">Liquida comisiones</span><b>Por ${esc(p.liqFrec)}</b></div>
      <div class="kv"><span class="muted">Ficha</span><b>${
        p.fichaje==='qr'?'Con QR, desde su celular':(p.fichaje==='simple'?'Lo marca recepción':'Con foto en el mostrador')}</b></div>
      <div class="kv"><span class="muted">Sueldo fijo</span><b>${p.fijoMonto>0?money(p.fijoMonto)+' por '+p.fijoFrec:'No tiene'}</b></div>
      <div class="kv"><span class="muted">Estado</span><b style="color:${p.activa?'var(--ok)':'var(--faint)'}">${p.activa?'Activa':'Inactiva'}</b></div>
      ${total?`<div class="btns"><button class="btn sec" onclick="editarProfesional('${pid}')">${ic('edit','sm')} Editar datos</button></div>`:''}
    </div>

    <div class="h3">Dónde trabaja</div>
    <div class="listcard">${ars.length?ars.map(x=>{
      const hs = DB.horarios.filter(h=>h.asignId===x.as.id).sort((a,b)=>a.dia-b.dia);
      return `<button class="lr" onclick="${puede?`editarAsignacion('${x.as.id}')`:''}">
        <div class="av" style="font-size:17px">${x.area.icono}</div>
        <div class="g"><b>${esc(x.area.nombre)} · ${esc(x.suc.nombre)}</b>
          <span>${hs.length?hs.map(h=>DIAS[h.dia].slice(0,3)+' '+h.desde+'-'+h.hasta).join(' · '):'Sin horario cargado'}</span>

      <div class="lr"><div class="av" style="font-size:17px">${iconoExc(e.tipo)}</div>
        <div class="g"><b>${e.desdeF===e.hastaF?fechaCorta(e.desdeF):fechaCorta(e.desdeF)+' al '+fechaCorta(e.hastaF)}</b>
          <span>${esc(etiquetaExc(e))}${e.tipo==='horario'?' · '+e.desde+'-'+e.hasta:''}${e.motivo?' · '+esc(e.motivo):''}</span></div>

function guardarProfesional(pid){
  if(!puedeEditarEquipo()){ toast('Eso lo hace administración'); return; }
  const n=document.getElementById('pn').value.trim();
  if(!n){ toast('Falta el nombre'); return; }
  const d = {nombre:n, tel:document.getElementById('pt').value.trim(),
    fichaje:document.getElementById('pfi').value,
    liqFrec:document.getElementById('pl').value,
    fijoMonto:+document.getElementById('pf').value||0,
    fijoFrec:document.getElementById('pff').value};
  if(pid){
    const p=byId(DB.profesionales,pid); Object.assign(p,d);
    const pa=document.getElementById('pa'); if(pa) p.activa=pa.checked;
    logAcc(`Profesional editada: ${n}`);
    save(); closeSheet(); render(); toast('Guardado');
  }else{
    const p={id:uid('pr'), ...d, activa:true};
    DB.profesionales.push(p);
    logAcc(`Profesional nueva: ${n}`);
    save(); closeSheet(); render();
    setTimeout(()=>agregarAsignacion(p.id, true), 250);
  }
}
function borrarProfesional(pid){
  if(!puedeEditarEquipo()){ toast('Dar de baja a alguien lo hace administración'); return; }
  const p=byId(DB.profesionales,pid);
  const asg=DB.asign.filter(a=>a.profId===pid);
  pedirBorrar({tipo:'profesional', id:pid, nombre:p.nombre,
    seLleva: asg.length?`${asg.length} asignación${asg.length===1?'':'es'} de área con sus horarios`:'',
    alBorrar:`hacerBorrarProfesional('${pid}')`,
    alDejarSinUso:`dejarSinUsoProfesional('${pid}')`, estaSinUso:!p.activa});
}
function hacerBorrarProfesional(pid){
  if(!puedeEditarEquipo()){ toast('Eso lo hace administración'); return; }
  const p=byId(DB.profesionales,pid);
  const asg=DB.asign.filter(a=>a.profId===pid).map(a=>a.id);
  DB.horarios = DB.horarios.filter(h=>!asg.includes(h.asignId));
  DB.asign = DB.asign.filter(a=>a.profId!==pid);
  DB.excepciones = DB.excepciones.filter(e=>e.profId!==pid);
  DB.bloqueos = DB.bloqueos.filter(b=>b.profId!==pid);
  DB.areas.forEach(a=>{ if(a.supervisoraId===pid) a.supervisoraId=null; });
  DB.profesionales = DB.profesionales.filter(x=>x.id!==pid);
  logAcc(`Profesional borrada: ${p.nombre}`);
  save(); closeSheet(); render(); toast('Borrada del sistema');
}
function dejarSinUsoProfesional(pid){
  if(!puedeEditarEquipo()){ toast('Eso lo hace administración'); return; }
  const p=byId(DB.profesionales,pid); p.activa=!p.activa;
  logAcc(`${p.nombre}: ${p.activa?'activada':'dada de baja'}`);
  save(); closeSheet(); render(); toast(p.activa?'Activada':'Dada de baja');
}
function agregarAsignacion(pid, esNueva){
  const p=byId(DB.profesionales,pid);
  const ya = DB.asign.filter(a=>a.profId===pid).map(a=>a.areaId);
  const libres = DB.areas.filter(a=>a.activa && !ya.includes(a.id));
  sheet(esNueva?'¿Dónde trabaja '+p.nombre.split(' ')[0]+'?':'Sumar a un área', `
    ${esNueva?`<div class="okbox">${esc(p.nombre)} quedó cargada. Ahora elegí en qué área trabaja
    y después le ponés el horario.</div>`:''}
    ${libres.length?`<div class="listcard">${libres.map(a=>{
      const su=byId(DB.sucursales,a.sucursalId);
      return `<button class="lr" onclick="hacerAsignacion('${pid}','${a.id}')">
        <div class="av" style="font-size:17px">${a.icono}</div>
        <div class="g"><b>${esc(a.nombre)}</b><span>${esc(su.nombre)}</span></div>
        ${ic('chev','sm')}</button>`;}).join('')}</div>`
      :`<div class="empty">Ya está en todas las áreas.</div>`}`);
}
function hacerAsignacion(pid, areaId){
  const svs = DB.servicios.filter(s=>s.areaId===areaId && s.activo).map(s=>s.id);
  const as = {id:uid('as'), profId:pid, areaId, servicios:svs, comision:null};
  DB.asign.push(as);
  /* horario habitual por defecto: lunes a viernes 9 a 17, para que salga andando */
  [1,2,3,4,5].forEach(d=>DB.horarios.push({id:uid('ho'), asignId:as.id, dia:d,
    desde:'09:00', hasta:'17:00', pausaD:'13:00', pausaH:'14:00'}));
  logAcc(`${byId(DB.profesionales,pid).nombre} sumada a ${byId(DB.areas,areaId).nombre}`);
  save(); closeSheet(); render();
  toast('Asignada. Ajustale el horario.');
  setTimeout(()=>editarAsignacion(as.id), 250);
}

  const svs = DB.servicios.filter(s=>s.areaId===as.areaId && s.activo);
  sheet(p.nombre.split(' ')[0]+' en '+area.nombre, `
    <div class="small muted" style="margin-bottom:13px">${area.icono} ${esc(area.nombre)} · ${esc(suc.nombre)}</div>

    <div class="h3" style="margin-top:0">Horario habitual</div>
    <div class="small muted" style="margin-bottom:9px">Esta es la base. Los cambios de una semana puntual
    se hacen desde la solapa Semana.</div>
    <div class="card cardp">
      ${[1,2,3,4,5,6,0].map(d=>{
        const h = DB.horarios.find(x=>x.asignId===asId && x.dia===d);
        return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">
          <input type="checkbox" id="hd_${d}" ${h?'checked':''} style="width:19px;height:19px;flex:none;accent-color:var(--acc)"
            onchange="document.getElementById('hf_${d}').style.opacity=this.checked?1:.35">
          <div style="width:64px;font-size:13px;font-weight:600">${DIAS[d].slice(0,3)}</div>
          <div id="hf_${d}" class="row" style="flex:1;gap:6px;opacity:${h?1:.35}">
            <input type="time" id="ha_${d}" value="${h?h.desde:'09:00'}" style="padding:7px 8px">
            <input type="time" id="hb_${d}" value="${h?h.hasta:'17:00'}" style="padding:7px 8px">
          </div></div>`;}).join('')}
      <div class="row" style="margin-top:11px">
        <div><label>Pausa desde</label><input type="time" id="hpd" value="${(DB.horarios.find(x=>x.asignId===asId)||{}).pausaD||''}" style="padding:8px"></div>
        <div><label>Pausa hasta</label><input type="time" id="hph" value="${(DB.horarios.find(x=>x.asignId===asId)||{}).pausaH||''}" style="padding:8px"></div>
      </div>
    </div>

    <div class="h3">Servicios que hace acá</div>
    <div class="card cardp" style="max-height:210px;overflow-y:auto">
      ${svs.map(s=>`<div class="chk"><input type="checkbox" class="asv" value="${s.id}" ${as.servicios.includes(s.id)?'checked':''}>
        <div class="g"><b>${esc(s.nombre)}</b><span class="small muted">${s.dur} min · ${money(s.contado)}</span></div></div>`).join('')}
    </div>

    <div class="f" style="margin-top:13px"><label>Comisión propia en esta área (dejalo vacío para usar la de cada servicio)</label>
      <input type="number" id="acom" value="${as.comision!=null?as.comision:''}" placeholder="Usa la de cada servicio" inputmode="numeric"></div>

    <button class="btn" onclick="guardarAsignacion('${asId}')">Guardar</button>
    ${perm('equipo')==='todo'?`<button class="btn dan" style="margin-top:8px" onclick="quitarAsignacion('${asId}')">Sacarla de esta área</button>`:''}`);
}
function guardarAsignacion(asId){
  const as = byId(DB.asign, asId);
  const pd = document.getElementById('hpd').value, ph = document.getElementById('hph').value;
  /* horarios imposibles: el "hasta" antes del "desde" */
  const malos=[];
  [1,2,3,4,5,6,0].forEach(d=>{
    if(document.getElementById('hd_'+d).checked){
      const a=document.getElementById('ha_'+d).value, b=document.getElementById('hb_'+d).value;
      if(!a||!b||mh(b)<=mh(a)) malos.push(DIAS[d]);
    }
  });
  if(malos.length){ toast('Revisá el horario de: '+malos.join(', ')); return; }
  if(pd&&ph&&mh(ph)<=mh(pd)){ toast('Revisá la pausa: el "hasta" tiene que ser posterior'); return; }
  const cm = document.getElementById('acom').value;
  if(cm!=='' && (+cm>100 || +cm<0)){ toast('La comisión tiene que estar entre 0 y 100'); return; }
  DB.horarios = DB.horarios.filter(h=>h.asignId!==asId);
  [1,2,3,4,5,6,0].forEach(d=>{
    if(document.getElementById('hd_'+d).checked){
      DB.horarios.push({id:uid('ho'), asignId:asId, dia:d,
        desde:document.getElementById('ha_'+d).value,
        hasta:document.getElementById('hb_'+d).value, pausaD:pd||null, pausaH:ph||null});
    }
  });
  as.servicios = [...document.querySelectorAll('.asv:checked')].map(x=>x.value);
  const c = document.getElementById('acom').value;
  as.comision = c===''?null:+c;
  logAcc(`Horario actualizado: ${byId(DB.profesionales,as.profId).nombre} en ${byId(DB.areas,as.areaId).nombre}`);
  save(); closeSheet(); render(); toast('Horario guardado');
}
function quitarAsignacion(asId){
  const as = byId(DB.asign, asId);
  const p = byId(DB.profesionales, as.profId), a = byId(DB.areas, as.areaId);

/* ============================================================
   HORARIOS EN UNA SOLA PANTALLA
   Se toca la casilla de la semana y se resuelve ahí: el horario de ese día,
   o el horario de siempre para ese día de la semana. Sin saltar a otro lado.
   ============================================================ */
/* los horarios que más se usan en el instituto, para ofrecerlos de un toque */
function horariosFrecuentes(){
  const c={};
  DB.horarios.forEach(h=>{ const k=h.desde+'-'+h.hasta; c[k]=(c[k]||0)+1; });
  const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0].split('-'));
  ['09:00-17:00','12:00-20:00','10:00-18:00'].forEach(d=>{
    const [a,b]=d.split('-');
    if(!arr.some(x=>x[0]===a&&x[1]===b) && arr.length<5) arr.push([a,b]);
  });
  return arr;
}
/* la supervisora maneja los horarios de SU gente; administración, de todos */
function puedeTocarHorarioDe(pid){
  const nivel = perm('equipo');
  if(nivel==='todo') return true;
  if(nivel==='suc'){
    /* recepción: cualquiera que trabaje en un área de SU sucursal */
    const ids = DB.areas.filter(a=>a.sucursalId===ST.sucursalId).map(a=>a.id);
    return DB.asign.some(a=>a.profId===pid && ids.includes(a.areaId));
  }
  if(nivel!=='area') return false;
  const mias = areasDeUsuario();
  if(!mias.length) return false;
  return DB.asign.some(a=>a.profId===pid && mias.includes(a.areaId));
}

function hacerTraslado(pid, fecha, areaId){
  if(!puedeTocarHorarioDe(pid)){ toast('Solo podés cambiarle el horario a la gente de tu área'); return; }
  /* si ese día ya tiene turnos en su área, el traslado los deja colgados: ahí sí pide motivo */
  const chocan = lineasDe(fecha, l=>l.profId===pid && l.areaId!==areaId && !['can','fin','no'].includes(l.estado));
  const guardar = (motivo)=>{
    const vieja = excepcionDe(pid, fecha);
    if(vieja) DB.excepciones = DB.excepciones.filter(e=>e.id!==vieja.id);
    const base = horarioBase(pid, areaId, fecha) || horarioBase(pid, (areasDeProf(pid)[0]||{area:{}}).area.id, fecha) || {desde:'09:00', hasta:'17:00'};
    DB.excepciones.push({id:uid('ex'), profId:pid, tipo:'traslado', desdeF:fecha, hastaF:fecha,
      desde:base.desde, hasta:base.hasta, areaId, motivo:motivo||'Traslado del día'});
    logAcc(`${byId(DB.profesionales,pid).nombre}: el ${fechaCorta(fecha)} va a ${byId(DB.areas,areaId).nombre}${motivo?' — '+motivo:''}`);
    save(); closeSheet(); render(); toast('Guardado');
  };
  if(chocan.length) return confirmarConMotivo('Tiene turnos ese día en su área',
    chocan.map(l=>`${byId(DB.clientas,l.visita.clientaId).nombre} a las ${l.hora} (${byId(DB.servicios,l.servicioId).nombre}).`)
      .concat(['Si se va a otra área esos turnos quedan sin profesional.']),
    'Trasladarla igual', m=>guardar(m));
  guardar('');
}

function ponerHorarioSiempre(pid, fecha, desde, hasta){
  if(!puedeTocarHorarioDe(pid)){ toast('Solo podés cambiarle el horario a la gente de tu área'); return; }
  const dia = parseISO(fecha).getDay();
  const areasS = areasDeSucursal();
  const a = areasS.find(x=>DB.asign.find(y=>y.profId===pid && y.areaId===x.id))
         || (areasDeProf(pid)[0]||{}).area;
  if(!a){ toast('Primero hay que asignarla a un área'); return; }
  const as = DB.asign.find(y=>y.profId===pid && y.areaId===a.id);
  const otros = DB.horarios.filter(h=>h.asignId===as.id && h.dia!==dia);
  const modelo = DB.horarios.find(h=>h.asignId===as.id) || {pausaD:null, pausaH:null};
  DB.horarios = DB.horarios.filter(h=>!(h.asignId===as.id && h.dia===dia));
  if(desde && hasta){
    DB.horarios.push({id:uid('ho'), asignId:as.id, dia, desde, hasta,
      pausaD:modelo.pausaD, pausaH:modelo.pausaH});
  }
  logAcc(`${byId(DB.profesionales,pid).nombre}: los ${DIAS[dia].toLowerCase()} ${desde?desde+' a '+hasta:'no trabaja'}`);
  save(); closeSheet(); render();
  toast(desde?`Todos los ${DIAS[dia].toLowerCase()} ${desde} a ${hasta}`:`Ya no trabaja los ${DIAS[dia].toLowerCase()}`);
}

function guardarExcepcion(pid, fecha){
  const t = document.getElementById('exq').value;
  const g = k => (document.getElementById(k)||{}).value || null;
  const mot = (g('exm')||'').trim();
  if(t==='horario' || t==='traslado'){
    const d=g('exd'), h=g('exh');
    if(!d||!h||mh(h)<=mh(d)){ toast('Revisá el horario: el "hasta" tiene que ser posterior'); return; }
  }
  if(t==='traslado' && !mot){ toast('Escribí por qué se traslada ese día'); return; }
  /* si ese día ya tiene turnos cargados, avisar antes de dejarla sin horario */
  const deja = ['no','vacaciones','licencia','traslado'].includes(t);
  const chocan = deja ? lineasDe(fecha, l=>l.profId===pid && !['can','fin','no'].includes(l.estado)) : [];
  const guardar = (motivo)=>{
    const vieja = excepcionDe(pid, fecha);
    if(vieja) DB.excepciones = DB.excepciones.filter(e=>e.id!==vieja.id);
    if(t){
      DB.excepciones.push({id:uid('ex'), profId:pid, tipo:t,
        desdeF: g('exdf')||fecha, hastaF: g('exhf')||fecha,
        desde: g('exd'), hasta: g('exh'), areaId: g('exa'), motivo: motivo||mot});
      logAcc(`${byId(DB.profesionales,pid).nombre}: ${t} el ${fechaCorta(fecha)}${(motivo||mot)?' — '+(motivo||mot):''}`);
    }
    save(); closeSheet(); render(); toast(t?'Guardado':'Vuelve al horario habitual');
  };
  if(chocan.length) return confirmarConMotivo('Tiene turnos ese día',
    chocan.map(l=>`${byId(DB.clientas,l.visita.clientaId).nombre} a las ${l.hora} (${byId(DB.servicios,l.servicioId).nombre}).`)
      .concat(['Esos turnos quedan sin profesional: hay que reubicarlos a mano.']),
    'Guardarlo igual', m=>guardar(m));
  guardar('');
}

function guardarVacaciones(pid){
  const p = pid || document.getElementById('vpr').value;
  const df = document.getElementById('vdf').value, hf = document.getElementById('vhf').value;
  if(!df||!hf||hf<df){ toast('Revisá las fechas'); return; }
  DB.excepciones.push({id:uid('ex'), profId:p, tipo:document.getElementById('vti').value,
    desdeF:df, hastaF:hf, desde:null, hasta:null, areaId:null,
    motivo:document.getElementById('vmo').value});
  logAcc(`${byId(DB.profesionales,p).nombre}: ausente del ${fechaCorta(df)} al ${fechaCorta(hf)}`);
  save(); closeSheet(); render();
  /* avisar de los turnos que quedan colgados */
  const colgados = [];
  DB.visitas.filter(v=>v.fecha>=df && v.fecha<=hf).forEach(v=>{
    v.lineas.filter(l=>l.profId===p && !['can','fin','no'].includes(l.estado)).forEach(l=>colgados.push({v,l}));
  });
  if(colgados.length){
    setTimeout(()=>sheet('Turnos que quedan sin profesional', `
      <div class="warnbox">${byId(DB.profesionales,p).nombre.split(' ')[0]} tiene ${colgados.length} turno${colgados.length>1?'s':''}
      cargado${colgados.length>1?'s':''} en esas fechas. Hay que reubicarlos.</div>
      <div class="listcard">${colgados.map(({v,l})=>{
        const cl=byId(DB.clientas,v.clientaId), sv=byId(DB.servicios,l.servicioId);
        return `<button class="lr" onclick="closeSheet();abrirTurno('${v.id}','${l.id}')">
          <div class="av">${ini(cl.nombre)}</div>
          <div class="g"><b>${esc(cl.nombre)}</b><span>${fechaCorta(v.fecha)} ${l.hora} · ${esc(sv.nombre)}</span></div>
          ${ic('chev','sm')}</button>`;}).join('')}</div>`), 350);
  } else toast('Cargado');
}

function difHoras(f){
  if(!f.entrada||!f.salida) return '';
  const m = mh(f.salida)-mh(f.entrada);

}

async function abrirCam(){
  try{
    CAM = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:640, height:480}});
    const v = document.getElementById('cam');
    if(!v){ cerrarCam(); return; }
    v.srcObject = CAM; await v.play();
    const b = document.getElementById('btnfoto'); if(b) b.disabled = false;
  }catch(e){
    const v=document.getElementById('cam'), er=document.getElementById('camerr');
    if(v) v.style.display='none';
    if(er){ er.style.display='block';
      er.textContent = e.name==='NotAllowedError'
        ? 'Hay que darle permiso a la cámara. Tocá el candado en la barra del navegador y permitila.'
        : 'No se pudo abrir la cámara en este dispositivo.'; }
  }
}
function cerrarCam(){
  if(CAM){ CAM.getTracks().forEach(t=>t.stop()); CAM=null; }
  closeSheet();
}
function sacarFoto(pid, tipo){
  const v = document.getElementById('cam');
  const c = document.createElement('canvas');
  c.width=200; c.height=150;
  const ctx=c.getContext('2d');
  ctx.translate(200,0); ctx.scale(-1,1);           /* espejo, como se ve en pantalla */
  ctx.drawImage(v,0,0,200,150);
  const foto = c.toDataURL('image/jpeg',0.55);
  fichar(pid, tipo, foto);
  cerrarCam();
}
function verFoto(fid){

    <div class="card cardp" style="margin-top:13px">
      <div class="kv"><span class="muted">Día</span><b>${fechaCorta(f.fecha)}</b></div>
      <div class="kv"><span class="muted">Entrada</span><b>${f.entrada||'—'}</b></div>
      <div class="kv"><span class="muted">Salida</span><b>${f.salida||'—'}</b></div>

function fichar(pid, tipo, foto){
  const hora = horaAhora();
  let f = DB.fichadas.find(x=>x.profId===pid && x.fecha===hoy() && x.sucursalId===ST.sucursalId);
  if(!f){ f={id:uid('fi'), profId:pid, fecha:hoy(), sucursalId:ST.sucursalId, entrada:null, salida:null};
    DB.fichadas.push(f); }
  f[tipo]=hora;
  if(foto) f[tipo==='entrada'?'fotoEntrada':'fotoSalida']=foto;
  logAcc(`${byId(DB.profesionales,pid).nombre} fichó ${tipo} ${hora}${foto?' con foto':''}`);
  save(); render(); toast((tipo==='entrada'?'Entrada':'Salida')+' '+hora);

/* ============================================================
   COMISIONES
   ============================================================ */
function vComisiones(){
  if(!ST.comDesde){ const d=new Date(); ST.comDesde=iso(new Date(d.getFullYear(),d.getMonth(),1)); ST.comHasta=hoy(); }
  const presets = [
    ['Esta semana', lunesDe(hoy()), hoy()],
    ['Este mes', (()=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth(),1))})(), hoy()],
    ['Mes pasado', (()=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth()-1,1))})(),
                   (()=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth(),0))})()]
  ];
  let gente = DB.profesionales;
  if(perm('equipo')==='area'){
    const mias = areasDeUsuario();
    const mios = DB.asign.filter(a=>mias.includes(a.areaId)).map(a=>a.profId);
    gente = gente.filter(p=>mios.includes(p.id));
  }
  if(perm('equipo')==='suc'){
    /* recepción: la gente que trabaja en su sucursal, que es a la que le paga */
    const ids = DB.areas.filter(a=>a.sucursalId===ST.sucursalId).map(a=>a.id);
    const suyos = DB.asign.filter(a=>ids.includes(a.areaId)).map(a=>a.profId);
    gente = gente.filter(p=>suyos.includes(p.id));
  }
  const filas = gente.map(p=>{
    const ls = lineasComisionables(p.id, ST.comDesde, ST.comHasta);
    const pend = ls.filter(x=>!x.l.liqId);
    return {p, ls, pend,
      com: pend.reduce((s,x)=>s+comisionLinea(x.l),0),
      fact: pend.reduce((s,x)=>s+x.l.precio,0)};
  }).filter(f=>f.ls.length>0 || f.com>0).sort((a,b)=>b.com-a.com);

  /* las liquidaciones también se filtran por la misma gente: la supervisora no tiene
     por qué ver lo que se le pagó a otra área, ni recepción lo de otra sucursal */
  const visibles = new Set(gente.map(p=>p.id));
  const liqs = DB.liquidaciones.filter(x=>visibles.has(x.profId))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const pendPago = liqs.filter(x=>!x.pagada);

  return `<div class="pad">
    <div class="subtabs" style="padding:0 0 11px">
      ${presets.map(x=>`<button class="ptab ${ST.comDesde===x[1]&&ST.comHasta===x[2]?'on':''}"
        onclick="ST.comDesde='${x[1]}';ST.comHasta='${x[2]}';render()">${x[0]}</button>`).join('')}
    </div>
    <div class="row f">
      <div><label>Desde</label><input type="date" id="cd" value="${ST.comDesde}"
        onchange="ST.comDesde=this.value;render()"></div>
      <div><label>Hasta</label><input type="date" id="ch" value="${ST.comHasta}"
        onchange="ST.comHasta=this.value;render()"></div>
    </div>
    <div class="infobox">La comisión se calcula siempre sobre el precio de contado, sin importar
    cómo pagó la clienta ni si hubo descuento o promoción.
    ${!puedeLiquidar()?'<br>Podés ver las comisiones de tu área; liquidarlas y pagarlas lo hace administración.':''}
    ${perm('equipo')==='suc'?'<br>Lo que pagues acá se carga como gasto en la caja del día, igual que el pago del día.':''}</div>

    <div class="h3">Sin liquidar</div>
    <div class="listcard">${filas.filter(f=>f.com>0).length?filas.filter(f=>f.com>0).map(f=>`
      <button class="lr" onclick="verComisiones('${f.p.id}')">
        <div class="av">${ini(f.p.nombre)}</div>
        <div class="g"><b>${esc(f.p.nombre)}</b>
          <span>${f.pend.length} servicios · facturó ${money(f.fact)}</span>
          <span class="tiny">Liquida por ${esc(f.p.liqFrec)}${f.p.fijoMonto>0?' · fijo '+money(f.p.fijoMonto)+'/'+f.p.fijoFrec:''}</span></div>
        <div class="r"><b style="font-size:15px;color:var(--acc)">${money(f.com)}</b><br>${ic('chev','sm')}</div>
      </button>`).join(''):`<div class="empty">No hay comisiones sin liquidar en este período.</div>`}</div>

    ${pendPago.length?`<div class="h3">Liquidadas, falta pagarlas</div>
      <div class="listcard">${pendPago.map(x=>{
        const p=byId(DB.profesionales,x.profId);
        return `<div class="lr"><div class="av">${ini(p.nombre)}</div>
          <div class="g"><b>${esc(p.nombre)}</b>
            <span>${fechaCorta(x.desde)} al ${fechaCorta(x.hasta)} · ${x.lineas.length} servicios</span>
            ${x.fijo>0?`<span class="tiny">Comisión ${money(x.comision)} + fijo ${money(x.fijo)}</span>`:''}</div>
          <div class="r"><b style="font-size:15px">${money(x.total)}</b><br>
            ${puedeLiquidar()?`<button class="btn sm ok" style="margin-top:4px" onclick="marcarPagada('${x.id}')">Pagar</button>
            <button class="btn sm sec" style="margin-top:4px" onclick="deshacerLiquidacion('${x.id}')">Deshacer</button>`:''}</div>
        </div>`;}).join('')}</div>`:''}

    ${liqs.filter(x=>x.pagada).length?`<div class="h3">Ya pagadas</div>
      <div class="listcard">${liqs.filter(x=>x.pagada).slice(0,12).map(x=>{
        const p=byId(DB.profesionales,x.profId);
        return `<div class="lr" style="opacity:.75"><div class="av">${ini(p.nombre)}</div>
          <div class="g"><b>${esc(p.nombre)}</b>
            <span>${fechaCorta(x.desde)} al ${fechaCorta(x.hasta)} · pagada ${fechaCorta(x.pagadaF)}</span></div>
          <div class="r">${money(x.total)}</div></div>`;}).join('')}</div>`:''}
  </div>`;
}
/* servicios finalizados de una profesional en un rango */
function lineasComisionables(profId, desde, hasta){
  const out=[];
  DB.visitas.filter(v=>v.fecha>=desde && v.fecha<=hasta).forEach(v=>{
    v.lineas.filter(l=>l.profId===profId && l.estado==='fin').forEach(l=>out.push({l,v}));
  });
  return out.sort((a,b)=>a.v.fecha.localeCompare(b.v.fecha));
}
function verComisiones(pid){
  const p = byId(DB.profesionales,pid);
  const ls = lineasComisionables(pid, ST.comDesde, ST.comHasta).filter(x=>!x.l.liqId);
  const com = ls.reduce((s,x)=>s+comisionLinea(x.l),0);
  const exentas = ls.filter(x=>x.l.exenta);
  sheet('Comisiones de '+p.nombre.split(' ')[0], `
    <div class="card cardp" style="margin-bottom:13px">
      <div class="kv"><span class="muted">Período</span><b>${fechaCorta(ST.comDesde)} al ${fechaCorta(ST.comHasta)}</b></div>
      <div class="kv"><span class="muted">Servicios</span><b>${ls.length}</b></div>
      <div class="kv"><span class="muted">Facturó</span><b>${money(ls.reduce((s,x)=>s+x.l.precio,0))}</b></div>
      ${exentas.length?`<div class="kv"><span class="muted">Exentas</span><b>${exentas.length}</b></div>`:''}
      ${p.fijoMonto>0?`<div class="kv"><span class="muted">Sueldo fijo</span><b>${money(p.fijoMonto)} por ${p.fijoFrec}</b></div>`:''}
      <div class="tot"><span>Comisión</span><span>${money(com)}</span></div>
    </div>
    <div class="listcard" style="max-height:280px;overflow-y:auto">
      ${ls.length?ls.map(x=>{
        const cl=byId(DB.clientas,x.v.clientaId), sv=byId(DB.servicios,x.l.servicioId);
        return `<div class="lr"><div class="g">
          <b>${esc(sv.nombre)}</b>
          <span>${fechaCorta(x.v.fecha)} · ${esc(cl.nombre)}</span></div>
          <div class="r">${x.l.exenta
            ? `<span class="bd">Exenta</span><br><span class="tiny">${esc(x.l.motivo||'')}</span>`
            : `<b>${money(comisionLinea(x.l))}</b><br><span class="tiny">${x.l.comisionPct}% de ${money(x.l.precio)}</span>`}
          </div></div>`;}).join(''):`<div class="empty">Sin servicios finalizados en el período.</div>`}
    </div>
    ${ls.length&&puedeLiquidar()?`<button class="btn pay" style="margin-top:13px" onclick="liquidar('${pid}')">
      Liquidar ${money(com + (p.fijoMonto||0))}</button>`:''}`);
}
function liquidar(pid){
  const p = byId(DB.profesionales,pid);
  const ls = lineasComisionables(pid, ST.comDesde, ST.comHasta).filter(x=>!x.l.liqId);
  const com = ls.reduce((s,x)=>s+comisionLinea(x.l),0);
  sheet('Liquidar a '+p.nombre.split(' ')[0], `
    <div class="card cardp" style="margin-bottom:13px">
      <div class="kv"><span class="muted">Comisiones</span><b>${money(com)}</b></div>
      <div class="kv"><span class="muted">Sueldo fijo</span><b>${money(p.fijoMonto||0)}</b></div>
      <div class="tot"><span>Total a pagar</span><span>${money(com+(p.fijoMonto||0))}</span></div>
    </div>
    <div class="warnbox">Al liquidar, estos ${ls.length} servicios quedan cerrados y no se vuelven
    a contar. Un cambio de porcentaje de acá en adelante no los toca.</div>
    <div class="f"><label>Sueldo fijo a incluir</label>
      <input type="number" id="lqf" value="${p.fijoMonto||0}" inputmode="numeric"></div>
    <button class="btn pay" onclick="hacerLiquidacion('${pid}')">Cerrar la liquidación</button>`);
}
function hacerLiquidacion(pid){
  if(!puedeLiquidar()){ toast('Las liquidaciones las maneja administración'); return; }
  const p = byId(DB.profesionales,pid);
  const ls = lineasComisionables(pid, ST.comDesde, ST.comHasta).filter(x=>!x.l.liqId);
  const com = ls.reduce((s,x)=>s+comisionLinea(x.l),0);
  const fijo = +document.getElementById('lqf').value||0;
  const liq = {id:uid('lq'), profId:pid, desde:ST.comDesde, hasta:ST.comHasta,
    lineas:ls.map(x=>x.l.id), comision:com, fijo, total:com+fijo,
    fecha:hoy(), pagada:false, pagadaF:null, usuario:usuario().nombre};
  DB.liquidaciones.push(liq);
  ls.forEach(x=>x.l.liqId=liq.id);
  logAcc(`Liquidación de ${p.nombre}: ${money(liq.total)}`);
  save(); closeSheet(); render(); toast('Liquidada. Queda pendiente de pago.');
}
function deshacerLiquidacion(lid){
  if(!puedeLiquidar()){ toast('Las liquidaciones las maneja administración'); return; }
  const l=byId(DB.liquidaciones,lid);
  const p=byId(DB.profesionales,l.profId);
  sheet('Deshacer la liquidación', `
    <div class="warnbox">${ic('alert','sm')} Los ${l.lineas.length} servicios de
      <b>${esc(p?p.nombre:'')}</b> vuelven a quedar sin liquidar, como estaban antes.</div>
    <div class="infobox">Usalo si liquidaste el período equivocado o con el porcentaje viejo.</div>
    <button class="btn dan" onclick="hacerDeshacerLiquidacion('${lid}')">Sí, deshacerla</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
}
function hacerDeshacerLiquidacion(lid){
  if(!puedeLiquidar()){ toast('Las liquidaciones las maneja administración'); return; }
  const l=byId(DB.liquidaciones,lid);
  DB.visitas.forEach(v=>v.lineas.forEach(x=>{ if(x.liqId===lid) x.liqId=null; }));
  DB.liquidaciones = DB.liquidaciones.filter(x=>x.id!==lid);
  logAcc(`Liquidación deshecha: ${(byId(DB.profesionales,l.profId)||{}).nombre||''}`);
  save(); closeSheet(); render(); toast('Liquidación deshecha');
}
function marcarPagada(lid){
  if(!puedeLiquidar()){ toast('Las liquidaciones las maneja administración'); return; }
  const l = byId(DB.liquidaciones,lid);
  const p = byId(DB.profesionales,l.profId);
  l.pagada=true; l.pagadaF=hoy();
  /* la plata sale de la caja: si no quedó cargada al liquidar, se carga ahora */
  if(!l.gastoId && puedeCobrar()){
    const g = {id:uid('ga'), sucursalId:ST.sucursalId, fecha:hoy(),
      concepto:'Pago a '+(p?p.nombre:''), importe:l.total, tipo:'comision'};
    DB.gastos.push(g); l.gastoId=g.id;
  }
  logAcc(`Pagada la liquidación de ${p?p.nombre:''}: ${money(l.total)}`);
  save(); render();
  toast(l.gastoId?'Pagada y cargada en la caja':'Marcada como pagada');
}

function paqueteActivo(clientaId, servicioId){
  return DB.paquetes.find(p=>p.clientaId===clientaId && p.servicioId===servicioId && p.usadas<p.total) || null;
}
function venderPaquete(clientaId){
  const svs = DB.servicios.filter(s=>s.activo && byId(DB.areas,s.areaId).sucursalId===ST.sucursalId);
  sheet('Vender un paquete de sesiones', `
    ${clientaId?'':`<div class="f"><label>Clienta</label>
      <select id="pqc">${DB.clientas.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></div>`}
    <div class="f"><label>Servicio</label>
      <select id="pqs" onchange="calcPaquete()">${svs.map(s=>`<option value="${s.id}" data-p="${s.contado}">${esc(s.nombre)} — ${money(s.contado)}</option>`).join('')}</select></div>
    <div class="row f">
      <div><label>Cantidad de sesiones</label><input type="number" id="pqn" value="6" min="1" inputmode="numeric" oninput="calcPaquete()"></div>
      <div><label>Descuento %</label><input type="number" id="pqd" value="20" inputmode="numeric" oninput="calcPaquete()"></div>
    </div>
    <div id="pqprev" class="okbox"></div>
    <div class="f"><label>Precio final del paquete</label><input type="number" id="pqt" inputmode="numeric"></div>
    <label>Medio de pago</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin-bottom:13px">
      ${MEDIOS.map((m,i)=>`<button class="pill ${i===0?'on':''}" data-m="${m.k}"
        onclick="[...document.querySelectorAll('[data-m]')].forEach(x=>x.classList.remove('on'));this.classList.add('on')">${m.n}</button>`).join('')}
    </div>
    <div class="infobox">La plata entra hoy a la caja. La comisión de la profesional se genera
    en cada sesión que se hace, no toda junta hoy.</div>
    <button class="btn pay" onclick="guardarPaquete('${clientaId||''}')">Vender paquete</button>`);
  setTimeout(calcPaquete,40);
}
function calcPaquete(){
  const s=document.getElementById('pqs'), n=+document.getElementById('pqn').value||1,
        d=+document.getElementById('pqd').value||0;
  const pr=+s.options[s.selectedIndex].dataset.p;
  const lista=pr*n, fin=Math.round(lista*(1-d/100)/500)*500;
  document.getElementById('pqprev').innerHTML =
    `${n} sesiones a ${money(pr)} = ${money(lista)} · con ${d}% de descuento: <b>${money(fin)}</b>`;
  document.getElementById('pqt').value = fin;
}
function guardarPaquete(clientaId){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const cid = clientaId || document.getElementById('pqc').value;
  const sid = document.getElementById('pqs').value;
  const n = +document.getElementById('pqn').value||1;
  const imp = +document.getElementById('pqt').value||0;
  const medio = (document.querySelector('[data-m].on')||{dataset:{m:'efectivo'}}).dataset.m;
  DB.paquetes.push({id:uid('pq'), clientaId:cid, servicioId:sid, total:n, usadas:0,
    importe:imp, medio, fecha:hoy(), sucursalId:ST.sucursalId, usuario:usuario().nombre});
  logAcc(`Paquete vendido a ${byId(DB.clientas,cid).nombre}: ${n} sesiones por ${money(imp)}`);
  save(); closeSheet(); render(); toast('Paquete vendido');
}

      ${MEDIOS.map(m=>`<div class="kv"><span>${m.n}${m.rec?' <span class="tiny muted">(con recargo)</span>':''}</span>

/* ============================================================
   LO QUE HAY QUE PAGARLE HOY A CADA PROFESIONAL
   La cajera tiene que poder ver y pagar sin entrar a Comisiones.
   ============================================================ */
function pagosDelDia(fecha, sucursalId){
  const out = {};
  DB.visitas.filter(v=>v.fecha===fecha && v.sucursalId===sucursalId).forEach(v=>{
    v.lineas.filter(l=>l.estado==='fin' && !l.liqId).forEach(l=>{
      const p = byId(DB.profesionales, l.profId); if(!p) return;
      out[p.id] = out[p.id] || {p, lineas:[], facturo:0, comision:0};
      out[p.id].lineas.push({l,v});
      out[p.id].facturo += l.precio;
      out[p.id].comision += comisionLinea(l);
    });
  });
  return Object.values(out).sort((a,b)=>b.comision-a.comision);
}
/* sueldo fijo prorrateado al día, si lo tiene cargado por día */
function fijoDelDia(p){ return (p.fijoFrec==='dia') ? (p.fijoMonto||0) : 0; }

function bloquePagosDelDia(){
  if(!puedeCobrar()) return '';
  const filas = pagosDelDia(hoy(), ST.sucursalId);
  const total = filas.reduce((s,f)=>s+f.comision+fijoDelDia(f.p),0);
  return `
    <div class="h3">A pagar hoy</div>
    ${puedeVerComisiones()?`<div class="small muted" style="padding:0 14px 7px">
      Acá está lo de HOY. Lo de días anteriores y lo que liquida por semana o por mes
      está en <b onclick="go('comisiones')" style="color:var(--acc)">Comisiones</b>.</div>`:''}
    ${filas.length?`<div class="listcard">
      ${filas.map(f=>{
        const fijo=fijoDelDia(f.p);
        return `<button class="lr" onclick="verPagoDelDia('${f.p.id}')">
          <div class="av">${ini(f.p.nombre)}</div>
          <div class="g"><b>${esc(f.p.nombre)}</b>
            <span>${f.lineas.length} servicio${f.lineas.length===1?'':'s'} terminado${f.lineas.length===1?'':'s'} · hizo ${money(f.facturo)}</span>
            ${fijo?`<span class="tiny">comisión ${money(f.comision)} + fijo del día ${money(fijo)}</span>`:''}</div>
          <div class="r"><b style="font-size:16px;color:var(--acc)">${money(f.comision+fijo)}</b><br>
            <span class="tiny">a cobrar</span></div>
        </button>`;}).join('')}
      <div class="lr" style="background:var(--bg)">
        <div class="g"><b>Total a pagar</b><span>sale de la caja de hoy</span></div>
        <div class="r"><b style="font-size:17px">${money(total)}</b></div></div>
    </div>`
    :`<div class="card cardp small muted">Todavía no hay servicios terminados hoy.
      Apenas se finaliza un turno aparece acá cuánto le corresponde a cada una.</div>`}`;
}
function verPagoDelDia(pid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const f = pagosDelDia(hoy(), ST.sucursalId).find(x=>x.p.id===pid);
  if(!f){ toast('No tiene servicios terminados hoy'); return; }
  const fijo = fijoDelDia(f.p);
  sheet('Pagarle a '+f.p.nombre.split(' ')[0], `
    <div class="card cardp" style="margin-bottom:13px">
      <div class="kv"><span class="muted">Servicios terminados hoy</span><b>${f.lineas.length}</b></div>
      <div class="kv"><span class="muted">Facturó</span><b>${money(f.facturo)}</b></div>
      <div class="kv"><span class="muted">Comisión</span><b>${money(f.comision)}</b></div>
      ${fijo?`<div class="kv"><span class="muted">Fijo del día</span><b>${money(fijo)}</b></div>`:''}
      <div class="tot"><span>A pagarle</span><span>${money(f.comision+fijo)}</span></div>
    </div>
    <div class="listcard" style="max-height:230px;overflow-y:auto">
      ${f.lineas.map(({l,v})=>{
        const cl=byId(DB.clientas,v.clientaId), sv=byId(DB.servicios,l.servicioId);
        return `<div class="lr"><div class="g"><b>${esc(sv.nombre)}</b>
          <span>${l.hora} · ${esc(cl?cl.nombre:'')}</span></div>
          <div class="r"><b>${l.exenta?'Exenta':money(comisionLinea(l))}</b><br>
            <span class="tiny">${l.exenta?esc(l.motivo||''):l.comisionPct+'% de '+money(l.precio)}</span></div>
        </div>`;}).join('')}
    </div>
    <div class="infobox" style="margin-top:13px">Al pagarle, esos servicios quedan liquidados y
      el importe se carga como gasto de la caja de hoy, así el arqueo cierra.</div>
    <button class="btn pay" onclick="pagarElDia('${pid}')">${ic('cash','sm')} Pagarle ${money(f.comision+fijo)} ahora</button>`);
}
function pagarElDia(pid){
  if(!puedeCobrar()){ toast('No tenés acceso a la caja'); return; }
  const f = pagosDelDia(hoy(), ST.sucursalId).find(x=>x.p.id===pid);
  if(!f) return;
  const fijo = fijoDelDia(f.p);
  const total = f.comision + fijo;
  const liq = {id:uid('lq'), profId:pid, desde:hoy(), hasta:hoy(),
    lineas:f.lineas.map(x=>x.l.id), comision:f.comision, fijo, total,
    fecha:hoy(), pagada:true, pagadaF:hoy(), usuario:usuario().nombre};
  DB.liquidaciones.push(liq);
  f.lineas.forEach(x=>{ x.l.liqId = liq.id; });
  const g = {id:uid('ga'), sucursalId:ST.sucursalId, fecha:hoy(),
    concepto:'Pago a '+f.p.nombre, importe:total, tipo:'comision'};
  DB.gastos.push(g); liq.gastoId = g.id;
  logAcc(`Pagado el día a ${f.p.nombre}: ${money(total)}`);
  save(); closeSheet(); render();
  toast('Pagado. Quedó cargado en la caja.');
}
