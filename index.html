<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ISIS — Gestión</title>
<style>
:root{
  --bg:#F2F2F4; --card:#FFFFFF; --ink:#16161A; --muted:#5E5E68; --faint:#6B6B75;
  --line:#E3E3E7; --line2:#C2C2CA;
  --acc:#D9202C; --acc2:#B4171F; --accsoft:#FDECEE;
  --bar:#16161A;
  --ok:#26694C; --warn:#8E5B10; --stop:#9B2C2C;
  /* verde = lugar libre, en TODA la app. El rojo no se usa para esto. */
  --freebg:#F0F9F4; --freeln:#8FC2AA; --freetx:#1F6A49;
  --e-res:#A87A00; --e-conf:#2F6FB5; --e-lleg:#24784A; --e-serv:#8250A8;
  --e-fin:#6E6E7A; --e-can:#9B2C2C; --e-no:#77718A;
  --sh:0 1px 3px rgba(22,22,26,.08);
  --sh2:0 6px 24px rgba(22,22,26,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:10px;
  background:var(--card);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.f{margin-bottom:13px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* layout */
#app{max-width:1400px;margin:0 auto;padding:0 0 84px}
.top{
  position:sticky;top:0;z-index:40;background:var(--bar);color:#fff;
  padding:9px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh);
}
.top .logo{height:26px;width:auto;border-radius:4px;flex:none;background:#fff;padding:2px 4px}
.top h1{font-size:16px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:11px;opacity:.82;font-weight:400;display:block;letter-spacing:0}
.top button{color:#fff;padding:7px;border-radius:9px;display:flex;align-items:center}
.top button:active{background:rgba(255,255,255,.18)}
.ico{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:17px;height:17px}
.ico.lg{width:28px;height:28px}

.pad{padding:14px}
.h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.h3{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:22px 0 9px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.center{text-align:center}
.empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:14px}

/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh)}
.card+.card{margin-top:9px}
.cardp{padding:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;
  padding:13px 18px;border-radius:11px;font-weight:600;font-size:15px;
  background:var(--acc);color:#fff;width:100%;
}
.btn:active{background:var(--acc2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.sec:active{background:var(--bg)}
/* cada acción tiene su color. Los que cambian el estado de un turno usan
   exactamente el color de ese estado, para que se aprendan solos. */
.btn.wa  {background:#0B7C40}                       /* WhatsApp */
.btn.wa:active{background:#096632}
.btn.pay {background:#8F5E00}                       /* plata: cobrar, caja */
.btn.pay:active{background:#744B00}
.btn.conf{background:var(--e-conf)}                 /* -> Confirmado */
.btn.lleg{background:var(--e-lleg)}                 /* -> Llegó */
.btn.serv{background:var(--e-serv)}                 /* -> En servicio */
.btn.fin {background:#4A4A55}                       /* -> Finalizado */
.btn.no  {background:var(--card);color:var(--e-no);border:1.5px solid var(--line2)}
.btn.dan {background:var(--card);color:var(--stop);border:1.5px solid var(--stop)}
.btn.dan:active{background:#FBEAEA}
.btn.ok{background:var(--ok)}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:9px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{width:auto;flex:1;min-width:120px}

/* ===== EL DÍA: el inicio es el trabajo, no un menú ===== */
.ahorabox{background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--sh);overflow:hidden;margin-bottom:13px}
.ahsep{padding:9px 13px 7px;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.ahr{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.ahr:last-child{border-bottom:0}
.ahr.n{background:var(--freebg)}
.ahr .hh2{width:42px;flex:none;font-size:12.5px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums;text-align:center}
.ahr .g2{flex:1;min-width:0;text-align:left;padding:2px 0}
.ahr .g2 b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahr .g2 span{display:block;font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.xs{padding:8px 11px;font-size:12.5px;border-radius:9px;width:auto;gap:5px;flex:none}
.q2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.qb{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px;
  text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.qb b{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.qb span{font-size:11.5px;color:var(--muted);line-height:1.25}
.qb:active{background:var(--bg)}

/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:19px 15px;display:flex;flex-direction:column;gap:9px;align-items:flex-start;
  box-shadow:var(--sh);text-align:left;
}
.tile:active{background:var(--bg)}
.tile .ico{color:var(--acc)}
.tile.t-cli .ico{color:#2F6FB5} .tile.t-eq .ico{color:#8250A8}
.tile.t-caja .ico{color:#B07400} .tile.t-esp .ico{color:#0E8A8A}
.tile.t-vou .ico{color:#0B7C40} .tile.t-rep .ico{color:#3F51A8}
.tile.t-cfg .ico{color:#65656E}
.tile b{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.3}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 8px;text-align:center}
.kpi b{display:block;font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.kpi.res b{color:var(--e-res)} .kpi.conf b{color:var(--e-conf)}
.kpi.lleg b{color:var(--e-lleg)} .kpi.no b{color:var(--e-no)}

/* chips / tabs */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 14px;scrollbar-width:none;
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:44px;z-index:30}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--muted);flex:none;
}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.subtabs{display:flex;gap:7px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.ptab{
  padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line2);
  font-size:13px;font-weight:600;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;
}
.ptab.on{background:var(--bar);border-color:var(--bar);color:#fff}
.ptab i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
.ptab.off i{background:var(--faint)}

/* daybar */
.daybar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);
  border-bottom:1px solid var(--line)}
.daybar button{padding:7px;border-radius:8px;color:var(--muted)}
.daybar button:active{background:var(--bg)}
.daybar b{flex:1;text-align:center;font-size:14.5px;font-weight:700}

/* timeline (mobile agenda) */
.tl{padding:8px 14px 0}
.slot{display:flex;gap:11px;align-items:stretch;min-height:34px}
.slot .hr{width:44px;flex:none;font-size:11.5px;color:var(--faint);padding-top:3px;
  font-variant-numeric:tabular-nums}
.slot .bar{flex:1;border-top:1px dashed var(--line);position:relative}
.tcard{
  border-radius:11px;padding:10px 12px;margin:0 0 7px;border:1px solid var(--line);text-align:left;width:100%;
  background:var(--card);box-shadow:var(--sh);border-left-width:4px;
}
.tcard:active{background:var(--bg)}
.tcard .n{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.tcard .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.tcard .t{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;
  font-variant-numeric:tabular-nums}
.tcard.proc{background:repeating-linear-gradient(135deg,var(--card),var(--card) 7px,var(--bg) 7px,var(--bg) 14px)}
.st-res{border-left-color:var(--e-res)} .st-conf{border-left-color:var(--e-conf)}
.st-lleg{border-left-color:var(--e-lleg)} .st-serv{border-left-color:var(--e-serv)}
.st-fin{border-left-color:var(--e-fin);opacity:.72} .st-can{border-left-color:var(--e-can);opacity:.5}
.st-no{border-left-color:var(--e-no);opacity:.55}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.d-res{background:var(--e-res)} .d-conf{background:var(--e-conf)} .d-lleg{background:var(--e-lleg)}
.d-serv{background:var(--e-serv)} .d-fin{background:var(--e-fin)} .d-can{background:var(--e-can)}
.d-no{background:var(--e-no)}
.free{
  border:1px dashed var(--line2);border-radius:10px;padding:9px;text-align:center;
  color:var(--faint);font-size:12.5px;margin:0 0 7px;background:transparent;width:100%;
}
.free:active{background:var(--freebg);color:var(--freetx);border-color:var(--freeln)}
.hueco{
  border:1px dashed var(--freeln);border-radius:10px;padding:10px 12px;margin:0 0 7px;width:100%;
  background:var(--freebg);color:var(--freetx);font-size:12.5px;text-align:left;font-weight:600;
  display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;
}
.hueco:active{background:var(--freetx);color:#fff;border-color:var(--freetx)}
.hueco .hx{margin-left:auto;font-weight:700;opacity:.8}
.hsep{font-size:11.5px;font-weight:700;color:var(--faint);margin:13px 0 7px;
  display:flex;align-items:center;gap:9px;font-variant-numeric:tabular-nums}
.hsep:after{content:'';flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:5px 11px;font-size:12px;color:var(--muted);font-weight:600}
.chip b{color:var(--ink)}
.blk{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;
  margin:0 0 7px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}

/* ===== AGENDA DEL DÍA: todas las profesionales a la vez ===== */
:root{
  --b-res:#9C6300; --b-conf:#2A66AB; --b-lleg:#1B6B42; --b-serv:#7B45A3;
  --b-fin:#66666F; --b-no:#736D82;
}
.diawrap{overflow-x:auto;background:var(--card);border-top:1px solid var(--line);
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.diahead{display:flex;background:var(--card);border-bottom:1.5px solid var(--line2);
  position:sticky;top:0;z-index:6;width:max-content;min-width:100%}
.diahead .hc{width:44px;flex:none;position:sticky;left:0;background:var(--card);z-index:7}
.pcol{flex:1 0 116px;padding:8px 6px;font-size:13px;font-weight:700;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line)}
.pcol span{display:block;font-size:10.5px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.diabody{display:flex;position:relative;width:max-content;min-width:100%}
.horas{width:44px;flex:none;position:sticky;left:0;z-index:4;background:var(--card);
  border-right:1px solid var(--line2)}
.hh{position:absolute;right:6px;font-size:11px;color:var(--muted);font-weight:600;
  transform:translateY(-7px);font-variant-numeric:tabular-nums}
.col{flex:1 0 116px;position:relative;border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent,transparent 55px,var(--line) 55px,var(--line) 56px)}
.off{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#E9E9EE,#E9E9EE 4px,#E1E1E8 4px,#E1E1E8 8px)}
.pau{position:absolute;left:0;right:0;background:#EFEBF7}
.blqz{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#FBE4E4,#FBE4E4 4px,#F4D4D4 4px,#F4D4D4 8px)}
.libre{position:absolute;left:2px;right:2px;border:1.5px dashed var(--freeln);border-radius:8px;
  background:var(--freebg);display:flex;align-items:center;justify-content:center;
  color:var(--freetx);font-size:15px;font-weight:700}
.libre span{font-size:10px;font-weight:600;opacity:.75}
.ev{position:absolute;border-radius:8px;padding:4px 6px;overflow:hidden;color:#fff;
  font-size:10.5px;line-height:1.2;box-shadow:0 1px 3px rgba(22,22,26,.25);
  border:1px solid rgba(255,255,255,.3);text-align:left}
.ev b{display:block;font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev em{display:block;font-style:normal;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i.pr{position:absolute;left:0;right:0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.55),rgba(255,255,255,.55) 3px,transparent 3px,transparent 7px)}
.ev.mini{padding:2px 5px;font-size:10px}
.ev.mini b{font-size:10.5px}
.ahora{position:absolute;left:0;right:0;height:2px;background:var(--acc);z-index:5;pointer-events:none}
.ahora i{position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.ahora b{position:absolute;left:12px;top:-9px;background:var(--acc);color:#fff;font-size:9.5px;
  padding:1px 5px;border-radius:9px;font-weight:700}
.leyenda{display:flex;gap:11px;padding:6px 14px 4px;font-size:10.5px;color:var(--muted);
  overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.leyenda::-webkit-scrollbar{display:none}
.leyenda span{flex:none}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* desktop grid agenda */
.gridwrap{overflow-x:auto;padding:0 14px 14px}
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:11px;overflow:hidden;width:max-content;max-width:100%}
.gh{background:var(--card);padding:8px 6px;font-size:12.5px;font-weight:700;
  position:sticky;top:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{background:var(--card);padding:6px 7px;font-size:11px;color:var(--faint);
  text-align:right;font-variant-numeric:tabular-nums}
.gc{background:var(--card);padding:0 2px;min-height:27px;position:relative}
.gcx{padding:0 2px}
.gsplit{display:flex;gap:2px;height:100%}
.gsplit>.gi{flex:1;min-width:0}
.gc:active{background:var(--freebg)}
.gi{border-radius:7px;padding:4px 6px;font-size:11px;line-height:1.22;height:100%;
  border-left:3px solid;background:var(--bg);overflow:hidden}
.gi b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* list rows */
.lr{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);
  background:var(--card);width:100%;text-align:left}
.lr:active{background:var(--bg)}
.lr:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:#ECECF1;color:#4A4A55;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.lr .g{flex:1;min-width:0}
.lr b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .r{font-size:12.5px;color:var(--faint);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.listcard{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--sh)}

/* badges */
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.bd.ok{background:#E9F5EF;color:var(--ok);border-color:#BCDECD}
.bd.wa{background:#FCF1DE;color:var(--warn);border-color:#EBD3A8}
.bd.st{background:#FBEAEA;color:var(--stop);border-color:#F0CFCF}
.bd.ac{background:var(--accsoft);color:var(--acc2);border-color:#F2C9CD}

/* sheet / modal */
.veil{position:fixed;inset:0;background:rgba(22,22,26,.55);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;box-shadow:var(--sh2);animation:up .2s ease;
}
@keyframes up{from{transform:translateY(30px)}to{transform:translateY(0)}}
.sheet .sh{position:sticky;top:0;background:var(--bg);padding:16px 16px 11px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2}
.sheet .sh b{flex:1;font-size:17px;font-weight:700;letter-spacing:-.02em}
.sheet .sb{padding:16px}
.grab{width:36px;height:4px;background:var(--line2);border-radius:2px;margin:8px auto 0}
@media (min-width:600px){
  .veil{align-items:center}
  .sheet{border-radius:18px;max-height:88vh}
  .grab{display:none}
}

/* bottom nav */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);display:flex;padding:6px 4px 8px;
}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--faint);font-size:10.5px;font-weight:600;border-radius:9px}
.nav button.on{color:var(--acc)}
.nav button.on .ico{stroke-width:2.2}

/* fab */
.fab{position:fixed;right:13px;bottom:76px;z-index:45;width:46px;height:46px;border-radius:15px;
  background:var(--bar);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(22,22,26,.35);opacity:.92}
.fab:active{background:var(--acc2)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:200;
  background:var(--bar);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;
  box-shadow:var(--sh2);max-width:92%;text-align:center}

/* misc */
.sep{height:1px;background:var(--line);margin:14px 0}

const MEDIOS = [
  {k:'efectivo',  n:'Efectivo',      rec:false},
  {k:'transfer',  n:'Transferencia', rec:true},

  {k:'mp',        n:'Mercado Pago',  rec:true}
];
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* ---------- helpers ---------- */
let _id = 1000;
const uid = p => p + (++_id);
const hm  = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const mh  = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const money = n => '$'+Math.round(n).toLocaleString('es-AR');
/* TODO el sistema trabaja con la fecha y la hora de Argentina.
   Antes se usaba UTC: después de las 21:00 la caja, los fichajes y los turnos
   se guardaban con la fecha del día siguiente. */
const TZ = 'America/Argentina/Buenos_Aires';
/* AAAA-MM-DD a partir de los componentes LOCALES de la fecha, nunca UTC */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoy = () => { try{ return new Date().toLocaleDateString('en-CA',{timeZone:TZ}); }
                    catch(e){ return iso(new Date()); } };
const horaAhora = () => { try{
    return new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
  }catch(e){ const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); } };
const ahoraMin = () => mh(horaAhora());
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fechaLarga = s => { const d=parseISO(s);
  return DIAS[d.getDay()]+' '+d.getDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]; };
const fechaCorta = s => { const d=parseISO(s); return DIAS[d.getDay()].slice(0,3)+' '+d.getDate()+'/'+(d.getMonth()+1); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const ini = n => n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr,id) => arr.find(x=>x.id===id);

/* precio de lista = contado + recargo, redondeado SIEMPRE para arriba al múltiplo */
function precioLista(contado){
  const r = DB.cfg.recargo/100, m = DB.cfg.redondeo;
  return Math.ceil(contado*(1+r)/m)*m;
}
function precioSegunMedio(contado, medio){
  const M = MEDIOS.find(x=>x.k===medio);
  return (M && M.rec) ? precioLista(contado) : contado;
}

let DB, MEM=null;
function load(){
  try{
    const raw = localStorage.getItem('isis_db');
    if(raw){ DB = JSON.parse(raw); return; }
  }catch(e){}
  DB = MEM || seed();
  save();
}
function migrar(){
  if(!DB.cfg.permisos) DB.cfg.permisos = JSON.parse(JSON.stringify(PERM_DEF));
  /* --- cambios de versión sobre bases ya guardadas: EN ORDEN, de la más vieja a la más nueva --- */
  if(!DB.cfg.v || DB.cfg.v < 2){
    /* la supervisora pasa a administrar las clientas de su área */
    if(DB.cfg.permisos.supervisora && DB.cfg.permisos.supervisora.clientas==='ver')
      DB.cfg.permisos.supervisora.clientas='todo';
    /* las notas que ya estaban cargadas son notas DE TRABAJO (tono, potencia, alergias) */
    DB.clientas.forEach(c=>{ if(c.notasInt===undefined) c.notasInt=''; });
    /* los pagos viejos: cuánto del precio de contado cubrió cada uno */
    DB.visitas.forEach(v=>v.pagos.forEach(p=>{
      if(p.contado===undefined) p.contado = MEDIOS.find(m=>m.k===p.medio)?.rec
        ? Math.round(p.importe/(1+(DB.cfg.recargo||0)/100)) : p.importe;
    }));
    DB.cfg.v = 2;
  }
  if(DB.cfg.v < 3){
    /* el ejemplo de excepción por persona pasa a ser de agenda: una supervisora
       no entra a la caja ni con excepción cargada por error */
    const u4 = byId(DB.usuarios,'us4');
    if(u4 && u4.rol==='supervisora' && u4.permisos && u4.permisos.caja){
      delete u4.permisos.caja; u4.permisos.agenda='suc';
    }
    DB.cfg.v = 3;
  }
  if(DB.cfg.v < 4){
    /* una supervisora puede tener varias áreas: el campo pasa a ser una lista */
    DB.usuarios.forEach(u=>{ if(!Array.isArray(u.areas)) u.areas = u.areaId?[u.areaId]:[]; });
    /* recepción pasa a poder manejar horarios de su sucursal */
    if(DB.cfg.permisos.recepcion && DB.cfg.permisos.recepcion.equipo==='ver')
      DB.cfg.permisos.recepcion.equipo='suc';
    DB.usuarios.forEach(u=>{ if(u.rol==='recepcion' && u.permisos && u.permisos.equipo==='ver')
      delete u.permisos.equipo; });
    DB.cfg.v = 4;
  }
  DB.clientas.forEach(c=>{ if(c.notasInt===undefined) c.notasInt=''; });
  DB.liquidaciones = DB.liquidaciones || [];
  DB.excepciones = DB.excepciones || [];
  DB.usuarios.forEach(u=>{ if(!u.permisos) u.permisos={}; if(u.activo===undefined) u.activo=true; });
  DB.profesionales.forEach(p=>{ if(!p.fichaje) p.fichaje='foto'; });
  /* las fotos de fichaje viejas se borran solas para no llenar la memoria */
  const lim = addDays(hoy(), -60);
  DB.fichadas.forEach(f=>{ if(f.fecha<lim){ delete f.fotoEntrada; delete f.fotoSalida; } });
}
let SIN_ESPACIO = false;
function save(){
  MEM = DB;
  try{
    localStorage.setItem('isis_db', JSON.stringify(DB));
    if(SIN_ESPACIO){ SIN_ESPACIO=false; render(); }
  }catch(e){
    /* la memoria se llenó: hay que avisar, NUNCA fallar en silencio */
    if(!SIN_ESPACIO){ SIN_ESPACIO=true; render(); }
  }
}
function pesoBase(){ try{ return JSON.stringify(DB).length; }catch(e){ return 0; } }
/* copia de seguridad: baja todo a un archivo */
function exportarBase(){
  const blob = new Blob([JSON.stringify(DB)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'isis-copia-'+hoy()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Copia descargada');
}
function importarBase(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.visitas || !d.servicios) throw new Error('no parece una copia de Isis');
      DB = d; migrar(); save(); closeSheet(); ST.view='home'; render();
      toast('Copia restaurada');
    }catch(e){ alert('No se pudo leer el archivo: '+e.message); }
  };
  r.readAsText(f);
}
/* archivar lo viejo para liberar memoria, bajando antes una copia */
function liberarEspacio(){
  const meses = [6,12,18];
  sheet('Liberar espacio', `
    <div class="warnbox">${ic('alert','sm')} La memoria de este dispositivo se llenó.
    Antes de archivar nada, bajá una copia de seguridad con todo.</div>
    <button class="btn" onclick="exportarBase()">${ic('list','sm')} Bajar copia de seguridad</button>
    <div class="h3">Archivar turnos viejos</div>
    <div class="small muted" style="margin-bottom:11px">Se sacan de este dispositivo los turnos
    anteriores a la fecha que elijas. Las clientas, el equipo, los precios y la configuración
    no se tocan.</div>
    <div class="listcard">${meses.map(m=>{
      const lim = addDays(hoy(), -m*30);
      const n = DB.visitas.filter(v=>v.fecha<lim).length;
      return `<button class="lr" onclick="archivar('${lim}')">
        <div class="g"><b>Anteriores a hace ${m} meses</b><span>${n} turnos se archivan</span></div>
        ${ic('chev','sm')}</button>`;}).join('')}</div>`);
}
function archivar(lim){
  const n = DB.visitas.filter(v=>v.fecha<lim).length;
  if(!confirm(`Se van a archivar ${n} turnos anteriores al ${fechaCorta(lim)}. ¿Bajaste la copia de seguridad?`)) return;
  DB.visitas = DB.visitas.filter(v=>v.fecha>=lim);
  DB.fichadas = DB.fichadas.filter(f=>f.fecha>=lim);
  save(); closeSheet(); render();
  toast(n+' turnos archivados');
}
function reset(){
  if(!puedeConfig()){ toast('No tenés acceso a la configuración'); return; }
  try{ localStorage.removeItem('isis_db'); }catch(e){}
  MEM=null; _id=1000; DB=seed(); save(); ST.view='home'; render();
  toast('Datos de ejemplo restaurados');
}

  return P[k];
}

   MOTOR DE DISPONIBILIDAD
   ============================================================ */

/* tramos en que la profesional está OCUPADA por una línea
   (trabaja -> proceso libre -> vuelve a trabajar) */
function tramosOcupados(linea){
  const sv = byId(DB.servicios, linea.servicioId);
  const ini = mh(linea.hora);
  if(!sv) return [[ini, ini+linea.dur]];
  if(sv.proceso>0 && sv.trabajo2>0){
    return [[ini, ini+sv.trabajo1],[ini+sv.trabajo1+sv.proceso, ini+sv.dur]];
  }
  if(sv.proceso>0) return [[ini, ini+sv.trabajo1]];
  return [[ini, ini+sv.dur]];
}
function lineasDe(fecha, filtro){
  const out=[];
  DB.visitas.filter(v=>v.fecha===fecha).forEach(v=>{
    v.lineas.forEach(l=>{
      if(l.estado==='can') return;
      if(filtro && !filtro(l,v)) return;
      out.push({...l, visita:v});
    });
  });
  return out;
}
/* horario HABITUAL (base) de una profesional en un área un día */
function horarioBase(profId, areaId, fecha){
  const as = DB.asign.find(a=>a.profId===profId && a.areaId===areaId);
  if(!as) return null;
  const dia = parseISO(fecha).getDay();
  return DB.horarios.find(x=>x.asignId===as.id && x.dia===dia) || null;
}
/* excepción vigente para esa persona esa fecha */
function excepcionDe(profId, fecha){
  return DB.excepciones.find(e=>e.profId===profId && fecha>=e.desdeF && fecha<=e.hastaF) || null;
}
/* DISPONIBILIDAD REAL = horario habitual + excepciones.
   Es lo que usa toda la agenda. */
function horarioDe(profId, areaId, fecha){
  const ex = excepcionDe(profId, fecha);
  if(ex){
    if(['no','vacaciones','licencia'].includes(ex.tipo)) return null;
    if(ex.tipo==='traslado'){
      /* ese día trabaja en otra área: solo aparece ahí */
      if(ex.areaId!==areaId) return null;
      if(!DB.asign.find(a=>a.profId===profId && a.areaId===areaId)) return null;
      return {desde:ex.desde||'09:00', hasta:ex.hasta||'17:00', pausaD:null, pausaH:null, excepcion:ex};
    }
    if(ex.tipo==='horario'){
      const base = horarioBase(profId, areaId, fecha);
      if(!base) return null;
      return {...base, desde:ex.desde||base.desde, hasta:ex.hasta||base.hasta, excepcion:ex};
    }
  }
  /* si ese día la trasladaron a otra área, no aparece en la suya */
  return horarioBase(profId, areaId, fecha);
}
function bloqueosDe(profId, fecha){
  return DB.bloqueos.filter(b=>b.profId===profId && b.fecha===fecha);
}
/* cuántas atenciones activas tiene la profesional en [a,b) */
function solapadas(profId, fecha, a, b, exceptoLineaId){
  let n=0;
  /* si la clienta no asistió, la profesional quedó libre: ese rato se puede volver a usar */
  lineasDe(fecha, l=>l.profId===profId && l.id!==exceptoLineaId && l.estado!=='no').forEach(l=>{
    tramosOcupados(l).forEach(([x,y])=>{ if(a < y && b > x) n++; });
  });
  return n;
}
/* huecos donde entra un servicio */
function huecos(profId, areaId, fecha, servicioId){
  const h = horarioDe(profId, areaId, fecha);
  if(!h) return [];
  const sv = byId(DB.servicios, servicioId);
  const desde = mh(h.desde), hasta = mh(h.hasta);
  const pausa = h.pausaD ? [mh(h.pausaD), mh(h.pausaH)] : null;
  const blqs = bloqueosDe(profId, fecha).map(b=>[mh(b.desde), mh(b.hasta)]);
  const out=[];
  for(let t=desde; t+sv.dur<=hasta; t+=15){
    const fin = t+sv.dur;
    if(pausa && t < pausa[1] && fin > pausa[0]) continue;
    if(blqs.some(([x,y])=> t<y && fin>x)) continue;
    /* tramos activos del nuevo servicio */
    const nuevos = sv.proceso>0 && sv.trabajo2>0
      ? [[t,t+sv.trabajo1],[t+sv.trabajo1+sv.proceso, fin]]
      : sv.proceso>0 ? [[t,t+sv.trabajo1]] : [[t,fin]];
    let libre = true;
    for(const [a,b] of nuevos){
      if(solapadas(profId, fecha, a, b) >= sv.simult){ libre=false; break; }
    }
    if(libre) out.push(hm(t));
  }
  return out;
}
/* TRAMOS LIBRES de una profesional en el dia (sin pensar en un servicio puntual):
   lo que queda del horario despues de sacar turnos, bloqueos y pausa.
   Es lo que la agenda del celular muestra como espacios tocables. */
function huecosLibres(profId, areaId, fecha){
  const h = horarioDe(profId, areaId, fecha);
  if(!h) return [];
  const desde = mh(h.desde), hasta = mh(h.hasta);
  const ocup = [];
  /* todos sus turnos del día, de cualquier área: si está ocupada en otra, no está libre acá.
     Los turnos donde la clienta no asistió liberan el horario. */
  lineasDe(fecha, l=>l.profId===profId && l.estado!=='no').forEach(l=> ocup.push([mh(l.hora), mh(l.hora)+l.dur]));
  bloqueosDe(profId, fecha).forEach(b=> ocup.push([mh(b.desde), mh(b.hasta)]));
  if(h.pausaD) ocup.push([mh(h.pausaD), mh(h.pausaH)]);
  ocup.sort((a,b)=>a[0]-b[0]);
  const out=[]; let t=desde;
  ocup.forEach(([a,b])=>{ if(a>t && a>desde) out.push([t, Math.min(a,hasta)]); if(b>t) t=b; });
  if(t<hasta) out.push([t,hasta]);
  return out.filter(([a,b])=> b-a>=15);
}
function durTxt(m){
  const h=Math.floor(m/60), r=m%60;
  return h? (h+' h'+(r?' '+r+'′':'')) : (r+'′');
}
/* profesionales que pueden hacer un servicio en un área */
function profesDe(areaId, servicioId){
  return DB.asign.filter(a=>a.areaId===areaId && (!servicioId || a.servicios.includes(servicioId)))
    .map(a=>byId(DB.profesionales, a.profId)).filter(p=>p && p.activa);
}
function profesDelDia(areaId, fecha){
  return profesDe(areaId).filter(p=>horarioDe(p.id, areaId, fecha));
}

/* ============================================================
   CÁLCULOS DE PLATA
   ============================================================ */
/* una línea cubierta por un paquete o un voucher ya está paga: no se vuelve a cobrar,
   pero la comisión de la profesional se genera igual */
function cubierta(l){ return l.paqueteId?'Paquete':(l.voucherId?'Voucher':null); }
function totalVisita(v){
  return v.lineas.filter(l=>l.estado!=='can' && !cubierta(l))
    .reduce((s,l)=> s + (l.precio - (l.descuento||0)), 0);
}
/* CUÁNTO DEL PRECIO DE CONTADO cubrió cada pago.
   Un pago con tarjeta de $11.500 con 15% de recargo cubre $10.000 de contado.
   Así el recargo se cobra SOLO sobre la parte que se paga con tarjeta,
   nunca sobre lo que ya se pagó en efectivo. */
function pagadoVisita(v){ return v.pagos.reduce((s,p)=>s+(p.contado!=null?p.contado:p.importe),0); }
/* plata que realmente entró a la caja */
function cobradoVisita(v){ return v.pagos.reduce((s,p)=>s+p.importe,0); }
function saldoVisita(v){ return totalVisita(v) - pagadoVisita(v); }
/* cuánto hay que cobrar para saldar, según con qué se paga */
function aCobrarCon(saldoContado, medio){
  const M = MEDIOS.find(m=>m.k===medio);
  return (M && M.rec) ? precioLista(saldoContado) : saldoContado;
}
function comisionLinea(l){
  if(l.exenta) return 0;
  return Math.round(l.precio * (l.comisionPct/100));   /* SIEMPRE sobre contado */
}

/* ============================================================
   BORRAR COSAS
   Todo se puede editar y sacar desde adentro de la app.
   Regla: si NO tiene historial atado, se borra de verdad.
   Si tiene, se deja SIN USO: desaparece de las pantallas pero el historial queda.
   ============================================================ */
function ataduras(tipo, id){
  const L=[]; const n=(c,uno,varios)=>{ if(c) L.push(c+' '+(c===1?uno:varios)); };
  if(tipo==='sucursal'){
    n(DB.areas.filter(a=>a.sucursalId===id).length,'área','áreas');
    n(DB.visitas.filter(v=>v.sucursalId===id).length,'turno','turnos');
    n(DB.caja.filter(c=>c.sucursalId===id).length,'día de caja','días de caja');
    n(DB.gastos.filter(g=>g.sucursalId===id).length,'gasto','gastos');
    n(DB.usuarios.filter(u=>u.sucursalId===id).length,'usuario asignado','usuarios asignados');
    n(DB.vouchers.filter(v=>v.sucursalId===id).length,'voucher','vouchers');
    n(DB.paquetes.filter(p=>p.sucursalId===id).length,'paquete','paquetes');
  }
  if(tipo==='area'){
    n(DB.visitas.reduce((t,v)=>t+v.lineas.filter(l=>l.areaId===id).length,0),'turno','turnos');
    n(DB.usuarios.filter(u=>areasDeUsuario(u).includes(id)).length,'usuario que la supervisa','usuarios que la supervisan');
  }
  if(tipo==='servicio'){
    n(DB.visitas.reduce((t,v)=>t+v.lineas.filter(l=>l.servicioId===id).length,0),'turno','turnos');
    n(DB.paquetes.filter(p=>p.servicioId===id).length,'paquete','paquetes');
    n(DB.vouchers.filter(v=>v.servicios.includes(id)).length,'voucher','vouchers');
    n(DB.espera.filter(e=>e.servicioId===id).length,'anotación en la lista de espera','anotaciones en la lista de espera');
  }
  if(tipo==='profesional'){
    n(DB.visitas.reduce((t,v)=>t+v.lineas.filter(l=>l.profId===id).length,0),'turno','turnos');
    n(DB.fichadas.filter(f=>f.profId===id).length,'fichada','fichadas');
    n(DB.liquidaciones.filter(x=>x.profId===id).length,'liquidación','liquidaciones');
    n(DB.usuarios.filter(u=>u.profId===id).length,'usuario','usuarios');
  }
  if(tipo==='clienta'){
    n(DB.visitas.filter(v=>v.clientaId===id).length,'visita','visitas');
    n(DB.paquetes.filter(p=>p.clientaId===id).length,'paquete','paquetes');
    n(DB.vouchers.filter(v=>v.clientaId===id).length,'voucher','vouchers');
    n(DB.espera.filter(e=>e.clientaId===id).length,'anotación en la lista de espera','anotaciones en la lista de espera');
  }
  return L;
}
/* pantalla única de borrado: explica qué pasa y ofrece la salida correcta */
function pedirBorrar(o){

  const at = ataduras(o.tipo, o.id);

/* ============================================================
   AVISOS Y MOTIVOS
   Nada se traba: todo se puede forzar. Pero el sistema dice exactamente
   qué pasa y pide un motivo corto que queda escrito en el movimiento.
   ============================================================ */
/* qué problemas tiene poner (o mover) un turno ahí */
function avisosDeTurno(profId, areaId, fecha, desdeMin, dur, exceptoLineaId){
  const av=[];
  const p = byId(DB.profesionales, profId);
  const n = p?p.nombre.split(' ')[0]:'Ella';
  const ex = excepcionDe(profId, fecha);
  const h = horarioDe(profId, areaId, fecha);
  const fin = desdeMin+dur;
  if(ex && ['vacaciones','licencia'].includes(ex.tipo))
    av.push(`${n} está de ${ex.tipo==='vacaciones'?'vacaciones':'licencia'} ese día.`);
  else if(ex && ex.tipo==='no') av.push(`${n} no trabaja ese día${ex.motivo?' ('+ex.motivo+')':''}.`);
  else if(ex && ex.tipo==='traslado' && ex.areaId!==areaId) av.push(`${n} ese día va a otra área.`);
  if(!h){ if(!av.length) av.push(`${n} no tiene horario cargado ese día.`); }
  else{
    if(desdeMin < mh(h.desde) || fin > mh(h.hasta))
      av.push(`Queda fuera de su horario: trabaja de ${h.desde} a ${h.hasta}.`);
    if(h.pausaD && desdeMin < mh(h.pausaH) && fin > mh(h.pausaD))
      av.push(`Cae en su pausa de ${h.pausaD} a ${h.pausaH}.`);
  }
  bloqueosDe(profId, fecha).forEach(b=>{
    if(desdeMin<mh(b.hasta) && fin>mh(b.desde))
      av.push(`Tiene ese rato bloqueado, ${b.desde} a ${b.hasta}${b.motivo?': '+b.motivo:''}.`); });
  lineasDe(fecha, l=>l.profId===profId && l.id!==exceptoLineaId && l.estado!=='no').forEach(l=>{
    const cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
    const nom = cl?cl.nombre.split(' ')[0]:'otra clienta';
    let choca=false;
    tramosOcupados(l).forEach(([a,b])=>{ if(desdeMin<b && fin>a) choca=true; });
    if(choca) av.push(`Está atendiendo a ${nom} (${sv?sv.nombre:''} ${l.hora}, ${EST[l.estado].n.toLowerCase()}).`);
    else if(sv && sv.proceso>0){
      const i=mh(l.hora), pa=i+sv.trabajo1, pb=pa+sv.proceso;
      if(desdeMin<pb && fin>pa) av.push(`En ese rato ${nom} está en proceso: queda libre pero vuelve a las ${hm(pb)}.`);
    }
  });
  return [...new Set(av)];
}
/* ¿hace falta forzarlo? Si el horario está entre los libres de verdad, no. */
function hayQueForzar(profId, areaId, fecha, hora, servicioId){
  return !huecos(profId, areaId, fecha, servicioId).includes(hora);
}
/* lo mismo para un turno que YA existe y se está moviendo o reasignando
   (no se cuenta a sí mismo como ocupación) */
function forzarPara(profId, areaId, fecha, hora, servicioId, dur, exceptoLineaId){
  const sv = byId(DB.servicios, servicioId); if(!sv) return true;
  const h = horarioDe(profId, areaId, fecha);
  const t = mh(hora), fin = t + (dur||sv.dur);
  if(!h) return true;
  if(t < mh(h.desde) || fin > mh(h.hasta)) return true;
  if(h.pausaD && t < mh(h.pausaH) && fin > mh(h.pausaD)) return true;
  if(bloqueosDe(profId, fecha).some(b=> t<mh(b.hasta) && fin>mh(b.desde))) return true;
  const nuevos = sv.proceso>0 && sv.trabajo2>0
    ? [[t,t+sv.trabajo1],[t+sv.trabajo1+sv.proceso, fin]]
    : sv.proceso>0 ? [[t,t+sv.trabajo1]] : [[t,fin]];
  return nuevos.some(([a,b])=> solapadas(profId, fecha, a, b, exceptoLineaId) >= sv.simult);
}

function diaCumple(c){
  const d = parseISO(c.nacimiento);
  return d.getDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()];
}
function clientasCumpleSemana(){
  const n=new Date(), fin=new Date(); fin.setDate(fin.getDate()+7);
  return DB.clientas.filter(c=>{
    if(!c.nacimiento) return false;
    const d=parseISO(c.nacimiento); const y=n.getFullYear();
    const este=new Date(y,d.getMonth(),d.getDate());
    return este>=new Date(y,n.getMonth(),n.getDate()) && este<=fin;
  });
}
function clientasPerdidas(){
  const lim = addDays(hoy(), -DB.cfg.diasSinVenir);
  return DB.clientas.filter(c=>{
    const vs = DB.visitas.filter(v=>v.clientaId===c.id).map(v=>v.fecha).sort();
    if(!vs.length) return false;
    return vs[vs.length-1] < lim;
  });
}
function verPerdidas(){
  const ps = clientasPerdidas();
  sheet('Clientas para reactivar', `<div class="listcard">${ps.map(c=>{
    const vs = DB.visitas.filter(v=>v.clientaId===c.id).map(v=>v.fecha).sort();

    const dias = Math.round((parseISO(hoy())-parseISO(ult))/86400000);
    return `<div class="lr"><div class="av">${ini(c.nombre)}</div>

}

function areasDeSucursal(){
  let as = DB.areas.filter(a=>a.sucursalId===ST.sucursalId && a.activa).sort((x,y)=>x.orden-y.orden);

  if(perm('clientas')!=='prop') return DB.clientas;

  DB.visitas.forEach(v=>v.lineas.forEach(l=>{ if(l.profId===u.profId) ids.add(v.clientaId); }));

function vAgenda(){
  const areas = areasDeSucursal();
  if(!areas.length) return `<div class="empty">Esta sucursal todavía no tiene áreas cargadas.</div>`;
  const verDia = puedeVerDiaCompleto();
  /* si no tiene permiso de ver la sucursal entera, nunca queda parado en esa vista */
  if(ST.areaId==='__dia' && !verDia) ST.areaId = null;
  const esDia = ST.areaId==='__dia';
  if(!esDia && (!ST.areaId || !areas.find(a=>a.id===ST.areaId))) ST.areaId = areas[0].id;
  const area = esDia ? null : byId(DB.areas, ST.areaId);
  let profes = [];
  if(!esDia){
    profes = profesDelDia(area.id, ST.fecha);
    /* quien tenga turnos ese día también va, aunque no tenga horario cargado:
       si no, un turno forzado o movido desaparecía de la agenda */
    const conTurnos = [...new Set(lineasDe(ST.fecha, l=>l.areaId===area.id).map(l=>l.profId))];
    conTurnos.forEach(pid=>{ if(!profes.some(p=>p.id===pid)){
      const p=byId(DB.profesionales,pid); if(p) profes.push(p); } });
    profes.sort((x,y)=>x.nombre.localeCompare(y.nombre));
    if(perm('agenda')==='prop') profes = profes.filter(p=>p.id===usuario().profId);
    if(!ST.profTab || !profes.find(p=>p.id===ST.profTab)) ST.profTab = profes[0]?.id || null;
  }

  return `
    <div class="tabs">
      ${verDia?`<button class="tab ${esDia?'on':''}"
        onclick="ST.areaId='__dia';ST.profTab=null;render()">📋 Todo el día</button>`:''}
      ${areas.map(a=>`<button class="tab ${a.id===ST.areaId?'on':''}"

    </div>
    <div class="daybar" style="padding:6px 14px">
      <button onclick="ST.fecha=addDays(ST.fecha,-1);render()">${ic('left')}</button>
      <b style="font-size:13.5px">${ST.fecha===hoy()?'HOY · ':''}${fechaCorta(ST.fecha)}</b>
      ${ST.fecha!==hoy()?`<button class="btn sm sec" style="padding:4px 10px"
        onclick="ST.fecha=hoy();render()">Hoy</button>`:''}
      <button onclick="ST.fecha=addDays(ST.fecha,1);render()">${ic('right')}</button>
      <button onclick="buscarAgenda()" aria-label="Buscar un turno">${ic('search')}</button>
    </div>
    ${esDia
      ? agendaDia()
      : (profes.length===0
        ? `<div class="empty">Nadie trabaja en ${esc(area.nombre)} este día.</div>`
        : agendaDelDia(area, profes))}
    ${puedeEditarAgenda()?`<button class="fab" onclick="nuevoTurno()">${ic('plus','lg')}</button>`:''}
  `;
}

/* --- vista TODO EL DÍA de la sucursal (recepción): todas las áreas juntas, por hora --- */
function agendaDia(){
  const ids = DB.areas.filter(a=>a.sucursalId===ST.sucursalId && a.activa).map(a=>a.id);
  const ls = lineasDe(ST.fecha, (l,v)=> v.sucursalId===ST.sucursalId && ids.includes(l.areaId))
    .sort((a,b)=> mh(a.hora)-mh(b.hora) || (a.areaId<b.areaId?-1:1));
  if(!ls.length) return `<div class="empty">No hay turnos cargados este día en la sucursal.</div>`;
  const cnt = k => ls.filter(l=>l.estado===k).length;
  const deben = new Set(ls.filter(l=>['lleg','serv','fin'].includes(l.estado) && saldoVisita(l.visita)>0)
    .map(l=>l.visita.id)).size;
  let ultima = null;
  return `
    <div class="chips">
      <span class="chip"><b>${ls.length}</b> turnos</span>
      <span class="chip">Por llegar <b>${cnt('res')+cnt('conf')}</b></span>
      <span class="chip">Acá <b>${cnt('lleg')+cnt('serv')}</b></span>
      <span class="chip">Terminados <b>${cnt('fin')}</b></span>
      ${(deben&&puedeCobrar())?`<span class="chip" style="border-color:var(--warn);color:var(--warn)">Deben <b>${deben}</b></span>`:''}
    </div>
    <div class="tl">
      ${ls.map(l=>{
        const cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
        const pr=byId(DB.profesionales,l.profId), ar=byId(DB.areas,l.areaId);
        const franja = l.hora.slice(0,2)+':00';
        const sep = franja!==ultima ? `<div class="hsep">${franja}</div>` : '';
        ultima = franja;
        const saldo = saldoVisita(l.visita);
        return `${sep}<button class="tcard st-${l.estado}" onclick="abrirTurno('${l.visita.id}','${l.id}')">
          <div class="n">${l.hora} · ${esc(cl.nombre)}</div>
          <div class="s">${esc(sv.nombre)} · ${esc(pr.nombre.split(' ')[0])}</div>
          <div class="t">
            <span>${ar?ar.icono+' '+esc(ar.nombre):''}</span>
            <span style="display:inline-flex;align-items:center;gap:5px"><i class="dot d-${l.estado}"></i>${EST[l.estado].n}</span>
            ${(['lleg','serv','fin'].includes(l.estado) && saldo>0 && puedeCobrar())
              ?`<span style="color:var(--warn)">Debe ${money(saldo)}</span>`:''}
          </div>
        </button>`;
      }).join('')}
      <div style="height:20px"></div>
    </div>`;
}

/* ============================================================
   AGENDA DEL DÍA — como se ve en cualquier sistema de salón:
   la hora a la izquierda, una columna por profesional, todo junto.
   ============================================================ */
let GRID={desde:540,H:14,paso:15};
function agendaDelDia(area, profes){
  const H=14, PASO=15;
  const hs = profes.map(p=>horarioDe(p.id, area.id, ST.fecha)).filter(Boolean);
  const dia = lineasDe(ST.fecha, l=>l.areaId===area.id && profes.some(p=>p.id===l.profId));
  let desde = Math.min(...hs.map(h=>mh(h.desde)), ...dia.map(l=>mh(l.hora)), 9*60);
  let hasta = Math.max(...hs.map(h=>mh(h.hasta)), ...dia.map(l=>mh(l.hora)+l.dur), 18*60);
  desde = Math.floor(desde/60)*60; hasta = Math.ceil(hasta/60)*60;
  GRID = {desde, H, paso:PASO};
  const alto = (hasta-desde)/PASO*H;
  const y = m => (m-desde)/PASO*H;
  const ahora = (ST.fecha===hoy()) ? ahoraMin() : null;

  /* turnos de cada profesional, con las superposiciones puestas lado a lado */
  const porProf = {};
  profes.forEach(p=>{
    const ls = dia.filter(l=>l.profId===p.id).sort((a,b)=>mh(a.hora)-mh(b.hora));
    const fin = [];
    ls.forEach(l=>{
      const i=mh(l.hora), f=i+l.dur;
      let c=0; while(fin[c]!==undefined && fin[c]>i) c++;
      fin[c]=f; l._c=c;
    });
    const n = Math.max(1, fin.length);
    ls.forEach(l=>l._n=n);
    porProf[p.id]=ls;
  });

  const columna = p => {
    const h = horarioDe(p.id, area.id, ST.fecha);
    const ls = porProf[p.id]||[];
    let fondo='';
    if(!h){ fondo = `<div class="off" style="top:0;height:${alto}px"></div>`; }
    else{
      const d=mh(h.desde), t=mh(h.hasta);
      if(d>desde) fondo += `<div class="off" style="top:0;height:${y(d)}px"></div>`;
      if(t<hasta) fondo += `<div class="off" style="top:${y(t)}px;height:${alto-y(t)}px"></div>`;
      if(h.pausaD) fondo += `<div class="pau" style="top:${y(mh(h.pausaD))}px;height:${(mh(h.pausaH)-mh(h.pausaD))/PASO*H}px"></div>`;
    }
    bloqueosDe(p.id, ST.fecha).forEach(b=>{
      fondo += `<div class="blqz" style="top:${y(mh(b.desde))}px;height:${(mh(b.hasta)-mh(b.desde))/PASO*H}px"
        title="${esc(b.motivo||'Bloqueado')}"></div>`;
    });
    /* dónde hay lugar */
    let libres='';
    if(puedeEditarAgenda() && h){
      huecosLibres(p.id, area.id, ST.fecha).forEach(([a,b])=>{
        const alt=(b-a)/PASO*H;
        if(alt<16) return;
        libres += `<div class="libre" style="top:${y(a)+1}px;height:${alt-2}px">
          ${alt>34?`+<span style="margin-left:4px">${durTxt(b-a)} libre</span>`:'+'}</div>`;
      });
    }
    const eventos = ls.map(l=>{
      const cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
      const top=y(mh(l.hora)), alt=Math.max(16, l.dur/PASO*H);
      const w=100/l._n, left=l._c*w;
      const col='var(--b-'+l.estado+')';
      let proceso='';
      if(sv && sv.proceso>0 && sv.trabajo2>0){
        proceso = `<i class="pr" style="top:${sv.trabajo1/PASO*H}px;height:${sv.proceso/PASO*H}px"></i>`;
      }
      const nom = cl?cl.nombre.split(' ')[0]+' '+((cl.nombre.split(' ')[1]||'')[0]||''):'';
      return `<div class="ev ${alt<32?'mini':''}" style="top:${top}px;height:${alt-2}px;left:${left}%;width:${w}%;
        background:${col};${l.estado==='fin'?'opacity:.75;':''}"
        onclick="event.stopPropagation();abrirTurno('${l.visita.id}','${l.id}')">
        ${proceso}
        <b>${esc(nom)}</b>
        ${alt>=32?`<em>${esc(sv?sv.nombre:'')}</em>`:''}
        ${alt>=46?`<em>${l.hora} · ${EST[l.estado].n}</em>`:''}
      </div>`;
    }).join('');
    return `<div class="col" onclick="clicAgenda(event,'${p.id}')" style="height:${alto}px">

  };

  const horas=[];
  for(let t=desde;t<=hasta;t+=60) horas.push(`<div class="hh" style="top:${y(t)}px">${hm(t)}</div>`);

  return `
    <div class="leyenda">
      <span><i style="background:var(--b-res)"></i>Reservado</span>
      <span><i style="background:var(--b-conf)"></i>Confirmado</span>
      <span><i style="background:var(--b-lleg)"></i>Llegó</span>
      <span><i style="background:var(--b-serv)"></i>Atendiendo</span>
      <span><i style="background:var(--b-fin)"></i>Terminado</span>
      <span><i style="background:#F0F9F4;border:1px solid #9FCBB4"></i>Libre</span>
    </div>
    <div class="diawrap">
      <div class="diahead">
        <div class="hc"></div>
        ${profes.map(p=>{
          const h=horarioDe(p.id,area.id,ST.fecha);
          return `<div class="pcol">${esc(p.nombre.split(' ')[0])}
            <span>${h?h.desde+'-'+h.hasta:'no trabaja'}</span></div>`;}).join('')}
      </div>
      <div class="diabody" style="height:${alto}px">
        <div class="horas" style="height:${alto}px">${horas.join('')}</div>
        ${profes.map(columna).join('')}
        ${(ahora!=null && ahora>=desde && ahora<=hasta)
          ? `<div class="ahora" style="top:${y(ahora)}px;left:44px"><i></i><b>${horaAhora()}</b></div>`:''}
      </div>
    </div>
    <div class="small muted" style="padding:10px 14px 0">
      Tocá cualquier hueco para cargar un turno ahí. Las rayas dentro de un turno son el tiempo de
      proceso: ahí la profesional queda libre.
    </div>`;
}
/* tocar un lugar vacío de la columna = nuevo turno a esa hora */
function clicAgenda(ev, profId){
  if(!puedeEditarAgenda()) return;
  const col = ev.currentTarget;
  const y = ev.clientY - col.getBoundingClientRect().top;
  let min = GRID.desde + Math.floor(y/GRID.H)*GRID.paso;
  min = Math.max(GRID.desde, min);
  nuevoTurno(profId, hm(min));
}

/* --- vista celular: una profesional por vez (ya no se usa) --- */
function agendaMovil(area, profes){
  const p = byId(DB.profesionales, ST.profTab) || profes[0];
  const h = horarioDe(p.id, area.id, ST.fecha);
  const ls = lineasDe(ST.fecha, l=>l.profId===p.id && l.areaId===area.id)
    .sort((a,b)=>mh(a.hora)-mh(b.hora));
  const blqs = bloqueosDe(p.id, ST.fecha);

  let cuerpo = '';
  if(!h){ cuerpo = `<div class="empty">No trabaja este día.</div>`; }
  else{
    const items = [];
    ls.forEach(l=>items.push({t:mh(l.hora), tipo:'turno', l}));
    blqs.forEach(b=>items.push({t:mh(b.desde), tipo:'blq', b}));
    if(h.pausaD) items.push({t:mh(h.pausaD), tipo:'pausa', h});
    /* los ratos libres se muestran como espacios tocables, en su lugar del día */
    const libres = puedeEditarAgenda() ? huecosLibres(p.id, area.id, ST.fecha) : [];
    libres.forEach(([a,b])=>items.push({t:a, tipo:'libre', a, b}));
    items.sort((a,b)=>a.t-b.t);

    cuerpo = `<div class="tl">
      <div class="small muted" style="margin-bottom:10px">
        ${ic('clock','sm')} Trabaja ${h.desde} a ${h.hasta}${h.pausaD?` · pausa ${h.pausaD}-${h.pausaH}`:''}
      </div>
      ${items.length===0?`<div class="empty">Sin turnos. Tocá el + para agregar uno.</div>`:''}
      ${items.map(it=>{
        if(it.tipo==='libre') return `<button class="hueco" onclick="nuevoTurno('${p.id}','${hm(it.a)}')">
          ${ic('plus','sm')}<span>${hm(it.a)} a ${hm(it.b)} libre</span><span class="hx">${durTxt(it.b-it.a)}</span></button>`;
        if(it.tipo==='pausa') return `<div class="blk">${ic('clock','sm')} Pausa ${it.h.pausaD} a ${it.h.pausaH}</div>`;
        if(it.tipo==='blq') return `<div class="blk">${ic('lock','sm')} Bloqueado ${it.b.desde} a ${it.b.hasta}${it.b.motivo?' · '+esc(it.b.motivo):''}
          ${puedeEditarAgenda()?`<button class="btn sm sec" style="margin-left:auto" onclick="quitarBloqueo('${it.b.id}')">Quitar</button>`:''}</div>`;
        const l=it.l, cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
        const e=EST[l.estado];
        const proc = sv.proceso>0;
        return `<button class="tcard st-${l.estado} ${proc?'proc':''}" onclick="abrirTurno('${l.visita.id}','${l.id}')">
          <div class="n">${esc(cl.nombre)}</div>
          <div class="s">${esc(sv.nombre)}</div>
          <div class="t">
            <span>${l.hora} – ${hm(mh(l.hora)+l.dur)}</span>
            <span style="display:inline-flex;align-items:center;gap:5px"><i class="dot d-${l.estado}"></i>${e.n}</span>
            ${proc?`<span>${sv.trabajo1}′ trabajo · ${sv.proceso}′ proceso · ${sv.trabajo2}′ trabajo</span>`:''}
            ${l.paqueteId?(()=>{const pq=byId(DB.paquetes,l.paqueteId);
              return pq?`<span style="color:var(--acc)">Sesión ${l.consumida?pq.usadas:pq.usadas+1} de ${pq.total}</span>`:'';})():''}
            ${l.voucherId?`<span style="color:#0B7C40">Voucher</span>`:''}
            ${(puedeVerPrecios() && ['lleg','serv','fin'].includes(l.estado) && saldoVisita(l.visita)>0)?`<span style="color:var(--warn)">Debe ${money(saldoVisita(l.visita))}</span>`:''}
          </div>
        </button>`;
      }).join('')}
      ${puedeEditarAgenda()?`${libres.length?'':`<button class="free" onclick="nuevoTurno('${p.id}')">${ic('plus','sm')} Agregar turno a ${esc(p.nombre.split(' ')[0])}</button>`}
      <button class="free" onclick="bloquearHorario('${p.id}')">${ic('lock','sm')} Bloquear un horario</button>`:''}

    </div>`;
  }

  return `
    <div class="subtabs">
      ${profes.map(x=>{
        const tra = !!horarioDe(x.id, area.id, ST.fecha);
        return `<button class="ptab ${x.id===p.id?'on':''} ${tra?'':'off'}"
          onclick="ST.profTab='${x.id}';render()"><i></i>${esc(x.nombre.split(' ')[0])}</button>`;
      }).join('')}
    </div>
    ${cuerpo}`;
}

/* --- vista ancha: grilla horas x profesionales --- */
function agendaGrilla(area, profes){
  const hs = profes.map(p=>horarioDe(p.id, area.id, ST.fecha)).filter(Boolean);
  if(!hs.length) return `<div class="empty">Nadie trabaja este día.</div>`;
  const paso = 15;
  const dia = lineasDe(ST.fecha, l=>l.areaId===area.id && profes.some(p=>p.id===l.profId));
  /* la grilla arranca y termina abarcando horarios de trabajo Y turnos cargados fuera de horario */
  const desde = Math.floor(Math.min(...hs.map(h=>mh(h.desde)), ...dia.map(l=>mh(l.hora)))/paso)*paso;
  const hasta = Math.max(...hs.map(h=>mh(h.hasta)), ...dia.map(l=>mh(l.hora)+l.dur));
  const filas = [];
  for(let t=desde;t<hasta;t+=paso) filas.push(t);

  /* cada franja puede tener MÁS DE UN turno (superposición) */
  const ocup = {};
  profes.forEach(p=>{
    ocup[p.id]={};
    dia.filter(l=>l.profId===p.id).forEach(l=>{
      const s=mh(l.hora), e=s+l.dur;
      for(let t=s;t<e;t+=paso){
        (ocup[p.id][t] = ocup[p.id][t] || []).push({l, primero:t===s, ultimo:t+paso>=e});
      }
    });
  });

  return `<div class="gridwrap"><div class="grid" style="grid-template-columns:46px repeat(${profes.length},minmax(104px,156px))">
    <div class="gh"></div>
    ${profes.map(p=>`<div class="gh">${esc(p.nombre.split(' ')[0])}</div>`).join('')}
    ${filas.map(t=>`
      <div class="gt">${t%60===0?hm(t):''}</div>
      ${profes.map(p=>{
        const h = horarioDe(p.id, area.id, ST.fecha);
        const dentro = h && t>=mh(h.desde) && t<mh(h.hasta);
        const enPausa = h && h.pausaD && t>=mh(h.pausaD) && t<mh(h.pausaH);
        const os = ocup[p.id][t];
        if(os && os.length){
          return `<div class="gc gcx"><div class="gsplit">${os.map(o=>{
            const l=o.l, cl=byId(DB.clientas,l.visita.clientaId), sv=byId(DB.servicios,l.servicioId);
            const rad = (o.primero?'7px 7px':'0 0')+' '+(o.ultimo?'7px 7px':'0 0');
            return `<div class="gi" onclick="abrirTurno('${l.visita.id}','${l.id}')"
              style="border-left-color:var(--${EST[l.estado].c});border-radius:${rad};${o.primero?'':'padding-top:0'}">
              ${o.primero?`<b>${esc(cl.nombre)}</b><span>${esc(sv.nombre)}</span><span>${l.hora}</span>`:''}
            </div>`;}).join('')}</div></div>`;
        }
        if(!dentro || enPausa) return `<div class="gc" style="background:var(--bg)"></div>`;
        return `<div class="gc" ${puedeEditarAgenda()?`onclick="nuevoTurno('${p.id}','${hm(t)}')"`:''}></div>`;
      }).join('')}
    `).join('')}
  </div></div>`;
}

      ${sv.proceso>0?`<div class="kv"><span class="muted">Tiene proceso</span><b>${sv.trabajo1}′ + ${sv.proceso}′ libre + ${sv.trabajo2}′</b></div>`:''}
      ${l.paqueteId?(()=>{const pq=byId(DB.paquetes,l.paqueteId);
        return pq?`<div class="kv"><span class="muted">Paquete</span><b style="color:var(--acc)">Sesión ${l.consumida?pq.usadas:pq.usadas+1} de ${pq.total}</b></div>`:'';})():''}
      ${l.voucherId?`<div class="kv"><span class="muted">Voucher</span><b style="color:#0B7C40">${esc((byId(DB.vouchers,l.voucherId)||{}).codigo||'')}</b></div>`:''}

    ${cl.notas?`<div class="warnbox">${ic('alert','sm')} ${esc(cl.notas)}</div>`:''}

function msgConfirmacion(v,l){
  const cl=byId(DB.clientas,v.clientaId), sv=byId(DB.servicios,l.servicioId);
  const pr=byId(DB.profesionales,l.profId), su=byId(DB.sucursales,v.sucursalId);
  return `Hola ${cl.nombre.split(' ')[0]}! Te recordamos tu turno en ${DB.cfg.negocio} ${su.nombre}: ${sv.nombre} con ${pr.nombre.split(' ')[0]}, el ${fechaLarga(v.fecha)} a las ${l.hora}. ¿Nos confirmás?`;
}
function cambiarEstado(vid,lid,est,desdeFicha){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  if(!puedeMarcarEstado(l, est)){ toast('No podés modificar turnos'); return; }
  l.estado=est;
  /* al finalizar se descuenta la sesión del paquete */
  if(est==='fin' && l.paqueteId && !l.consumida){
    const pq = byId(DB.paquetes, l.paqueteId);
    if(pq){ pq.usadas++; l.consumida=true;
      if(pq.total-pq.usadas<=1) setTimeout(()=>toast(pq.total-pq.usadas===0
        ? 'Se le terminaron las sesiones del paquete'
        : 'Le queda 1 sesión del paquete'), 900);
    }
  }
  logAcc(`${byId(DB.clientas,v.clientaId).nombre}: ${EST[est].n}`);
  save(); closeSheet(); render();
  toast(EST[est].n);
  if(est==='fin' && saldoVisita(v)>0 && puedeCobrar()){ setTimeout(()=>cobrar(vid), 350); return; }
  /* la ficha NO se cierra entre paso y paso: la acción que sigue queda a mano.
     Desde la lista del día no se reabre: ahí el renglón ya se actualiza solo. */
  if(desdeFicha && ['res','conf','lleg','serv'].includes(est)) setTimeout(()=>abrirTurno(vid,lid), 240);
}
function cancelarTurno(vid,lid){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const cl=byId(DB.clientas,v.clientaId), sv=byId(DB.servicios,l.servicioId);
  const av=[`${esc(cl.nombre)} · ${esc(sv.nombre)} · ${fechaCorta(v.fecha)} a las ${l.hora}.`];
  if(pagadoVisita(v)>0) av.push(`Esta visita ya tiene ${money(cobradoVisita(v))} cobrados. Revisá si hay que devolver algo.`);
  confirmarConMotivo('Cancelar el turno', av, 'Cancelar el turno', m=>hacerCancelar(vid,lid,m));
}
function hacerCancelar(vid,lid,motivo){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  l.estado='can'; l.motivoCan=motivo||'';
  logAcc(`Cancelado: ${byId(DB.clientas,v.clientaId).nombre}${motivo?' — '+motivo:''}`);
  save(); closeSheet(); render();
  const esp = DB.espera.filter(e=>e.fecha===v.fecha);
  if(esp.length){
    setTimeout(()=>sheet('Se liberó un horario', `
      <div class="okbox">Quedó libre ${l.hora} el ${fechaCorta(v.fecha)}. Hay gente esperando ese día.</div>
      <div class="listcard">${esp.map(e=>{
        const c=byId(DB.clientas,e.clientaId), s=byId(DB.servicios,e.servicioId);
        return `<div class="lr"><div class="av">${ini(c.nombre)}</div>
          <div class="g"><b>${esc(c.nombre)}</b><span>${esc(s.nombre)}${e.nota?' · '+esc(e.nota):''}</span></div>
          <a class="btn sm wa" href="${waLink(c.tel,'Hola '+c.nombre.split(' ')[0]+'! Se liberó un turno el '+fechaCorta(v.fecha)+' a las '+l.hora+'. ¿Te sirve?')}" target="_blank">${ic('wa','sm')}</a>
        </div>`;}).join('')}</div>`), 300);
  } else toast('Turno cancelado');
}
function moverTurno(vid,lid){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const hs = huecos(l.profId, l.areaId, v.fecha, l.servicioId);
  sheet('Mover a otro horario', `
    <div class="small muted" style="margin-bottom:11px">Horarios libres de ${esc(byId(DB.profesionales,l.profId).nombre)} el ${fechaCorta(v.fecha)}</div>
    ${hs.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px">
      ${hs.map(h=>`<button class="pill" onclick="hacerMover('${vid}','${lid}','${h}')">${h}</button>`).join('')}
    </div>`:`<div class="empty">No quedan horarios libres.</div>`}
    <div class="sep"></div>
    <div class="f"><label>O poné la hora a mano (el sistema avisa si se superpone)</label>
      <input type="time" id="horaman" value="${l.hora}"></div>
    <button class="btn sec" onclick="hacerMover('${vid}','${lid}',document.getElementById('horaman').value,true)">Mover igual</button>`);
}
function hacerMover(vid,lid,hora,forzar){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  if(!/^\d\d:\d\d$/.test(hora||'')){ toast('Poné una hora válida'); return; }
  if(forzarPara(l.profId, l.areaId, v.fecha, hora, l.servicioId, l.dur, l.id)){
    const av = avisosDeTurno(l.profId, l.areaId, v.fecha, mh(hora), l.dur, l.id);
    return confirmarConMotivo('Mover a las '+hora,
      av.length?av:['Ese horario no está libre.'],
      'Moverlo igual a las '+hora, m=>aplicarMover(vid,lid,hora,m));
  }
  aplicarMover(vid,lid,hora,'');
}
function aplicarMover(vid,lid,hora,motivo){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const antes=l.hora; l.hora=hora; if(motivo) l.forzado=motivo;
  logAcc(`${byId(DB.clientas,v.clientaId).nombre}: turno movido de ${antes} a ${hora}${motivo?' — FORZADO: '+motivo:''}`);
  save(); closeSheet(); render(); toast('Movido a las '+hora);
}
/* cambiar el servicio de un turno ya cargado, sin tener que borrarlo y rehacerlo */

  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }

  sheet('Cambiar el servicio', `
    <div class="infobox">Cambia la duración y el precio del turno. La comisión se recalcula
    con el porcentaje del servicio nuevo.</div>
    <div class="listcard">${svs.map(x=>{
      const hace=profesDe(l.areaId,x.id).some(p=>p.id===l.profId);

        <div class="g"><b>${esc(x.nombre)}</b>
          <span>${x.dur} min${hace?'':' · no lo tiene habilitado'}</span></div>
        ${puedeVerPrecios()?`<div class="r"><b>${money(x.contado)}</b></div>`:''}
        ${x.id===l.servicioId?'<span class="bd ac">Ahora</span>':''}</button>`;}).join('')}</div>`);
}
function hacerCambioServicio(vid,lid,svId){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const nuevo=byId(DB.servicios,svId), antes=byId(DB.servicios,l.servicioId);
  const aplicar=(motivo)=>{
    const as=DB.asign.find(a=>a.profId===l.profId && a.areaId===l.areaId);
    l.servicioId=svId; l.dur=nuevo.dur; l.precio=nuevo.contado;
    l.comisionPct=(as&&as.comision!=null)?as.comision:nuevo.comision;
    l.paqueteId = (paqueteActivo(v.clientaId,svId)||{}).id || null;
    if(motivo) l.forzado=motivo;
    logAcc(`${byId(DB.clientas,v.clientaId).nombre}: ${antes?antes.nombre:'?'} → ${nuevo.nombre}${motivo?' — '+motivo:''}`);
    save(); closeSheet(); render(); toast('Servicio cambiado');
  };
  /* si el servicio nuevo dura más y pisa otra cosa, avisar */
  if(forzarPara(l.profId, l.areaId, v.fecha, l.hora, svId, nuevo.dur, l.id)){
    const av=avisosDeTurno(l.profId, l.areaId, v.fecha, mh(l.hora), nuevo.dur, l.id);
    return confirmarConMotivo('El servicio nuevo no entra',
      av.concat([`${nuevo.nombre} dura ${nuevo.dur} min y el turno arranca ${l.hora}.`]),
      'Cambiarlo igual', aplicar);
  }
  aplicar('');
}
function cambiarProfesional(vid,lid){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const profes = profesDe(l.areaId, l.servicioId).filter(p=>p.id!==l.profId);
  sheet('Pasar a otra profesional', `
    <div class="infobox">La comisión la cobra quien efectivamente hace el servicio.</div>
    <div class="listcard">${profes.map(p=>{
      const tra = !!horarioDe(p.id,l.areaId,v.fecha);
      const libre = tra && huecos(p.id,l.areaId,v.fecha,l.servicioId).includes(l.hora);
      return `<button class="lr" onclick="hacerCambioProf('${vid}','${lid}','${p.id}')">
        <div class="av">${ini(p.nombre)}</div>
        <div class="g"><b>${esc(p.nombre)}</b><span>${!tra?'No trabaja este día':(libre?'Libre a las '+l.hora:'Ocupada a las '+l.hora)}</span></div>
        <span class="bd ${!tra?'st':(libre?'ok':'wa')}">${!tra?'No trabaja':(libre?'Libre':'Ocupada')}</span>
      </button>`;}).join('')}</div>`);
}
function hacerCambioProf(vid,lid,pid){
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  if(forzarPara(pid, l.areaId, v.fecha, l.hora, l.servicioId, l.dur, l.id)){
    const av = avisosDeTurno(pid, l.areaId, v.fecha, mh(l.hora), l.dur, l.id);
    return confirmarConMotivo('Pasar a '+byId(DB.profesionales,pid).nombre.split(' ')[0],
      av.length?av:['No está libre en ese horario.'],
      'Pasarla igual', m=>aplicarCambioProf(vid,lid,pid,m));
  }
  aplicarCambioProf(vid,lid,pid,'');
}
function aplicarCambioProf(vid,lid,pid,motivo){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const sv=byId(DB.servicios,l.servicioId);
  const antes = byId(DB.profesionales,l.profId).nombre;
  l.profId = pid; if(motivo) l.forzado=motivo;
  const as = DB.asign.find(a=>a.profId===pid && a.areaId===l.areaId);
  l.comisionPct = (as && as.comision!=null) ? as.comision : sv.comision;
  logAcc(`${byId(DB.clientas,v.clientaId).nombre}: pasada de ${antes} a ${byId(DB.profesionales,pid).nombre}${motivo?' — '+motivo:''}`);
  save(); closeSheet(); render(); toast('Pasada a '+byId(DB.profesionales,pid).nombre.split(' ')[0]);
}
function exencionComision(vid,lid){
  if(!puedeAjustarComision()){ toast('El porcentaje lo cambia administración'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  sheet('Comisión de este servicio', `
    <div class="f"><label>Porcentaje</label>
      <input type="number" id="cpct" value="${l.comisionPct}" min="0" max="100"></div>
    <div class="chk"><input type="checkbox" id="cex" ${l.exenta?'checked':''}>
      <div class="g"><b>No pagar comisión por este servicio</b>
      <span class="small muted">Por ejemplo si es un familiar o una cortesía</span></div></div>
    <div class="f" style="margin-top:11px"><label>Motivo</label>
      <input id="cmot" value="${esc(l.motivo||'')}" placeholder="Familiar de la profesional"></div>
    <button class="btn" onclick="guardarComision('${vid}','${lid}')">Guardar</button>`);
}
function guardarComision(vid,lid){
  if(!puedeAjustarComision()){ toast('El porcentaje lo cambia administración'); return; }
  const v=byId(DB.visitas,vid), l=byId(v.lineas,lid);
  const pct = +document.getElementById('cpct').value || 0;
  if(pct>100 || pct<0){ toast('La comisión tiene que estar entre 0 y 100'); return; }
  l.comisionPct = pct;
  l.exenta = document.getElementById('cex').checked;
  l.motivo = document.getElementById('cmot').value;
  logAcc(`Comisión ajustada: ${byId(DB.clientas,v.clientaId).nombre}`);
  save(); closeSheet(); render(); toast('Comisión actualizada');
}
function bloquearHorario(pid){
  sheet('Bloquear un horario', `
    <div class="row f">
      <div><label>Desde</label><input type="time" id="bd" value="13:00"></div>
      <div><label>Hasta</label><input type="time" id="bh" value="14:00"></div>
    </div>
    <div class="f"><label>Motivo</label><input id="bm" placeholder="Reunión, trámite, etc."></div>
    <button class="btn" onclick="hacerBloqueo('${pid}')">${ic('lock','sm')} Bloquear</button>`);
}
function hacerBloqueo(pid){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  const d=document.getElementById('bd').value, h=document.getElementById('bh').value;
  const m=(document.getElementById('bm').value||'').trim();
  if(!d||!h||mh(h)<=mh(d)){ toast('Revisá el horario: el "hasta" tiene que ser posterior'); return; }
  if(!m){ toast('Escribí el motivo del bloqueo'); return; }
  /* avisar si hay turnos cargados en ese rato */
  const chocan = lineasDe(ST.fecha, l=>l.profId===pid).filter(l=>mh(l.hora)<mh(h) && mh(l.hora)+l.dur>mh(d));
  const guardar = ()=>{
    DB.bloqueos.push({id:uid('bl'), profId:pid, fecha:ST.fecha, desde:d, hasta:h, motivo:m});
    logAcc(`Bloqueo ${d}-${h} para ${byId(DB.profesionales,pid).nombre}: ${m}`);
    save(); closeSheet(); render(); toast('Horario bloqueado');
  };
  if(chocan.length) return confirmarConMotivo('Ya hay turnos en ese rato',
    chocan.map(l=>`${byId(DB.clientas,l.visita.clientaId).nombre} a las ${l.hora} (${byId(DB.servicios,l.servicioId).nombre}).`)
      .concat(['Los turnos NO se cancelan solos: hay que reubicarlos.']),
    'Bloquear igual', ()=>guardar());
  guardar();
}
function quitarBloqueo(id){
  if(!puedeEditarAgenda()){ toast('No podés modificar turnos'); return; }
  DB.bloqueos = DB.bloqueos.filter(b=>b.id!==id);
  save(); render(); toast('Bloqueo quitado');
}

/* ============================================================
   NUEVO TURNO
   ============================================================ */
const NT = {clientaId:null, areaId:null, servicioId:null, profId:null, hora:null,
            visitaId:null, motivo:'', aviso:null, espera:false};
/* el área en la que estamos parados (la pestaña "Todo el día" no es un área) */
const areaActual = () => (ST.areaId && ST.areaId!=='__dia') ? ST.areaId : (areasDeSucursal()[0]||{}).id;
/* EL ORDEN: primero el LUGAR (servicio -> profesional y hora) y recien al final la clienta.
   Es como se piensa en el mostrador: "tengo las 3 y media con Caro, ¿quien la agarra?".
   Si la clienta YA se sabe (otra visita, agregar servicio) se saltea el ultimo paso. */
function nuevoTurno(profId, hora){
  NT.clientaId=null; NT.servicioId=null; NT.profId=profId||null; NT.hora=hora||null;
  NT.visitaId=null; NT.motivo=''; NT.aviso=null; NT.espera=false;
  NT.areaId = areaActual();
  if(profId){
    const as = DB.asign.find(a=>a.profId===profId && a.areaId===NT.areaId);
    if(as) NT.areaId = as.areaId;
  }
  pasoServicio();
}
function pasoCliente(){
  const sv = NT.servicioId ? byId(DB.servicios, NT.servicioId) : null;
  const p  = NT.profId ? byId(DB.profesionales, NT.profId) : null;
  sheet(NT.espera?'¿Quién queda en espera?':'¿Para quién es?', `
    ${sv?`<div class="card cardp" style="margin-bottom:11px">
      <div style="font-weight:700;font-size:15px">${esc(sv.nombre)}</div>
      <div class="small muted">${p?esc(p.nombre)+' · ':''}${fechaCorta(ST.fecha)}${NT.hora?' a las '+NT.hora:''}</div>
    </div>`:''}
    <div class="f"><input id="bq" placeholder="Buscar por nombre o teléfono"
      oninput="pintarClientas(this.value)" autocomplete="off"></div>
    <div id="reslist" class="listcard">${listaClientasHTML('')}</div>
    <div class="sep"></div>
    <button class="btn sec" onclick="nuevaClientaRapida()">${ic('plus','sm')} Es una clienta nueva</button>`,
    {focus:'bq'});
}
/* elegir la clienta es el ultimo paso: de aca sale el turno (o la lista de espera) */
function elegidaClienta(id){
  NT.clientaId = id;
  if(NT.espera){ NT.espera=false; anotarEnEspera(); return; }
  preGuardarTurno();
}
function listaClientasHTML(q){
  const t = q.toLowerCase().trim();
  const res = DB.clientas.filter(c=>!t || c.nombre.toLowerCase().includes(t) || c.tel.includes(t)).slice(0,20);
  if(!res.length) return `<div class="empty">No aparece nadie con ese nombre.</div>`;
  return res.map(c=>`<button class="lr" onclick="elegidaClienta('${c.id}')">
    <div class="av">${ini(c.nombre)}</div>
    <div class="g"><b>${esc(c.nombre)}</b><span>${esc(c.tel)}${c.notas?' · ⚠ '+esc(c.notas.slice(0,30)):''}</span></div>
    ${ic('chev','sm')}</button>`).join('');
}
function pintarClientas(q){ document.getElementById('reslist').innerHTML = listaClientasHTML(q); }
function nuevaClientaRapida(){
  sheet('Clienta nueva', `
    <div class="infobox">Con el nombre y el teléfono alcanza. Todo lo demás es opcional y se completa después.</div>
    <div class="f"><label>Nombre y apellido</label><input id="nn" autocomplete="off"></div>
    <div class="f"><label>Teléfono</label><input id="nt" inputmode="tel" placeholder="221 555-1234"></div>
    <div class="f"><label>Fecha de nacimiento (opcional)</label><input type="date" id="nb"></div>
    <button class="btn" onclick="guardarClientaRapida()">Guardar y seguir</button>`, {focus:'nn'});
}
function guardarClientaRapida(){
  if(!puedeEditarClientas()){ toast('No tenés permiso para modificar clientas'); return; }

  if(!n){ toast('Falta el nombre'); return; }
