/* ===================== Rediseño 26/10/2026 =====================
   Teléfono primero. Texto principal 16 px, botones de 52 px o más,
   jerarquía por tamaño y no solo por color. */
:root{
 --ink:#2b2531;--muted:#5f5668;--plum:#4b3155;--plum-claro:#6d4a79;--accent:#8c4f78;
 --bg:#f6f3f7;--paper:#fff;--line:#ddd4e0;--soft:#f3ebf4;
 --ok:#1f6a4e;--ok-bg:#e4f2ea;--draft:#8a5d12;--draft-bg:#fbf0d9;--peligro:#9c2f2f;
 font-size:16px;color:var(--ink);background:var(--bg)}
body{font-size:16px;line-height:1.5;background:var(--bg);color:var(--ink)}
main{max-width:980px;margin:auto;padding:0 16px 40px}
h1{font:600 26px/1.25 Georgia,serif;margin:0 0 6px;letter-spacing:-.2px}
h2{font-size:19px;margin:0}
h3{font-size:17px;margin:0}
.sub,.hint{color:var(--muted);font-size:15px;line-height:1.5}
.hint{font-size:14px}

/* --- encabezado --- */
.top{background:var(--paper);min-height:0;padding:8px 14px;gap:10px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;flex-wrap:nowrap}
.top .brand{gap:10px;flex:1 1 auto;min-width:0;overflow:hidden}
.brand strong,.brand small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-logo{height:34px;width:auto;border-radius:4px}
.brand strong{font-size:19px;letter-spacing:.4px;display:block;color:var(--plum)}
.brand small{font-size:13px;color:var(--muted);margin-top:1px;display:block}
.session-info{display:flex;align-items:center;gap:10px}
#logout{min-height:48px;padding:10px 16px}
.session-info strong{font-size:14px;font-weight:600;color:var(--muted)}
@media(max-width:640px){.session-info strong{display:none}.brand small{display:none}.top .brand-logo{height:30px}}
.nav-volver{flex:0 0 auto;min-height:48px;padding:0 13px;border-radius:12px;background:var(--soft);
 color:var(--plum);font-size:16px;font-weight:600;border:0;white-space:nowrap}
.nav-volver[hidden]{display:none}
footer{max-width:980px;margin:auto;padding:18px 16px 28px;font-size:13px;color:var(--muted);
 display:flex;gap:10px;justify-content:space-between;border-top:1px solid var(--line);flex-wrap:wrap}

/* --- botones --- */
.btn{min-height:52px;padding:12px 18px;border-radius:14px;font-size:16px;font-weight:600;
 background:var(--paper);border:1.5px solid var(--line);color:var(--plum);gap:8px}
.btn.primary{background:var(--plum);color:#fff;border-color:var(--plum)}
.btn.soft{background:var(--soft);border-color:transparent}
.btn.danger{color:var(--peligro);border-color:#e3c3c3;background:#fff}
.btn.chico{min-height:44px;padding:9px 14px;font-size:15px;border-radius:12px}
.btn.small{min-height:44px;padding:9px 14px;font-size:15px}
.text-button{font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.icon-button{width:44px;height:44px;font-size:26px}

/* --- portada --- */
.portada{display:grid;gap:14px}
.accion-grande{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
 min-height:84px;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);
 background:var(--paper);color:var(--ink);box-shadow:0 2px 10px #3a26320a}
.accion-grande .ico{flex:0 0 52px;height:52px;border-radius:15px;display:grid;place-items:center;
 background:var(--soft);font-size:26px;line-height:1}
.accion-grande b{display:block;font-size:19px;color:var(--plum);font-weight:600}
.accion-grande span{display:block;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.4}
.accion-grande.destacada{background:var(--plum);border-color:var(--plum)}
.accion-grande.destacada b{color:#fff}
.accion-grande.destacada span{color:#e8dbec}
.accion-grande.destacada .ico{background:#ffffff26;color:#fff}
.opciones-cambio{display:grid;gap:10px;margin-bottom:18px}
.opciones-cambio .accion-grande{min-height:72px}
.opciones-cambio .accion-grande .ico{flex:0 0 42px;height:42px;font-size:21px;border-radius:13px}
.opciones-cambio .accion-grande b{font-size:16px}
.opciones-cambio .accion-grande span{font-size:13px}
.accion-media{display:flex;align-items:center;gap:10px;min-height:60px;padding:12px 14px;border-radius:15px;
 border:1.5px solid var(--line);background:var(--paper);color:var(--plum);font-size:16px;font-weight:600;text-align:left}
.accion-media .ico{font-size:22px}
.fila-3{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.fila-3{grid-template-columns:repeat(3,1fr)}}
.grupo-titulo{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
 font-weight:700;margin:12px 2px 2px}
.ajustes-fila{display:flex;flex-wrap:wrap;gap:8px}
.ajustes-fila .btn{min-height:48px;font-size:15px;font-weight:500}
.marca{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;
 min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0 7px}

/* --- tarjeta de contexto (semana / local) --- */
.contexto{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px}
.contexto .linea{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.contexto .semana{font-size:18px;font-weight:600;color:var(--plum)}
.flecha{min-width:48px;min-height:48px;border-radius:13px;border:1.5px solid var(--line);
 background:var(--paper);color:var(--plum);font-size:22px}
.estado{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;
 font-size:14px;font-weight:700}
.estado.borrador{background:var(--draft-bg);color:var(--draft)}
.estado.confirmada{background:var(--ok-bg);color:var(--ok)}

/* --- locales y dias --- */
.locales{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.local-btn{min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);
 color:var(--plum);font-size:16px;font-weight:600;padding:8px 10px;line-height:1.25}
.local-btn small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:3px}
.local-btn.active{background:var(--plum);border-color:var(--plum);color:#fff}
.local-btn.active small{color:#e3d6e7}
.local-btn.falta{border-color:#e0c08a}

/* --- la semana, dia por dia --- */
.dias{display:grid;gap:12px;margin-top:4px}
@media(min-width:760px){.dias{grid-template-columns:1fr 1fr}}
.dia-card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.dia-card>header{display:flex;align-items:baseline;gap:8px;justify-content:space-between;
 padding:12px 16px;background:var(--soft)}
.dia-card>header b{font-size:17px;color:var(--plum)}
.dia-card>header span{font-size:14px;color:var(--muted)}
.turno{padding:12px 16px;border-top:1px solid var(--line)}
.turno-cab{display:flex;align-items:baseline;gap:8px;justify-content:space-between;margin-bottom:8px}
.turno-cab b{font-size:15px;color:var(--plum);letter-spacing:.02em}
.turno-cab span{font-size:14px;color:var(--muted)}
.persona{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;
 padding:10px 12px;border-radius:13px;border:1.5px solid transparent;background:var(--soft);
 color:var(--ink);margin-bottom:8px;font-size:16px}
.persona b{font-weight:600;display:block;font-size:16px}
.persona small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.persona .editar{margin-left:auto;font-size:14px;color:var(--plum);font-weight:600}
.vacio-slot{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;
 border:1.5px dashed #c9b9cd;border-radius:13px;background:transparent;color:var(--plum);
 font-size:15px;font-weight:600;margin-bottom:8px}
.sin-nadie{font-size:14px;color:var(--muted);padding:4px 0 8px}

/* --- avisos y estados --- */
.aviso{border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.5;margin-bottom:14px}
.aviso.atencion{background:#fbf0d9;border:1.5px solid #e4cd97;color:#6b4e12}
.aviso.info{background:var(--soft);border:1.5px solid var(--line);color:var(--plum)}
.aviso.ok{background:var(--ok-bg);border:1.5px solid #bcdccb;color:var(--ok)}
.aviso>strong:first-child{display:block;margin-bottom:4px;font-size:16px}
.aviso ul{margin:8px 0 0;padding-left:20px}
.aviso li{margin:4px 0}
.pendiente{display:inline-flex;align-items:center;gap:6px;background:#efeaf1;color:#5c5167;
 border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}

/* --- listas (equipo, ausencias, comunicados) --- */
.lista{display:grid;gap:10px}
.item{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;
 display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.item .crece{flex:1 1 180px;min-width:0}
.item b{font-size:17px;display:block}
.item small{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.item .acciones{display:flex;gap:8px;flex-wrap:wrap}
.tarjeta{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.tarjeta h2{margin-bottom:6px}
.tarjeta .cuerpo{font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}

/* --- formularios dentro de la hoja --- */
#sheet-body{padding:18px 20px 6px;font-size:16px}
.sheet-head{padding:16px 20px}
.sheet-head h2{font:600 21px Georgia,serif}
#sheet-actions{padding:14px 20px 20px;gap:10px}
#sheet-actions .btn{flex:1 1 auto}
.field label{font-size:15px}
.field input,.field select,.field textarea{min-height:52px;font-size:16px;border-radius:12px;border:1.5px solid #cfc3d3}
.days-checks label{min-height:48px;font-size:15px;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line)}
.days-checks input{width:20px;height:20px}
dialog{max-width:620px}

/* --- empleada (demostración local) --- */
.mi-dia{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.mi-dia .dayname{font-size:14px;color:var(--muted);margin-bottom:6px}
.mi-dia.libre{background:transparent;border-style:dashed}
.semana-mia{display:grid;gap:10px}
@media(min-width:720px){.semana-mia{grid-template-columns:repeat(3,1fr)}}

/* --- barra de estado local --- */
.aviso-band{position:relative;z-index:40;background:#36243d;color:#fff;padding:9px 16px;
 font-size:14px;line-height:1.35;display:flex;gap:10px;align-items:center;justify-content:space-between}
.aviso-band span{opacity:.92}
.aviso-band button{background:#ffffff1f;color:#fff;border:1.5px solid #ffffff5c;border-radius:999px;
 padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px}
