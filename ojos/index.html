<header class="top"><div class="brand"><img class="brand-logo" src="logo.jpg" alt="Isis"><div><strong><span>Ojos</span></strong><small>El equipo, organizado.</small></div></div><div class="session-info"><strong id="session-name"></strong><button class="text-button" id="logout" type="button">Salir</button></div><select id="role" hidden><option value="supervisor">Supervisora</option><option value="employee">Empleada</option></select><select id="person" hidden></select></header>

</div>
